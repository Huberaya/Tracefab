<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="operations.meta.title">Tracefab — Exploitation</title>
  <meta name="description" data-i18n-attr="content:operations.meta.description" content="Tracefab Exploitation — santé de l'outbox, du scheduler et des dépendances d'exploitation.">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#17231f;background:#f7f8f4;--green:#0b7656;--dark:#07523e;--muted:#71807a;--line:#e2e8df;--red:#b42318;--yellow:#8f6417}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:34px}.brand{display:flex;gap:12px;align-items:center;font-weight:800}.mark{width:40px;height:40px;display:grid;place-items:center;background:var(--green);color:#fff;border-radius:12px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.links{display:flex;gap:8px;flex-wrap:wrap}.links a,.btn{padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--dark);text-decoration:none;font-weight:700;cursor:pointer}.hero{margin-bottom:26px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,4rem);letter-spacing:-.06em;line-height:1;margin:10px 0}.lede{max-width:650px;color:var(--muted);line-height:1.6}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 26px #17231f0b}.card label{font-size:12px;color:var(--muted)}.card strong{display:block;font-size:2rem;margin-top:7px}.card.danger strong{color:var(--red)}.card.warn strong{color:var(--yellow)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel h2{margin:0 0 15px;font-size:1.1rem}.status{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.status:first-of-type{border-top:0}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;background:#87938e}.dot.ok{background:#159570}.dot.off{background:var(--red)}.muted{color:var(--muted)}.auth{min-height:70vh;display:grid;place-items:center}.authbox{max-width:680px;width:100%;padding:34px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 44px #17231f16}#clerk-sign-in{min-height:180px}.error{background:#fff0ef;color:var(--red);padding:14px;border-radius:9px}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:430px){.cards{grid-template-columns:1fr}}
  </style>
  <script src="/i18n-core.js"></script>
</head>
<body><div id="app"></div><script>
(()=>{
      /*
       * Tout le texte vient de locales/{lang}/operations.json.
       *
       * La page s'appuyait sur auto-translate.js, qui traduit par GLOSSAIRE : il
       * remplace des termes isolés qu'il connaît, et laisse intact tout le reste.
       * Des phrases comme « L'outbox reste la source durable de vérité » n'étaient
       * donc jamais traduites. `t()` renvoie la clé quand le dictionnaire ne l'a
       * pas — la convention de brand-console.
       */
      const t=(key,values)=>{const v=window.TracefabI18n?window.TracefabI18n.t(key,values):null;return v===null||v===undefined?key:v;};
      const state={clerk:null,user:null,loading:true,error:null,demo:new URLSearchParams(location.search).has('demo')};const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const api=async path=>{const token=state.clerk?.session?await state.clerk.session.getToken():null;const r=await fetch(path,{headers:token?{Authorization:`Bearer ${token}`}: {}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||`HTTP ${r.status}`);return b;};function demoData(){return{notifications:{pending:2,processing:0,sent:28,failed:1,blocked:0,oldestPendingAt:new Date().toISOString()},alertingConfigured:false,schedulerConfigured:true,workerConfigured:true};}function render(){if(state.loading){app.innerHTML=`<div class="auth"><div class="muted">${t('operations.loading')}</div></div>`;return}if(state.error&&!state.demo){app.innerHTML=`<div class="auth"><div class="authbox"><div class="eyebrow">${t('operations.brand')}</div><h1>${t('operations.unavailableTitle')}</h1><p class="error">${esc(state.error)}</p><button class="btn" onclick="location.reload()">${t('operations.retry')}</button></div></div>`;return}if(!state.user&&!state.demo){app.innerHTML=`<div class="auth"><div class="authbox"><div class="eyebrow">${t('operations.brand')}</div><h1>${t('operations.authTitle')}</h1><p class="muted">${t('operations.authBody')}</p><div id="clerk-sign-in"></div></div></div>`;if(state.clerk)state.clerk.mountSignIn(document.getElementById('clerk-sign-in'));return}const d=state.data||demoData(),n=d.notifications||{};app.innerHTML=`<main class="shell"><header class="top"><div class="brand"><div class="mark">tf</div><div>tracefab<small>${t('operations.workspace')}</small></div></div><nav class="links"><a href="/">${t('operations.nav.home')}</a><a href="/quality-center/">${t('operations.nav.qualityCenter')}</a><a href="/brand-console/">${t('operations.nav.brandConsole')}</a><button class="btn" id="refresh">${t('operations.nav.refresh')}</button></nav></header><section class="hero"><div class="eyebrow">${t('operations.eyebrow')}</div><h1>${t('operations.title')}</h1><p class="lede">${t('operations.lede')}</p></section><section class="cards"><div class="card"><label>${t('operations.kpi.pending')}</label><strong>${n.pending||0}</strong></div><div class="card warn"><label>${t('operations.kpi.processing')}</label><strong>${n.processing||0}</strong></div><div class="card danger"><label>${t('operations.kpi.failed')}</label><strong>${n.failed||0}</strong></div><div class="card"><label>${t('operations.kpi.blocked')}</label><strong>${n.blocked||0}</strong></div></section><section class="grid"><article class="card panel"><h2>${t('operations.deps.title')}</h2><div class="status"><span><i class="dot ${d.schedulerConfigured?'ok':'off'}"></i>${t('operations.deps.cron')}</span><b>${d.schedulerConfigured?t('operations.deps.configured'):t('operations.deps.missing')}</b></div><div class="status"><span><i class="dot ${d.workerConfigured?'ok':'off'}"></i>${t('operations.deps.worker')}</span><b>${d.workerConfigured?t('operations.deps.configured'):t('operations.deps.missing')}</b></div><div class="status"><span><i class="dot ${d.alertingConfigured?'ok':'off'}"></i>${t('operations.deps.alerting')}</span><b>${d.alertingConfigured?t('operations.deps.configured'):t('operations.deps.notConfigured')}</b></div></article><article class="card panel"><h2>${t('operations.rules.title')}</h2><p class="muted">${t('operations.rules.body')}</p><p class="muted">${t('operations.rules.outbox')}</p>${n.oldestPendingAt?`<p><strong>${t('operations.rules.oldest')}</strong><br><span class="muted">${new Date(n.oldestPendingAt).toLocaleString({fr:'fr-FR',en:'en-GB',de:'de-DE',it:'it-IT',es:'es-ES',nl:'nl-NL',pt:'pt-PT'}[window.TracefabI18n?.language||'fr']||'fr-FR')}</span></p>`:''}</article></section></main>`;document.getElementById('refresh').onclick=load;}async function load(){state.loading=true;state.error=null;render();if(state.demo){state.data=demoData();state.loading=false;render();return}try{state.data=await api('/api/operations/overview');state.loading=false;render()}catch(e){state.loading=false;state.error=e.message;render()}}async function boot(){if(state.demo){load();return}try{const c=await fetch('/api/config').then(r=>r.json());if(!c.publishableKey)throw new Error(c.error||'clerk_not_configured');const domain=atob(c.publishableKey.split('_')[2]).slice(0,-1);await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=`https://${domain}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;s.async=true;s.crossOrigin='anonymous';s.setAttribute('data-clerk-publishable-key',c.publishableKey);s.onload=resolve;s.onerror=()=>reject(new Error('clerk_sdk_unavailable'));document.head.appendChild(s)});state.clerk=window.Clerk;if(!state.clerk)throw new Error('clerk_sdk_unavailable');await state.clerk.load();state.user=state.clerk.user;state.loading=false;render();if(state.user)load()}catch(e){state.loading=false;state.error=e.message;render()}}/* Le contenu s'affiche d'abord en français, puis est traduit dès que le
         dictionnaire arrive : aucun fetch ne bloque le premier rendu. */
      document.addEventListener('tracefab:lang',()=>{if(!state.loading||state.error||state.data)render();});
      const start=()=>boot();
      if(window.TracefabI18n)window.TracefabI18n.init({scope:'operations',fallback:'fr'}).then(start,start);else start();})();
</script></body></html>
