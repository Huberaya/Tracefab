<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="i18n15.appMeta.operationsTitle">Tracefab — Operations</title>
  <meta name="description" data-i18n-attr="content:i18n15.appMeta.operationsDesc" content="Tracefab Operations — notification delivery status, queues and integration readiness.">
  <!-- Chantier 02 : famille unique Inter Tight (variable). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&display=swap">
  <style>
    :root{font-family:'Inter Tight',Inter,ui-sans-serif,system-ui,sans-serif;color:#17231f;background:#f7f8f4;--green:#0b7656;--dark:#07523e;--muted:#71807a;--line:#e2e8df;--red:#b42318;--yellow:#8f6417}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:34px}.brand{display:flex;gap:12px;align-items:center;font-weight:800}.mark{width:40px;height:40px;display:grid;place-items:center;background:var(--green);color:#fff;border-radius:12px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.links{display:flex;gap:8px;flex-wrap:wrap}.links a,.btn{padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--dark);text-decoration:none;font-weight:700;cursor:pointer}.hero{margin-bottom:26px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,4rem);letter-spacing:-.06em;line-height:1;margin:10px 0}.lede{max-width:650px;color:var(--muted);line-height:1.6}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 26px #17231f0b}.card label{font-size:12px;color:var(--muted)}.card strong{display:block;font-size:2rem;margin-top:7px}.card.danger strong{color:var(--red)}.card.warn strong{color:var(--yellow)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel h2{margin:0 0 15px;font-size:1.1rem}.status{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.status:first-of-type{border-top:0}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;background:#87938e}.dot.ok{background:#159570}.dot.off{background:var(--red)}.muted{color:var(--muted)}.auth{min-height:70vh;display:grid;place-items:center}.authbox{max-width:680px;width:100%;padding:34px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 44px #17231f16}#clerk-sign-in{min-height:180px}.error{background:#fff0ef;color:var(--red);padding:14px;border-radius:9px}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:430px){.cards{grid-template-columns:1fr}}
    .auth-lang { display:flex; justify-content:flex-end; margin-bottom:14px; }
  </style>
  <script>window.TF_I18N_SKIP_META = true;</script>
  <script src="/assets/i18n/en.js"></script>
  <script src="/assets/js/tf-i18n.js"></script>
  <link rel="stylesheet" href="/assets/design-system/tracefab-components.css">
  <link rel="stylesheet" href="/assets/design-system/tracefab-touch.css">
</head>
<body><div id="app"></div><script>
(()=>{const state={clerk:null,user:null,loading:true,error:null,demo:new URLSearchParams(location.search).has('demo')};const app=document.getElementById('app');const o=(k)=>(window.TF_I18N?window.TF_I18N.t('ops.'+k,k):k);const o15=(k)=>(window.TF_I18N?window.TF_I18N.t('i18n15.'+k,k):k);const LANG_NAMES={en:'🇬🇧 English',fr:'🇫🇷 Français',de:'🇩🇪 Deutsch',it:'🇮🇹 Italiano',es:'🇪🇸 Español',nl:'🇳🇱 Nederlands',pt:'🇵🇹 Português'};const langSelect=()=>{const api=window.TF_I18N;if(!api)return '';const opts=api.supported.map((l)=>`<option value="${l}"${l===api.lang?' selected':''}>${LANG_NAMES[l]||l}</option>`).join('');return `<select id="ops-lang-select" aria-label="Language" class="btn">${opts}</select>`;};const fmtDate=(v)=>new Date(v).toLocaleString((window.TF_I18N&&window.TF_I18N.lang)||'en');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const api=async path=>{const token=state.clerk?.session?await state.clerk.session.getToken():null;const r=await fetch(path,{headers:token?{Authorization:`Bearer ${token}`}: {}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||`HTTP ${r.status}`);return b;};function demoData(){return{notifications:{pending:2,processing:0,sent:28,failed:1,blocked:0,oldestPendingAt:new Date().toISOString()},alertingConfigured:false,schedulerConfigured:true,workerConfigured:true};}function errLabel(code){const c=String(code||'');if(/unauthor|clerk|session|sign/i.test(c))return o('errSignIn');if(c)console.error('[tracefab] operations:',c);return o('errBackend');}function render(){if(state.loading){app.innerHTML=`<div class="auth"><div class="muted">${esc(o('loading'))}</div></div>`;return}if(state.error&&!state.demo){app.innerHTML=`<div class="auth"><div class="authbox"><div class="auth-lang">${langSelect()}</div><div class="eyebrow">${esc(o('eyebrowBrand'))}</div><h1>${esc(o('unavailable'))}</h1><p class="error">${esc(errLabel(state.error))}</p><button class="btn" onclick="location.reload()">${esc(o('retry'))}</button></div></div>`;const els=document.getElementById('ops-lang-select');if(els)els.onchange=()=>{if(window.TF_I18N)window.TF_I18N.setLanguage(els.value);};return}if(!state.user&&!state.demo){app.innerHTML=`<div class="auth"><div class="authbox"><div class="eyebrow">${esc(o('eyebrowBrand'))}</div><h1>${esc(o('signInTitle'))}</h1><p class="muted">${esc(o('signInLede'))}</p><div id="clerk-sign-in"></div></div></div>`;if(state.clerk)state.clerk.mountSignIn(document.getElementById('clerk-sign-in'));return}const d=state.data||demoData(),n=d.notifications||{};app.innerHTML=`<main class="shell"><header class="top"><div class="brand"><div class="mark">tf</div><div>tracefab<small>${esc(o15('appMeta.operationsLabel'))}</small></div></div><nav class="links">${langSelect()}<a href="/">${esc(o('navHome'))}</a><a href="/quality-center/">${esc(o('navQuality'))}</a><a href="/brand-console/">${esc(o('navConsole'))}</a><button class="btn" id="refresh">${esc(o('refresh'))}</button></nav></header><section class="hero"><div class="eyebrow">${esc(o('eyebrow'))}</div><h1>${esc(o('heroTitle'))}</h1><p class="lede">${esc(o('heroLede'))}</p></section><section class="cards"><div class="card"><label>${esc(o('cardPending'))}</label><strong>${n.pending||0}</strong></div><div class="card warn"><label>${esc(o('cardProcessing'))}</label><strong>${n.processing||0}</strong></div><div class="card danger"><label>${esc(o('cardFailed'))}</label><strong>${n.failed||0}</strong></div><div class="card"><label>${esc(o('cardBlocked'))}</label><strong>${n.blocked||0}</strong></div></section><section class="grid"><article class="card panel"><h2>${esc(o('depsTitle'))}</h2><div class="status"><span><i class="dot ${d.schedulerConfigured?'ok':'off'}"></i>Vercel Cron</span><b>${esc(d.schedulerConfigured?o('stConfigured'):o('stMissing'))}</b></div><div class="status"><span><i class="dot ${d.workerConfigured?'ok':'off'}"></i>${esc(o('depWorker'))}</span><b>${esc(d.workerConfigured?o('stConfigured'):o('stMissing'))}</b></div><div class="status"><span><i class="dot ${d.alertingConfigured?'ok':'off'}"></i>${esc(o('depAlerting'))}</span><b>${esc(d.alertingConfigured?o('stConfigured'):o('stNotConfigured'))}</b></div></article><article class="card panel"><h2>${esc(o('rulesTitle'))}</h2><p class="muted">${esc(o('rulesPrivacy'))}</p><p class="muted">${esc(o('rulesDurability'))}</p>${n.oldestPendingAt?`<p><strong>${esc(o('oldestPending'))}</strong><br><span class="muted">${esc(fmtDate(n.oldestPendingAt))}</span></p>`:''}</article></section></main>`;document.getElementById('refresh').onclick=load;const ls=document.getElementById('ops-lang-select');if(ls)ls.onchange=()=>{if(window.TF_I18N)window.TF_I18N.setLanguage(ls.value);};}async function load(){state.loading=true;state.error=null;render();if(state.demo){state.data=demoData();state.loading=false;render();return}try{state.data=await api('/api/operations/overview');state.loading=false;render()}catch(e){state.loading=false;state.error=e.message;render()}}async function boot(){if(state.demo){load();return}try{const c=await fetch('/api/config').then(r=>r.json());if(!c.publishableKey)throw new Error(c.error||'clerk_not_configured');const domain=atob(c.publishableKey.split('_')[2]).slice(0,-1);await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=`https://${domain}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;s.async=true;s.crossOrigin='anonymous';s.setAttribute('data-clerk-publishable-key',c.publishableKey);s.onload=resolve;s.onerror=()=>reject(new Error('clerk_sdk_unavailable'));document.head.appendChild(s)});state.clerk=window.Clerk;if(!state.clerk)throw new Error('clerk_sdk_unavailable');await state.clerk.load();state.user=state.clerk.user;state.loading=false;render();if(state.user)load()}catch(e){state.loading=false;state.error=e.message;render()}}document.addEventListener('tf:languagechange',()=>{if(state.i18nReady)render();});window.tracefabOperations={state};(window.TF_I18N?window.TF_I18N.setLanguage(window.TF_I18N.lang):Promise.resolve()).then(()=>{state.i18nReady=true;},()=>{state.i18nReady=true;}).then(boot,boot);})();
</script></body></html>
