      function downloadTextFile(filename, content, mime = 'text/csv;charset=utf-8') {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = filename;
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);

      function demoCatalogCsv() {

        const cell = (value) => { const text = value === null || value === undefined ? '' : typeof value === 'string' ? value : JSON.stringify(value); return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text; };
        const rows = state.products.map((product) => headers.map((header) => cell(product[header] ?? (header === 'sizeRange' ? (product.sizeRange || []).join('|') : header === 'careInstructions' || header === 'compositionJson' ? {} : ''))).join(','));
        return `\uFEFF${[headers.join(','), ...rows].join('\r\n')}\r\n`;

        document.getElementById('request-form')?.addEventListener('submit', (e) => { e.preventDefault(); createRequest(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.getElementById('chain-node-form')?.addEventListener('submit', (e) => { e.preventDefault(); addChainNode(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.getElementById('chain-link-form')?.addEventListener('submit', (e) => { e.preventDefault(); addChainLink(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.getElementById('waive-issue-form')?.addEventListener('submit', (e) => { e.preventDefault(); waiveIssue(e.currentTarget).catch((err) => notify(err.message, true)); });
      }

      async function boot() {
        if (state.demo) { await sync(); return; }
        try {
          const res = await fetch('/api/config');
          if (!res.ok) throw new Error('config_fetch_failed');
          const config = await res.json();
          if (!config.publishableKey) throw new Error(config.error || 'clerk_not_configured');
          const clerkDomain = atob(config.publishableKey.split('_')[2]).slice(0, -1);
          await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = `https://${clerkDomain}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
            s.async = true;
            s.crossOrigin = 'anonymous';
            s.setAttribute('data-clerk-publishable-key', config.publishableKey);
            s.onload = resolve;
            s.onerror = () => reject(new Error('clerk_sdk_unavailable'));
            document.head.appendChild(s);
          });
          state.clerk = window.Clerk;
          if (!state.clerk) throw new Error('clerk_sdk_unavailable');
          await state.clerk.load();
          state.clerk.addListener(() => { if (state.clerk.user && !state.user) sync(); });
          if (state.clerk.user) await sync(); else { state.loading = false; render(); }
        } catch (error) {
          // Graceful fallback to interactive simulation mode so the console is ALWAYS operational and never broken
          console.warn('Backend Clerk unavailable, launching interactive demo workspace:', error.message);
          state.demo = true;
          state.configError = null;
          await sync();
        }
      }
      window.tracefabBrandConsole = { state, sync, render, openProduct, openSupplier, openRequest, remindRequest };
      // Le catalogue doit etre charge dans la langue de l'application avant
      // le premier rendu.
      (window.TF_I18N ? window.TF_I18N.setLanguage(state.lang) : Promise.resolve())
        .then(() => { i18nReady = true; }, () => { i18nReady = true; })
        .then(boot, boot);
    })();
  </script>
  <script>
    /* Chantier 04 — câblage du shell applicatif (palette Ctrl/Cmd+K + centre
       de notifications). Le shell ne lit que l'état deja charge par la
       console : il n'invente rien et n'appelle aucune API lui-meme. */
    (function wireShell() {
      const host = window.tracefabBrandConsole;
      const TF = () => window.TF_I18N;
      const t = (k, fb) => (TF() ? TF().t(k, fb) : fb);
      if (!host || !window.TFShell) return;

      const st = () => host.state || {};
      const goView = (v) => { const s = st(); s.view = v; s.selectedRequest = null; host.render(); };
      const name = (o) => (o && (o.display_name || o.legal_name || o.name)) || '';
      const productName = (p) => (p && (p.name || p.reference)) || '';
      const supplierName = (rec) => (rec && rec.organizations ? name(rec.organizations) : (rec && rec.name) || '');

      window.TFShell.init({
        t,
        providers: () => {
          const s = st();
          const nav = [
            ['overview', '⌂'], ['products', '◇'], ['suppliers', '◎'], ['materials', '⬡'], ['supplyChain', '☍'],
            ['requests', '↗'], ['questionnaires', '✎'], ['documents', '▤'], ['certifications', '✓'],
            ['quality', '◒'], ['risk', '⚠'], ['massBalance', '⚖'], ['integrations', '⇄'],
            ['intelligence', '✦'], ['dpp', '▣'], ['reports', '☷'], ['settings', '⚙']
          ].map(([view, icon]) => ({
            id: 'nav-' + view, icon,
            label: (view.charAt(0).toUpperCase() + view.slice(1)).replace(/([A-Z])/g, ' $1'),
            run: () => goView(view)
          }));

          const actions = [
            { id: 'act-new-request', icon: '↗', label: t('console.newRequest', 'New data request'), run: () => { s.modal = 'new-request'; host.render(); } },
            { id: 'act-new-product', icon: '◇', label: t('console.pdNew', 'New product'), run: () => { s.modal = 'new-product'; host.render(); } },
            { id: 'act-invite', icon: '◎', label: t('console.mdInviteSupplier', 'Invite a supplier'), run: () => { s.modal = 'invite-supplier'; host.render(); } }
          ];

          const entities = [];
          (s.products || []).forEach((p) => entities.push({
            id: 'prod-' + p.id, icon: '◇', label: productName(p), hint: p.reference || '',
            run: () => host.openProduct(p.id)
          }));
          (s.suppliers || []).forEach((rec) => entities.push({
            id: 'sup-' + (rec.id || rec.organization_id), icon: '◎', label: supplierName(rec), hint: (rec.organizations && rec.organizations.country_code) || '',
            run: () => host.openSupplier(rec.id || rec.organization_id)
          }));
          (s.requests || []).forEach((r) => entities.push({
            id: 'req-' + r.id, icon: '↗', label: r.title || r.reference || r.id, hint: r.status || '',
            run: () => host.openRequest(r.id)
          }));

          const now = Date.now();
          const notifications = [];
          (s.requests || []).forEach((r) => {
            if (['approved', 'cancelled'].includes(r.status)) return;
            const due = r.dueAt ? new Date(r.dueAt).getTime() : null;
            const label = r.title || r.reference || r.id;
            if (due && due < now) {
              notifications.push({ id: 'ovd-' + r.id, severity: 'critical', title: t('shell.console.notifOverdueTitle', 'Request overdue'), detail: label, actionLabel: t('shell.console.actionOpen', 'Open'), run: () => host.openRequest(r.id) });
            } else if (due && due - now < 72 * 3600000) {
              notifications.push({ id: 'due-' + r.id, severity: 'warning', title: t('shell.console.notifDueSoonTitle', 'Request due soon'), detail: label, actionLabel: t('shell.console.actionOpen', 'Open'), run: () => host.openRequest(r.id) });
            } else if (r.status === 'submitted') {
              notifications.push({ id: 'rev-' + r.id, severity: 'info', title: t('shell.console.notifReviewTitle', 'Response awaiting review'), detail: t('shell.console.notifReviewDetail', 'A supplier response is ready for review.'), actionLabel: t('shell.console.actionReview', 'Review'), run: () => host.openRequest(r.id) });
            }
          });

          return { nav, actions, entities, notifications };
        }
      });
      window.TFShell.refresh();
    })();
  </script>
