<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracefab — Brand Console</title>
  <meta name="description" content="Tracefab Brand Console — collecter, revoir et améliorer les données fournisseurs.">
  <style>
    :root {
      --ink: #17231f;
      --muted: #71807a;
      --paper: #f7f8f4;
      --panel: #ffffff;
      --line: #e2e8df;
      --green: #0b7656;
      --green-dark: #07523e;
      --green-soft: #e4f3ec;
      --yellow: #d79621;
      --yellow-soft: #fff3d8;
      --red: #bd514e;
      --red-soft: #ffebea;
      --shadow: 0 16px 45px rgba(20, 42, 34, .08);
      --radius: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: #112b23; color: #eff8f2; padding: 25px 16px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 11px 31px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 12px; background: #d7f3e4; color: var(--green-dark); display: grid; place-items: center; font-weight: 900; letter-spacing: -.08em; }
    .brand-name { font-weight: 780; letter-spacing: -.03em; font-size: 18px; }
    .brand-name small { display: block; color: #a9c4b6; font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
    .nav { display: grid; gap: 6px; }
    .nav button { appearance: none; border: 0; color: #b8cec2; background: transparent; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 12px 13px; text-align: left; font-size: 13px; font-weight: 650; }
    .nav button:hover, .nav button.active { background: rgba(255,255,255,.1); color: white; }
    .nav-icon { width: 19px; text-align: center; opacity: .9; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,.12); padding: 18px 10px 2px; }
    .user-mini { display: flex; gap: 10px; align-items: center; color: #c5d8cd; font-size: 12px; min-width: 0; }
    .avatar { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #9edec0; color: #124936; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
    .user-mini strong { display: block; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-mini span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .link-button { border: 0; background: transparent; color: inherit; padding: 0; font-size: 12px; text-decoration: underline; opacity: .85; }
    .main { min-width: 0; }
    .topbar { height: 76px; padding: 0 40px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .crumb { color: var(--muted); font-size: 13px; font-weight: 650; }
    .crumb strong { color: var(--ink); }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .org-select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--ink); background: white; max-width: 220px; }
    .content { max-width: 1420px; margin: 0 auto; padding: 42px 40px 70px; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .13em; color: var(--green); font-weight: 800; margin-bottom: 11px; }
    h1 { margin: 0; font-size: clamp(27px, 3vw, 42px); line-height: 1.06; letter-spacing: -.055em; }
    h2 { margin: 0; font-size: 22px; letter-spacing: -.035em; }
    h3 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    p { color: var(--muted); line-height: 1.6; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 31px; }
    .page-head p { margin: 10px 0 0; max-width: 640px; font-size: 14px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid transparent; border-radius: 11px; padding: 10px 15px; font-weight: 750; font-size: 13px; transition: transform .15s, box-shadow .15s, background .15s; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: white; background: var(--green); box-shadow: 0 7px 16px rgba(11,118,86,.18); }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-secondary { background: white; color: var(--ink); border-color: var(--line); }
    .btn-danger { background: var(--red-soft); color: var(--red); border-color: #f7cbc8; }
    .btn-small { padding: 7px 10px; font-size: 12px; }
    .grid { display: grid; gap: 17px; }
    .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 22px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .kpi { padding: 20px; position: relative; overflow: hidden; }
    .kpi::after { content: ""; width: 90px; height: 90px; border-radius: 50%; position: absolute; right: -30px; bottom: -44px; background: var(--green-soft); }
    .kpi-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .kpi-value { font-size: 30px; font-weight: 800; letter-spacing: -.06em; margin: 13px 0 3px; }
    .kpi-note { font-size: 11px; color: var(--muted); }
    .split { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); align-items: start; }
    .panel { padding: 23px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 18px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 610px; }
    th { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; text-align: left; padding: 0 12px 12px; font-weight: 800; }
    td { border-top: 1px solid #edf0eb; padding: 14px 12px; font-size: 13px; vertical-align: middle; }
    td:first-child, th:first-child { padding-left: 0; }
    td:last-child, th:last-child { padding-right: 0; text-align: right; }
    .clickable { cursor: pointer; }
    .clickable:hover td { background: #fbfcfa; }
    .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 800; background: #edf1ed; color: #5b6962; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-sent, .status-in_progress { background: #e8f1ff; color: #3970b3; }
    .status-submitted { background: var(--yellow-soft); color: #9a680e; }
    .status-approved, .status-verified_by_reviewer { background: var(--green-soft); color: var(--green); }
    .status-changes_requested, .status-needs_review { background: var(--red-soft); color: var(--red); }
    .status-draft { background: #f0f1f0; color: #69766e; }
    .progress { height: 7px; background: #e9eee9; border-radius: 99px; overflow: hidden; min-width: 82px; }
    .progress > span { display: block; height: 100%; background: var(--green); border-radius: inherit; }
    .progress-line { display: flex; align-items: center; gap: 9px; }
    .progress-line small { color: var(--muted); font-weight: 700; min-width: 32px; }
    .quick-grid { display: grid; gap: 10px; }
    .quick { display: flex; align-items: center; gap: 12px; padding: 13px; border: 1px solid var(--line); border-radius: 13px; background: #fcfdfa; text-align: left; color: var(--ink); }
    .quick:hover { border-color: #afd8c4; background: var(--green-soft); }
    .quick-icon { width: 33px; height: 33px; display: grid; place-items: center; background: var(--green-soft); border-radius: 10px; color: var(--green); font-weight: 900; }
    .quick strong { display: block; font-size: 13px; }
    .quick span { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .empty { padding: 44px 20px; text-align: center; color: var(--muted); }
    .empty-icon { width: 44px; height: 44px; display: grid; place-items: center; margin: 0 auto 13px; border-radius: 14px; background: var(--green-soft); color: var(--green); font-size: 20px; }
    .filters { display: flex; gap: 10px; margin-bottom: 17px; flex-wrap: wrap; }
    .input, .select, .textarea { width: 100%; border: 1px solid #d8e1d8; border-radius: 10px; padding: 11px 12px; background: white; color: var(--ink); outline: none; }
    .input:focus, .select:focus, .textarea:focus { border-color: #58a887; box-shadow: 0 0 0 3px rgba(88,168,135,.13); }
    .filters .input { max-width: 300px; }
    label { display: grid; gap: 7px; color: #53625a; font-size: 12px; font-weight: 750; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field-full { grid-column: 1 / -1; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 21px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(13,30,24,.42); display: grid; place-items: center; padding: 20px; z-index: 20; }
    .modal { width: min(630px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 25px 80px rgba(0,0,0,.22); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
    .close { border: 0; background: #f2f4f1; color: var(--muted); width: 31px; height: 31px; border-radius: 9px; font-size: 18px; }
    .detail-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    .detail-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .meta { color: var(--muted); font-size: 12px; }
    .item-list { display: grid; gap: 11px; }
    .item { padding: 16px; border: 1px solid var(--line); border-radius: 13px; display: grid; grid-template-columns: 1fr auto; gap: 15px; align-items: center; }
    .item h3 { font-size: 14px; }
    .item p { margin: 5px 0 0; font-size: 12px; }
    .item-response { margin-top: 11px; padding: 10px 11px; background: #f7faf6; border-radius: 10px; font-size: 12px; color: #44544b; }
    .item-response strong { color: var(--ink); }
    .score-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 20px; }
    .score { padding: 18px; }
    .score-name { color: var(--muted); font-size: 11px; font-weight: 750; }
    .score-value { font-size: 26px; font-weight: 800; letter-spacing: -.06em; margin: 10px 0; }
    .issue { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 15px 0; border-top: 1px solid #edf0eb; }
    .severity { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 850; padding: 5px 7px; border-radius: 6px; background: var(--yellow-soft); color: #9a680e; }
    .severity-blocking { background: var(--red-soft); color: var(--red); }
    .severity-info { background: var(--green-soft); color: var(--green); }
    .issue strong { display: block; font-size: 13px; }
    .issue p { margin: 4px 0 0; font-size: 12px; }
    .pipeline { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 15px; margin-top: 15px; }
    .dpp-hero { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; padding: 24px; background: white; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 22px; }
    .dpp-gauge-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-right: 1px solid #edf0eb; padding-right: 20px; }
    .dpp-gauge-val { font-size: 48px; font-weight: 850; letter-spacing: -.06em; line-height: 1; }
    .dpp-gauge-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-top: 6px; letter-spacing: .06em; }
    .dpp-pillars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 22px; }
    .pillar-card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
    .pillar-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .pillar-name { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .pillar-score { font-size: 18px; font-weight: 850; }
    .pillar-bar-bg { width: 100%; height: 6px; background: #edf2ee; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
    .pillar-bar-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width .3s ease; }
    .pillar-items { display: grid; gap: 6px; }
    .pillar-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 5px 0; border-top: 1px solid #f4f6f3; }
    .pillar-item-label { display: flex; align-items: center; gap: 7px; color: #37473d; }
    .check-icon { font-weight: 800; font-size: 12px; }
    .check-icon.met { color: var(--green); }
    .check-icon.unmet { color: var(--red); }
    .tier-column { background: #fbfdfa; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 11px; min-height: 240px; }
    .tier-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #edf0eb; padding-bottom: 8px; }
    .tier-title { font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: .06em; color: var(--green); }
    .tier-badge { font-size: 10px; background: var(--green-soft); color: var(--green); padding: 2px 7px; border-radius: 6px; font-weight: 800; }
    .node-card { background: white; border: 1px solid #e1e7e2; border-radius: 11px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.03); display: grid; gap: 7px; position: relative; }
    .node-card:hover { border-color: #4da87d; box-shadow: 0 4px 12px rgba(88,168,135,.15); }
    .node-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .node-type-pill { font-size: 9px; text-transform: uppercase; font-weight: 850; padding: 2px 6px; border-radius: 4px; background: #eef3ef; color: #44544b; }
    .node-label { font-size: 13px; font-weight: 750; color: var(--ink); line-height: 1.3; }
    .node-meta { font-size: 11px; color: var(--muted); }
    .node-connector { display: flex; justify-content: center; align-items: center; color: #8ba093; font-size: 16px; margin: -4px 0; }
    .toast { position: fixed; right: 25px; bottom: 25px; z-index: 50; color: white; background: #19372d; border-radius: 12px; padding: 13px 16px; box-shadow: 0 12px 35px rgba(0,0,0,.2); font-size: 13px; max-width: 360px; }
    .toast.error { background: #8e3d3b; }
    .auth-screen { min-height: 100vh; display: grid; place-items: center; padding: 25px; background: radial-gradient(circle at 10% 0%, #d9f1e4, transparent 32%), var(--paper); }
    .auth-card { width: min(950px, 100%); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border-radius: 24px; background: white; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .auth-copy { padding: 52px; background: #112b23; color: white; }
    .auth-copy h1 { font-size: 38px; margin-top: 75px; }
    .auth-copy p { color: #bdd2c7; max-width: 370px; }
    .auth-copy ul { color: #d7e9df; padding-left: 19px; line-height: 2; font-size: 13px; }
    .auth-box { padding: 38px; min-height: 480px; }
    .config-error { max-width: 600px; background: white; padding: 35px; border-radius: 20px; box-shadow: var(--shadow); }
    .demo-banner { background: var(--yellow-soft); border-bottom: 1px solid #f2ddb0; padding: 8px 15px; text-align: center; font-size: 11px; color: #8f6417; font-weight: 750; }
    @media (max-width: 1050px) { .kpis { grid-template-columns: repeat(2, 1fr); } .split { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { .app { display: block; } .sidebar { min-height: auto; padding: 15px; } .brand { padding-bottom: 16px; } .nav { display: flex; overflow-x: auto; } .nav button { white-space: nowrap; } .sidebar-bottom { display: none; } .topbar { padding: 0 18px; height: 64px; } .content { padding: 28px 18px 50px; } .page-head, .detail-hero { display: block; } .actions { justify-content: flex-start; margin-top: 17px; } .org-select { max-width: 150px; } .auth-card { grid-template-columns: 1fr; } .auth-copy { display: none; } .auth-box { min-height: 500px; } .form-grid { grid-template-columns: 1fr; } .field-full { grid-column: auto; } .score-grid { grid-template-columns: repeat(2, 1fr); } }
  
    /* Review Workflow & Document Annotations (Chantier 4) */
    .annotation-panel {
      background: #fbfdfc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    .doc-preview-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid #dce6e0;
      border-radius: 10px;
      margin-top: 8px;
    }
    .badge-ocr {
      background: #ede9fe;
      color: #6d28d9;
      font-size: 10px;
      font-weight: 750;
      padding: 2px 7px;
      border-radius: 6px;
      font-family: var(--font-mono);
    }
    .annotation-bubble {
      background: #fffbeb;
      border-left: 3px solid #d97706;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #78350f;
      margin-top: 10px;
    }
    .annotation-bubble.verified {
      background: #f0fdf4;
      border-left-color: #10b981;
      color: #065f46;
    }

  
    /* ==========================================================================
       MISSION CONTROL CENTER — BRAND CONSOLE (Phase 4 & 5)
       ========================================================================== */
    .mc-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .mc-hero-strip {
      background: linear-gradient(135deg, #091a13 0%, #112b21 60%, #173b2d 100%);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      padding: 28px 32px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    .mc-hero-strip::after {
      content: "";
      position: absolute;
      top: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .mc-headline {
      font-size: 26px;
      font-weight: 850;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .mc-subline {
      font-size: 13.5px;
      color: #a4c4b5;
      max-width: 580px;
      line-height: 1.5;
    }

    /* 4 Distinct Mission Domain Cards */
    .mc-domains-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .mc-domain-card {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      position: relative;
      transition: all 0.2s ease;
    }

    .mc-domain-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(11, 118, 86, 0.08);
      border-color: #0b7656;
    }

    .mc-domain-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .mc-domain-tag {
      font-family: var(--font-mono, monospace);
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #71807a;
    }

    .mc-domain-badge {
      font-family: var(--font-mono, monospace);
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .mc-badge-green { background: #eaf5ef; color: #0b7656; }
    .mc-badge-amber { background: #fef3c7; color: #b45309; }
    .mc-badge-blue { background: #eff6ff; color: #1d4ed8; }
    .mc-badge-red { background: #fee2e2; color: #b91c1c; }

    .mc-stat-huge {
      font-size: 32px;
      font-weight: 850;
      color: #17231f;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 12px;
      font-family: var(--font-mono, monospace);
    }

    .mc-stat-sublist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #edf2ee;
      padding-top: 12px;
      font-size: 12px;
      color: #55655e;
    }

    .mc-stat-subitem {
      display: flex;
      justify-content: space-between;
    }

    .mc-stat-subitem strong {
      color: #17231f;
      font-weight: 700;
    }

    /* Product Lineage & Timeline Container */
    .lineage-shell {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .lineage-pipeline-flow {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      margin-top: 18px;
      align-items: center;
    }

    .lineage-step-card {
      background: #f7f9f7;
      border: 1px solid #e5ebe6;
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lineage-step-card:hover, .lineage-step-card.active {
      background: #0b7656;
      border-color: #07523e;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(11, 118, 86, 0.25);
    }

    .lineage-step-card.active .lineage-step-label,
    .lineage-step-card.active .lineage-step-sub,

      async function verifyDocument(documentId) {

        try {
          const payload = await api(`/api/documents/${encodeURIComponent(documentId)}/verification-report`);

      /* ------------------------------------------------------------------
         Indicateurs du centre de pilotage.
         Tout est calculé depuis les listes réellement chargées au démarrage
         (/api/products, /api/suppliers, /api/materials, /api/data-requests).
         Ce qui n'est pas mesurable depuis ces listes est renvoyé `null` et
         affiché « Non mesuré » : aucun chiffre n'est estimé ni reconduit.
         ------------------------------------------------------------------ */
      function overviewMetrics() {
        const products = state.products || [];
        const suppliers = state.suppliers || [];
        const materials = state.materials || [];
        const requests = state.requests || [];
        const counts = requestCounts();

        const completions = products.map((p) => Number(p.dataCompletion)).filter((n) => Number.isFinite(n));
        const avg = completions.length
          ? Math.round(completions.reduce((a, b) => a + b, 0) / completions.length)
          : null;

        const byReadiness = (key) => products.filter((p) => p.dataReadiness === key).length;

        const countries = new Set();
        suppliers.forEach((s) => { const c = s?.organizations?.country_code; if (c) countries.add(String(c).toUpperCase()); });
        products.forEach((p) => { if (p.countryOfManufacture) countries.add(String(p.countryOfManufacture).toUpperCase()); });

        return {
          products: products.length,
          suppliers: suppliers.length,
          materials: materials.length,
          countries: countries.size,
          avgCompletion: avg,
          dataReady: byReadiness('data_ready'),
          inProgress: byReadiness('in_progress'),
          needsReview: byReadiness('needs_review'),
          notStarted: byReadiness('not_started'),
          incomplete: products.filter((p) => Number(p.dataCompletion) < 100).length,
          openRequests: counts.open,
          dueSoon: counts.dueSoon,
          submitted: counts.submitted,
        };
      }

            function requestsView() {

        <!-- Status Filter Filter Bar (Missing, Requested, Submitted, Under Review, Accepted, Rejected) -->

      function productsView() {
        return `<div class="page-head"><div><div class="eyebrow">Catalogue produit</div><h1>Produits</h1><p>Suivez la complétude de vos références et lancez une collecte de données.</p></div><div class="actions"><button class="btn btn-secondary" data-action="catalog-import">Importer CSV</button><button class="btn btn-secondary" data-action="catalog-export">Exporter CSV</button><button class="btn btn-secondary" data-action="audit-export">Exporter audit</button><button class="btn btn-primary" data-action="new-product">+ Nouveau produit</button></div></div><div class="card panel">${state.products.length ? `<div class="table-wrap"><table><thead><tr><th>Produit</th><th>Catégorie</th><th>Statut</th><th>Complétude</th><th>Readiness</th><th></th></tr></thead><tbody>${state.products.map((p) => `<tr><td><strong>${esc(p.name)}</strong><div class="meta">${esc(p.reference)} · v${esc(p.version)}</div></td><td>${esc(p.category || '—')}</td><td>${status(p.status)}</td><td><div class="progress-line"><div class="progress"><span style="width:${pct(p.dataCompletion)}%"></span></div><small>${moneyless(p.dataCompletion)}%</small></div></td><td>${status(p.dataReadiness || 'in_progress')}</td><td><div class="actions" style="justify-content:flex-end"><button class="btn btn-secondary btn-small" data-product-id="${esc(p.id)}">Ouvrir</button><button class="btn btn-secondary btn-small" data-dpp-product="${esc(p.id)}">DPP</button><button class="btn btn-secondary btn-small" data-quality-product="${esc(p.id)}">Qualité</button></div></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><div class="empty-icon">◇</div><strong>Votre catalogue est vide</strong><p>Créez votre première référence produit.</p><button class="btn btn-primary btn-small" data-action="new-product">Créer un produit</button></div>`}</div>`;
      }

      function suppliersView() {
        return `<div class="page-head"><div><div class="eyebrow">Écosystème fournisseur</div><h1>Fournisseurs</h1><p>Invitez et suivez les organisations qui alimentent vos données.</p></div><div class="actions"><button class="btn btn-secondary" data-action="supplier-import">Importer CSV</button><button class="btn btn-primary" data-action="invite-supplier">+ Inviter un fournisseur</button></div></div><div class="card panel">${suppliers().length ? `<div class="table-wrap"><table><thead><tr><th>Organisation</th><th>Rôle</th><th>Demandes ouvertes</th><th></th></tr></thead><tbody>${suppliers().map((s) => { const count = state.requests.filter((r) => r.supplierOrganizationId === s.organization_id && !['approved','cancelled'].includes(r.status)).length; return `<tr><td><strong>${esc(s.organizations.display_name || s.organizations.legal_name)}</strong><div class="meta">${esc(s.organizations.country_code || 'Pays non renseigné')}</div></td><td><span class="status status-approved">Partenaire actif</span></td><td>${count}</td><td><div class="actions" style="justify-content:flex-end"><button class="btn btn-secondary btn-small" data-supplier-id-view="${esc(s.id)}">Profil</button><button class="btn btn-secondary btn-small" data-action="new-request" data-supplier-org-id="${esc(s.organization_id)}">Demander des données</button></div></td></tr>`; }).join('')}</tbody></table></div>` : `<div class="empty"><div class="empty-icon">◎</div><strong>Aucun fournisseur connecté</strong><p>Invitez votre premier fournisseur pour commencer une collecte.</p><button class="btn btn-primary btn-small" data-action="invite-supplier">Inviter un fournisseur</button></div>`}</div>`;
      }

      function materialName(material) { return material?.name || material?.materialName || material?.id || 'Matériau'; }
      function materialType(material) { return material?.materialType || material?.material_type || ''; }
      /**
       * Onglets de la fiche produit.
       *
       * Chaque onglet est rattaché à une source réelle ou déclare explicitement
       * qu'il n'en a pas. Les quatre sans source ne sont pas supprimés : un onglet
       * qui dit « aucune source dans TRACEFAB » informe le propriétaire du produit,
       * là où un onglet absent masquerait la lacune.
       */
      const PRODUCT_TABS = [
        { key: 'overview', label: "Vue d'ensemble", source: 'GET /api/products/{id}' },
        { key: 'composition', label: 'Composition', source: 'GET /api/products/{id} · materials' },
        { key: 'materials', label: 'Matières', source: 'GET /api/products/{id}/materials' },
        { key: 'supply-chain', label: "Chaîne d'approvisionnement", source: 'GET /api/products/{id}/supply-chain' },
        { key: 'manufacturing', label: 'Fabrication', source: null },
        { key: 'suppliers', label: 'Fournisseurs', source: 'GET /api/products/{id}/supply-chain · sites' },
        { key: 'evidence', label: 'Preuves', source: null },
        { key: 'certifications', label: 'Certifications', source: null },
        { key: 'quality', label: 'Qualité', source: 'GET /api/quality/products/{id}' },
        { key: 'dpp', label: 'DPP', source: 'GET /api/products/{id}/dpp' },
        { key: 'history', label: 'Historique', source: null },
      ];

      function productTabStrip() {
        const current = state.productTab || 'overview';
        return `<div class="tabs-strip" role="tablist" aria-label="Onglets de la fiche produit">
          ${PRODUCT_TABS.map((tab) => {
            const selected = tab.key === current;
            return `<button type="button" role="tab" class="tab-btn${selected ? ' active' : ''}"
              data-tab="${esc(tab.key)}" id="ptab-${esc(tab.key)}"
              aria-selected="${selected ? 'true' : 'false'}"
              aria-controls="ptabpanel-${esc(tab.key)}"
              title="${tab.source ? 'Source : ' + esc(tab.source) : 'Aucune source de données dans TRACEFAB pour cet onglet'}"
            >${esc(tab.label)}${tab.source ? '' : '<span class="tab-nosource" aria-hidden="true">•</span>'}</button>`;
          }).join('')}
        </div>`;
      }

      /** Panneau honnête pour les onglets sans source de données. */
      function noSourcePanel(tab) {
        const reasons = {
          manufacturing: "Aucun endpoint ne décrit les sites de fabrication d'un produit. Les nœuds de traçabilité portent des étapes, pas des ateliers de production.",
          evidence: "GET /api/documents filtre par type et par statut, pas par produit : aucune requête ne renvoie les preuves d'un produit donné.",
          certifications: "Aucune table ne rattache une certification à un produit. Le catalogue porte les référentiels, pas les certifications obtenues par produit.",
          history: "POST /api/products/{id}/revision crée une révision ; aucun endpoint ne liste les révisions antérieures ni les modifications.",
        };
        return `<div class="card panel"><div class="panel-head"><h2>${esc(tab.label)}</h2></div>
          <div class="empty"><div class="empty-icon">◇</div>
            <strong>Aucune source de données</strong>
            <p class="meta" style="max-width:62ch;margin:8px auto 0">${esc(reasons[tab.key] || 'Aucune source disponible.')}</p>
            <p class="meta" style="margin-top:10px">Cet onglet est conservé visible pour rendre la lacune explicite plutôt que de la masquer.</p>
          </div></div>`;
      }

      function productTabLoading(tab) {
        return `<div class="card panel"><div class="panel-head"><h2>${esc(tab.label)}</h2></div>
          <div class="empty"><div class="empty-icon">⟳</div><strong>Chargement…</strong>
          <p class="meta" style="margin-top:6px">${esc(tab.source || '')}</p></div></div>`;
      }

      function productTabError(tab, message) {
        return `<div class="card panel"><div class="panel-head"><h2>${esc(tab.label)}</h2></div>
          <div class="empty"><div class="empty-icon">⚠</div><strong>Source indisponible</strong>
          <p class="meta" style="margin-top:6px">${esc(message || 'Erreur inconnue')}</p>
          <p class="meta">Endpoint attendu : ${esc(tab.source || '—')}</p></div></div>`;
      }

      /**
       * Rendu des onglets autres que « Vue d'ensemble ».
       * Chaque onglet lit une source réelle ; sans source, il le déclare.
       */
      function productTabPanel(key) {
        const tab = PRODUCT_TABS.find((t) => t.key === key) || PRODUCT_TABS[0];
        if (!tab.source) return noSourcePanel(tab);

        const data = (state.productTabData || {})[key];
        if (!data) return productTabLoading(tab);
        if (data.__error) return productTabError(tab, data.__error);

        switch (key) {
          case 'composition': return compositionPanel(data);
          case 'materials': return materialsTabPanel(data);
          case 'supply-chain': return supplyChainTabPanel(data);
          case 'suppliers': return suppliersTabPanel(data);
          case 'quality': return qualityTabPanel(data);
          case 'dpp': return dppTabPanel(data);
          default: return noSourcePanel(tab);
        }
      }

      /** Composition : uniquement les matières réellement rattachées. */
      function compositionPanel(data) {
        const materials = Array.isArray(data.materials) ? data.materials : [];
        const parts = materials.map((m) => Number(m.percentage)).filter((n) => Number.isFinite(n));
        const total = parts.length ? Math.round(parts.reduce((a, b) => a + b, 0)) : null;
        return `<div class="card panel"><div class="panel-head">
            <div><h2>Composition</h2><p class="meta" style="margin:4px 0 0">Source : le champ materials du contrat GET /api/products/:id.</p></div>
            <span class="meta">${materials.length} matière(s)</span>
          </div>
          ${materials.length ? `<div class="item-list">${materials.map((m) => `<div class="item">
              <div><strong>${esc(materialName(m.material))}</strong>
                <div class="meta">${esc(m.role || 'Rôle non déclaré')} · ${esc(materialType(m.material) || 'Type non déclaré')}</div></div>
              <div class="actions"><span class="badge">${esc(m.percentage === null || m.percentage === undefined ? 'part non déclarée' : m.percentage + '%')}</span></div>
            </div>`).join('')}</div>
            <p class="meta" style="margin-top:12px">${total === null ? 'Aucune part déclarée : la somme ne peut pas être calculée.' : `Somme des parts déclarées : <strong>${total}%</strong>${total === 100 ? '' : ' (différent de 100%)'}`}</p>`
            : `<div class="empty" style="padding:12px 0 18px"><p>Aucune matière rattachée à ce produit.</p></div>`}
        </div>`;
      }

      /** Matières : catalogue rattaché via GET /api/products/{id}/materials. */
      function materialsTabPanel(data) {
        const list = Array.isArray(data.materials) ? data.materials : (Array.isArray(data) ? data : []);
        return `<div class="card panel"><div class="panel-head">
            <div><h2>Matières</h2><p class="meta" style="margin:4px 0 0">Source : GET /api/products/:id/materials.</p></div>
            <span class="meta">${list.length} entrée(s)</span>
          </div>
          ${list.length ? `<div class="item-list">${list.map((m) => `<div class="item">
              <div><strong>${esc(materialName(m.material) || m.name || 'Matière sans nom')}</strong>
                <div class="meta">${esc(m.role || m.materialType || 'Non déclaré')}</div></div>
              <div class="actions"><span class="badge">${esc(m.percentage === undefined || m.percentage === null ? '—' : m.percentage + '%')}</span></div>
            </div>`).join('')}</div>`
            : `<div class="empty" style="padding:12px 0 18px"><p>Aucune matière renvoyée par l'endpoint.</p></div>`}
        </div>`;
      }

      /** Chaîne : nœuds et bilan réellement calculés. */
      function supplyChainTabPanel(data) {
        const summary = data.summary || {};
        const nodes = (data.graph && data.graph.nodes) || [];
        const links = (data.graph && data.graph.links) || [];
        return `<div class="card panel"><div class="panel-head">
            <div><h2>Chaîne d'approvisionnement</h2><p class="meta" style="margin:4px 0 0">Source : GET /api/products/:id/supply-chain.</p></div>
            <span class="meta">${summary.nodeCount ?? nodes.length} nœud(s) · ${summary.linkCount ?? links.length} liaison(s)</span>
          </div>
          <div class="quick-grid" style="margin-bottom:14px">
            <div class="quick"><span class="quick-icon">▤</span><span><strong>${esc(String(summary.documentationRate ?? '—'))}${summary.documentationRate === undefined ? '' : '%'}</strong><span>Couverture documentaire calculée</span></span></div>
            <div class="quick"><span class="quick-icon">◈</span><span><strong>${esc(String(summary.documentedNodeCount ?? '—'))} / ${esc(String(summary.nodeCount ?? '—'))}</strong><span>Nœuds documentés</span></span></div>
            <div class="quick"><span class="quick-icon">≡</span><span><strong>${esc(String(summary.stagesCoveredCount ?? '—'))}</strong><span>Échelons couverts</span></span></div>
          </div>
          ${nodes.length ? `<div class="item-list">${nodes.map((n) => `<div class="item">
              <div><strong>${esc(n.label || 'Nœud sans libellé')}</strong>
                <div class="meta">${esc(n.node_type || 'type inconnu')}${n.process_code ? ` · ${esc(n.process_code)}` : ''}${n.site_country ? ` · ${esc(n.site_country)}` : ''}</div></div>
              <div class="actions"><span class="status ${n.status === 'verified_by_reviewer' ? 'status-approved' : 'status-pending'}">${esc(n.status || 'non déclaré')}</span></div>
            </div>`).join('')}</div>`
            : `<div class="empty" style="padding:12px 0 18px"><p>Aucun nœud de traçabilité rattaché à ce produit.</p></div>`}
        </div>`;
      }

      /** Fournisseurs : déduits des sites portés par les nœuds, jamais inventés. */
      function suppliersTabPanel(data) {
        const nodes = (data.graph && data.graph.nodes) || [];
        const bySite = new Map();
        for (const node of nodes) {
          if (!node.site_name && !node.site_country) continue;
          const key = node.site_name || node.site_country;
          const entry = bySite.get(key) || { name: node.site_name || 'Site sans nom', country: node.site_country || null, nodes: 0 };
          entry.nodes += 1;
          bySite.set(key, entry);
        }
        const sites = [...bySite.values()];
        return `<div class="card panel"><div class="panel-head">
            <div><h2>Fournisseurs</h2><p class="meta" style="margin:4px 0 0">Sites déduits des nœuds de traçabilité rattachés au produit.</p></div>
            <span class="meta">${sites.length} site(s)</span>
          </div>
          ${sites.length ? `<div class="item-list">${sites.map((site) => `<div class="item">
              <div><strong>${esc(site.name)}</strong>
                <div class="meta">${esc(site.country || 'Pays non déclaré')} · ${site.nodes} nœud(s)</div></div>
            </div>`).join('')}</div>`
            : `<div class="empty" style="padding:12px 0 18px"><p>Aucun nœud ne porte de site : aucun fournisseur ne peut être déduit de la chaîne.</p></div>`}
        </div>`;
      }

      /** Qualité : rapport réel de GET /api/quality/products/{id}. */
      function qualityTabPanel(data) {
        const rows = Array.isArray(data.issues) ? data.issues : [];
        const score = data.score ?? data.qualityScore ?? data.index;
        return `<div class="card panel"><div class="panel-head">
            <div><h2>Qualité des données</h2><p class="meta" style="margin:4px 0 0">Source : GET /api/quality/products/:id.</p></div>
            <span class="meta">${score === undefined || score === null ? 'Indice non renvoyé' : `Indice ${esc(String(score))}`}</span>
          </div>
          ${Object.keys(data).length ? `<pre class="meta" style="white-space:pre-wrap;max-height:320px;overflow:auto">${esc(JSON.stringify(data, null, 2))}</pre>`
            : `<div class="empty" style="padding:12px 0 18px"><p>L'endpoint n'a renvoyé aucune donnée de qualité.</p></div>`}
          ${rows.length ? `<p class="meta" style="margin-top:10px">${rows.length} anomalie(s) signalée(s).</p>` : ''}
        </div>`;
      }

      /** DPP : readiness réellement calculée. */
      function dppTabPanel(data) {
        const dpp = data.dpp || data;
        const missing = Array.isArray(dpp.missingFields) ? dpp.missingFields : [];
        const pillars = dpp.pillars ? Object.entries(dpp.pillars) : [];
        return `<div class="card panel"><div class="panel-head">
            <div><h2>Préparation au passeport numérique</h2><p class="meta" style="margin:4px 0 0">Source : GET /api/products/:id/dpp. Indicateur de préparation, pas une certification.</p></div>
            <span class="meta">${esc(String(dpp.readinessStatus || dpp.status || 'état non renvoyé'))}</span>
          </div>
          ${pillars.length ? `<div class="item-list">${pillars.map(([key, pillar]) => {
              const items = Array.isArray(pillar.items) ? pillar.items : [];
              const blocking = items.filter((i) => i.blocking === true).length;
              return `<div class="item"><div><strong>${esc(pillar.label || key)}</strong>
                <div class="meta">${items.length} exigence(s) · ${blocking} bloquante(s)</div></div></div>`;
            }).join('')}</div>` : ''}
          <p class="meta" style="margin-top:12px">${missing.length
            ? `Champs manquants : <strong>${esc(missing.join(', '))}</strong>.`
            : 'Aucun champ manquant signalé.'}</p>
          ${auditPackBlock()}
        </div>`;
      }

      /**
       * Manifeste d'audit CSRD, branché sur POST /api/quality/audit-pack.
       *

      async function generateAuditPack() {
        const productId = state.selectedProductDetail?.product?.id;
        if (!productId) { notify('Aucun produit sélectionné.', true); return; }
        state.auditPack = { __pending: true };
        render();
        try {
          state.auditPack = await api('/api/quality/audit-pack', {
            method: 'POST',
            body: JSON.stringify({
              productId,
              sku: state.selectedProductDetail.product.sku || state.selectedProductDetail.product.reference || undefined,
            }),
          });
          notify('Manifeste d’audit généré.');
        } catch (error) {
          state.auditPack = { __error: error.message };
          notify(error.message, true);
        }
        render();
      }

      /**
       * Chargement paresseux : un onglet n'appelle son endpoint qu'à l'ouverture,
       * et le résultat est mis en cache pour ne pas re-rejouer la requête.
       */
      async function selectProductTab(key) {
        state.productTab = key;
        const tab = PRODUCT_TABS.find((t) => t.key === key);
        if (!tab || !tab.source || !state.selectedProductDetail?.product) { render(); return; }
        state.productTabData = state.productTabData || {};
        /* La composition vient du contrat déjà chargé : pas de requête supplémentaire. */
        if (key === 'composition') {
          state.productTabData.composition = state.selectedProductDetail;
          render();
          return;
        }
        if (state.productTabData[key]) { render(); return; }
        render();
        if (state.demo) {
          state.productTabData[key] = { __error: 'Mode démonstration : cet endpoint n’est pas appelé.' };
          render();
          return;
        }
        const id = encodeURIComponent(state.selectedProductDetail.product.id);
        const endpoints = {
          materials: `/api/products/${id}/materials`,
          'supply-chain': `/api/products/${id}/supply-chain`,
          suppliers: `/api/products/${id}/supply-chain`,
          quality: `/api/quality/products/${id}`,
          dpp: `/api/products/${id}/dpp`,
        };
        try {
          state.productTabData[key] = await api(endpoints[key]);
        } catch (error) {
          state.productTabData[key] = { __error: error.message };
        }
        render();
      }

       */
      function dppActionFor(key, productId) {
        const k = String(key || '');
        if (k.startsWith('composition.') || k.startsWith('material.') || k.startsWith('evidence.')) {
          return `<button class="btn btn-secondary" data-action="product-new-request" data-product-id="${esc(productId)}">Demander la donnée</button>`;

        if (k.startsWith('traceability.') || k.startsWith('supply_chain.')) {
          return `<button class="btn btn-secondary" data-action="select-supply-chain-product" data-product-id="${esc(productId)}">Ouvrir la chaîne</button>`;

        if (k.startsWith('quality.')) {
          return `<button class="btn btn-secondary" data-action="select-quality-product" data-product-id="${esc(productId)}">Ouvrir la qualité</button>`;
        }
        return `<button class="btn btn-secondary" data-product-id="${esc(productId)}">Ouvrir le produit</button>`;
      }

      /**
       * Déclaration géographique AGEC article 13 : ce qui est déduit de la chaîne,
       * ce qui ne l'est pas, et pourquoi. Aucune valeur n'est complétée ici — le
       * serveur renvoie soit un pays établi, soit une lacune qualifiée.
       */
      function agecPanel() {
        const a = state.agec;
        if (!a) {
          return `<div class="card panel"><div class="panel-head"><div><h2>AGEC article 13 · Géographie</h2></div></div>
            <p class="meta" style="margin:0">Non évaluée en mode démonstration : la déduction se fait côté serveur, à partir des nœuds de traçabilité réellement rattachés au produit.</p></div>`;
        }
        if (a.error) {
          return `<div class="card panel"><div class="panel-head"><div><h2>AGEC article 13 · Géographie</h2></div></div>
            <p class="meta" style="margin:0">Dérivation indisponible : ${esc(a.error)}</p></div>`;
        }
        const agec = a.agec || {};
        const gaps = a.gaps || [];
        const geoFields = [
          ['tissageTricotage', 'Tissage / Tricotage'],
          ['teintureImpression', 'Teinture / Impression'],
          ['confection', 'Confection'],
        ];
        const gapFor = (field) => gaps.find((g) => g.field === field);
        const declared = gaps.filter((g) => g.reason === 'requires_declaration');

        return `<div class="card panel">
          <div class="panel-head">
            <div>
              <h2>AGEC article 13 · Géographie</h2>
              <p class="meta" style="margin:4px 0 0">Déduite des nœuds de traçabilité du produit (${a.nodeCount ?? 0} nœud(s)). Aucune valeur n'est complétée par défaut.</p>
            </div>
            <span class="meta">${a.complete ? 'Géographie complète' : 'Géographie incomplète'}</span>
          </div>
          <table class="table">
            <thead><tr><th>Étape</th><th>Pays déclaré</th><th>Source</th></tr></thead>
            <tbody>
              ${geoFields.map(([field, label]) => {
                const country = agec[field];
                const from = (a.derivedFrom || []).find((d) => d.field === field);
                if (country) {
                  return `<tr><td>${esc(label)}</td><td><strong>${esc(country)}</strong></td>
                    <td class="meta">${esc((from && from.nodeIds || []).join(', '))}</td></tr>`;
                }
                const gap = gapFor(field);
                return `<tr><td>${esc(label)}</td>
                  <td><span class="status status-changes_requested">Non établi</span></td>

          </div>

      }

      function demoCatalogPreview(content) {
        const lines = String(content || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter((line) => line.trim());
        const delimiter = (lines[0] || '').includes(';') ? ';' : ',';
        const headers = (lines[0] || '').split(delimiter).map((value) => value.trim().toLowerCase());
        const referenceIndex = headers.indexOf('reference');
        const nameIndex = headers.indexOf('name');
        const errors = [];
        const rows = [];
        if (referenceIndex < 0 || nameIndex < 0) errors.push({ line: 1, code: 'required_column_missing', message: 'Les colonnes reference et name sont obligatoires.' });
        for (let index = 1; index < lines.length && errors.length < 100; index += 1) {
          const cells = lines[index].split(delimiter).map((value) => value.trim().replace(/^"|"$/g, ''));
          if (!cells[referenceIndex] || !cells[nameIndex]) errors.push({ line: index + 1, code: 'required_value_missing', message: 'reference et name sont obligatoires.' });
          else rows.push({ reference: cells[referenceIndex], name: cells[nameIndex], category: cells[headers.indexOf('category')] || null, sku: cells[headers.indexOf('sku')] || null });
        }
        return { valid: errors.length === 0 && rows.length > 0, totalRows: Math.max(0, lines.length - 1), acceptedRows: rows.length, rejectedRows: Math.max(0, lines.length - 1 - rows.length), errors, warnings: [], rows };
      }

      function demoSupplierPreview(content) {
        const lines = String(content || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter((line) => line.trim());
        const delimiter = (lines[0] || '').includes(';') ? ';' : ',';
        const headers = (lines[0] || '').split(delimiter).map((value) => value.trim().toLowerCase());
        const emailIndex = headers.indexOf('email'); const legalNameIndex = headers.indexOf('legalname'); const errors = []; const rows = [];
        if (emailIndex < 0 || legalNameIndex < 0) errors.push({ line: 1, code: 'required_column_missing', message: 'Les colonnes email et legalName sont obligatoires.' });
        for (let index = 1; index < lines.length; index += 1) {
          const cells = lines[index].split(delimiter).map((value) => value.trim().replace(/^"|"$/g, ''));
          const email = cells[emailIndex]?.toLowerCase(); const legalName = cells[legalNameIndex];
          if (!email || !legalName) errors.push({ line: index + 1, code: 'required_value_missing', message: 'email et legalName sont obligatoires.' });
          else rows.push({ email, legalName });
        }
        return { valid: errors.length === 0 && rows.length > 0, totalRows: Math.max(0, lines.length - 1), acceptedRows: rows.length, rejectedRows: Math.max(0, lines.length - 1 - rows.length), errors, rows };
      }

      function downloadTextFile(filename, content, mime = 'text/csv;charset=utf-8') {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = filename;
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

        const templates = state.questionnaires || [];
        if (!templates.length) { notify('Aucun gabarit à exporter.', true); return; }
        downloadTextFile('tracefab-questionnaire-templates.json', JSON.stringify(templates, null, 2), 'application/json;charset=utf-8');
        notify(`${templates.length} gabarit(s) exporté(s).`);
      }

      /* Export réel des matières présentes dans l'état. */
      function exportMaterialsCsv() {
        const materials = state.materials || [];
        if (!materials.length) { notify('Aucune matière à exporter.', true); return; }
        const headers = ['id', 'name', 'normalized_name', 'materialType', 'originCountryCode'];
        const cell = (v) => { const t = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
        const rows = materials.map((m) => headers.map((h) => cell(m[h])).join(','));
        downloadTextFile('tracefab-materials.csv', `\uFEFF${[headers.join(','), ...rows].join('\r\n')}\r\n`);
        notify(`${materials.length} matière(s) exportée(s).`);
      }

      function demoCatalogCsv() {
        const headers = ['reference', 'name', 'category', 'sku', 'description', 'productFamily', 'colorName', 'sizeRange', 'countryOfDesign', 'countryOfManufacture', 'weightGrams', 'careInstructions', 'dataReadiness', 'dataCompletion', 'version', 'compositionJson'];
        const cell = (value) => { const text = value === null || value === undefined ? '' : typeof value === 'string' ? value : JSON.stringify(value); return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text; };
        const rows = state.products.map((product) => headers.map((header) => cell(product[header] ?? (header === 'sizeRange' ? (product.sizeRange || []).join('|') : header === 'careInstructions' || header === 'compositionJson' ? {} : ''))).join(','));
        return `\uFEFF${[headers.join(','), ...rows].join('\r\n')}\r\n`;
      }

      /**
       * Payload CIRPASS construit uniquement à partir de données TRACEFAB réelles.
       * Le schéma ne contient ni bloc AGEC Art. 13 (tissage / teinture / confection),
       * ni indice de réparabilité, ni déclaration microfibres : ces champs sont
       * laissés absents afin que le validateur les signale, plutôt que d'être inventés.
       */
      function buildCirpassPayload(detail, dpp) {
        const product = (detail && detail.product) || {};
        const identifiers = (detail && detail.identifiers) || [];
        const materials = (detail && detail.materials) || [];
        const gtinEntry = identifiers.find((i) => /gtin|ean/i.test(String(i.type || '')));
        const gtin = (gtinEntry && gtinEntry.value) || '';
        const care = product.careInstructions;
        const wash = Array.isArray(care) ? care : (care && Array.isArray(care.wash) ? care.wash : []);
        const payload = {
          '@context': ['https://schema.org', 'https://cirpassproject.eu/schema/1.2'],
          '@type': 'Product',
          identifier: gtin ? 'https://id.gs1.org/01/' + gtin : '',
          gtin: gtin,
          sku: product.sku || product.reference || '',
          name: product.name || '',
          materialComposition: materials
            .filter((m) => m && m.material)
            .map((m) => ({
              materialName: m.material.name || m.material.normalized_name || 'Non renseigné',
              percentage: Number(m.percentage || 0),
            })),
          issuanceMetadata: {
            issuedAt: new Date().toISOString(),
            dppReadinessScore: (dpp && dpp.completionScore) || 0,
            isLegallyPublishable: false,
          },
        };
        if (wash.length) payload.circularityAndCare = { washCareInstructions: wash };
        return payload;
      }

      /** Miroir de validateDppCompliance (api/_lib/dpp-validator.ts) pour le mode démo. */
      function validateCirpassLocal(payload) {
        const blockingErrors = [];
        const warnings = [];
        if (!payload.gtin || String(payload.gtin).trim().length < 8) blockingErrors.push('GTIN / EAN barcode identifier is missing or malformed.');
        if (!payload.sku) blockingErrors.push('Product SKU is required for unique lot serialization.');
        if (!payload.name) blockingErrors.push('Product trade name is required.');
        if (!Array.isArray(payload.materialComposition) || !payload.materialComposition.length) {
          blockingErrors.push('Material composition must contain at least one fiber breakdown.');
        } else {
          const total = payload.materialComposition.reduce((sum, m) => sum + (m.percentage || 0), 0);
          if (Math.abs(total - 100) > 0.5) blockingErrors.push(`Material composition totals ${total}%, expected 100%.`);
        }
        const agec = payload.frenchAgecArticle13;
        if (!agec) {
          blockingErrors.push('French AGEC Article 13 geographical data block is missing.');
        } else {
          if (!agec.tissageTricotage || agec.tissageTricotage.length < 2) blockingErrors.push('AGEC Art. 13: Country of Weaving/Knitting (Tissage/Tricotage) is mandatory.');
          if (!agec.teintureImpression || agec.teintureImpression.length < 2) blockingErrors.push('AGEC Art. 13: Country of Dyeing/Printing (Teinture/Impression) is mandatory.');
          if (!agec.confection || agec.confection.length < 2) blockingErrors.push('AGEC Art. 13: Country of Assembly (Confection) is mandatory.');
        }
        if (agec && agec.microfibresPlastiques === undefined) warnings.push('AGEC Art. 13: Microfiber shedding disclosure should be explicitly declared (true/false).');
        const circ = payload.circularityAndCare;
        if (!circ) warnings.push('Circularity and repairability instructions are recommended for EU ESPR score.');
        else if (circ.repairabilityIndex === undefined || circ.repairabilityIndex < 0 || circ.repairabilityIndex > 10) warnings.push('Repairability index should be graded on a 0 to 10 scale.');
        const totalChecks = 8;
        const readinessScore = Math.max(0, Math.round(((totalChecks - blockingErrors.length) / totalChecks) * 100));
        const isPublishable = blockingErrors.length === 0 && readinessScore >= 85;
        return {
          isValid: blockingErrors.length === 0,
          readinessScore,
          isPublishable,
          blockingErrors,
          warnings,
          standardsPassed: {
            cirpassJsonLd: !!payload.identifier && !!payload.gtin,
            euEspr: isPublishable,
            frenchAgecArt13: !!agec && !!agec.tissageTricotage && !!agec.teintureImpression && !!agec.confection,
            germanLkSg: !!payload.supplyChainProvenance && !!payload.supplyChainProvenance.rawMaterialOrigin,
          },
        };
      }

      /** Détail produit de démonstration : mêmes champs réels, valeurs fictives. */
      function demoProductDetail() {
        const p = state.selectedDppProduct || state.products[0] || {};
        return {
          product: {
            id: p.id || 'demo-p1',
            reference: p.reference || 'AT-ESS-001',
            sku: p.sku || null,
            name: p.name || 'Essentiel coton biologique',
            category: p.category || 'T-Shirt',
            countryOfManufacture: 'PT',
            careInstructions: { wash: ['Lavage 30°', 'Ne pas javelliser'] },
          },
          identifiers: [{ id: 'demo-id-1', type: 'GTIN', value: '3760000000017', isPrimary: true }],
          materials: [
            { materialId: 'demo-m1', role: 'shell', percentage: '95', unit: 'percent', material: { id: 'demo-m1', name: 'Coton biologique', normalized_name: 'coton biologique' } },
            { materialId: 'demo-m2', role: 'trim', percentage: '3', unit: 'percent', material: { id: 'demo-m2', name: 'Élasthanne', normalized_name: 'elasthanne' } },
          ],
        };
      }

      async function validateCirpass() {
        if (!state.selectedDppProduct) return;
        state.cirpassLoading = true;
        render();
        try {
          if (!state.cirpassDetail) {
            if (state.demo) state.cirpassDetail = demoProductDetail();
            else state.cirpassDetail = await api(`/api/products/${encodeURIComponent(state.selectedDppProduct.id)}`);
          }
          const payload = buildCirpassPayload(state.cirpassDetail, state.dpp);
          /* AGEC article 13 : les trois pays sont déduits de la chaîne de traçabilité
             par le serveur (api/_lib/agec.ts), une seule implémentation. Ce qui ne
             peut pas être établi remonte dans `gaps` et reste affiché comme tel. */
          state.agec = null;
          if (!state.demo) {
            try {
              state.agec = await api(
                `/api/products/${encodeURIComponent(state.selectedDppProduct.id)}/dpp/agec-article13`,
              );
            } catch (e) {
              state.agec = { agec: {}, gaps: [], error: e.message };
            }
            const derived = (state.agec && state.agec.agec) || {};
            if (Object.keys(derived).length) {
              payload.frenchAgecArticle13 = { ...(payload.frenchAgecArticle13 || {}), ...derived };
            }
          }
          state.cirpassPayload = payload;
          if (state.demo) {
            state.cirpass = validateCirpassLocal(payload);
            notify('Structure CIRPASS évaluée en mode démonstration.');
          } else {
            state.cirpass = await api('/api/dpp/validate', { method: 'POST', body: JSON.stringify({ payload }) });
            notify('Structure CIRPASS évaluée par le serveur.');
          }
        } catch (e) {
          notify(e.message, true);
        }
        state.cirpassLoading = false;
        render();
      }

      async function loadDpp(productId) {
        state.selectedDppProduct = state.products.find((p) => p.id === productId) || null;
        state.view = 'dpp';
        state.dpp = null;
        state.cirpass = null;
        state.cirpassDetail = null;
        render();
        if (state.demo) {
          state.dpp = demoDpp();
          render();
          return;
        }
        try {
          const res = await api(`/api/products/${encodeURIComponent(productId)}/dpp`);
          state.dpp = res.dpp;
          render();
        } catch (e) {
          notify(e.message, true);
        }
      }

      async function computeDpp() {
        if (!state.selectedDppProduct) return;
        if (state.demo) {
          state.dpp = demoDpp();
          notify('Passeport DPP recalculé en mode démonstration.');
          render();
          return;
        }
        try {
          const res = await api(`/api/products/${encodeURIComponent(state.selectedDppProduct.id)}/dpp`, {
            method: 'POST',
          });
          state.dpp = res.dpp;
          notify('Calcul de préparation DPP actualisé.');
          render();
        } catch (e) {
          notify(e.message, true);
        }
      }

      async function publishDpp() {
        if (!state.selectedDppProduct) return;
        if (!confirm('Confirmez-vous la validation de ce passeport produit pour publication ?')) return;
        if (state.demo) {
          state.dpp.readinessStatus = 'ready_to_publish';
          state.dpp.statusLabel = 'Validé & Prêt à publier';
          state.dpp.isReadyToPublish = true;
          state.dpp.canMarkReadyToPublish = false;
          state.dpp.reviewedAt = new Date().toISOString();
          notify('Passeport DPP validé pour publication en mode démonstration.');
          render();
          return;
        }
        try {
          const res = await api(`/api/products/${encodeURIComponent(state.selectedDppProduct.id)}/dpp/publish-review`, {
            method: 'POST',
          });
          state.dpp = res.dpp;
          notify('Passeport DPP validé pour publication avec succès !');
          render();
        } catch (e) {
          notify(e.message, true);
        }
      }

      async function submitCapConsoleForm(form, kind) {
        const data = Object.fromEntries(new FormData(form));
        if (!state.demo) {
          const path = kind === 'create' ? `/api/quality/issues/${encodeURIComponent(data.issueId)}/cap` : kind === 'review' ? `/api/quality/caps/${encodeURIComponent(data.capId)}/review` : `/api/quality/caps/${encodeURIComponent(data.capId)}/messages`;
          await api(path, { method: 'POST', body: JSON.stringify(data) });
        }
        state.modal = null;
        notify(kind === 'create' ? 'CAP créé.' : kind === 'review' ? 'Revue CAP enregistrée.' : 'Message CAP envoyé.');
        render();
      }

      function bind() {
        document.querySelectorAll('[data-view]').forEach((el) => el.addEventListener('click', () => { state.view = el.dataset.view; state.selectedRequest = null; render(); }));
        document.querySelectorAll('[data-action]').forEach((el) => el.addEventListener('click', async (event) => {
          const action = el.dataset.action;
          try {
            if (action === 'new-product') { state.modal = 'new-product'; render(); }
            if (action === 'generate-audit-pack') await generateAuditPack();
            if (action === 'catalog-import') { state.catalogImport = { filename: '', content: '', preview: null, job: null, loading: false }; state.modal = 'catalog-import'; render(); }
            if (action === 'supplier-import') { state.supplierImport = { filename: '', content: '', preview: null, job: null, delivery: null, loading: false }; state.modal = 'supplier-import'; render(); }
            if (action === 'catalog-export') await exportCatalog();
            if (action === 'audit-export') await exportAudit();
            if (action === 'preview-catalog-import') await previewCatalogImport();
            if (action === 'commit-catalog-import') await commitCatalogImport();
            if (action === 'preview-supplier-import') await previewSupplierImport();
            if (action === 'commit-supplier-import') await commitSupplierImport();
            if (action === 'new-request') { state.modal = 'new-request'; state.modalSupplierId = el.dataset.supplierOrgId || el.dataset.supplierId; state.modalProductId = null; render(); }
            if (action === 'product-new-request') { state.modal = 'new-request'; state.modalProductId = el.dataset.productId; render(); }
            if (action === 'invite-supplier') { state.modal = 'invite-supplier'; render(); }
            if (action === 'open-cap-modal') { state.modal = 'create-cap'; render(); }
            if (action === 'open-review-cap-modal') { state.modal = 'review-cap'; render(); }
            if (action === 'open-cap-message-modal') { state.modal = 'cap-message'; render(); }
            if (action === 'close-modal') { state.modal = null; state.modalProductId = null; render(); }
            if (action === 'retry') { state.configError = null; boot(); }
            if (action === 'refresh-detail') await refreshDetail();
            if (action === 'send-request') await sendRequest();
            if (action === 'remind-request') { event.stopPropagation(); await remindRequest(el.dataset.reminderRequestId); }
            if (action === 'select-quality-product') { state.selectedProduct = null; state.quality = null; render(); }
            if (action === 'select-supply-chain-product') { state.selectedSupplyChainProduct = null; state.supplyChain = null; render(); }
            if (action === 'select-dpp-product') { state.selectedDppProduct = null; state.dpp = null; render(); }
            if (action === 'compute-quality') await computeQuality();
            if (action === 'validate-cirpass') await validateCirpass();
            if (action === 'compute-dpp') await computeDpp();
            if (action === 'publish-dpp') await publishDpp();
            if (action === 'generate-baseline-chain') await generateBaselineChain();
            if (action === 'new-chain-node') { state.modal = 'new-chain-node'; render(); }
            if (action === 'new-chain-link') { state.modal = 'new-chain-link'; render(); }
            if (action === 'product-revision') await reviseProduct();
            if (action === 'product-quality-from-detail') { state.selectedProduct = state.selectedProductDetail?.product; await loadQuality(state.selectedProduct?.id); }
            if (action === 'product-supply-chain-from-detail') { await loadSupplyChain(state.selectedProductDetail?.product?.id); }
            if (action === 'product-dpp-from-detail') { await loadDpp(state.selectedProductDetail?.product?.id); }
            if (action === 'signout' && state.clerk) await state.clerk.signOut();
          } catch (error) { notify(error.message, true); }
        }));
        document.querySelectorAll('[data-request-id]').forEach((el) => el.addEventListener('click', (event) => { event.stopPropagation(); openRequest(el.dataset.requestId); }));
        document.querySelectorAll('[data-tab]').forEach((el) => el.addEventListener('click', () => selectProductTab(el.dataset.tab)));
        document.querySelectorAll('[data-quality-product]').forEach((el) => el.addEventListener('click', () => loadQuality(el.dataset.qualityProduct)));
        document.querySelectorAll('[data-dpp-product]').forEach((el) => el.addEventListener('click', () => loadDpp(el.dataset.dppProduct)));
        document.querySelectorAll('[data-product-id]').forEach((el) => el.addEventListener('click', (event) => { event.stopPropagation(); openProduct(el.dataset.productId); }));
        document.querySelectorAll('[data-supplier-id-view]').forEach((el) => el.addEventListener('click', (event) => { event.stopPropagation(); openSupplier(el.dataset.supplierIdView); }));
        document.querySelectorAll('[data-review-response]').forEach((el) => el.addEventListener('click', () => reviewResponse(el.dataset.reviewResponse, el.dataset.reviewStatus).catch((error) => notify(error.message, true))));
        document.querySelectorAll('[data-delete-chain-link]').forEach((el) => el.addEventListener('click', (e) => { e.stopPropagation(); deleteChainLink(el.dataset.deleteChainLink); }));
        document.querySelectorAll('[data-action="acknowledge-issue"]').forEach((el) => el.addEventListener('click', (e) => { e.stopPropagation(); acknowledgeIssue(el.dataset.issueId).catch((err) => notify(err.message, true)); }));
        document.querySelectorAll('[data-action="open-waive-modal"]').forEach((el) => el.addEventListener('click', (e) => { e.stopPropagation(); state.modal = 'waive-issue'; state.modalIssueId = el.dataset.issueId; render(); }));
        const org = document.getElementById('active-org'); if (org) org.addEventListener('change', () => { state.activeOrganizationId = org.value; sync(); });
        const search = document.getElementById('request-search'); const filter = document.getElementById('request-filter');
        const filterRequests = () => { if (!search || !filter) return; const query = search.value.toLowerCase(); const items = state.requests.filter((r) => (filter.value === 'all' || r.status === filter.value) && `${r.title} ${orgName(r.supplierOrganizationId)}`.toLowerCase().includes(query)); const list = document.getElementById('request-list'); if (list) list.innerHTML = requestTable(items); list?.querySelectorAll('[data-request-id]').forEach((el) => el.addEventListener('click', () => openRequest(el.dataset.requestId))); list?.querySelectorAll('[data-action="remind-request"]').forEach((el) => el.addEventListener('click', (event) => { event.stopPropagation(); remindRequest(el.dataset.reminderRequestId).catch((error) => notify(error.message, true)); })); };
        search?.addEventListener('input', filterRequests); filter?.addEventListener('change', filterRequests);
        document.getElementById('quality-product-select')?.addEventListener('change', (e) => { if (e.target.value) loadQuality(e.target.value); });
        document.getElementById('supply-chain-product-select')?.addEventListener('change', (e) => { if (e.target.value) loadSupplyChain(e.target.value); });
        document.getElementById('dpp-product-select')?.addEventListener('change', (e) => { if (e.target.value) loadDpp(e.target.value); });
        document.getElementById('catalog-import-file')?.addEventListener('change', async (event) => { const file = event.currentTarget.files?.[0]; if (!file) return; state.catalogImport.filename = file.name; state.catalogImport.content = await file.text(); state.catalogImport.preview = null; render(); });
        document.getElementById('catalog-import-content')?.addEventListener('input', (event) => { state.catalogImport.content = event.currentTarget.value; state.catalogImport.preview = null; });
        document.getElementById('supplier-import-file')?.addEventListener('change', async (event) => { const file = event.currentTarget.files?.[0]; if (!file) return; state.supplierImport.filename = file.name; state.supplierImport.content = await file.text(); state.supplierImport.preview = null; render(); });
        document.getElementById('supplier-import-content')?.addEventListener('input', (event) => { state.supplierImport.content = event.currentTarget.value; state.supplierImport.preview = null; });
        document.getElementById('product-form')?.addEventListener('submit', (e) => { e.preventDefault(); createProduct(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.getElementById('create-cap-form')?.addEventListener('submit', (e) => { e.preventDefault(); submitCapConsoleForm(e.currentTarget, 'create').catch((err) => notify(err.message, true)); });
        document.getElementById('review-cap-form')?.addEventListener('submit', (e) => { e.preventDefault(); submitCapConsoleForm(e.currentTarget, 'review').catch((err) => notify(err.message, true)); });
        document.getElementById('cap-message-form')?.addEventListener('submit', (e) => { e.preventDefault(); submitCapConsoleForm(e.currentTarget, 'message').catch((err) => notify(err.message, true)); });
        document.getElementById('product-detail-form')?.addEventListener('submit', (e) => { e.preventDefault(); saveProduct(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.getElementById('schema-binding-form')?.addEventListener('submit', (e) => { e.preventDefault(); saveSchemaBinding(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.getElementById('material-form')?.addEventListener('submit', (e) => { e.preventDefault(); saveMaterial(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.querySelectorAll('.material-edit-form').forEach((form) => form.addEventListener('submit', (e) => { e.preventDefault(); saveMaterial(e.currentTarget).catch((err) => notify(err.message, true)); }));
        document.getElementById('identifier-form')?.addEventListener('submit', (e) => { e.preventDefault(); saveIdentifier(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.querySelectorAll('.identifier-edit-form').forEach((form) => form.addEventListener('submit', (e) => { e.preventDefault(); saveIdentifier(e.currentTarget).catch((err) => notify(err.message, true)); }));
        document.getElementById('supplier-form')?.addEventListener('submit', (e) => { e.preventDefault(); inviteSupplier(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.getElementById('questionnaire-builder-form')?.addEventListener('submit', (e) => {
          e.preventDefault();
          const form = e.currentTarget;
          const data = Object.fromEntries(new FormData(form));
          const newQ = {
            key: data.key,
            version: '1.0',
            title: data.title,
            category: data.category,
            description: data.description,
            itemCount: 4,
            requiredItemCount: data.required === 'true' ? 4 : 3,
            fields: [
              { id: `f-${Date.now()}-1`, key: 'primary_evidence', label: 'Preuve documentaire d\'audit principal', type: data.firstFieldType, required: data.required === 'true', helpText: 'Rapport accrédité' },
              { id: `f-${Date.now()}-2`, key: 'attestation_compliance', label: 'Déclaration formelle de conformité', type: 'text_short', required: true, helpText: 'Signé par le directeur d\'usine' }
            ]
          };
          state.questionnaires.unshift(newQ);
          state.modal = null;
          notify(`Protocole "${data.title}" créé et disponible pour toutes les marques.`);
          render();
        });
        document.getElementById('request-form')?.addEventListener('submit', (e) => { e.preventDefault(); createRequest(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.getElementById('chain-node-form')?.addEventListener('submit', (e) => { e.preventDefault(); addChainNode(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.getElementById('chain-link-form')?.addEventListener('submit', (e) => { e.preventDefault(); addChainLink(e.currentTarget).catch((err) => notify(err.message, true)); });
        document.getElementById('waive-issue-form')?.addEventListener('submit', (e) => { e.preventDefault(); waiveIssue(e.currentTarget).catch((err) => notify(err.message, true)); });
      }

      async function boot() {
        if (state.demo) { await sync(); return; }
        try {
          const res = await fetch('/api/config');
          if (!res.ok) throw new Error('config_fetch_failed');
          const config = await res.json();
          if (!config.publishableKey) throw new Error(config.error || 'clerk_not_configured');
          const clerkDomain = atob(config.publishableKey.split('_')[2]).slice(0, -1);
          await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = `https://${clerkDomain}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
            s.async = true;
            s.crossOrigin = 'anonymous';
            s.setAttribute('data-clerk-publishable-key', config.publishableKey);
            s.onload = resolve;
            s.onerror = () => reject(new Error('clerk_sdk_unavailable'));
            document.head.appendChild(s);
          });
          state.clerk = window.Clerk;
          if (!state.clerk) throw new Error('clerk_sdk_unavailable');
          await state.clerk.load();
          state.clerk.addListener(() => { if (state.clerk.user && !state.user) sync(); });
          if (state.clerk.user) await sync(); else { state.loading = false; render(); }
        } catch (error) {
          // Graceful fallback to interactive simulation mode so the console is ALWAYS operational and never broken
          console.warn('Backend Clerk unavailable, launching interactive demo workspace:', error.message);
          state.demo = true;
          state.configError = null;
          await sync();
        }
      }
      /* Les gestionnaires `onclick` inline du HTML s'exécutent HORS de cette IIFE :
         un identifiant qu'ils référencent et qui n'est pas exposé lève une
         ReferenceError au clic. Les boîtes de dialogue natives fonctionnaient par
         accident, parce qu'elles sont des globales du navigateur — d'où 22 fausses
         annonces de succès qui « marchaient ».
         On expose ici exactement les identifiants utilisés par ces gestionnaires. */
      Object.assign(window, {
        state,
        render,
        notify,
        pendingAction,
        esc,
        filterRequestsByStatus,
        filterIssues,
        exportAudit,
        exportCatalog,
        exportMaterialsCsv,
        exportQuestionnaireTemplates,
        exportRequestSummary,
        verifyDocument,
      });

      window.tracefabBrandConsole = { state, sync };
      boot();
    })();
  </script>
</body>
