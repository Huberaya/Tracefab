<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracefab — Brand Console</title>
  <meta name="description" content="Tracefab Brand Console — collect, review and improve supplier data." data-i18n-attr="content:console.cnMetaDesc">
  <!-- Systeme de jetons partage. Place avant le <style> en ligne pour que
       les declarations propres a la console conservent la priorite. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/design-system/tracefab-core.css?v=2c246dca">
  <style>
    :root {
      --ink: var(--tf-charcoal-800);
      --muted: var(--tf-trust-declared-ink);
      --paper: var(--tf-surface-light);
      --panel: var(--tf-surface-light-raised);
      --line: #e2e8df;
      --green: var(--tf-trust-verified-ink);
      --green-dark: var(--tf-emerald-ink);
      --green-soft: #e4f3ec;
      --yellow: #d79621;
      --yellow-soft: #fff3d8;
      --red: #b04b49;
      --red-soft: #ffebea;
      --shadow: 0 16px 45px rgba(20, 42, 34, .08);
      --radius: 18px;
      font-family: var(--tf-font-text);
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: #112b23; color: #eff8f2; padding: 25px 16px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 11px 31px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 12px; background: #d7f3e4; color: var(--green-dark); display: grid; place-items: center; font-weight: 900; letter-spacing: -.08em; }
    .brand-name { font-weight: 780; letter-spacing: -.03em; font-size: 18px; }
    .brand-name small { display: block; color: #a9c4b6; font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
    .nav { display: grid; gap: 6px; }
    .nav button { appearance: none; border: 0; color: #b8cec2; background: transparent; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 12px 13px; text-align: left; font-size: 13px; font-weight: 650; }
    .nav button:hover, .nav button.active { background: rgba(255,255,255,.1); color: white; }
    .nav-icon { width: 19px; text-align: center; opacity: .9; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,.12); padding: 18px 10px 2px; }
    .user-mini { display: flex; gap: 10px; align-items: center; color: #c5d8cd; font-size: 12px; min-width: 0; }
    .avatar { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #9edec0; color: #124936; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
    .user-mini strong { display: block; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-mini span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .link-button { border: 0; background: transparent; color: inherit; padding: 0; font-size: 12px; text-decoration: underline; opacity: .85; }
    .main { min-width: 0; }
    .topbar { height: 76px; padding: 0 40px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .crumb { color: var(--muted); font-size: 13px; font-weight: 650; }
    .crumb strong { color: var(--ink); }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .org-select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--ink); background: white; max-width: 220px; }
    .content { max-width: 1420px; margin: 0 auto; padding: 42px 40px 70px; }
    .eyebrow code { text-transform: none; letter-spacing: 0; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .13em; color: var(--green); font-weight: 800; margin-bottom: 11px; }
    h1 { margin: 0; font-size: clamp(27px, 3vw, 42px); line-height: 1.06; letter-spacing: -.055em; }
    h2 { margin: 0; font-size: 22px; letter-spacing: -.035em; }
    h3 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    p { color: var(--muted); line-height: 1.6; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 31px; }
    .page-head p { margin: 10px 0 0; max-width: 640px; font-size: 14px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid transparent; border-radius: 11px; padding: 10px 15px; font-weight: 750; font-size: 13px; transition: transform .15s, box-shadow .15s, background .15s; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: white; background: var(--green); box-shadow: 0 7px 16px rgba(11,118,86,.18); }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-secondary { background: white; color: var(--ink); border-color: var(--line); }
    .btn-danger { background: var(--red-soft); color: var(--red); border-color: #f7cbc8; }
    .btn-small { padding: 7px 10px; font-size: 12px; }
    .grid { display: grid; gap: 17px; }
    .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 22px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .kpi { padding: 20px; position: relative; overflow: hidden; }
    .kpi::after { content: ""; width: 90px; height: 90px; border-radius: 50%; position: absolute; right: -30px; bottom: -44px; background: var(--green-soft); }
    .kpi-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .kpi-value { font-size: 30px; font-weight: 800; letter-spacing: -.06em; margin: 13px 0 3px; }
    .kpi-note { font-size: 11px; color: var(--muted); }
    .split { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); align-items: start; }
    .panel { padding: 23px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 18px; }
    .table-wrap { overflow-x: auto; }

    /* Pagination — le catalogue et le registre de risque rendaient 1 248
       lignes d'un bloc (86 543 px et 88 789 px de haut). Barre sobre : le
       comptage lit comme une legende technique, seule la page courante
       prend l'accent. Elle reste lisible en monochrome. */
    .pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .pager-count { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .pager-count strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
    .pager-controls { display: flex; align-items: center; gap: 4px; }
    .pager-num, .pager-step { min-width: var(--tf-touch-min); min-height: var(--tf-touch-min); padding: 0 10px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; }
    .pager-num:hover:not(.is-current), .pager-step:hover:not([disabled]) { background: var(--paper); color: var(--ink); }
    .pager-num.is-current { background: var(--green-dark); border-color: var(--green-dark); color: #fff; font-weight: 600; }
    .pager-step[disabled] { opacity: .38; cursor: default; }
    .pager-gap { min-width: 20px; text-align: center; color: var(--muted); font-size: 12px; }
    /* En etroit, neuf numeros ne tiennent pas : on garde precedent, la page
       courante et suivant. Le comptage au-dessus donne deja la position. */
    @media (max-width: 559px) {
      .pager { justify-content: center; }
      .pager-num:not(.is-current), .pager-gap { display: none; }
    }
    table { width: 100%; border-collapse: collapse; min-width: 610px; }
    th { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; text-align: left; padding: 0 12px 12px; font-weight: 800; }
    td { border-top: 1px solid #edf0eb; padding: 14px 12px; font-size: 13px; vertical-align: middle; }
    td:first-child, th:first-child { padding-left: 0; }
    td:last-child, th:last-child { padding-right: 0; text-align: right; }
    .clickable { cursor: pointer; }
    .clickable:hover td { background: #fbfcfa; }
    .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 800; background: #edf1ed; color: #5b6962; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-sent, .status-in_progress { background: #e8f1ff; color: #386eb0; }
    .status-submitted { background: var(--yellow-soft); color: #95650e; }
    .status-approved, .status-verified_by_reviewer { background: var(--green-soft); color: var(--green); }
    .status-changes_requested, .status-needs_review { background: var(--red-soft); color: var(--red); }
    .status-draft { background: #f0f1f0; color: #636f68; }
    .progress { height: 7px; background: #e9eee9; border-radius: 99px; overflow: hidden; min-width: 82px; }
    .progress > span { display: block; height: 100%; background: var(--green); border-radius: inherit; }
    .progress-line { display: flex; align-items: center; gap: 9px; }
    .progress-line small { color: var(--muted); font-weight: 700; min-width: 32px; }
    .quick-grid { display: grid; gap: 10px; }
    .quick { display: flex; align-items: center; gap: 12px; padding: 13px; border: 1px solid var(--line); border-radius: 13px; background: #fcfdfa; text-align: left; color: var(--ink); }
    .quick:hover { border-color: #afd8c4; background: var(--green-soft); }
    .quick-icon { width: 33px; height: 33px; display: grid; place-items: center; background: var(--green-soft); border-radius: 10px; color: var(--green); font-weight: 900; }
    .quick strong { display: block; font-size: 13px; }
    .quick span { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .empty { padding: 44px 20px; text-align: center; color: var(--muted); }
    .empty-icon { width: 44px; height: 44px; display: grid; place-items: center; margin: 0 auto 13px; border-radius: 14px; background: var(--green-soft); color: var(--green); font-size: 20px; }
    .filters { display: flex; gap: 10px; margin-bottom: 17px; flex-wrap: wrap; }
    .input, .select, .textarea { width: 100%; border: 1px solid #d8e1d8; border-radius: 10px; padding: 11px 12px; background: white; color: var(--ink); outline: none; }
    .input:focus, .select:focus, .textarea:focus { border-color: #58a887; box-shadow: 0 0 0 3px rgba(88,168,135,.13); }
    .filters .input { max-width: 300px; }
    /* Barre de filtres du catalogue. Les trois facettes reprennent les
       colonnes de la table : on filtre sur ce qu'on voit. Le comptage
       n'apparait que lorsqu'un filtre est actif, sinon il repeterait ce que
       la pagination annonce deja. */
    .filters--catalogue { align-items: center; }
    .filters--catalogue .select { width: auto; min-width: 150px; min-height: var(--tf-touch-min); }
    .filters--catalogue .input { min-height: var(--tf-touch-min); flex: 1 1 220px; }
    .filters-chip { display: inline-flex; align-items: center; min-height: var(--tf-touch-min); padding: 0 12px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    .filters-count { margin: 0 0 0 auto; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .filters-count strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
    @media (max-width: 559px) {
      .filters--catalogue .select, .filters--catalogue .input { width: 100%; flex-basis: 100%; }
      .filters-count { margin-left: 0; }
    }
    label { display: grid; gap: 7px; color: #53625a; font-size: 12px; font-weight: 750; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field-full { grid-column: 1 / -1; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 21px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(13,30,24,.42); display: grid; place-items: center; padding: 20px; z-index: 20; }
    .modal { width: min(630px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 25px 80px rgba(0,0,0,.22); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
    .close { border: 0; background: #f2f4f1; color: var(--muted); width: 31px; height: 31px; border-radius: 9px; font-size: 18px; }
    .detail-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    .detail-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .meta { color: var(--muted); font-size: 12px; }

    /* --- Preparation DPP, vue portefeuille ------------------------------- */
    .dp-portfolio-hero { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 32px; align-items: center; }
    .dp-hero-score strong { display: block; font-size: clamp(3rem, 6vw, 4.4rem); line-height: 1; font-weight: 600; letter-spacing: -.03em; color: var(--green); font-variant-numeric: tabular-nums; }
    .dp-hero-score > span { display: block; margin-top: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .13em; color: var(--muted); font-weight: 700; }
    .dp-disclaimer { margin-top: 12px; max-width: 30ch; line-height: 1.5; }
    .dp-hero-facts { border-left: 1px solid var(--line); padding-left: 32px; }
    .dp-hero-stats { display: flex; flex-wrap: wrap; gap: 28px; margin: 16px 0 12px; }
    .dp-hero-stats strong { display: block; font-size: 25px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .dp-hero-stats span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }

    .dp-dist { display: grid; gap: 9px; }
    .dp-dist-row { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 56px; align-items: center; gap: 14px; }
    .dp-dist-label { font-size: 12.5px; color: var(--ink); }
    .dp-dist-track { height: 8px; border-radius: 4px; background: var(--paper); overflow: hidden; }
    .dp-dist-fill { display: block; height: 100%; border-radius: 4px; background: var(--green); }
    .dp-dist-fill.dp-dist-not_started { background: #c7cdc9; }
    .dp-dist-fill.dp-dist-in_progress { background: #b47e18; }
    .dp-dist-fill.dp-dist-review_required { background: #c0492f; }
    .dp-dist-fill.dp-dist-data_ready { background: #2f6f94; }
    .dp-dist-count { text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--muted); }

    .dp-gaps { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .dp-gap { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 16px 18px; background: var(--panel); flex-wrap: wrap; }
    .dp-gap-head { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
    .dp-gap-main { min-width: 0; flex: 1 1 320px; }
    .dp-gap-main .meta { margin: 2px 0; }
    .dp-gap-side { display: flex; align-items: center; gap: 18px; }
    .dp-gap-count { text-align: right; }
    .dp-gap-count strong { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .dp-gap-count span { font-size: 11px; color: var(--muted); }

    @media (max-width: 860px) {
      .dp-portfolio-hero { grid-template-columns: minmax(0, 1fr); gap: 22px; }
      .dp-hero-facts { border-left: 0; border-top: 1px solid var(--line); padding-left: 0; padding-top: 20px; }
      .dp-dist-row { grid-template-columns: minmax(0, 1fr) 48px; }
      .dp-dist-track { grid-column: 1 / -1; }
      .dp-gap { flex-direction: column; align-items: flex-start; gap: 12px; }
      .dp-gap-side { width: 100%; justify-content: space-between; }
    }
    .item-list { display: grid; gap: 11px; }
    .item { padding: 16px; border: 1px solid var(--line); border-radius: 13px; display: grid; grid-template-columns: 1fr auto; gap: 15px; align-items: center; }
    .item h3 { font-size: 14px; }
    .item p { margin: 5px 0 0; font-size: 12px; }
    .item-response { margin-top: 11px; padding: 10px 11px; background: #f7faf6; border-radius: 10px; font-size: 12px; color: #44544b; }
    .item-response strong { color: var(--ink); }
    .score-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 20px; }
    .score { padding: 18px; }
    .score-name { color: var(--muted); font-size: 11px; font-weight: 750; }
    .score-value { font-size: 26px; font-weight: 800; letter-spacing: -.06em; margin: 10px 0; }
    .issue { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 15px 0; border-top: 1px solid #edf0eb; }
    .severity { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 850; padding: 5px 7px; border-radius: 6px; background: var(--yellow-soft); color: #95650e; }
    .severity-blocking { background: var(--red-soft); color: var(--red); }
    .severity-info { background: var(--green-soft); color: var(--green); }
    .issue strong { display: block; font-size: 13px; }
    .issue p { margin: 4px 0 0; font-size: 12px; }
    .pipeline { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 15px; margin-top: 15px; }
    .dpp-hero { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; padding: 24px; background: white; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 22px; }
    .dpp-gauge-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-right: 1px solid #edf0eb; padding-right: 20px; }
    .dpp-gauge-val { font-size: 48px; font-weight: 850; letter-spacing: -.06em; line-height: 1; }
    .dpp-gauge-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-top: 6px; letter-spacing: .06em; }
    .dpp-pillars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 22px; }
    .pillar-card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
    .pillar-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .pillar-name { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .pillar-score { font-size: 18px; font-weight: 850; }
    .pillar-bar-bg { width: 100%; height: 6px; background: #edf2ee; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
    .pillar-bar-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width .3s ease; }
    .pillar-items { display: grid; gap: 6px; }
    .pillar-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 5px 0; border-top: 1px solid #f4f6f3; }
    .pillar-item-label { display: flex; align-items: center; gap: 7px; color: #37473d; }
    .check-icon { font-weight: 800; font-size: 12px; }
    .check-icon.met { color: var(--green); }
    .check-icon.unmet { color: var(--red); }
    .tier-column { background: #fbfdfa; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 11px; min-height: 240px; }
    .tier-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #edf0eb; padding-bottom: 8px; }
    .tier-title { font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: .06em; color: var(--green); }
    .tier-badge { font-size: 10px; background: var(--green-soft); color: var(--green); padding: 2px 7px; border-radius: 6px; font-weight: 800; }
    .node-card { background: white; border: 1px solid #e1e7e2; border-radius: 11px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.03); display: grid; gap: 7px; position: relative; }
    .node-card:hover { border-color: #4da87d; box-shadow: 0 4px 12px rgba(88,168,135,.15); }
    .node-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .node-type-pill { font-size: 9px; text-transform: uppercase; font-weight: 850; padding: 2px 6px; border-radius: 4px; background: #eef3ef; color: #44544b; }
    .node-label { font-size: 13px; font-weight: 750; color: var(--ink); line-height: 1.3; }
    .node-meta { font-size: 11px; color: var(--muted); }
    .node-connector { display: flex; justify-content: center; align-items: center; color: #8ba093; font-size: 16px; margin: -4px 0; }
    .toast { position: fixed; right: 25px; bottom: 25px; z-index: 50; color: white; background: #19372d; border-radius: 12px; padding: 13px 16px; box-shadow: 0 12px 35px rgba(0,0,0,.2); font-size: 13px; max-width: 360px; }
    .toast.error { background: #8e3d3b; }
    .auth-screen { min-height: 100vh; display: grid; place-items: center; padding: 25px; background: radial-gradient(circle at 10% 0%, #d9f1e4, transparent 32%), var(--paper); }
    .auth-card { width: min(950px, 100%); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border-radius: 24px; background: white; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .auth-copy { padding: 52px; background: #112b23; color: white; }
    .auth-copy h1 { font-size: 38px; margin-top: 75px; }
    .auth-copy p { color: #bdd2c7; max-width: 370px; }
    .auth-copy ul { color: #d7e9df; padding-left: 19px; line-height: 2; font-size: 13px; }
    .auth-box { padding: 38px; min-height: 480px; }
    .config-error { max-width: 600px; background: white; padding: 35px; border-radius: 20px; box-shadow: var(--shadow); }
    .demo-banner { background: var(--yellow-soft); border-bottom: 1px solid #f2ddb0; padding: 8px 15px; text-align: center; font-size: 11px; color: #8f6417; font-weight: 750; }
    @media (max-width: 1050px) { .kpis { grid-template-columns: repeat(2, 1fr); } .split { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { .app { display: block; } .sidebar { min-height: auto; padding: 15px; } .brand { padding-bottom: 16px; } .nav { display: flex; overflow-x: auto; } .nav button { white-space: nowrap; } .sidebar-bottom { display: none; } .topbar { padding: 0 18px; height: 64px; } .content { padding: 28px 18px 50px; } .page-head, .detail-hero { display: block; } .actions { justify-content: flex-start; margin-top: 17px; } .org-select { max-width: 150px; } .auth-card { grid-template-columns: 1fr; } .auth-copy { display: none; } .auth-box { min-height: 500px; } .form-grid { grid-template-columns: 1fr; } .field-full { grid-column: auto; } .score-grid { grid-template-columns: repeat(2, 1fr); } }
  
    /* Review Workflow & Document Annotations (Chantier 4) */
    .annotation-panel {
      background: #fbfdfc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    .doc-preview-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid #dce6e0;
      border-radius: 10px;
      margin-top: 8px;
    }
    .badge-ocr {
      background: #ede9fe;
      color: #6d28d9;
      font-size: 10px;
      font-weight: 750;
      padding: 2px 7px;
      border-radius: 6px;
      font-family: var(--font-mono);
    }
    .annotation-bubble {
      background: #fffbeb;
      border-left: 3px solid #b06005;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #78350f;
      margin-top: 10px;
    }
    .annotation-bubble.verified {
      background: #f0fdf4;
      border-left-color: #10b981;
      color: #065f46;
    }

  
    /* ==========================================================================
       MISSION CONTROL CENTER — BRAND CONSOLE (Phase 4 & 5)
       ========================================================================== */
    .mc-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .mc-hero-strip {
      background: linear-gradient(135deg, #091a13 0%, #112b21 60%, #173b2d 100%);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      padding: 28px 32px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    .mc-hero-strip::after {
      content: "";
      position: absolute;
      top: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .mc-headline {
      font-size: 26px;
      font-weight: 850;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .mc-subline {
      font-size: 13.5px;
      color: #a4c4b5;
      max-width: 580px;
      line-height: 1.5;
    }

    /* 4 Distinct Mission Domain Cards */
    .mc-domains-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .mc-domain-card {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      position: relative;
      transition: all 0.2s ease;
    }

    .mc-domain-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(11, 118, 86, 0.08);
      border-color: #0b7656;
    }

    .mc-domain-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .mc-domain-tag {
      font-family: var(--font-mono, monospace);
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #63706b;
    }

    .mc-domain-badge {
      font-family: var(--font-mono, monospace);
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .mc-badge-green { background: #eaf5ef; color: #0b7656; }
    .mc-badge-amber { background: #fef3c7; color: #b45309; }
    .mc-badge-blue { background: #eff6ff; color: #1d4ed8; }
    .mc-badge-red { background: #fee2e2; color: #b91c1c; }

    .mc-stat-huge {
      font-size: 32px;
      font-weight: 850;
      color: #17231f;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 12px;
      font-family: var(--font-mono, monospace);
    }

    .mc-stat-sublist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #edf2ee;
      padding-top: 12px;
      font-size: 12px;
      color: #55655e;
    }

    .mc-stat-subitem {
      display: flex;
      justify-content: space-between;
    }

    .mc-stat-subitem strong {
      color: #17231f;
      font-weight: 700;
    }

    /* Product Lineage & Timeline Container */
    .lineage-shell {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .lineage-pipeline-flow {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      margin-top: 18px;
      align-items: center;
    }

    .lineage-step-card {
      background: #f7f9f7;
      border: 1px solid #e5ebe6;
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lineage-step-card:hover, .lineage-step-card.active {
      background: #0b7656;
      border-color: #07523e;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(11, 118, 86, 0.25);
    }

    .lineage-step-card.active .lineage-step-label,
    .lineage-step-card.active .lineage-step-sub,
    .lineage-step-card:hover .lineage-step-label,
    .lineage-step-card:hover .lineage-step-sub {
      color: #ffffff !important;
    }

    .lineage-step-label {
      font-size: 11.5px;
      font-weight: 800;
      color: #17231f;
      margin-bottom: 2px;
      letter-spacing: -0.01em;
    }

    .lineage-step-sub {
      font-size: 10px;
      color: #63706b;
      font-family: var(--font-mono, monospace);
    }

    /* Attention Section */
    .mc-attention-panel {
      background: #fffdfa;
      border: 1px solid #f2e2be;
      border-radius: 18px;
      padding: 24px;
      margin-top: 24px;
    }

    .mc-attention-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .mc-attention-title {
      font-size: 15px;
      font-weight: 800;
      color: #92400e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mc-attention-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .mc-attention-pill {
      background: #ffffff;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12.5px;
      color: #78350f;
    }

    .mc-attention-num {
      font-size: 18px;
      font-weight: 850;
      color: #b45309;
      font-family: var(--font-mono, monospace);
    }

    @media (max-width: 1024px) {
      .mc-domains-grid, .mc-attention-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .lineage-pipeline-flow {
        grid-template-columns: repeat(4, 1fr);
      }
    }

  
    /* ==========================================================================
       DATA COLLECTION LIFECYCLE PIPELINE (Phase 7)
       Brand ➔ Supplier ➔ Product ➔ Required Data ➔ Evidence ➔ Review ➔ Verified Data
       ========================================================================== */
    .dc-pipeline-container {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .dc-pipeline-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .dc-pipeline-title {
      font-size: 15px;
      font-weight: 800;
      color: #17231f;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dc-lifecycle-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .dc-step-card {
      background: #f7f9f7;
      border: 1px solid #e1e8e2;
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
      position: relative;
    }

    .dc-step-card.active {
      background: #eaf5ef;
      border-color: #0b7656;
    }

    .dc-step-num {
      font-family: var(--font-mono, monospace);
      font-size: 9.5px;
      color: #63706b;
      font-weight: 750;
      margin-bottom: 4px;
    }

    .dc-step-card.active .dc-step-num {
      color: #0b7656;
    }

    .dc-step-label {
      font-size: 11.5px;
      font-weight: 800;
      color: #17231f;
      margin-bottom: 2px;
    }

    .dc-step-sub {
      font-size: 10px;
      color: #63706b;
    }

    /* Statuses Pills Row */
    .dc-status-pills-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .dc-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #e5ebe6;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dc-status-pill.active {
      border-color: #0b7656;
      background: #eaf5ef;
      color: #0b7656;
    }

    .dc-pill-badge {
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.05);
    }

  
    /* ==========================================================================
       PHASE 8: EVIDENCE & QUALITY CENTERS
       "Can you trust your data?"
       ========================================================================== */
    .eq-overview-panel {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .eq-score-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .eq-score-card {
      background: #f7f9f7;
      border: 1px solid #e5ebe6;
      border-radius: 14px;
      padding: 16px;
      text-align: left;
    }

    .eq-score-label {
      font-family: var(--font-mono, monospace);
      font-size: 10px;
      color: #63706b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .eq-score-num {
      font-size: 24px;
      font-weight: 850;
      color: #17231f;
      font-family: var(--font-mono, monospace);
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .eq-score-desc {
      font-size: 11px;
      color: #55655e;
    }

    /* Severity Action Filter Tabs */
    .eq-severity-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .eq-sev-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      border: 1px solid #e1e8e2;
      background: #ffffff;
      transition: all 0.2s;
    }

    .eq-sev-tab.active {
      border-color: #0b7656;
      background: #eaf5ef;
      color: #0b7656;
    }

    .sev-pill-count {
      font-family: var(--font-mono, monospace);
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: rgba(0,0,0,0.06);
    }

  
    /* ==========================================================================
       PHASE 9: FORENSIC TRACEABILITY & MULTI-TIER CUSTODY GRAPH
       "7 Echelons, Real Forensic Verification, Chain of Custody, Zero Illusions"
       ========================================================================== */
    .tc-forensic-strip {
      background: linear-gradient(135deg, #091a13 0%, #102a20 60%, #17382b 100%);
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 20px;
      padding: 26px 30px;
      color: #ffffff;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.09);
    }

    .tc-forensic-badge {
      font-family: var(--font-mono, monospace);
      font-size: 10.5px;
      color: #34d399;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .tc-forensic-title {
      font-size: 26px;
      font-weight: 850;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .tc-forensic-desc {
      font-size: 13.5px;
      color: #b5d5c5;
      max-width: 720px;
      line-height: 1.5;
    }

    /* 7-Echelon Forensic Custody Matrix */
    .tc-echelons-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .tc-echelon-card {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .tc-echelon-card:hover {
      border-color: #0b7656;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(11, 118, 86, 0.08);
    }

    .tc-ech-num {
      font-family: var(--font-mono, monospace);
      font-size: 10px;
      font-weight: 800;
      color: #0b7656;
      margin-bottom: 4px;
    }

    .tc-ech-title {
      font-size: 12px;
      font-weight: 850;
      color: #17231f;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .tc-ech-model {
      font-size: 9.5px;
      font-family: var(--font-mono, monospace);
      padding: 2px 5px;
      border-radius: 4px;
      background: #eaf5ef;
      color: #0b7656;
      display: inline-block;
      margin-bottom: 6px;
    }

    .tc-ech-status {
      font-size: 10px;
      font-weight: 750;
      color: #0b7656;
    }

    /* Mass Balance Reconciliation Table */
    .tc-reconcil-card {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 22px 24px;
      margin-bottom: 24px;
    }

  
    /* ==========================================================================
       PHASE 10: TRACEFAB INTELLIGENCE SYSTEM
       Natural Language Query · Cited Evidence Links · Zero Hallucination Guardrail
       ========================================================================== */
    .intel-hero-card {
      background: linear-gradient(135deg, #050f0b 0%, #0d281c 50%, #153b2a 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      padding: 28px 32px;
      color: #ffffff;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
    }

    .intel-hero-card::after {
      content: "";
      position: absolute;
      top: -30%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    .intel-tag {
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      color: #34d399;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .intel-title {
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .intel-desc {
      font-size: 14px;
      color: #b5d5c5;
      max-width: 720px;
      line-height: 1.55;
    }

    .intel-guardrail-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 6px;
      font-size: 11px;
      font-family: var(--font-mono, monospace);
      color: #34d399;
      margin-top: 12px;
    }

    /* Query Box with Chips */
    .intel-query-panel {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 22px 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .intel-chips-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .intel-chip {
      background: #f4f7f5;
      border: 1px solid #e1e8e2;
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 650;
      color: #17231f;
      cursor: pointer;
      transition: all 0.2s;
    }

    .intel-chip:hover {
      background: #eaf5ef;
      border-color: #0b7656;
      color: #0b7656;
    }

    .intel-input-wrap {
      display: flex;
      gap: 10px;
    }

    .intel-input {
      flex: 1;
      padding: 14px 18px;
      border: 1.5px solid #d5ded7;
      border-radius: 12px;
      font-size: 14px;
      color: #17231f;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .intel-input:focus {
      border-color: #0b7656;
      box-shadow: 0 0 0 3px rgba(11, 118, 86, 0.12);
    }

    /* Answer Stream Box with Evidence Citations */
    .intel-answer-box {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 26px;
      margin-bottom: 24px;
    }

    .intel-answer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #edf2ee;
    }

    .intel-cited-badge {
      font-family: var(--font-mono, monospace);
      font-size: 10.5px;
      font-weight: 750;
      color: #0b7656;
      background: #eaf5ef;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #c2e2d0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .intel-cited-badge:hover {
      background: #0b7656;
      color: #ffffff;
    }

    /* ── Risk & exposure ─────────────────────────────────────────────────
       Les classes mc-badge-* n'apportent que des couleurs, sans geometrie :
       seules, elles rendent un texte nu. On pose ici les quelques regles
       propres a la vue Risk, alignees sur les tokens existants. */
    .risk-note { display:inline-block; padding:4px 11px; border-radius:999px; background:#f1f5f4; color:#37473d; font-size:11.5px; font-weight:750; white-space:nowrap; }
    .risk-pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:800; letter-spacing:.01em; }
    .risk-pill--critical { background:#fee2e2; color:#b91c1c; }
    .risk-pill--high     { background:#ffedd5; color:#c2410c; }
    .risk-pill--medium   { background:#fef3c7; color:#b45309; }
    .risk-pill--low      { background:#eff6ff; color:#1d4ed8; }
    .risk-dim { display:grid; gap:7px; padding:11px 0; border-bottom:1px solid var(--line); }
    .risk-dim:last-child { border-bottom:0; }
    .risk-dim__row { display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
    .risk-dim__name { font-size:13.5px; font-weight:750; color:#37473d; }
    .risk-dim__val { font-size:17px; font-weight:850; font-variant-numeric:tabular-nums; }
    .risk-dim__val.is-muted { font-size:12px; font-weight:650; color:var(--muted); }
    /* l ornement d angle de .kpi passe par-dessus le libelle a 390px */
    .cert-table .status { white-space: nowrap; }
    /* Deux bandes etaient figees a 5 et 7 colonnes, sans repli mobile :
       elles forcaient un defilement horizontal de toute la page. */
    @media (max-width: 760px) {
      .eq-score-strip { grid-template-columns: repeat(2, 1fr); }
      .dc-lifecycle-strip { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 420px) {
      .eq-score-strip, .dc-lifecycle-strip { grid-template-columns: 1fr; }
      .eq-severity-tabs { flex-wrap: wrap; }
    }

    @media (max-width: 720px) {
      .dpp-hero { grid-template-columns: 1fr; gap: 16px; }
