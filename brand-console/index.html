<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracefab — Brand Console</title>
  <meta name="description" content="Tracefab Brand Console — collecter, revoir et améliorer les données fournisseurs.">
  <style>
    :root {
      --ink: #17231f;
      --muted: #71807a;
      --paper: #f7f8f4;
      --panel: #ffffff;
      --line: #e2e8df;
      --green: #0b7656;
      --green-dark: #07523e;
      --green-soft: #e4f3ec;
      --yellow: #d79621;
      --yellow-soft: #fff3d8;
      --red: #bd514e;
      --red-soft: #ffebea;
      --shadow: 0 16px 45px rgba(20, 42, 34, .08);
      --radius: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: #112b23; color: #eff8f2; padding: 25px 16px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 11px 31px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 12px; background: #d7f3e4; color: var(--green-dark); display: grid; place-items: center; font-weight: 900; letter-spacing: -.08em; }
    .brand-name { font-weight: 780; letter-spacing: -.03em; font-size: 18px; }
    .brand-name small { display: block; color: #a9c4b6; font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
    .nav { display: grid; gap: 6px; }
    .nav button { appearance: none; border: 0; color: #b8cec2; background: transparent; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 12px 13px; text-align: left; font-size: 13px; font-weight: 650; }
    .nav button:hover, .nav button.active { background: rgba(255,255,255,.1); color: white; }
    .nav-icon { width: 19px; text-align: center; opacity: .9; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,.12); padding: 18px 10px 2px; }
    .user-mini { display: flex; gap: 10px; align-items: center; color: #c5d8cd; font-size: 12px; min-width: 0; }
    .avatar { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #9edec0; color: #124936; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
    .user-mini strong { display: block; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-mini span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .link-button { border: 0; background: transparent; color: inherit; padding: 0; font-size: 12px; text-decoration: underline; opacity: .85; }
    .main { min-width: 0; }
    .topbar { height: 76px; padding: 0 40px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .crumb { color: var(--muted); font-size: 13px; font-weight: 650; }
    .crumb strong { color: var(--ink); }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .org-select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--ink); background: white; max-width: 220px; }
    .content { max-width: 1420px; margin: 0 auto; padding: 42px 40px 70px; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .13em; color: var(--green); font-weight: 800; margin-bottom: 11px; }
    h1 { margin: 0; font-size: clamp(27px, 3vw, 42px); line-height: 1.06; letter-spacing: -.055em; }
    h2 { margin: 0; font-size: 22px; letter-spacing: -.035em; }
    h3 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    p { color: var(--muted); line-height: 1.6; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 31px; }
    .page-head p { margin: 10px 0 0; max-width: 640px; font-size: 14px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid transparent; border-radius: 11px; padding: 10px 15px; font-weight: 750; font-size: 13px; transition: transform .15s, box-shadow .15s, background .15s; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: white; background: var(--green); box-shadow: 0 7px 16px rgba(11,118,86,.18); }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-secondary { background: white; color: var(--ink); border-color: var(--line); }
    .btn-danger { background: var(--red-soft); color: var(--red); border-color: #f7cbc8; }
    .btn-small { padding: 7px 10px; font-size: 12px; }
    .grid { display: grid; gap: 17px; }
    .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 22px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .kpi { padding: 20px; position: relative; overflow: hidden; }
    .kpi::after { content: ""; width: 90px; height: 90px; border-radius: 50%; position: absolute; right: -30px; bottom: -44px; background: var(--green-soft); }
    .kpi-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .kpi-value { font-size: 30px; font-weight: 800; letter-spacing: -.06em; margin: 13px 0 3px; }
    .kpi-note { font-size: 11px; color: var(--muted); }
    .split { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); align-items: start; }
    .panel { padding: 23px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 18px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 610px; }
    th { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; text-align: left; padding: 0 12px 12px; font-weight: 800; }
    td { border-top: 1px solid #edf0eb; padding: 14px 12px; font-size: 13px; vertical-align: middle; }
    td:first-child, th:first-child { padding-left: 0; }
    td:last-child, th:last-child { padding-right: 0; text-align: right; }
    .clickable { cursor: pointer; }
    .clickable:hover td { background: #fbfcfa; }
    .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 800; background: #edf1ed; color: #5b6962; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-sent, .status-in_progress { background: #e8f1ff; color: #3970b3; }
    .status-submitted { background: var(--yellow-soft); color: #9a680e; }
    .status-approved, .status-verified_by_reviewer { background: var(--green-soft); color: var(--green); }
    .status-changes_requested, .status-needs_review { background: var(--red-soft); color: var(--red); }
    .status-draft { background: #f0f1f0; color: #69766e; }
    .progress { height: 7px; background: #e9eee9; border-radius: 99px; overflow: hidden; min-width: 82px; }
    .progress > span { display: block; height: 100%; background: var(--green); border-radius: inherit; }
    .progress-line { display: flex; align-items: center; gap: 9px; }
    .progress-line small { color: var(--muted); font-weight: 700; min-width: 32px; }
    .quick-grid { display: grid; gap: 10px; }
    .quick { display: flex; align-items: center; gap: 12px; padding: 13px; border: 1px solid var(--line); border-radius: 13px; background: #fcfdfa; text-align: left; color: var(--ink); }
    .quick:hover { border-color: #afd8c4; background: var(--green-soft); }
    .quick-icon { width: 33px; height: 33px; display: grid; place-items: center; background: var(--green-soft); border-radius: 10px; color: var(--green); font-weight: 900; }
    .quick strong { display: block; font-size: 13px; }
    .quick span { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .empty { padding: 44px 20px; text-align: center; color: var(--muted); }
    .empty-icon { width: 44px; height: 44px; display: grid; place-items: center; margin: 0 auto 13px; border-radius: 14px; background: var(--green-soft); color: var(--green); font-size: 20px; }
    .filters { display: flex; gap: 10px; margin-bottom: 17px; flex-wrap: wrap; }
    .input, .select, .textarea { width: 100%; border: 1px solid #d8e1d8; border-radius: 10px; padding: 11px 12px; background: white; color: var(--ink); outline: none; }
    .input:focus, .select:focus, .textarea:focus { border-color: #58a887; box-shadow: 0 0 0 3px rgba(88,168,135,.13); }
    .filters .input { max-width: 300px; }
    label { display: grid; gap: 7px; color: #53625a; font-size: 12px; font-weight: 750; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field-full { grid-column: 1 / -1; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 21px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(13,30,24,.42); display: grid; place-items: center; padding: 20px; z-index: 20; }
    .modal { width: min(630px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 25px 80px rgba(0,0,0,.22); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
    .close { border: 0; background: #f2f4f1; color: var(--muted); width: 31px; height: 31px; border-radius: 9px; font-size: 18px; }
    .detail-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    .detail-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .meta { color: var(--muted); font-size: 12px; }
    .item-list { display: grid; gap: 11px; }
    .item { padding: 16px; border: 1px solid var(--line); border-radius: 13px; display: grid; grid-template-columns: 1fr auto; gap: 15px; align-items: center; }
    .item h3 { font-size: 14px; }
    .item p { margin: 5px 0 0; font-size: 12px; }
    .item-response { margin-top: 11px; padding: 10px 11px; background: #f7faf6; border-radius: 10px; font-size: 12px; color: #44544b; }
    .item-response strong { color: var(--ink); }
    .score-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 20px; }
    .score { padding: 18px; }
    .score-name { color: var(--muted); font-size: 11px; font-weight: 750; }
    .score-value { font-size: 26px; font-weight: 800; letter-spacing: -.06em; margin: 10px 0; }
    .issue { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 15px 0; border-top: 1px solid #edf0eb; }
    .severity { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 850; padding: 5px 7px; border-radius: 6px; background: var(--yellow-soft); color: #9a680e; }
    .severity-blocking { background: var(--red-soft); color: var(--red); }
    .severity-info { background: var(--green-soft); color: var(--green); }
    .issue strong { display: block; font-size: 13px; }
    .issue p { margin: 4px 0 0; font-size: 12px; }
    .pipeline { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 15px; margin-top: 15px; }
    .dpp-hero { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; padding: 24px; background: white; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 22px; }
    .dpp-gauge-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-right: 1px solid #edf0eb; padding-right: 20px; }
    .dpp-gauge-val { font-size: 48px; font-weight: 850; letter-spacing: -.06em; line-height: 1; }
    .dpp-gauge-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-top: 6px; letter-spacing: .06em; }
    .dpp-pillars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 22px; }
    .pillar-card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
    .pillar-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .pillar-name { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .pillar-score { font-size: 18px; font-weight: 850; }
    .pillar-bar-bg { width: 100%; height: 6px; background: #edf2ee; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
    .pillar-bar-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width .3s ease; }
    .pillar-items { display: grid; gap: 6px; }
    .pillar-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 5px 0; border-top: 1px solid #f4f6f3; }
    .pillar-item-label { display: flex; align-items: center; gap: 7px; color: #37473d; }
    .check-icon { font-weight: 800; font-size: 12px; }
    .check-icon.met { color: var(--green); }
    .check-icon.unmet { color: var(--red); }
    .tier-column { background: #fbfdfa; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 11px; min-height: 240px; }
    .tier-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #edf0eb; padding-bottom: 8px; }
    .tier-title { font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: .06em; color: var(--green); }
    .tier-badge { font-size: 10px; background: var(--green-soft); color: var(--green); padding: 2px 7px; border-radius: 6px; font-weight: 800; }
    .node-card { background: white; border: 1px solid #e1e7e2; border-radius: 11px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.03); display: grid; gap: 7px; position: relative; }
    .node-card:hover { border-color: #4da87d; box-shadow: 0 4px 12px rgba(88,168,135,.15); }
    .node-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .node-type-pill { font-size: 9px; text-transform: uppercase; font-weight: 850; padding: 2px 6px; border-radius: 4px; background: #eef3ef; color: #44544b; }
    .node-label { font-size: 13px; font-weight: 750; color: var(--ink); line-height: 1.3; }
    .node-meta { font-size: 11px; color: var(--muted); }
    .node-connector { display: flex; justify-content: center; align-items: center; color: #8ba093; font-size: 16px; margin: -4px 0; }
    .toast { position: fixed; right: 25px; bottom: 25px; z-index: 50; color: white; background: #19372d; border-radius: 12px; padding: 13px 16px; box-shadow: 0 12px 35px rgba(0,0,0,.2); font-size: 13px; max-width: 360px; }
    .toast.error { background: #8e3d3b; }
    .auth-screen { min-height: 100vh; display: grid; place-items: center; padding: 25px; background: radial-gradient(circle at 10% 0%, #d9f1e4, transparent 32%), var(--paper); }
    .auth-card { width: min(950px, 100%); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border-radius: 24px; background: white; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .auth-copy { padding: 52px; background: #112b23; color: white; }
    .auth-copy h1 { font-size: 38px; margin-top: 75px; }
    .auth-copy p { color: #bdd2c7; max-width: 370px; }
    .auth-copy ul { color: #d7e9df; padding-left: 19px; line-height: 2; font-size: 13px; }
    .auth-box { padding: 38px; min-height: 480px; }
    .config-error { max-width: 600px; background: white; padding: 35px; border-radius: 20px; box-shadow: var(--shadow); }
    .demo-banner { background: var(--yellow-soft); border-bottom: 1px solid #f2ddb0; padding: 8px 15px; text-align: center; font-size: 11px; color: #8f6417; font-weight: 750; }
    @media (max-width: 1050px) { .kpis { grid-template-columns: repeat(2, 1fr); } .split { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { .app { display: block; } .sidebar { min-height: auto; padding: 15px; } .brand { padding-bottom: 16px; } .nav { display: flex; overflow-x: auto; } .nav button { white-space: nowrap; } .sidebar-bottom { display: none; } .topbar { padding: 0 18px; height: 64px; } .content { padding: 28px 18px 50px; } .page-head, .detail-hero { display: block; } .actions { justify-content: flex-start; margin-top: 17px; } .org-select { max-width: 150px; } .auth-card { grid-template-columns: 1fr; } .auth-copy { display: none; } .auth-box { min-height: 500px; } .form-grid { grid-template-columns: 1fr; } .field-full { grid-column: auto; } .score-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      'use strict';
      const app = document.getElementById('app');
      const state = {
        clerk: null,
        loading: true,
        configError: null,
        user: null,
        memberships: [],
        organizations: [],
        suppliers: [],
        materials: [],
        products: [],
        requests: [],
        questionnaires: [],
        view: 'overview',
        activeOrganizationId: null,
        selectedRequest: null,
        selectedProduct: null,
        selectedProductDetail: null,
        selectedSupplier: null,
        quality: null,
        supplyChain: null,
        selectedSupplyChainProduct: null,
        dpp: null,
        selectedDppProduct: null,
        modal: null,
        modalIssueId: null,
        toast: null,
        demo: new URLSearchParams(location.search).has('demo'),
      };

      const PROCESS_LABELS = {
        ginning: 'Égrenage (Ginning)',
        spinning: 'Filature (Spinning)',
        weaving: 'Tissage (Weaving)',
        knitting: 'Tricotage (Knitting)',
        dyeing: 'Teinture (Dyeing)',
        printing: 'Impression (Printing)',
        finishing: 'Ennoblissement (Finishing)',
        cutting: 'Coupe (Cutting)',
        sewing: 'Confection (Sewing)',
        assembly: 'Assemblage (Assembly)',
        laundering: 'Lavage (Laundering)',
        packaging: 'Conditionnement (Packaging)',
      };

      const labels = {
        draft: 'Brouillon', sent: 'Envoyée', in_progress: 'En cours', submitted: 'Soumise',
        changes_requested: 'À corriger', approved: 'Approuvée', cancelled: 'Annulée',
        verified_by_reviewer: 'Vérifiée', needs_review: 'À revoir', open: 'Ouverte', acknowledged: 'Acquittée', waived: 'Dérogation', resolved: 'Résolue',
        not_started: 'Non démarré', data_ready: 'Prêt pour validation', ready_to_publish: 'Validé & Prêt à publier', review_required: 'Revue requise'
      };
      const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
      const first = (value) => String(value || '').trim().split(/\s+/).map((part) => part[0]).join('').slice(0, 2).toUpperCase() || 'TF';
      const status = (value) => `<span class="status status-${esc(value)}">${esc(labels[value] || value || '—')}</span>`;
      const pct = (value) => Math.max(0, Math.min(100, Number(value || 0)));
      const date = (value) => value ? new Intl.DateTimeFormat('fr-FR', { dateStyle: 'medium' }).format(new Date(value)) : '—';
      const moneyless = (value) => Number(value || 0).toLocaleString('fr-FR', { maximumFractionDigits: 0 });

      function notify(message, isError = false) {
        state.toast = { message, isError };
        render();
        setTimeout(() => { state.toast = null; render(); }, 3500);
      }

      async function api(path, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        if (!state.demo && state.clerk?.session) {
          const token = await state.clerk.session.getToken();
          if (token) headers.Authorization = `Bearer ${token}`;
        }
        const response = await fetch(path, { ...options, headers });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `request_failed_${response.status}`);
        return payload;
      }

      function demoData() {
        state.user = { fullName: 'Camille Martin', email: 'camille@atelier-demo.fr' };
        state.organizations = [
          { organization_id: 'demo-brand', role: 'owner', organizations: { id: 'demo-brand', type: 'brand', display_name: 'Atelier Demo', legal_name: 'Atelier Demo' } },
          { organization_id: 'demo-supplier', role: 'manager', organizations: { id: 'demo-supplier', type: 'supplier', display_name: 'Nhãn Textile', legal_name: 'Nhãn Textile' } },
        ];
        state.memberships = state.organizations;
        state.suppliers = [{ id: 'demo-supplier-record', organization_id: 'demo-supplier', relationship_id: 'demo-relationship', organizations: { id: 'demo-supplier', type: 'supplier', display_name: 'Nhãn Textile', legal_name: 'Nhãn Textile', country_code: 'PT', status: 'active' } }];
        state.materials = [{ id: 'demo-material-1', name: 'Coton biologique', materialType: 'fiber', originCountryCode: 'PT' }];
        state.products = [
          { id: 'demo-product-1', brandOrganizationId: 'demo-brand', reference: 'AT-ESS-001', name: 'Essentiel coton', category: 'T-shirt', status: 'active', version: 2, dataReadiness: 'needs_review', dataCompletion: '82' },
          { id: 'demo-product-2', brandOrganizationId: 'demo-brand', reference: 'AT-LIN-004', name: 'Ligne lin naturel', category: 'Chemise', status: 'draft', version: 1, dataReadiness: 'in_progress', dataCompletion: '46' },
        ];
        state.requests = [
          { id: 'demo-request-1', brandOrganizationId: 'demo-brand', supplierOrganizationId: 'demo-supplier', title: 'Données produit — collection automne', questionnaireKey: 'product-data-core', questionnaireVersion: '1.0', status: 'in_progress', dueAt: new Date(Date.now() + 5 * 86400000).toISOString(), completionPercentage: '64', lastActivityAt: new Date().toISOString() },
          { id: 'demo-request-2', brandOrganizationId: 'demo-brand', supplierOrganizationId: 'demo-supplier', title: 'Origine et composition — Essentiel coton', questionnaireKey: 'product-data-core', questionnaireVersion: '1.0', status: 'submitted', dueAt: new Date(Date.now() + 2 * 86400000).toISOString(), completionPercentage: '100', lastActivityAt: new Date(Date.now() - 86400000).toISOString() },
        ];
        state.questionnaires = [{ key: 'product-data-core', version: '1.0', title: 'Product data core', description: 'Données produit, composition et fabrication.', itemCount: 5, requiredItemCount: 4 }];
      }

      async function sync() {
        state.loading = true; render();
        try {
          if (state.demo) { demoData(); state.loading = false; render(); return; }
          const [me, orgs, supplierPayload, materials, products, requests, questionnaires] = await Promise.all([
            api('/api/me'), api('/api/organizations'), api('/api/suppliers'), api('/api/materials'), api('/api/products'), api('/api/data-requests'), api('/api/questionnaires')
          ]);
          state.user = me.user;
          state.memberships = me.memberships || [];
          state.organizations = orgs.organizations || [];
          state.suppliers = supplierPayload.suppliers || [];
          state.materials = materials.materials || [];
          state.products = products.products || [];
          state.requests = requests.requests || [];
          state.questionnaires = questionnaires.questionnaires || [];
          const brands = state.memberships.filter((m) => m.organizations?.type === 'brand');
          state.activeOrganizationId = state.activeOrganizationId || brands[0]?.organization_id || null;
          state.loading = false;
          render();
        } catch (error) {
          state.loading = false; state.configError = error.message; render();
        }
      }

      function currentBrand() {
        return state.memberships.find((m) => m.organization_id === state.activeOrganizationId)?.organizations;
      }
      function brands() { return state.memberships.filter((m) => m.organizations?.type === 'brand'); }
      function suppliers() { return state.suppliers || []; }
      function orgName(id) {
        const membership = state.memberships.find((m) => m.organization_id === id);
        const supplier = suppliers().find((s) => s.organization_id === id);
        return membership?.organizations?.display_name || membership?.organizations?.legal_name || supplier?.organizations?.display_name || supplier?.organizations?.legal_name || id?.slice(0, 8) || '—';
      }
      function requestCounts() {
        const open = state.requests.filter((r) => !['approved', 'cancelled'].includes(r.status));
        const dueSoon = open.filter((r) => r.dueAt && new Date(r.dueAt).getTime() - Date.now() < 7 * 86400000);
        return { open: open.length, dueSoon: dueSoon.length, submitted: state.requests.filter((r) => r.status === 'submitted').length };
      }

      function shell(content) {
        const brand = currentBrand();
        const userName = state.user?.fullName || state.user?.email || 'Utilisateur';
        const brandOptions = brands().map((m) => `<option value="${esc(m.organization_id)}" ${m.organization_id === state.activeOrganizationId ? 'selected' : ''}>${esc(m.organizations.display_name || m.organizations.legal_name)}</option>`).join('');

                ${navButton('products', '◇', 'Produits')}
                ${navButton('supplyChain', '☍', 'Traçabilité')}
                ${navButton('dpp', '📋', 'Passeport DPP')}
                ${navButton('quality', '◒', 'Qualité')}
                ${navButton('suppliers', '◎', 'Fournisseurs')}

            </aside>
            <main class="main">
              <header class="topbar"><div class="crumb">Brand Console <span> / </span><strong>${esc(viewLabel())}</strong></div><div class="top-actions">${brands().length ? `<select class="org-select" id="active-org">${brandOptions}</select>` : ''}<button class="btn btn-primary btn-small" data-action="new-request">+ Nouvelle demande</button></div></header>
              <section class="content">${content}</section>
            </main>
          </div>
          ${state.modal ? modal(state.modal) : ''}
          ${state.toast ? `<div class="toast ${state.toast.isError ? 'error' : ''}">${esc(state.toast.message)}</div>` : ''}`;
      }
      function viewLabel() { return ({ overview: 'Vue d’ensemble', requests: 'Demandes de données', products: 'Produits', quality: 'Qualité', suppliers: 'Fournisseurs', requestDetail: 'Détail de la demande', productDetail: 'Détail du produit', supplierDetail: 'Détail du fournisseur', supplyChain: 'Supply Chain & Traçabilité', dpp: 'Passeport Numérique (DPP Readiness)' })[state.view] || 'Vue d’ensemble'; }
      function navButton(view, icon, label) { return `<button class="${state.view === view ? 'active' : ''}" data-view="${view}"><span class="nav-icon">${icon}</span>${label}</button>`; }

      function render() {

        }
        if (state.loading) { app.innerHTML = `<div class="auth-screen"><div class="config-error"><div class="eyebrow">Tracefab</div><h1>Préparation de votre espace…</h1><p>Chargement des organisations, produits et demandes.</p></div></div>`; return; }
        if (!state.user && !state.demo) { renderAuth(); return; }
        const content = state.view === 'overview' ? overview() : state.view === 'requests' ? requestsView() : state.view === 'products' ? productsView() : state.view === 'quality' ? qualityView() : state.view === 'suppliers' ? suppliersView() : state.view === 'productDetail' ? productDetailView() : state.view === 'supplierDetail' ? supplierDetailView() : state.view === 'supplyChain' ? supplyChainView() : state.view === 'dpp' ? dppView() : requestDetailView();
        app.innerHTML = shell(content); bind();
      }

      function renderAuth() {
        app.innerHTML = `<div class="auth-screen"><div class="auth-card"><div class="auth-copy"><div class="brand"><div class="brand-mark">tf</div><div class="brand-name">tracefab<small>brand console</small></div></div><h1>La donnée fournisseur, enfin pilotable.</h1><p>Centralisez vos demandes, rendez les progrès visibles et transformez les données déclarées en décisions documentées.</p><ul><li>Demandes et questionnaires</li><li>Revue et collaboration</li><li>Score qualité explicable</li></ul></div><div class="auth-box"><div class="eyebrow">Espace marque</div><h2>Se connecter</h2><p>Accédez à votre espace Tracefab sécurisé.</p><div id="clerk-sign-in"></div></div></div></div>`;

      function overview() {
        const counts = requestCounts(); const brand = currentBrand();

        return `<div class="page-head"><div><div class="eyebrow">Pilotage fournisseur</div><h1>Demandes de données</h1><p>Créez, envoyez et révisez les informations demandées à vos fournisseurs.</p></div><div class="actions"><button class="btn btn-primary" data-action="new-request">+ Nouvelle demande</button></div></div><div class="card panel"><div class="filters"><input class="input" id="request-search" placeholder="Rechercher une demande…"><select class="select" id="request-filter" style="max-width:190px"><option value="all">Tous les statuts</option><option value="draft">Brouillons</option><option value="in_progress">En cours</option><option value="submitted">À revoir</option><option value="approved">Approuvées</option></select></div><div id="request-list">${requestTable(state.requests)}</div></div>`;

      function productsView() {
        return `<div class="page-head"><div><div class="eyebrow">Catalogue produit</div><h1>Produits</h1><p>Suivez la complétude de vos références et lancez une collecte de données.</p></div><div class="actions"><button class="btn btn-primary" data-action="new-product">+ Nouveau produit</button></div></div><div class="card panel">${state.products.length ? `<div class="table-wrap"><table><thead><tr><th>Produit</th><th>Catégorie</th><th>Statut</th><th>Complétude</th><th>Readiness</th><th></th></tr></thead><tbody>${state.products.map((p) => `<tr><td><strong>${esc(p.name)}</strong><div class="meta">${esc(p.reference)} · v${esc(p.version)}</div></td><td>${esc(p.category || '—')}</td><td>${status(p.status)}</td><td><div class="progress-line"><div class="progress"><span style="width:${pct(p.dataCompletion)}%"></span></div><small>${moneyless(p.dataCompletion)}%</small></div></td><td>${status(p.dataReadiness || 'in_progress')}</td><td><div class="actions" style="justify-content:flex-end"><button class="btn btn-secondary btn-small" data-product-id="${esc(p.id)}">Ouvrir</button><button class="btn btn-secondary btn-small" data-dpp-product="${esc(p.id)}">DPP</button><button class="btn btn-secondary btn-small" data-quality-product="${esc(p.id)}">Qualité</button></div></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><div class="empty-icon">◇</div><strong>Votre catalogue est vide</strong><p>Créez votre première référence produit.</p><button class="btn btn-primary btn-small" data-action="new-product">Créer un produit</button></div>`}</div>`;
      }

      function suppliersView() {
        return `<div class="page-head"><div><div class="eyebrow">Écosystème fournisseur</div><h1>Fournisseurs</h1><p>Invitez et suivez les organisations qui alimentent vos données.</p></div><div class="actions"><button class="btn btn-primary" data-action="invite-supplier">+ Inviter un fournisseur</button></div></div><div class="card panel">${suppliers().length ? `<div class="table-wrap"><table><thead><tr><th>Organisation</th><th>Rôle</th><th>Demandes ouvertes</th><th></th></tr></thead><tbody>${suppliers().map((s) => { const count = state.requests.filter((r) => r.supplierOrganizationId === s.organization_id && !['approved','cancelled'].includes(r.status)).length; return `<tr><td><strong>${esc(s.organizations.display_name || s.organizations.legal_name)}</strong><div class="meta">${esc(s.organizations.country_code || 'Pays non renseigné')}</div></td><td><span class="status status-approved">Partenaire actif</span></td><td>${count}</td><td><div class="actions" style="justify-content:flex-end"><button class="btn btn-secondary btn-small" data-supplier-id-view="${esc(s.id)}">Profil</button><button class="btn btn-secondary btn-small" data-action="new-request" data-supplier-org-id="${esc(s.organization_id)}">Demander des données</button></div></td></tr>`; }).join('')}</tbody></table></div>` : `<div class="empty"><div class="empty-icon">◎</div><strong>Aucun fournisseur connecté</strong><p>Invitez votre premier fournisseur pour commencer une collecte.</p><button class="btn btn-primary btn-small" data-action="invite-supplier">Inviter un fournisseur</button></div>`}</div>`;
      }

      function materialType(material) { return material?.materialType || material?.material_type || ''; }

        return `<div class="page-head"><div><button class="link-button" data-view="products">← Retour aux produits</button><div class="eyebrow" style="margin-top:20px">Produit · v${esc(p.version)}</div><h1>${esc(p.name)}</h1><p>${esc(p.reference)} · ${esc(p.category || 'Catégorie non renseignée')}</p></div><div class="actions"><button class="btn btn-secondary" data-action="product-new-request" data-product-id="${esc(p.id)}">+ Demande fournisseur</button><button class="btn btn-secondary" data-action="product-supply-chain-from-detail">Graphe de traçabilité</button><button class="btn btn-secondary" data-action="product-dpp-from-detail">📋 Passeport DPP</button><button class="btn btn-secondary" data-action="product-revision">Créer une révision</button><button class="btn btn-primary" data-action="product-quality-from-detail">Ouvrir la qualité</button></div></div>
          <div class="grid split">
            <div class="card panel"><div class="panel-head"><h2>Données produit</h2><span class="meta">Les champs calculés restent contrôlés par Neon</span></div><form id="product-detail-form"><div class="form-grid"><label>Référence<input class="input" name="reference" value="${esc(p.reference)}" required></label><label>Nom<input class="input" name="name" value="${esc(p.name)}" required></label><label>Catégorie<input class="input" name="category" value="${esc(p.category || '')}"></label><label>SKU<input class="input" name="sku" value="${esc(p.sku || '')}"></label><label>Description<textarea class="textarea field-full" name="description" rows="4">${esc(p.description || '')}</textarea></label><label>Famille produit<input class="input" name="productFamily" value="${esc(p.productFamily || '')}"></label><label>Couleur<input class="input" name="colorName" value="${esc(p.colorName || '')}"></label><label>Pays de conception<input class="input" name="countryOfDesign" maxlength="2" value="${esc(p.countryOfDesign || '')}"></label><label>Pays de fabrication<input class="input" name="countryOfManufacture" maxlength="2" value="${esc(p.countryOfManufacture || '')}"></label><label>Poids en grammes<input class="input" name="weightGrams" type="number" min="0" step="0.1" value="${esc(p.weightGrams || '')}"></label><label>Tailles<input class="input" name="sizeRange" value="${esc((p.sizeRange || []).join(', '))}" placeholder="S, M, L"></label></div><div class="form-actions"><button class="btn btn-primary">Enregistrer les données</button></div></form></div>
            <div class="card panel"><div class="panel-head"><div><h2>Composition</h2><p class="meta" style="margin:5px 0 0">Version courante · matériaux partagés par votre organisation</p></div><span class="status status-${state.materials.length ? 'approved' : 'draft'}">${state.materials.length} matériau(x)</span></div>
              ${detail.materials?.length ? `<div class="item-list">${detail.materials.map((m) => `<form class="item material-edit-form" data-material-product-id="${esc(p.id)}"><input type="hidden" name="materialId" value="${esc(m.materialId)}"><input type="hidden" name="materialRole" value="${esc(m.role)}"><input type="hidden" name="productVersion" value="${esc(m.productVersion || p.version)}"><div><strong>${esc(materialName(m.material))}</strong><div class="meta">${esc(m.role)} · ${esc(materialType(m.material))}</div></div><div class="actions"><label class="meta">Valeur<input class="input" name="percentage" type="number" min="0" max="100" step="0.01" value="${esc(m.percentage || '')}" aria-label="Pourcentage de ${esc(materialName(m.material))}"></label><label class="meta">Unité<input class="input" name="unit" value="${esc(m.unit || '%')}" maxlength="20" aria-label="Unité de ${esc(materialName(m.material))}"></label><button class="btn btn-secondary btn-small" type="submit">Mettre à jour</button></div></form>`).join('')}</div>` : '<div class="empty" style="padding:12px 0 18px"><p>Aucune composition renseignée pour cette version.</p></div>'}
              <form id="material-form" class="form-grid" style="margin-top:18px"><label class="field-full">Matériau<select class="select" name="materialId" required>${materialOptions || '<option value="">Aucun matériau disponible</option>'}</select></label><label>Rôle<input class="input" name="materialRole" required value="main" placeholder="main"></label><label>Pourcentage<input class="input" name="percentage" type="number" min="0" max="100" step="0.01" placeholder="80"></label><label>Unité<input class="input" name="unit" value="%" maxlength="20"></label><div class="form-actions field-full"><button class="btn btn-primary btn-small" type="submit" ${state.materials.length ? '' : 'disabled'}>Ajouter à la composition</button></div></form>
            </div>
          </div>
          <div class="card panel" style="margin-top:17px"><div class="panel-head"><div><h2>Identifiants</h2><p class="meta" style="margin:5px 0 0">Les identifiants servent à relier cette référence aux systèmes externes.</p></div><span class="meta">${detail.identifiers?.length || 0} enregistré(s)</span></div>
            ${detail.identifiers?.length ? `<div class="item-list">${detail.identifiers.map((identifier) => `<form class="item identifier-edit-form" data-identifier-id="${esc(identifier.id)}"><div><strong>${esc(identifier.type.toUpperCase())}</strong><div class="meta">Créé le ${date(identifier.createdAt)}</div></div><div class="actions"><input class="input" name="identifierValue" value="${esc(identifier.value)}" maxlength="240" required aria-label="Valeur ${esc(identifier.type)}"><label class="meta"><input type="checkbox" name="isPrimary" ${identifier.isPrimary ? 'checked' : ''}> Principal</label><button class="btn btn-secondary btn-small" type="submit">Enregistrer</button></div></form>`).join('')}</div>` : '<div class="empty" style="padding:12px 0 18px"><p>Aucun identifiant renseigné pour cette version.</p></div>'}
            <form id="identifier-form" class="form-grid" style="margin-top:18px"><label>Type<select class="select" name="identifierType" required><option value="internal">Interne</option><option value="gtin">GTIN</option><option value="ean">EAN</option><option value="upc">UPC</option></select></label><label>Valeur<input class="input" name="identifierValue" maxlength="240" required placeholder="3760123456789"></label><label style="display:flex;align-items:center;gap:8px;margin-top:25px"><input type="checkbox" name="isPrimary"> Définir comme principal</label><div class="form-actions" style="margin-top:25px"><button class="btn btn-primary btn-small" type="submit">Ajouter l’identifiant</button></div></form>
          </div>`;

      function supplierDetailView() {
        const supplier = state.selectedSupplier;
        if (!supplier) return `<div class="empty"><div class="empty-icon">◎</div><strong>Fournisseur introuvable</strong><button class="btn btn-secondary" data-view="suppliers">Retour aux fournisseurs</button></div>`;
        return `<div class="page-head"><div><button class="link-button" data-view="suppliers">← Retour aux fournisseurs</button><div class="eyebrow" style="margin-top:20px">Fournisseur</div><h1>${esc(supplier.name)}</h1><p>${esc(supplier.country || 'Pays non renseigné')} · ${esc(supplier.role || 'Membre actif')}</p></div><div class="actions"><button class="btn btn-primary" data-action="new-request" data-supplier-org-id="${esc(supplier.organizationId)}">Nouvelle demande</button></div></div><div class="grid split"><div class="card panel"><div class="panel-head"><h2>Profil fournisseur</h2><span class="status status-${esc(supplier.profile?.onboardingStatus || 'draft')}">${esc(labels[supplier.profile?.onboardingStatus] || supplier.profile?.onboardingStatus || 'Non chargé')}</span></div>${supplier.profile ? `<dl style="display:grid;gap:15px;margin:0"><div><dt class="meta">Complétude</dt><dd style="margin:4px 0;font-weight:800">${esc(supplier.profile.profileCompletion)}%</dd></div><div><dt class="meta">Contact</dt><dd style="margin:4px 0;font-weight:750">${esc(supplier.profile.contactName || '—')} · ${esc(supplier.profile.contactEmail || '—')}</dd></div><div><dt class="meta">Activités</dt><dd style="margin:4px 0;font-weight:750">${esc((supplier.profile.activityTypes || []).join(', ') || '—')}</dd></div><div><dt class="meta">Résumé</dt><dd style="margin:4px 0;line-height:1.5">${esc(supplier.profile.profileSummary || '—')}</dd></div></dl>` : '<div class="empty"><p>Profil non disponible pour cette organisation.</p></div>'}</div><div class="card panel"><div class="panel-head"><h2>Demandes</h2></div>${requestTable(state.requests.filter((r) => r.supplierOrganizationId === supplier.id))}</div></div>`;

      function qualityView() {
        if (!state.selectedProduct) return `<div class="page-head"><div><div class="eyebrow">Quality Center</div><h1>Qualité produit</h1><p>Sélectionnez un produit pour calculer et consulter son score qualité explicable.</p></div></div><div class="card panel"><label>Produit<select class="select" id="quality-product-select"><option value="">Choisir un produit…</option>${state.products.map((p) => `<option value="${esc(p.id)}">${esc(p.reference)} — ${esc(p.name)}</option>`).join('')}</select></label></div>`;
        const q = state.quality; const score = q?.score;
        return `<div class="page-head"><div><div class="eyebrow">Quality Center</div><h1>${esc(state.selectedProduct.name)}</h1><p>Le score décrit l’état de préparation des données. Il ne constitue pas une certification.</p></div><div class="actions"><button class="btn btn-secondary" data-action="select-quality-product">Changer de produit</button><button class="btn btn-primary" data-action="compute-quality">Recalculer le score</button></div></div>${score ? `<div class="grid score-grid">${scoreCard('Complétude', score.completeness)}${scoreCard('Fraîcheur', score.freshness)}${scoreCard('Preuves', score.documentationCoverage)}${scoreCard('Cohérence', score.consistency)}</div>` : `<div class="card empty"><div class="empty-icon">◒</div><strong>Score non calculé</strong><p>Lancez un premier calcul qualité pour ce produit.</p><button class="btn btn-primary btn-small" data-action="compute-quality">Calculer maintenant</button></div>`}${q ? `<div class="card panel"><div class="panel-head"><h2>Issues ouvertes</h2><span class="meta">${q.issues.length} issue(s)</span></div>${q.issues.length ? q.issues.map(issueCard).join('') : '<div class="empty"><strong>Aucune issue ouverte</strong><p>Les règles qualité ne remontent aucun blocage actif.</p></div>'}</div>` : ''}`;
      }
      function scoreCard(label, value) { return `<div class="card score"><div class="score-name">${label}</div><div class="score-value">${moneyless(value)}%</div><div class="progress"><span style="width:${pct(value)}%"></span></div></div>`; }
      function issueCard(issue) {
        const isWaived = issue.status === 'waived';
        const isAcknowledged = issue.status === 'acknowledged';
        const waiverReason = issue.details?.waiver_reason || issue.waiverReason;
        return `
          <div class="issue">
            <span class="severity severity-${esc(issue.severity)}">${esc(issue.severity)}</span>
            <div>
              <strong>${esc(issue.message)}</strong>
              <p>${esc(issue.ruleKey)} · <span class="status status-${esc(issue.status)}">${esc(labels[issue.status] || issue.status)}</span> · <span class="meta">Détectée le ${date(issue.detectedAt)}</span></p>
              ${isWaived && waiverReason ? `
                <div class="item-response" style="margin-top:7px;background:#edf7f0;border:1px solid #cce8d5;border-radius:8px;font-size:11px;color:#285e42">
                  <strong>Dérogation accordée :</strong> ${esc(waiverReason)}
                </div>
              ` : ''}
              ${isAcknowledged ? `
                <div class="meta" style="margin-top:5px;color:#3d6752">✓ Prise en compte et acquittée par l’équipe qualité${issue.acknowledgedAt ? ` le ${date(issue.acknowledgedAt)}` : ''}.</div>
              ` : ''}
            </div>
            <div class="actions" style="justify-content:flex-end">
              ${issue.status === 'open' ? `
                <button class="btn btn-secondary btn-small" data-action="acknowledge-issue" data-issue-id="${esc(issue.id)}">Acquitter</button>
                <button class="btn btn-secondary btn-small" data-action="open-waive-modal" data-issue-id="${esc(issue.id)}">Déroger (Waive)</button>
              ` : isAcknowledged ? `
                <button class="btn btn-secondary btn-small" data-action="open-waive-modal" data-issue-id="${esc(issue.id)}">Déroger (Waive)</button>
              ` : `
                <span class="status status-approved" style="font-size:10px">Dérogation active</span>
              `}
            </div>
          </div>
        `;
      }

      function supplyChainView() {
        if (!state.selectedSupplyChainProduct) {
          return `<div class="page-head"><div><div class="eyebrow">Supply Chain Graph</div><h1>Traçabilité de la chaîne de valeur</h1><p>Sélectionnez un produit pour explorer et cartographier sa chaîne d’approvisionnement multi-rangs (Tier 4 à Tier 0).</p></div></div>
            <div class="card panel"><label>Produit<select class="select" id="supply-chain-product-select"><option value="">Choisir un produit…</option>${state.products.map((p) => `<option value="${esc(p.id)}">${esc(p.reference)} — ${esc(p.name)}</option>`).join('')}</select></label></div>`;

        const sc = state.supplyChain || { graph: { nodes: [], links: [] }, summary: { nodeCount: 0, linkCount: 0, documentationRate: 0, stagesCoveredCount: 0 }, stages: { tier4_raw_materials: [], tier3_spinning: [], tier2_fabric: [], tier1_assembly: [], tier0_product: [], other_nodes: [] } };

        const links = sc.graph?.links || [];
        const stages = sc.stages || { tier4_raw_materials: [], tier3_spinning: [], tier2_fabric: [], tier1_assembly: [], tier0_product: [], other_nodes: [] };

        const renderNodeCard = (node) => {
          const processLabel = PROCESS_LABELS[node.process_code] || node.process_code || '';

            <div class="node-card-head">
              <span class="node-type-pill">${esc(node.node_type)}</span>
              <span class="status status-${esc(node.status)}">${esc(labels[node.status] || node.status)}</span>
            </div>
            <strong class="node-label">${esc(node.label)}</strong>
            ${processLabel ? `<div class="node-meta">⚙ ${esc(processLabel)}</div>` : ''}
            ${entityInfo ? `<div class="node-meta">📍 ${esc(entityInfo)}</div>` : ''}
            ${node.source_document_id ? `<div class="node-meta"><a href="/api/documents/${encodeURIComponent(node.source_document_id)}/download" target="_blank" class="link-button">📄 Preuve documentaire</a></div>` : '<div class="node-meta" style="color:#b26a27">⚠ Non documenté</div>'}

        const renderTierCol = (title, badge, items) => `
          <div class="tier-column">
            <div class="tier-header">
              <span class="tier-title">${esc(title)}</span>
              <span class="tier-badge">${items.length}</span>
            </div>
            ${items.length ? items.map(renderNodeCard).join('') : '<div class="empty" style="padding:25px 5px;font-size:11px">Aucune étape</div>'}
          </div>
        `;

        return `
          <div class="page-head">
            <div>
              <div class="eyebrow">Supply Chain Graph · Traçabilité</div>
              <h1>${esc(p.name)}</h1>
              <p>${esc(p.reference)} · Chaîne de transformation du rang 4 au produit fini</p>
            </div>
            <div class="actions">
              <button class="btn btn-secondary" data-action="select-supply-chain-product">Changer de produit</button>
              <button class="btn btn-secondary" data-action="new-chain-node">+ Nœud</button>

          <div class="grid score-grid">
            <div class="card score"><div class="score-name">Étapes / Nœuds</div><div class="score-value">${summary.nodeCount}</div><div class="node-meta">points de traçabilité</div></div>

            <div class="card score"><div class="score-name">Preuves documentées</div><div class="score-value">${summary.documentationRate}%</div><div class="progress"><span style="width:${pct(summary.documentationRate)}%"></span></div></div>
            <div class="card score"><div class="score-name">Procédés couverts</div><div class="score-value">${summary.stagesCoveredCount}</div><div class="node-meta">filature, tissage, confection…</div></div>

          <div class="card panel">

                <h2>Pipeline de Transformation Multi-Rangs</h2>

            ${nodes.length ? `
              <div class="pipeline">
                ${renderTierCol('Tier 4 · Matières', 'Fibre', stages.tier4_raw_materials)}
                ${renderTierCol('Tier 3 · Filature', 'Fil', stages.tier3_spinning)}
                ${renderTierCol('Tier 2 · Tissage / Teinture', 'Étoffe', stages.tier2_fabric)}
                ${renderTierCol('Tier 1 · Confection', 'Atelier', stages.tier1_assembly)}
                ${renderTierCol('Tier 0 · Produit Fini', 'Packaging', stages.tier0_product)}
              </div>
            ` : `
              <div class="empty">
                <div class="empty-icon">☍</div>
                <strong>Aucune étape dans la chaîne de traçabilité</strong>
                <p>Initialisez la chaîne automatiquement à partir des composants de ce produit ou ajoutez des étapes manuellement.</p>
                <button class="btn btn-primary" data-action="generate-baseline-chain" style="margin-top:10px">Générer la chaîne de base depuis la composition</button>
              </div>
            `}
          </div>

          <div class="card panel" style="margin-top:17px">
            <div class="panel-head">
              <div>
                <h2>Flux & Liens de Traçabilité (${links.length})</h2>

                      <th>Preuve</th>

                  <tbody>
                    ${links.map((link) => {

                      return `<tr>
                        <td><strong>${esc(link.sequence_number ?? '—')}</strong></td>

                        <td><span class="status status-${esc(link.status)}">${esc(labels[link.status] || link.status)}</span></td>
                        <td>${link.evidence_document_id ? `<a href="/api/documents/${encodeURIComponent(link.evidence_document_id)}/download" target="_blank" class="link-button">📄 Preuve</a>` : '<span class="meta">—</span>'}</td>

        `;
      }

      function dppView() {
        if (!state.selectedDppProduct) {
          return `<div class="page-head"><div><div class="eyebrow">Digital Product Passport</div><h1>Préparation DPP (Passeport Numérique des Produits)</h1><p>Sélectionnez un produit textile pour auditer son niveau de conformité et de préparation opérationnelle aux exigences du Passeport Numérique européen (ESPR / DPP).</p></div></div>
            <div class="card panel"><label>Sélectionner un produit<select class="select" id="dpp-product-select"><option value="">Choisir un produit du catalogue…</option>${state.products.map((p) => `<option value="${esc(p.id)}">${esc(p.reference)} — ${esc(p.name)}</option>`).join('')}</select></label></div>`;
        }

        const p = state.selectedDppProduct;
        const dpp = state.dpp || {
          readinessStatus: 'not_started',
          statusLabel: 'Non démarré',
          completionScore: 0,
          totalRequirements: 9,
          metRequirements: 0,
          blockingCount: 0,
          pillars: {},
          missingFields: [],
          blockingIssues: [],
          canMarkReadyToPublish: false,
          isReadyToPublish: false,
        };

        return `<div class="page-head">
            <div>
              <div class="eyebrow">Passeport Numérique des Produits · DPP Readiness</div>
              <h1>${esc(p.name)}</h1>
              <p>Réf: <strong>${esc(p.reference)}</strong> · Version v${esc(p.version)} · Catégorie: ${esc(p.category || 'Non spécifiée')}</p>

          ${dpp.isReadyToPublish ? `
            <div class="card panel" style="background:#edf7f0;border-color:#bce3c9;margin-bottom:20px;padding:16px 20px">

                <span style="font-size:24px">🎉</span>

                </div>
              </div>

          <div class="dpp-hero">
            <div class="dpp-gauge-box">
              <div class="dpp-gauge-val" style="color:${scoreColor}">${moneyless(dpp.completionScore)}%</div>
              <div class="dpp-gauge-label">Score Global DPP</div>
              <div style="margin-top:10px">${status(dpp.readinessStatus)}</div>
            </div>
            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                <span class="eyebrow">Profil Actif : ${esc(dpp.profileKey || 'textile_readiness_mvp')} v${esc(dpp.profileVersion || '1.0')}</span>
                <span class="meta">${esc(dpp.metRequirements)} / ${esc(dpp.totalRequirements)} exigences satisfaites</span>
              </div>
              <div class="progress" style="height:10px;margin-bottom:12px"><span style="width:${pct(dpp.completionScore)}%;background:${scoreColor}"></span></div>

          </div>

          ${dpp.missingFields && dpp.missingFields.length ? `
            <div class="card panel">
              <div class="panel-head">
                <div>
                  <h2>Exigences Restantes à Compléter (${dpp.missingFields.length})</h2>
                  <p class="meta" style="margin:4px 0 0">Actions requises avant de pouvoir certifier le passeport en statut Prêt pour validation.</p>

                <span class="status status-changes_requested">${dpp.blockingCount} bloquant(s)</span>

              <div class="item-list">
                ${dpp.missingFields.map((m) => `

                      <h3>${esc(m.label || m.key)} ${m.blocking ? '<span style="color:var(--red)">*</span>' : ''}</h3>

                      <span class="severity ${m.blocking ? 'severity-blocking' : 'severity-info'}">${m.blocking ? 'Bloquant' : 'Recommandé'}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : `
            <div class="card panel" style="text-align:center;padding:28px">

      function renderPillarCard(pillar, defaultIcon, defaultTitle) {

        const pctVal = pillar.metPercent || 0;

        return `
          <div class="pillar-card">
            <div class="pillar-head">
              <div class="pillar-name"><span>${esc(pillar.icon || defaultIcon)}</span> ${esc(pillar.name || defaultTitle)}</div>

            </div>
            <div class="pillar-bar-bg"><div class="pillar-bar-fill" style="width:${pct(pctVal)}%;background:${color}"></div></div>
            <p class="meta" style="margin-bottom:12px">${esc(pillar.description || '')}</p>
            <div class="pillar-items">
              ${(pillar.items || []).map((it) => `
                <div class="pillar-item">
                  <span class="pillar-item-label">
                    <span class="check-icon ${it.met ? 'met' : 'unmet'}">${it.met ? '✓' : '✗'}</span>
                    ${esc(it.label)}

                  <span class="meta">${it.met ? '<span style="color:var(--green)">Conforme</span>' : '<span style="color:var(--red)">Manquant</span>'}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

        return `<div class="detail-hero"><div><button class="link-button" data-view="requests">← Retour aux demandes</button><div class="eyebrow" style="margin-top:20px">${esc(orgName(r.supplierOrganizationId))}</div><h1>${esc(r.title)}</h1><div class="detail-meta">${status(r.status)}<span class="meta">${esc(r.questionnaireKey)} · v${esc(r.questionnaireVersion)}</span><span class="meta">Échéance : ${date(r.dueAt)}</span>${r.productId ? `<span class="meta">Produit : <strong>${esc(state.products.find((p) => p.id === r.productId)?.name || r.productId)}</strong></span>` : ''}</div></div><div class="actions">${r.status === 'draft' ? '<button class="btn btn-primary" data-action="send-request">Envoyer la demande</button>' : ''}${['submitted','in_progress'].includes(r.status) ? '<button class="btn btn-secondary" data-action="refresh-detail">Actualiser</button>' : ''}</div></div><div class="grid split"><div class="card panel"><div class="panel-head"><h2>Items du questionnaire</h2><div class="progress-line"><div class="progress"><span style="width:${pct(r.completionPercentage)}%"></span></div><small>${moneyless(r.completionPercentage)}%</small></div></div><div class="item-list">${(r.items || []).map((item) => `<div class="item"><div><h3>${esc(item.label)} ${item.required ? '<span style="color:var(--red)">*</span>' : ''}</h3><p>${esc(item.helpText || item.fieldKey)} · ${esc(item.dataType)}</p>${item.responses?.filter((response) => response.isCurrent).map((response) => `<div class="item-response"><strong>Réponse :</strong> ${esc(JSON.stringify(response.value))} <span class="status status-${esc(response.status)}">${esc(labels[response.status] || response.status)}</span>${['declared','documented','needs_review'].includes(response.status) ? `<div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="btn btn-primary btn-small" data-review-response="${esc(response.id)}" data-review-status="verified_by_reviewer">Vérifier</button><button class="btn btn-danger btn-small" data-review-response="${esc(response.id)}" data-review-status="needs_review">Demander une correction</button></div>` : ''}</div>`).join('') || '<div class="item-response">En attente de réponse fournisseur.</div>'}</div><div>${status(item.status)}</div></div>`).join('') || '<div class="empty">Aucun item.</div>'}</div></div><div class="card panel"><div class="panel-head"><h2>Résumé</h2></div><dl style="display:grid;gap:13px;margin:0"><div><dt class="meta">Fournisseur</dt><dd style="margin:4px 0;font-weight:750">${esc(orgName(r.supplierOrganizationId))}</dd></div><div><dt class="meta">Créée le</dt><dd style="margin:4px 0;font-weight:750">${date(r.createdAt)}</dd></div><div><dt class="meta">Dernière activité</dt><dd style="margin:4px 0;font-weight:750">${date(r.lastActivityAt)}</dd></div><div><dt class="meta">Réponses</dt><dd style="margin:4px 0;font-weight:750">${(r.items || []).reduce((n, item) => n + (item.responses || []).filter((x) => x.isCurrent).length, 0)} courante(s)</dd></div>${r.productId ? `<div><dt class="meta">Produit associé</dt><dd style="margin:4px 0;font-weight:750"><button class="link-button" data-product-id="${esc(r.productId)}">${esc(state.products.find((p) => p.id === r.productId)?.name || 'Voir produit')}</button></dd></div>` : ''}</dl><p style="font-size:12px;margin-bottom:0">Les actions de revue détaillées mettent à jour le statut, alimentent les Data Points et déclenchent le recalcul qualité du produit lors de l’approbation.</p></div></div>`;

      async function saveMaterial(form) {

          if (existing) Object.assign(existing, { percentage: body.percentage === null ? null : String(body.percentage), unit: body.unit });
          else state.selectedProductDetail.materials.push({ ...body, percentage: body.percentage === null ? null : String(body.percentage), productVersion: state.selectedProductDetail.product.version, role: body.materialRole, material: material ? { name: material.name, materialType: material.materialType, id: material.id } : { id: body.materialId } });

      async function computeQuality() {
        if (!state.selectedProduct) return;
        if (state.demo) {
          if (state.quality?.score) {
            const hasBlocking = (state.quality.issues || []).some((i) => i.severity === 'blocking' && ['open', 'acknowledged'].includes(i.status));
            state.quality.score.consistency = hasBlocking ? 70 : 100;

          notify('Score qualité recalculé en mode démonstration.');
          render();
          return;
        }
        state.quality = await api(`/api/quality/products/${encodeURIComponent(state.selectedProduct.id)}`, {
          method: 'POST',
          body: JSON.stringify({ calculationVersion: 'product_quality_v1' }),
        });
        notify('Score qualité recalculé.');
        render();
      }

      async function waiveIssue(form) {
        if (!state.selectedProduct) return;
        const data = Object.fromEntries(new FormData(form));
        const issueId = data.issueId;
        const reason = (data.reason || '').trim();
        if (reason.length < 10) {
          notify('Le motif de dérogation doit comporter au moins 10 caractères.', true);
          return;
        }
        if (state.demo) {
          const issue = state.quality?.issues?.find((i) => i.id === issueId);
          if (issue) {
            issue.status = 'waived';
            issue.details = { waiver_reason: reason, waived_at: new Date().toISOString() };
            if (state.quality?.score) {
              const hasBlocking = (state.quality.issues || []).some((i) => i.severity === 'blocking' && ['open', 'acknowledged'].includes(i.status));
              state.quality.score.consistency = hasBlocking ? 70 : 100;
            }
          }
          state.modal = null;
          notify('Dérogation accordée en mode démonstration.');
          render();
          return;
        }
        await api(`/api/quality-issues/${encodeURIComponent(issueId)}/waive`, {
          method: 'POST',
          body: JSON.stringify({ reason }),
        });
        state.modal = null;
        await computeQuality();
        notify('Dérogation enregistrée avec succès.');
      }
