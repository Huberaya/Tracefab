<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracefab — Brand Console</title>
  <meta name="description" content="Tracefab Brand Console — collect, review and improve supplier data." data-i18n-attr="content:console.cnMetaDesc">
  <!-- Chantier 02 : famille unique Inter Tight (variable) + JetBrains Mono,
       alignee sur la landing et le design system v3. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --ink: #17231f;
      --muted: #71807a;
      --paper: #f7f8f4;
      --panel: #ffffff;
      --line: #e2e8df;
      --green: #0b7656;
      --green-dark: #07523e;
      --green-soft: #e4f3ec;
      --yellow: #d79621;
      --yellow-soft: #fff3d8;
      --red: #bd514e;
      --red-soft: #ffebea;
      --shadow: 0 16px 45px rgba(20, 42, 34, .08);
      --radius: 18px;
      font-family: 'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: #112b23; color: #eff8f2; padding: 25px 16px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 11px 31px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 12px; background: #d7f3e4; color: var(--green-dark); display: grid; place-items: center; font-weight: 900; letter-spacing: -.08em; }
    .brand-name { font-weight: 780; letter-spacing: -.03em; font-size: 18px; }
    .brand-name small { display: block; color: #a9c4b6; font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
    .nav { display: grid; gap: 6px; }
    .nav button { appearance: none; border: 0; color: #b8cec2; background: transparent; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 12px 13px; text-align: left; font-size: 13px; font-weight: 650; }
    .nav button:hover, .nav button.active { background: rgba(255,255,255,.1); color: white; }
    .nav-icon { width: 19px; text-align: center; opacity: .9; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,.12); padding: 18px 10px 2px; }
    .user-mini { display: flex; gap: 10px; align-items: center; color: #c5d8cd; font-size: 12px; min-width: 0; }
    .avatar { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #9edec0; color: #124936; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
    .user-mini strong { display: block; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-mini span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .link-button { border: 0; background: transparent; color: inherit; padding: 0; font-size: 12px; text-decoration: underline; opacity: .85; }
    .main { min-width: 0; }
    .topbar { height: 76px; padding: 0 40px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .crumb { color: var(--muted); font-size: 13px; font-weight: 650; }
    .crumb strong { color: var(--ink); }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .org-select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--ink); background: white; max-width: 220px; }
    .content { max-width: 1420px; margin: 0 auto; padding: 42px 40px 70px; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .13em; color: var(--green); font-weight: 800; margin-bottom: 11px; }
    h1 { margin: 0; font-size: clamp(27px, 3vw, 42px); line-height: 1.06; letter-spacing: -.055em; }
    h2 { margin: 0; font-size: 22px; letter-spacing: -.035em; }
    h3 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    p { color: var(--muted); line-height: 1.6; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 31px; }
    .page-head p { margin: 10px 0 0; max-width: 640px; font-size: 14px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid transparent; border-radius: 11px; padding: 10px 15px; font-weight: 750; font-size: 13px; transition: transform .15s, box-shadow .15s, background .15s; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: white; background: var(--green); box-shadow: 0 7px 16px rgba(11,118,86,.18); }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-secondary { background: white; color: var(--ink); border-color: var(--line); }
    .btn-danger { background: var(--red-soft); color: var(--red); border-color: #f7cbc8; }
    .btn-small { padding: 7px 10px; font-size: 12px; }
    .grid { display: grid; gap: 17px; }
    .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 22px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .kpi { padding: 20px; position: relative; overflow: hidden; }
    .kpi::after { content: ""; width: 90px; height: 90px; border-radius: 50%; position: absolute; right: -30px; bottom: -44px; background: var(--green-soft); }
    .kpi-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .kpi-value { font-size: 30px; font-weight: 800; letter-spacing: -.06em; margin: 13px 0 3px; }
    .kpi-note { font-size: 11px; color: var(--muted); }
    .split { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); align-items: start; }
    .panel { padding: 23px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 18px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 610px; }
    th { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; text-align: left; padding: 0 12px 12px; font-weight: 800; }
    td { border-top: 1px solid #edf0eb; padding: 14px 12px; font-size: 13px; vertical-align: middle; }
    td:first-child, th:first-child { padding-left: 0; }
    td:last-child, th:last-child { padding-right: 0; text-align: right; }
    .clickable { cursor: pointer; }
    .clickable:hover td { background: #fbfcfa; }
    .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 800; background: #edf1ed; color: #5b6962; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-sent, .status-in_progress { background: #e8f1ff; color: #3970b3; }
    .status-submitted { background: var(--yellow-soft); color: #9a680e; }
    .status-approved, .status-verified_by_reviewer { background: var(--green-soft); color: var(--green); }
    .status-changes_requested, .status-needs_review { background: var(--red-soft); color: var(--red); }
    .status-draft { background: #f0f1f0; color: #69766e; }
    .progress { height: 7px; background: #e9eee9; border-radius: 99px; overflow: hidden; min-width: 82px; }
    .progress > span { display: block; height: 100%; background: var(--green); border-radius: inherit; }
    .progress-line { display: flex; align-items: center; gap: 9px; }
    .progress-line small { color: var(--muted); font-weight: 700; min-width: 32px; }
    .quick-grid { display: grid; gap: 10px; }
    .quick { display: flex; align-items: center; gap: 12px; padding: 13px; border: 1px solid var(--line); border-radius: 13px; background: #fcfdfa; text-align: left; color: var(--ink); }
    .quick:hover { border-color: #afd8c4; background: var(--green-soft); }
    .quick-icon { width: 33px; height: 33px; display: grid; place-items: center; background: var(--green-soft); border-radius: 10px; color: var(--green); font-weight: 900; }
    .quick strong { display: block; font-size: 13px; }
    .quick span { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .empty { padding: 44px 20px; text-align: center; color: var(--muted); }
    .empty-icon { width: 44px; height: 44px; display: grid; place-items: center; margin: 0 auto 13px; border-radius: 14px; background: var(--green-soft); color: var(--green); font-size: 20px; }
    .filters { display: flex; gap: 10px; margin-bottom: 17px; flex-wrap: wrap; }
    .input, .select, .textarea { width: 100%; border: 1px solid #d8e1d8; border-radius: 10px; padding: 11px 12px; background: white; color: var(--ink); outline: none; }
    .input:focus, .select:focus, .textarea:focus { border-color: #58a887; box-shadow: 0 0 0 3px rgba(88,168,135,.13); }
    .filters .input { max-width: 300px; }
    label { display: grid; gap: 7px; color: #53625a; font-size: 12px; font-weight: 750; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field-full { grid-column: 1 / -1; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 21px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(13,30,24,.42); display: grid; place-items: center; padding: 20px; z-index: 20; }
    .modal { width: min(630px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 25px 80px rgba(0,0,0,.22); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
    .close { border: 0; background: #f2f4f1; color: var(--muted); width: 31px; height: 31px; border-radius: 9px; font-size: 18px; }
    .detail-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    .detail-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .meta { color: var(--muted); font-size: 12px; }
    .item-list { display: grid; gap: 11px; }
    .item { padding: 16px; border: 1px solid var(--line); border-radius: 13px; display: grid; grid-template-columns: 1fr auto; gap: 15px; align-items: center; }
    .item h3 { font-size: 14px; }
    .item p { margin: 5px 0 0; font-size: 12px; }
    .item-response { margin-top: 11px; padding: 10px 11px; background: #f7faf6; border-radius: 10px; font-size: 12px; color: #44544b; }
    .item-response strong { color: var(--ink); }
    .score-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 20px; }
    .score { padding: 18px; }
    .score-name { color: var(--muted); font-size: 11px; font-weight: 750; }
    .score-value { font-size: 26px; font-weight: 800; letter-spacing: -.06em; margin: 10px 0; }
    .issue { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 15px 0; border-top: 1px solid #edf0eb; }
    .severity { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 850; padding: 5px 7px; border-radius: 6px; background: var(--yellow-soft); color: #9a680e; }
    .severity-blocking { background: var(--red-soft); color: var(--red); }
    .severity-info { background: var(--green-soft); color: var(--green); }
    .issue strong { display: block; font-size: 13px; }
    .issue p { margin: 4px 0 0; font-size: 12px; }
    .pipeline { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 15px; margin-top: 15px; }
    .dpp-hero { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; padding: 24px; background: white; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 22px; }
    .dpp-gauge-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-right: 1px solid #edf0eb; padding-right: 20px; }
    .dpp-gauge-val { font-size: 48px; font-weight: 850; letter-spacing: -.06em; line-height: 1; }
    .dpp-gauge-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-top: 6px; letter-spacing: .06em; }
    .dpp-pillars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 22px; }
    .pillar-card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
    .pillar-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .pillar-name { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .pillar-score { font-size: 18px; font-weight: 850; }
    .pillar-bar-bg { width: 100%; height: 6px; background: #edf2ee; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
    .pillar-bar-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width .3s ease; }
    .pillar-items { display: grid; gap: 6px; }
    .pillar-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 5px 0; border-top: 1px solid #f4f6f3; }
    .pillar-item-label { display: flex; align-items: center; gap: 7px; color: #37473d; }
    .check-icon { font-weight: 800; font-size: 12px; }
    .check-icon.met { color: var(--green); }
    .check-icon.unmet { color: var(--red); }
    .tier-column { background: #fbfdfa; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 11px; min-height: 240px; }
    .tier-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #edf0eb; padding-bottom: 8px; }
    .tier-title { font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: .06em; color: var(--green); }
    .tier-badge { font-size: 10px; background: var(--green-soft); color: var(--green); padding: 2px 7px; border-radius: 6px; font-weight: 800; }
    .node-card { background: white; border: 1px solid #e1e7e2; border-radius: 11px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.03); display: grid; gap: 7px; position: relative; }
    .node-card:hover { border-color: #4da87d; box-shadow: 0 4px 12px rgba(88,168,135,.15); }
    .node-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .node-type-pill { font-size: 9px; text-transform: uppercase; font-weight: 850; padding: 2px 6px; border-radius: 4px; background: #eef3ef; color: #44544b; }
    .node-label { font-size: 13px; font-weight: 750; color: var(--ink); line-height: 1.3; }
    .node-meta { font-size: 11px; color: var(--muted); }
    .node-connector { display: flex; justify-content: center; align-items: center; color: #8ba093; font-size: 16px; margin: -4px 0; }
    .toast { position: fixed; right: 25px; bottom: 25px; z-index: 50; color: white; background: #19372d; border-radius: 12px; padding: 13px 16px; box-shadow: 0 12px 35px rgba(0,0,0,.2); font-size: 13px; max-width: 360px; }
    .toast.error { background: #8e3d3b; }
    .auth-screen { min-height: 100vh; display: grid; place-items: center; padding: 25px; background: radial-gradient(circle at 10% 0%, #d9f1e4, transparent 32%), var(--paper); }
    .auth-card { width: min(950px, 100%); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border-radius: 24px; background: white; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .auth-copy { padding: 52px; background: #112b23; color: white; }
    .auth-copy h1 { font-size: 38px; margin-top: 75px; }
    .auth-copy p { color: #bdd2c7; max-width: 370px; }
    .auth-copy ul { color: #d7e9df; padding-left: 19px; line-height: 2; font-size: 13px; }
    .auth-box { padding: 38px; min-height: 480px; }
    .config-error { max-width: 600px; background: white; padding: 35px; border-radius: 20px; box-shadow: var(--shadow); }
    .demo-banner { background: var(--yellow-soft); border-bottom: 1px solid #f2ddb0; padding: 8px 15px; text-align: center; font-size: 11px; color: #8f6417; font-weight: 750; }
    @media (max-width: 1050px) { .kpis { grid-template-columns: repeat(2, 1fr); } .split { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { .app { display: block; } .sidebar { min-height: auto; padding: 15px; } .brand { padding-bottom: 16px; } .nav { display: flex; overflow-x: auto; } .nav button { white-space: nowrap; } .sidebar-bottom { display: none; } .topbar { padding: 0 18px; height: 64px; } .content { padding: 28px 18px 50px; } .page-head, .detail-hero { display: block; } .actions { justify-content: flex-start; margin-top: 17px; } .org-select { max-width: 150px; } .auth-card { grid-template-columns: 1fr; } .auth-copy { display: none; } .auth-box { min-height: 500px; } .form-grid { grid-template-columns: 1fr; } .field-full { grid-column: auto; } .score-grid { grid-template-columns: repeat(2, 1fr); } }
  
    /* Review Workflow & Document Annotations (Chantier 4) */
    .annotation-panel {
      background: #fbfdfc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    .doc-preview-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid #dce6e0;
      border-radius: 10px;
      margin-top: 8px;
    }
    .badge-ocr {
      background: #ede9fe;
      color: #6d28d9;
      font-size: 10px;
      font-weight: 750;
      padding: 2px 7px;
      border-radius: 6px;
      font-family: var(--font-mono);
    }
    .annotation-bubble {
      background: #fffbeb;
      border-left: 3px solid #d97706;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #78350f;
      margin-top: 10px;
    }
    .annotation-bubble.verified {
      background: #f0fdf4;
      border-left-color: #10b981;
      color: #065f46;
    }

  
    /* ==========================================================================
       MISSION CONTROL CENTER — BRAND CONSOLE (Phase 4 & 5)
       ========================================================================== */
    .mc-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .mc-hero-strip {
      background: linear-gradient(135deg, #091a13 0%, #112b21 60%, #173b2d 100%);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      padding: 28px 32px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    .mc-hero-strip::after {
      content: "";
      position: absolute;
      top: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .mc-headline {
      font-size: 26px;
      font-weight: 850;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .mc-subline {
      font-size: 13.5px;
      color: #a4c4b5;
      max-width: 580px;
      line-height: 1.5;
    }

    /* 4 Distinct Mission Domain Cards */
    .mc-domains-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .mc-domain-card {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      position: relative;
      transition: all 0.2s ease;
    }

    .mc-domain-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(11, 118, 86, 0.08);
      border-color: #0b7656;
    }

    .mc-domain-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .mc-domain-tag {
      font-family: var(--font-mono, monospace);
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #71807a;
    }

    .mc-domain-badge {
      font-family: var(--font-mono, monospace);
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .mc-badge-green { background: #eaf5ef; color: #0b7656; }
    .mc-badge-amber { background: #fef3c7; color: #b45309; }
    .mc-badge-blue { background: #eff6ff; color: #1d4ed8; }
    .mc-badge-red { background: #fee2e2; color: #b91c1c; }

    .mc-stat-huge {
      font-size: 32px;
      font-weight: 850;
      color: #17231f;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 12px;
      font-family: var(--font-mono, monospace);
    }

    .mc-stat-sublist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #edf2ee;
      padding-top: 12px;
      font-size: 12px;
      color: #55655e;
    }

    .mc-stat-subitem {
      display: flex;
      justify-content: space-between;
    }

    .mc-stat-subitem strong {
      color: #17231f;
      font-weight: 700;
    }

    /* Product Lineage & Timeline Container */
    .lineage-shell {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .lineage-pipeline-flow {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      margin-top: 18px;
      align-items: center;
    }

    .lineage-step-card {
      background: #f7f9f7;
      border: 1px solid #e5ebe6;

      function demoAlea(graine) {

        let a = graine >>> 0;

        return () => {

          a = (a + 0x6d2b79f5) >>> 0;

          let t = Math.imul(a ^ (a >>> 15), 1 | a);

          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

        };

      }

        for (let i = 0; reste > 0 && parFournisseur.length; i = (i + 1) % parFournisseur.length) {

          parFournisseur[i] += ajout; reste -= ajout;

          state.requests = requests.requests || [];
          state.questionnaires = questionnaires.questionnaires || [];
          state.schemaCatalog = schemas.schemas || [];

          // ne pas bloquer le reste de la console si l'endpoint echoue.
          const evidence = await Promise.allSettled([api('/api/documents')]);

          const certPayloads = await Promise.allSettled([api('/api/certifications'), api('/api/catalog/certification-standards')]);

      /* Chantier 08 — Evidence Center : centre de preuves reel de la console.
         Alimente par GET /api/documents (state.documents, charge dans sync),
         upload via /api/documents/upload-intent + PUT presigne + analyse
         antivirus /api/documents/:id/scan, rapports de verification et de
         securite via leurs endpoints respectifs. Aucun chiffre en dur : les
         statistiques sont comptees depuis les documents charges. */
      const be = (key, fb) => (window.TF_I18N ? window.TF_I18N.t('evidence.' + key, fb) : fb);
      const evidenceKindLabel = (k) => be('kinds.' + k, k);
      const evidenceStatusLabel = (s) => be('status.' + s, s);
      const evidenceSize = (bytes) => {
        const n = Number(bytes);
        if (!Number.isFinite(n) || n <= 0) return '—';
        return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1024).toFixed(1) + ' KB';
      };
      const evidenceLinksCount = (doc) => {
        const links = doc.links || {};
        return Object.values(links).reduce((a, b) => a + (Number(b) || 0), 0);
      };

      function evidenceDetailRow(doc) {
        const detail = state.evidenceDetail;
        if (!detail || detail.id !== doc.id) return '';
        let body;
        if (detail.loading) {
          body = `<p class="meta">${be('detail.loading', 'Loading…')}</p>`;
        } else if (detail.error) {
          body = `<p class="meta" style="color:#b91c1c">${esc(detail.error)}</p>`;
        } else if (detail.kind === 'verification') {
          const report = detail.data?.report || {};
          const verifications = report.verifications || [];
          body = `<dl style="display:grid;gap:10px;margin:0">
            <div><dt class="meta">${be('detail.statusLabel', 'Verification status')}</dt><dd style="margin:3px 0 0;font-weight:750">${esc(report.latestAiStatus || 'unverified')}</dd></div>
            <div><dt class="meta">${be('detail.certifications', 'Linked certifications')}</dt><dd style="margin:3px 0 0">${(report.certifications || []).length ? report.certifications.map((c) => esc(c.standard_name || c.id)).join(', ') : '—'}</dd></div>
            <div><dt class="meta">${be('detail.records', 'Verification records')}</dt><dd style="margin:3px 0 0">${verifications.length ? verifications.map((v) => esc(v.method || '') + ' · ' + esc(v.status || '')).join(' ; ') : '—'}</dd></div>
          </dl>`;
        } else {
          const report = detail.data?.securityReport || {};
          const integrity = report.integrity || {};
          const compliance = report.compliance || {};
          body = `<dl style="display:grid;gap:10px;margin:0">
            <div><dt class="meta">SHA-256</dt><dd style="margin:3px 0 0;font-family:var(--font-mono,monospace);word-break:break-all">${esc(integrity.sha256 || '—')}</dd></div>
            <div><dt class="meta">${be('detail.securityResult', 'Security analysis result')}</dt><dd style="margin:3px 0 0">${report.antivirus ? esc(JSON.stringify(report.antivirus)) : '—'}</dd></div>
            <div><dt class="meta">${be('table.status', 'Status')}</dt><dd style="margin:3px 0 0">${compliance.isAvailable ? evidenceStatusLabel('available') : compliance.isQuarantined ? evidenceStatusLabel('rejected') : '—'}${compliance.isExpired ? ' · ' + esc(be('detail.expired', 'Expired')) : ''}</dd></div>
          </dl>`;
        }
        return `<tr class="evidence-detail-row"><td colspan="8" style="background:#fbfaf8"><div style="padding:14px 18px">${body}</div></td></tr>`;
      }

      async function openEvidenceReport(id, kind) {
        const key = kind + ':' + id;
        if (state.evidenceDetail?.key === key) { state.evidenceDetail = null; render(); return; }
        state.evidenceDetail = { key, id, kind, loading: true };
        render();
        try {
          const endpoint = kind === 'verification' ? 'verification-report' : 'security-report';
          const data = await api(`/api/documents/${encodeURIComponent(id)}/${endpoint}`);
          state.evidenceDetail = { key, id, kind, data };

          state.evidenceDetail = { key, id, kind, error: error.message };

      async function uploadEvidence(form) {
        const data = Object.fromEntries(new FormData(form));
        const file = data.file;
        if (!(file instanceof File) || !file.size) throw new Error('document_file_required');
        if (file.size > 50 * 1024 * 1024) throw new Error('document_size_limit_exceeded');
        if (state.demo) {
          state.documents.unshift({ id: `demo-evidence-${Date.now()}`, originalFilename: file.name, contentType: file.type, byteSize: file.size, kind: data.kind || 'other', status: 'available', visibility: 'private', createdAt: new Date().toISOString(), availableAt: new Date().toISOString(), expiresAt: data.expiresAt || null, sha256: null, metadata: { source: 'brand-console-demo' } });
          notify(be('upload.successDemo', 'Demonstration mode: evidence added locally.'));
          render();
          return;
        }
        const body = { originalFilename: file.name, contentType: file.type, byteSize: file.size, kind: data.kind || 'other', expiresAt: data.expiresAt || null, metadata: { source: 'brand-console' } };
        const intent = await api('/api/documents/upload-intent', { method: 'POST', body: JSON.stringify(body) });
        const upload = await fetch(intent.upload.url, { method: 'PUT', headers: intent.upload.headers || {}, body: file });
        if (!upload.ok) throw new Error('private_storage_upload_failed');
        await api(`/api/documents/${encodeURIComponent(intent.document.id)}/scan`, { method: 'POST', body: '{}' }).catch((error) => notify(error.message, true));
        await refreshEvidence();
        notify(be('upload.success', 'Evidence uploaded and analyzed.'));

      // Jours restants avant echeance, et pastille correspondante. La veille
      // des expirations derive desormais de ces donnees : la version
      // precedente affirmait en dur qu'aucun certificat n'expirait, ce qui
      // devenait faux des que la vue etait alimentee.
      const certJours = (c) => Math.ceil((Date.parse(c.expires) - Date.now()) / 86400000);
      /* Chantier 09 — Certification Intelligence : sante (valid / expiring /
         expired / needs review) derivee des statuts et dates reels, veille
         d'expiration actionnable, declaration et revue humaine via
         GET/POST /api/certifications et POST /api/certifications/:id/review.
         La vue marque inclut les certificats des fournisseurs actifs ; la
         couverture du catalogue versionne est affichee a titre informatif,
         jamais comme une exigence de conformite. */
      const bc = (key, fb) => (window.TF_I18N ? window.TF_I18N.t('certifications.' + key, fb) : fb);
      const certNorm = (c) => ({
        raw: c,
        id: c.id || null,
        name: c.standardName || c.standard || '—',
        code: c.standardCode || null,
        number: c.certificateNumber || c.number || null,
        issuer: c.issuerName || c.issuer || null,
        issued: c.issuedAt || c.issued || null,
        expires: c.expiresAt || c.expires || null,
        status: c.status || 'declared',
        ownerName: c.ownerName || null,
        ownedByBrand: c.ownedByBrand !== false,
        documentId: c.documentId || null,
        verificationCount: c.verificationCount || 0,
      });
      const certExpiresTs = (c) => {
        const raw = c.expiresAt ?? c.expires;
        const ts = raw ? new Date(raw).getTime() : NaN;
        return Number.isNaN(ts) ? null : ts;
      };
      const certHealth = (c) => {
        const ts = certExpiresTs(c);
        if (c.status === 'expired') return 'expired';
        if (ts !== null && ts < Date.now()) return 'expired';
        if (ts !== null && ts - Date.now() < 90 * 86400000) return 'expiring';
        if (['declared', 'needs_review'].includes(c.status)) return 'needsReview';
        return 'valid';
      };
      const certHealthBadge = (health) => {
        const cls = health === 'valid' ? 'status-approved' : health === 'expiring' ? 'status-needs_review' : health === 'expired' ? 'status-changes_requested' : 'status-draft';
        const labels = { valid: bc('health.valid', 'Valid'), expiring: bc('health.expiring', 'Expiring'), expired: bc('health.expired', 'Expired'), needsReview: bc('health.needsReview', 'Needs review') };
        return `<span class="status ${cls}">${esc(labels[health])}</span>`;
      };
      const certStatusLabel = (status) => bc('statuses.' + status, status);

      function certReviewRow(cert) {

          state.certifications.unshift({ id: `demo-cert-${Date.now()}`, standard: data.standardName.trim(), standardCode: data.standardCode || null, number: data.certificateNumber || null, issuer: data.issuerName || null, issued: data.issuedAt || null, expires: data.expiresAt || null, status: data.documentId ? 'documented' : 'declared', ownedByBrand: true, verificationCount: 0 });

        await api('/api/certifications', { method: 'POST', body: JSON.stringify({
          standardName: data.standardName.trim(),
          standardCode: data.standardCode || undefined,
          issuerName: data.issuerName || undefined,
          certificateNumber: data.certificateNumber || undefined,
          issuedAt: data.issuedAt || undefined,
          expiresAt: data.expiresAt || undefined,
          documentId: data.documentId || undefined,

        await refreshCertifications();
        notify(bc('declare.success', 'Certification declared.'));

          const cert = (state.certifications || []).find((c) => c.id === id);
          if (cert) {
            cert.status = data.verificationStatus === 'passed' ? 'verified_by_reviewer' : data.verificationStatus === 'expired' ? 'expired' : 'needs_review';

          state.certReview = null;
          notify(bc('review.successDemo', 'Demonstration mode: review applied locally.'));

        await api(`/api/certifications/${encodeURIComponent(id)}/review`, { method: 'POST', body: JSON.stringify({ verificationStatus: data.verificationStatus, method: data.method.trim(), notes: data.notes || undefined }) });

        notify(bc('review.success', 'Review recorded.'));

            function overview() {
        const counts = requestCounts();
        const brand = currentBrand();
        // Tous les chiffres de cet ecran derivent de l etat, aucun n est ecrit en dur.
        const ag = demoAgregats();

        /* Chantier 05 — Brand Command Center : metriques derivees de l etat. */
        const nowTs = Date.now();
        const tcc = (key, fb) => (window.TF_I18N ? window.TF_I18N.t(key, fb) : fb);
        const allProducts = state.products || [];
        const openRequests = state.requests.filter((r) => !['approved', 'cancelled'].includes(r.status));
        const overdueRequests = openRequests.filter((r) => r.dueAt && new Date(r.dueAt).getTime() < nowTs);
        const dueSoonRequests = openRequests.filter((r) => r.dueAt && new Date(r.dueAt).getTime() - nowTs < 7 * 86400000);
        const awaitingReview = state.requests.filter((r) => r.status === 'submitted');

                <div><dt class="meta">${bt('pdCategory')}</dt><dd style="margin:4px 0 0;font-weight:750">${esc(p.category || '—')}</dd></div>
                <div><dt class="meta">Version</dt><dd style="margin:4px 0 0;font-weight:750">v${esc(p.version || '1')}</dd></div>
                <div><dt class="meta">${bt('pdStatus')}</dt><dd style="margin:4px 0 0">${status(p.status)}</dd></div>
                <div><dt class="meta">${bt('pdCompleteness')}</dt><dd style="margin:4px 0 0;font-weight:750">${p.dataCompletion != null ? esc(moneyless(p.dataCompletion)) + '%' : '—'}</dd></div>

            <div class="card panel">
              <div class="panel-head"><h2>${bt('pxTechSheet')}</h2></div>
              <form id="product-detail-form" class="form-grid">
                <label>${bt('pxStyleName')}<input class="input" name="name" value="${esc(p.name || '')}"></label>
                <label>${bt('pxSku')}<input class="input" name="reference" value="${esc(p.reference || '')}"></label>
                <label>${bt('pxTextileCategory')}<input class="input" name="category" value="${esc(p.category || '')}"></label>
                <label>Couleur<input class="input" name="colorName" value="${esc(p.colorName || '')}"></label>
                <label>${bit('overview.countryOfDesign', 'Country of design')}<input class="input" name="countryOfDesign" value="${esc(p.countryOfDesign || '')}" maxlength="2"></label>
                <label>${bt('pxCountryMfg')}<input class="input" name="countryOfManufacture" value="${esc(p.countryOfManufacture || '')}" maxlength="2"></label>
                <label>Poids unitaire (g)<input class="input" name="weightGrams" type="number" value="${esc(p.weightGrams != null ? p.weightGrams : '')}"></label>
                <label>Tailles<input class="input" name="sizeRange" value="${esc(sizeRangeText)}"></label>
                <div class="form-actions field-full"><button class="btn btn-primary" type="submit">${bt('pxUpdate')}</button></div>
              </form>
            </div>
          </div>
          <div class="card panel" style="margin-top:18px">
            <div class="panel-head"><div><h2>${bit('overview.schemas', 'Versioned data schemas')}</h2></div><span class="meta">${bindings.length}</span></div>
            ${bindings.length ? `<div class="item-list">${bindings.map((b) => `<div class="item"><div><strong>${esc(b.schemaKey)}</strong><div class="meta">${bit('overview.schemaVersion', 'Version')} ${esc(b.schemaVersion)} · ${bit('overview.attachedOn', 'Attached on')} ${date(b.createdAt)}</div></div></div>`).join('')}</div>` : `<div class="empty" style="padding:12px 0 18px"><p>${bit('overview.noSchemas', 'No schema attached to this product yet.')}</p></div>`}
            <form id="schema-binding-form" class="form-grid" style="margin-top:14px">
              <label class="field-full">${bit('overview.linkSchema', 'Attach a schema')}<select class="select" name="schemaIdentity" required>${schemaOptions || '<option value="">—</option>'}</select></label>
              <div class="form-actions field-full"><button class="btn btn-primary btn-small" type="submit" ${schemaOptions ? '' : 'disabled'}>${bit('overview.linkSchema', 'Attach a schema')}</button></div>
            </form>
          </div>`;

        /* -- lentille Composition : parts reelles des matieres attachees ----- */
        const compPalette = ['#0b7656', '#10b981', '#1d4ed8', '#b45309', '#7c3aed', '#0f766e'];
        const compositionLens = mats.length ? `
          <div class="card" style="padding:20px">
            <div class="pil-comp-bar">${mats.map((m, i) => `<i style="width:${Math.max(0, Math.min(100, Number(m.percentage) || 0))}%;background:${compPalette[i % compPalette.length]}"></i>`).join('')}</div>
            <div class="table-wrap"><table><thead><tr><th>${bt('cnMaterialLabel')}</th><th>${bt('spRole')}</th><th>${bit('composition.share', 'Share')}</th></tr></thead><tbody>
              ${mats.map((m) => `<tr><td><strong>${esc(materialName(m.material))}</strong><div class="meta">${esc(materialType(m.material) || '')}</div></td><td>${esc(m.role || '—')}</td><td style="font-variant-numeric:tabular-nums">${m.percentage != null ? esc(moneyless(m.percentage)) + '%' : '—'}</td></tr>`).join('')}
            </tbody></table></div>
          </div>` : `<div class="empty"><div class="empty-icon">◇</div><strong>${bit('composition.noComposition', 'No composition declared yet.')}</strong></div>`;

        /* -- lentille Materials : BOM reel (edition + ajout conserves) ------- */
        const materialsLens = `
          <div class="card panel">
            <div class="panel-head"><div><h2>Nomenclature & Bilan Massique (BOM)</h2><p class="meta" style="margin:4px 0 0;">${bt('pxEspr')}</p></div></div>
            ${mats.length ? `<div class="item-list">${mats.map((m) => `<form class="item material-edit-form" data-material-product-id="${esc(p.id)}">
              <input type="hidden" name="materialId" value="${esc(m.materialId)}">
              <div><strong>${esc(materialName(m.material))}</strong><div class="meta">${esc(m.role || '—')} · ${esc(materialType(m.material) || '')}</div></div>
              <div class="actions">
                <label class="meta">${bt('pxSharePct')}<input class="input" name="percentage" type="number" value="${esc(m.percentage != null ? m.percentage : '')}" style="width:75px"></label>
                <button class="btn btn-secondary btn-small" type="submit">Valider</button>
              </div>
            </form>`).join('')}</div>` : `<div class="empty" style="padding:12px 0 18px"><p>${bit('composition.noComposition', 'No composition declared yet.')}</p></div>`}
            <form id="material-form" class="form-grid" style="margin-top:18px">
              <label class="field-full">${bt('pxAddComponent')}<select class="select" name="materialId">${materialOptions || '<option value="">—</option>'}</select></label>
              <label>${bt('pxSharePctP')}<input class="input" name="percentage" type="number" min="0" max="100" placeholder="15"></label>
              <label>${bt('spRole')}<input class="input" name="materialRole" value="secondary"></label>
              <div class="form-actions field-full"><button class="btn btn-primary btn-small" type="submit">${bt('pxAddBom')}</button></div>
            </form>
          </div>
          <div class="card panel" style="margin-top:18px;">
            <div class="panel-head"><div><h2>${bt('pxIdentifiers')}</h2><p class="meta">${bt('pxResolveHint')}</p></div><span class="meta">${ids.length}</span></div>
            ${ids.length ? `<div class="item-list">${ids.map((identifier) => `<form class="item identifier-edit-form" data-identifier-id="${esc(identifier.id)}"><div><strong>${esc(identifier.type.toUpperCase())}</strong><div class="meta">${esc(bt('cnCreatedOn'))} ${date(identifier.createdAt)}</div></div><div class="actions"><input class="input" name="identifierValue" value="${esc(identifier.value)}" maxlength="240" required aria-label="Valeur ${esc(identifier.type)}"><label class="meta"><input type="checkbox" name="isPrimary" ${identifier.isPrimary ? 'checked' : ''}> Principal</label><button class="btn btn-secondary btn-small" type="submit">${bt('pxSave')}</button></div></form>`).join('')}</div>` : `<div class="empty" style="padding:12px 0 18px"><p>${bt('pxNoId')}</p></div>`}
            <form id="identifier-form" class="form-grid" style="margin-top:18px"><label>${bt('mtType')}<select class="select" name="identifierType" required><option value="internal">Interne</option><option value="gtin">GTIN</option><option value="ean">EAN</option><option value="upc">UPC</option></select></label><label>Valeur<input class="input" name="identifierValue" maxlength="240" required placeholder="3760123456789"></label><label style="display:flex;align-items:center;gap:8px;margin-top:25px"><input type="checkbox" name="isPrimary"> ${bt('pxSetPrimary')}</label><div class="form-actions" style="margin-top:25px"><button class="btn btn-primary btn-small" type="submit">${bt('pxAddId')}</button></div></form>
          </div>`;

        /* -- lentilles Supply chain / Manufacturing / Suppliers : graphe reel */
        const nodeCard = (n, i) => `<div class="pil-node"><span class="pil-node-idx">${String(i + 1).padStart(2, '0')}</span><div class="pil-node-body"><span class="pil-node-label">${esc(n.label || n.site_name || n.material_name || n.id)}</span><span class="pil-node-meta">${esc(n.node_type || '')}${n.process_code ? ' · ' + esc(n.process_code) : ''}${n.site_country ? ' · ' + esc(n.site_country) : ''}</span></div>${status(n.status)}</div>`;
        const supplyChainLens = sc ? `
          <div class="pil-summary-grid">
            <div class="pil-summary-cell"><div class="pil-summary-num">${scSummary?.nodeCount ?? scNodes.length}</div><span class="pil-summary-label">${bit('supplyChain.nodes', 'Traceability nodes')}</span></div>
            <div class="pil-summary-cell"><div class="pil-summary-num">${scSummary?.linkCount ?? scLinks.length}</div><span class="pil-summary-label">Liens</span></div>
            <div class="pil-summary-cell"><div class="pil-summary-num">${scSummary?.documentationRate != null ? scSummary.documentationRate + '%' : '—'}</div><span class="pil-summary-label">${bit('supplyChain.documentationRate', 'Documentation rate')}</span></div>
            <div class="pil-summary-cell"><div class="pil-summary-num">${scSummary?.stagesCovered != null ? (Array.isArray(scSummary.stagesCovered) ? scSummary.stagesCovered.length : scSummary.stagesCovered) : '—'}</div><span class="pil-summary-label">${bit('supplyChain.stagesCovered', 'Stages covered')}</span></div>
          </div>
          ${scNodes.length ? `<div class="pil-node-list">${scNodes.map(nodeCard).join('')}</div>` : `<div class="empty"><p>${bit('supplyChain.noGraph', 'No traceability graph recorded for this product yet.')}</p></div>`}
          <div class="actions" style="margin-top:16px"><button class="btn btn-secondary" data-action="product-supply-chain-from-detail">${bit('supplyChain.openGraph', 'Open the full supply chain graph')}</button></div>`
          : `<div class="empty"><div class="empty-icon">☍</div><strong>${bit('supplyChain.noGraph', 'No traceability graph recorded for this product yet.')}</strong><p>${intel.errors?.includes('supply-chain') ? esc(bt('cnNotLoaded')) : ''}</p></div>`;

        const mfgNodes = scNodes.filter((n) => ['process', 'site'].includes(n.node_type));
        const manufacturingLens = mfgNodes.length ? `
          <p class="pil-note">${bit('manufacturing.note', '')}</p>
          <div class="table-wrap"><table><thead><tr><th>${bit('manufacturing.process', 'Process')}</th><th>${bit('manufacturing.facility', 'Facility')}</th><th>${bit('manufacturing.country', 'Country')}</th><th>${bit('manufacturing.status', 'Status')}</th></tr></thead><tbody>
            ${mfgNodes.map((n) => `<tr><td><strong>${esc(n.process_code || n.node_type)}</strong></td><td>${esc(n.site_name || n.label || '—')}</td><td>${esc(n.site_country || '—')}</td><td>${status(n.status)}</td></tr>`).join('')}
          </tbody></table></div>`
          : `<div class="empty"><div class="empty-icon">▦</div><strong>${bit('manufacturing.empty', 'No manufacturing node in the graph yet.')}</strong></div>`;

        const supplierNodes = scNodes.filter((n) => n.node_type === 'site').filter((n, i, arr) => arr.findIndex((x) => (x.site_name || x.label) === (n.site_name || n.label)) === i);
        const suppliersLens = supplierNodes.length ? `
          <p class="pil-note">${bit('suppliers.note', '')}</p>
          <div class="table-wrap"><table><thead><tr><th>${bit('suppliers.org', 'Organization')}</th><th>${bit('manufacturing.country', 'Country')}</th><th>${bit('suppliers.type', 'Node type')}</th><th>${bit('manufacturing.status', 'Status')}</th></tr></thead><tbody>
            ${supplierNodes.map((n) => `<tr><td><strong>${esc(n.site_name || n.label || '—')}</strong>${n.site_city ? `<div class="meta">${esc(n.site_city)}</div>` : ''}</td><td>${esc(n.site_country || '—')}</td><td>${esc(n.node_type)}</td><td>${status(n.status)}</td></tr>`).join('')}
          </tbody></table></div>`
          : `<div class="empty"><div class="empty-icon">◎</div><strong>${bit('suppliers.empty', 'No organization in the traceability graph yet.')}</strong></div>`;

        /* -- lentille Evidence : renvoie vers le Centre de preuves (chantier 08) -- */
        const evidenceDocs = (state.documents || []).filter((d) => d.status !== 'deleted');
        const evidenceLens = `
          <div class="card panel">
            <div class="panel-head"><h2>${bit('evidence.plannedTitle', '')}</h2></div>
            <p class="pil-note" style="margin-bottom:14px">${bit('evidence.plannedNote', '')}</p>
            <div class="pil-summary-grid" style="margin-bottom:14px">
              <div class="pil-summary-cell"><div class="pil-summary-num">${evidenceDocs.length}</div><span class="pil-summary-label">${window.TF_I18N.t('evidence.stats.total', 'Evidence tracked')}</span></div>
              <div class="pil-summary-cell"><div class="pil-summary-num">${evidenceDocs.filter((d) => d.status === 'available').length}</div><span class="pil-summary-label">${window.TF_I18N.t('evidence.stats.available', 'Available')}</span></div>
            </div>
            <button class="btn btn-secondary btn-small" data-view="documents">${bit('evidence.openDocuments', 'Open documents')}</button>
          </div>`;

        /* -- lentille Certifications : niveau organisation, forme normalisee -- */
        const certs = (state.certifications || []).map(certNorm);
        const certificationsLens = `
          <p class="pil-note">${bit('certifications.orgNote', '')}</p>
          ${certs.length ? `<div class="table-wrap"><table><thead><tr><th>${bc('table.standard', 'Standard')}</th><th>${bc('table.number', 'Certificate number')}</th><th>${bc('table.issuer', 'Issuer')}</th><th>${bc('table.expires', 'Expires')}</th><th>${bc('table.health', 'Health')}</th></tr></thead><tbody>
            ${certs.map((c) => `<tr><td><strong>${esc(c.name)}</strong></td><td class="meta">${esc(c.number || '—')}</td><td>${esc(c.issuer || '—')}</td><td>${c.expires ? date(c.expires) : '—'}</td><td>${certHealthBadge(certHealth(c))}</td></tr>`).join('')}
          </tbody></table></div>` : `<div class="empty"><p>${bit('certifications.none', 'No certification declared yet.')}</p></div>`}
          <div class="actions" style="margin-top:16px"><button class="btn btn-secondary btn-small" data-view="certifications">${bit('certifications.openCerts', 'Open certifications')}</button></div>`;

        /* -- lentille Quality : score reel par produit ------------------------ */
        const qScore = quality?.score || null;
        const qIssues = quality?.issues || [];
        const qualityLens = qScore ? `
          <div class="pil-summary-grid">
            ${[['completeness', 'Completude'], ['freshness', 'Fraicheur'], ['documentationCoverage', 'Couverture preuves'], ['consistency', 'Coherence']].map(([k, label]) => `<div class="pil-summary-cell"><div class="pil-summary-num">${qScore[k] != null ? esc(moneyless(qScore[k])) + '%' : '—'}</div><span class="pil-summary-label">${label}</span></div>`).join('')}
          </div>
          ${qIssues.length ? `<div class="card panel"><div class="panel-head"><h2>${bit('quality.issues', 'Open issues')}</h2><span class="meta">${qIssues.length}</span></div><div class="item-list">${qIssues.map((iss) => `<div class="item"><div><strong>${esc(iss.ruleKey || iss.id || '')}</strong><div class="meta">${esc(iss.message || '')} · ${date(iss.detectedAt)}</div></div>${status(iss.severity || iss.status || 'open')}</div>`).join('')}</div></div>` : ''}
          <div class="actions" style="margin-top:16px"><button class="btn btn-secondary" data-action="product-quality-from-detail">${bit('quality.openQuality', 'Open the Quality Center')}</button></div>`
          : `<div class="empty"><div class="empty-icon">◒</div><strong>${bit('quality.noQuality', 'No quality score computed for this product yet.')}</strong><div class="actions" style="margin-top:12px"><button class="btn btn-primary btn-small" data-action="product-quality-from-detail">${bit('quality.openQuality', 'Open the Quality Center')}</button></div></div>`;

        /* -- lentille DPP : preparation uniquement, jamais de conformite ------ */
        const dppLens = dpp ? `
          <div class="notice" style="margin-bottom:14px">${bit('dpp.readinessNote', '')}</div>
          <div class="pil-summary-grid">
            <div class="pil-summary-cell"><div class="pil-summary-num">${dpp.completionScore != null ? esc(moneyless(dpp.completionScore)) + '%' : '—'}</div><span class="pil-summary-label">${bit('dpp.completion', 'Completion')}</span></div>
            <div class="pil-summary-cell"><div class="pil-summary-num">${dpp.metRequirements != null && dpp.totalRequirements != null ? esc(dpp.metRequirements) + '/' + esc(dpp.totalRequirements) : '—'}</div><span class="pil-summary-label">${bit('dpp.requirements', 'Requirements met')}</span></div>
            <div class="pil-summary-cell"><div class="pil-summary-num" style="font-size:14px;padding-top:6px">${status(dpp.readinessStatus || 'in_progress')}</div><span class="pil-summary-label">${bit('dpp.status', 'Readiness status')}</span></div>
          </div>
          <div class="actions" style="margin-top:6px"><button class="btn btn-secondary" data-action="product-dpp-from-detail">${bit('common.openFull', 'Open the full view')}</button></div>`
          : `<div class="empty"><div class="empty-icon">▣</div><strong>${bit('dpp.noDpp', 'No DPP readiness record for this product yet.')}</strong><div class="actions" style="margin-top:12px"><button class="btn btn-primary btn-small" data-action="product-dpp-from-detail">${bit('common.openFull', 'Open the full view')}</button></div></div>`;

        /* -- lentille History : evenements horodates reels -------------------- */
        const historyEvents = [];
        if (p.createdAt) historyEvents.push({ d: p.createdAt, label: bit('history.productCreated', 'Product record created') });
        ids.forEach((i) => { if (i.createdAt) historyEvents.push({ d: i.createdAt, label: bit('history.identifierAdded', 'Identifier added') + ' · ' + i.type.toUpperCase() + ' ' + i.value }); });
        mats.forEach((m) => { if (m.createdAt) historyEvents.push({ d: m.createdAt, label: bit('history.materialAdded', 'Material attached to the product') + ' · ' + materialName(m.material) }); });
        bindings.forEach((b) => { if (b.createdAt) historyEvents.push({ d: b.createdAt, label: bit('history.schemaAttached', 'Data schema attached') + ' · ' + b.schemaKey + ' v' + b.schemaVersion }); });
        historyEvents.sort((a, b) => new Date(b.d) - new Date(a.d));
        const historyLens = historyEvents.length ? `
          <div class="card" style="padding:20px"><div class="pil-timeline">
            ${historyEvents.map((e) => `<div class="pil-event"><span class="pil-event-date">${date(e.d)}</span><span>${esc(e.label)}</span></div>`).join('')}
          </div></div>`
          : `<div class="empty"><div class="empty-icon">☷</div><strong>${bit('history.noHistory', 'No timestamped event recorded for this product yet.')}</strong></div>`;

        const lensContent = { overview: overviewLens, composition: compositionLens, materials: materialsLens, supplyChain: supplyChainLens, manufacturing: manufacturingLens, suppliers: suppliersLens, evidence: evidenceLens, certifications: certificationsLens, quality: qualityLens, dpp: dppLens, history: historyLens };

        return `<div class="page-head">
          <div>
            <button class="link-button" data-view="products">${bt('pxBackCatalogue')}</button>
            <div class="eyebrow" style="margin-top:16px;">${bit('head.eyebrow', 'Product Intelligence')} · ${bt('cRef')} ${esc(p.reference || '—')} · Version ${esc(p.version || '1')}</div>
            <h1>${esc(p.name || '—')}</h1>
            <p>${esc(p.category || '—')}${p.dataCompletion != null ? ` · ${bt('pdCompleteness')} ${esc(moneyless(p.dataCompletion))}%` : ''}</p>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" data-action="product-supply-chain-from-detail">${bt('pxTraceGraph')}</button>
            <button class="btn btn-secondary" data-action="product-dpp-from-detail">${bt('pxPrepareDpp')}</button>
            <button class="btn btn-secondary" data-action="product-export-intel">${bit('head.export', 'Export product data (JSON)')}</button>
            <button class="btn btn-primary" data-action="product-new-request" data-product-id="${esc(p.id)}">+ ${bt('cnRqCreate')}</button>
          </div>
        </div>

        <div class="pil-tabs" role="tablist" aria-label="${bit('head.eyebrow', 'Product Intelligence')}">
          ${LENSES.map((id) => `<button type="button" class="pil-tab${id === active ? ' is-active' : ''}" role="tab" aria-selected="${id === active}" data-pi-tab="${id}">${esc(bit('tabs.' + id, id))}</button>`).join('')}
        </div>

        ${LENSES.map((id) => `<section class="pil-lens" data-pi-lens="${id}" role="tabpanel" ${id === active ? '' : 'hidden'}>${lensContent[id]}</section>`).join('')}`;
      }

      function supplierDetailView() {
        const supplier = state.selectedSupplier;
        if (!supplier) return `<div class="empty"><div class="empty-icon">◎</div><strong>${bt('sxNotFound')}</strong><button class="btn btn-secondary" data-view="suppliers">${bt('sxBack')}</button></div>`;
        return `<div class="page-head"><div><button class="link-button" data-view="suppliers">${bt('sxBackArrow')}</button><div class="eyebrow" style="margin-top:20px">${bt('sxSupplier')}</div><h1>${esc(supplier.name)}</h1><p>${esc(supplier.country || bt('cnCountryUnknown'))} · ${esc(supplier.role || 'Membre actif')}</p></div><div class="actions"><button class="btn btn-primary" data-action="new-request" data-supplier-org-id="${esc(supplier.organizationId)}">${bt('sxNewRequest')}</button></div></div><div class="grid split"><div class="card panel"><div class="panel-head"><h2>Profil fournisseur</h2><span class="status status-${esc(supplier.profile?.onboardingStatus || 'draft')}">${esc(statusLabel(supplier.profile?.onboardingStatus) || bt('cnNotLoaded'))}</span></div>${supplier.profile ? `<dl style="display:grid;gap:15px;margin:0"><div><dt class="meta">${bt('pdCompleteness')}</dt><dd style="margin:4px 0;font-weight:800">${esc(supplier.profile.profileCompletion)}%</dd></div><div><dt class="meta">Contact</dt><dd style="margin:4px 0;font-weight:750">${esc(supplier.profile.contactName || '—')} · ${esc(supplier.profile.contactEmail || '—')}</dd></div><div><dt class="meta">${bt('sxActivities')}</dt><dd style="margin:4px 0;font-weight:750">${esc((supplier.profile.activityTypes || []).join(', ') || '—')}</dd></div><div><dt class="meta">${bt('sxSummary')}</dt><dd style="margin:4px 0;line-height:1.5">${esc(supplier.profile.profileSummary || '—')}</dd></div></dl>` : `<div class="empty"><p>${esc(bt('cnNoProfile'))}</p></div>`}</div><div class="card panel"><div class="panel-head"><h2>Demandes</h2></div>${requestTable(state.requests.filter((r) => r.supplierOrganizationId === supplier.id))}</div></div>`;
      }

      function capContractPanel() {
        return `<div class="card panel" style="margin-top:18px"><div class="panel-head"><div><h2>${bt('qcCapTitle')}</h2><p class="meta">${bt('qcCapIntro')}</p></div><div class="actions"><button class="btn btn-secondary btn-small" type="button" data-action="open-cap-modal">${bt('qcCreateCap')}</button><button class="btn btn-secondary btn-small" type="button" data-action="open-review-cap-modal">${bt('mdReviewCap')}</button><button class="btn btn-secondary btn-small" type="button" data-action="open-cap-message-modal">${bt('qcMessageThread')}</button></div></div><div class="notice">${bt('qcCapNote')}</div></div>`;

      /* ── Risk & exposure ──────────────────────────────────────────────
         Vue exigee par le cahier des charges (nav : Quality, Risk, DPP) et
         absente de la console jusqu'ici.

         Principe : aucune notation externe, aucune donnee inventee. Chaque
         signal est derive des enregistrements deja charges dans state
         (fournisseurs, produits, matieres, demandes). Une dimension sans
         enregistrement vaut 0 et l'affiche comme telle, plutot que de
         simuler un score. L'indice global est un indicateur operationnel
         destine a prioriser le travail : ce n'est jamais une certification.
      */
      function riskSignals() {
        const sup = state.suppliers || [];
        const prods = state.products || [];
        const reqs = state.requests || [];
        const mats = state.materials || [];
        const now = Date.now();
        const org = (s) => s.organizations || {};
        const nom = (o, s) => o.display_name || o.legal_name || s.id || '—';
        const SEUIL = 70;          // completude produit jugee suffisante
        const rows = [];

        // 1. Concentration : part du pays le plus represente
        const parPays = {};
        sup.forEach((s) => { const c = org(s).country_code || ''; parPays[c] = (parPays[c] || 0) + 1; });
        const pays = Object.entries(parPays).sort((a, b) => b[1] - a[1]);
        const partMax = sup.length ? Math.round((pays[0][1] / sup.length) * 100) : 0;
        if (sup.length > 1 && partMax >= 50) {
          rows.push({ sev: partMax >= 80 ? 'High' : 'Medium', cat: 'riskCatGeography',
            subject: pays[0][0] || bt('riskGeoUnknown'), sig: 'riskSigConcentration',
            extra: partMax + '%', view: 'suppliers' });
        }

        // 2. Fournisseurs : relation inactive, pays non declare
        sup.forEach((s) => {
          const o = org(s);
          if (o.status && o.status !== 'active') {
            rows.push({ sev: 'High', cat: 'riskCatSupplier', subject: nom(o, s),
              sig: 'riskSigInactive', extra: o.status, view: 'suppliers' });
          }
          if (!o.country_code) {
            rows.push({ sev: 'Medium', cat: 'riskCatSupplier', subject: nom(o, s),
              sig: 'riskSigNoCountry', extra: '', view: 'suppliers' });
          }
        });

        // 3. Produits : completude sous le seuil, sinon donnees non validees
        prods.forEach((p) => {
          const c = Number(p.dataCompletion);
          const label = [p.reference, p.name].filter(Boolean).join(' · ') || p.id;
          if (Number.isFinite(c) && c < SEUIL) {
            rows.push({ sev: c < 50 ? 'Critical' : 'High', cat: 'riskCatProduct', subject: label,
              sig: 'riskSigIncomplete', extra: c + '%', view: 'products' });
          } else if (p.dataReadiness && p.dataReadiness !== 'ready') {
            rows.push({ sev: 'Medium', cat: 'riskCatProduct', subject: label,
              sig: 'riskSigNotReady', extra: String(p.dataReadiness).replace(/_/g, ' '), view: 'products' });
          }
        });

        // 4. Collecte : demandes echues, puis demandes en retard de completion
        const clos = (r) => ['approved', 'completed', 'accepted'].includes(r.status);
        reqs.forEach((r) => {
          if (clos(r)) return;
          const due = r.dueAt ? Date.parse(r.dueAt) : NaN;
          const pct = Number(r.completionPercentage);
          if (Number.isFinite(due) && due < now) {
            const jours = Math.max(1, Math.round((now - due) / 86400000));
            rows.push({ sev: 'Critical', cat: 'riskCatCollection', subject: r.title || r.id,
              sig: 'riskSigOverdue', extra: '+' + jours + 'd', view: 'requests' });
          } else if (Number.isFinite(pct) && pct < 50) {
            rows.push({ sev: 'Medium', cat: 'riskCatCollection', subject: r.title || r.id,
              sig: 'riskSigStalled', extra: pct + '%', view: 'requests' });
          }
        });

        // 5. Matieres sans pays d'origine
        mats.forEach((m) => {
          if (!m.originCountryCode) {
            rows.push({ sev: 'Medium', cat: 'riskCatMaterial', subject: m.name || m.id,
              sig: 'riskSigNoOrigin', extra: '', view: 'materials' });
          }
        });

        // Dimensions : part des enregistrements porteurs d'un signal.
        const part = (n, d) => (d ? Math.round((n / d) * 100) : 0);
        const dims = [
          { key: 'riskDimConcentration', n: sup.length,
            score: sup.length > 1 ? Math.max(0, partMax - 20) : 0 },
          { key: 'riskDimGeography', n: sup.length,
            score: part(sup.filter((s) => !org(s).country_code).length, sup.length) },
          { key: 'riskDimData', n: prods.length,
            score: part(prods.filter((p) => Number(p.dataCompletion) < SEUIL
              || (p.dataReadiness && p.dataReadiness !== 'ready')).length, prods.length) },
          { key: 'riskDimCollection', n: reqs.length,
            score: part(reqs.filter((r) => !clos(r) && ((r.dueAt && Date.parse(r.dueAt) < now)
              || Number(r.completionPercentage) < 50)).length, reqs.length) },
          { key: 'riskDimTraceability', n: mats.length,
            score: part(mats.filter((m) => !m.originCountryCode).length, mats.length) },
        ];
        // Seules les dimensions reellement alimentees entrent dans l'indice :
        // moyenner un zero issu d'une absence de donnees ferait baisser le
        // score pour la mauvaise raison.
        const vivantes = dims.filter((d) => d.n > 0);
        const index = vivantes.length
          ? Math.round(vivantes.reduce((a, d) => a + d.score, 0) / vivantes.length) : 0;

        const rang = { Critical: 0, High: 1, Medium: 2, Low: 3 };
        rows.sort((a, b) => rang[a.sev] - rang[b.sev]);
        return { rows, dims, index, pays, nbSup: sup.length, nbProd: prods.length };
      }

            /* Chantier 10 — Quality Center premium : score decompose REEL (4
           composantes calculees par tracefab_compute_product_quality),
           composantes cliquables avec drill-down (champs manquants,
           anomalies bloquantes, anomalies liees), actions « resoudre les
           donnees manquantes » vers les vues reelles, et tendances depuis
           l'historique /api/quality/products/:id/history. Tout l ancien
           contenu simule (grade 98.4%, piliers fixes, carte « ESPR
           Conformity », fausses anomalies) a ete supprime. */
        const qp = (key, fb) => (window.TF_I18N ? window.TF_I18N.t('qualityPremium.' + key, fb) : fb);
        const qualityCompValue = (score, comp) => (score ? Number(score[comp]) : null);
        const qualityOverall = (score) => {
          if (!score) return null;
          return (Number(score.completeness || 0) + Number(score.freshness || 0) + Number(score.documentationCoverage || 0) + Number(score.consistency || 0)) / 4;
        };
        const QUALITY_COMPONENTS = ['completeness', 'freshness', 'documentationCoverage', 'consistency'];
        const QUALITY_RELATED_PATTERNS = {
          completeness: /incomplete|missing|profile|completion/i,
          freshness: /stale|fresh|outdated|renew/i,
          documentationCoverage: /evidence|document|certific/i,
          consistency: null,
        };
        const qualityRelatedIssues = (issues, component) => {
          const pattern = QUALITY_RELATED_PATTERNS[component];
          if (component === 'consistency') return issues.filter((i) => i.severity === 'blocking');
          return pattern ? issues.filter((i) => pattern.test(i.ruleKey || '') || pattern.test(i.fieldKey || '')) : [];
        };
        const qualityResolveTarget = (item) => {
          const text = `${item.ruleKey || ''} ${item.fieldKey || ''} ${item}`.toLowerCase();
          if (/evidence|document/.test(text)) return { view: 'documents', label: qp('resolve.documents', 'Upload evidence') };
          if (/certific/.test(text)) return { view: 'certifications', label: qp('resolve.certifications', 'Manage certifications') };
          if (/product_data|product_material|composition/.test(text)) return { view: 'products', label: qp('resolve.product', 'Open product sheet') };
          return { view: 'requests', label: qp('resolve.requests', 'Request data') };
        };

        function qualityView() {
        const prod = state.selectedProduct || state.products[0] || null;
        const q = state.quality;
        const score = q?.score || null;
        const issues = q?.issues || [];
        const history = state.qualityHistory || [];
        const activeComponent = state.qualityComponent || null;
        const severityFilter = state.qualitySeverityFilter || 'all';
        const filteredIssues = severityFilter === 'all' ? issues : issues.filter((i) => i.severity === severityFilter);
        const overall = qualityOverall(score);
        const sevCounts = { all: issues.length, blocking: 0, warning: 0, info: 0 };
        issues.forEach((i) => { if (sevCounts[i.severity] !== undefined) sevCounts[i.severity] += 1; });

        const drillPanel = activeComponent && score ? (() => {
          const missing = (score.missingFields || []).map(String);
          const blocking = (score.blockingIssues || []).map(String);
          const related = qualityRelatedIssues(issues, activeComponent);
          return `<div class="card panel" style="margin-top:14px;border-left:3px solid var(--green)">
            <div class="panel-head"><h2>${esc(qp('comp.' + activeComponent, activeComponent))} — drill-down</h2>
              <button class="btn btn-secondary btn-small" data-action="quality-component" data-quality-component="${esc(activeComponent)}">${qp('drill.close', 'Close')}</button></div>
            <div class="grid split">
              <div>
                <h3 style="font-size:13px;margin:0 0 8px">${qp('drill.missingTitle', 'Missing fields')}</h3>
                ${missing.length ? `<ul style="margin:0;padding-left:18px;display:grid;gap:8px">${missing.map((f) => { const target = qualityResolveTarget(f); return `<li><code>${esc(f)}</code> <button class="btn btn-secondary btn-small" style="margin-left:8px" data-action="quality-resolve" data-target="${target.view}">${target.label}</button></li>`; }).join('')}</ul>` : `<p class="meta">${qp('drill.missingNone', '')}</p>`}
                <h3 style="font-size:13px;margin:14px 0 8px">${qp('drill.blockingTitle', 'Blocking issues')}</h3>
                ${blocking.length ? `<ul style="margin:0;padding-left:18px;display:grid;gap:8px">${blocking.map((b) => { const target = qualityResolveTarget(b); return `<li><code>${esc(b)}</code> <button class="btn btn-secondary btn-small" style="margin-left:8px" data-action="quality-resolve" data-target="${target.view}">${target.label}</button></li>`; }).join('')}</ul>` : `<p class="meta">${qp('drill.blockingNone', '')}</p>`}
              </div>
              <div>
                <h3 style="font-size:13px;margin:0 0 8px">${qp('drill.relatedTitle', 'Related issues')} (${related.length})</h3>
                ${related.length ? `<div class="issue-list">${related.map(issueCard).join('')}</div>` : `<p class="meta">${qp('drill.relatedNone', '')}</p>`}
                <p class="meta" style="margin-top:10px">${qp('drill.resolveNote', '')}</p>
              </div>
            </div>
          </div>`;
        })() : '';

        const trendPanel = history.length >= 2 ? (() => {
          const rows = history.map((h) => ({ at: h.computedAt, overall: qualityOverall(h) }));
          const delta = Math.round((rows[rows.length - 1].overall - rows[0].overall) * 10) / 10;
          return `<div class="card panel" style="margin-top:18px">
            <div class="panel-head"><h2>${qp('trend.title', 'Score trend')}</h2><span class="meta">${qp('trend.note', '')}</span></div>
            <div style="display:grid;gap:6px">
              ${rows.map((r) => `<div style="display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:12px">
                <span class="meta">${date(r.at)}</span>
                <div class="progress" style="margin:0"><span style="width:${pct(r.overall)}%"></span></div>
                <span style="text-align:right;font-weight:750">${moneyless(r.overall)}%</span>
              </div>`).join('')}
            </div>
            <p class="meta" style="margin:10px 0 0">${qp('trend.overallLabel', 'Overall')} : <strong>${delta >= 0 ? '+' : ''}${esc(String(delta))}</strong> ${qp('trend.delta', 'pts since the first snapshot')}</p>
          </div>`;
        })() : `<div class="card panel" style="margin-top:18px"><div class="panel-head"><h2>${qp('trend.title', 'Score trend')}</h2></div><p class="meta">${qp('trend.empty', '')}</p></div>`;

        return `${complianceContractPanel()}${capContractPanel()}
        <div class="page-head">
          <div>
            <div class="eyebrow">${bt('qcEyebrow')}</div>
            <h1>${bt('qcTrustQuestion')}</h1>
            <p>${esc(bt('cnQcIntro'))}${prod ? ` · <strong>${esc(prod.name)}</strong>${prod.reference ? ` (${esc(prod.reference)})` : ''}` : ''}</p>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" data-action="select-quality-product">${bt('scChangeProduct')}</button>
            <button class="btn btn-primary" data-action="compute-quality">${bt('qcRecalc')}</button>
          </div>
        </div>

        <div class="card panel">
          <div class="panel-head"><h2>${qp('panel.title', 'Decomposed quality score')}</h2>
            <span class="meta">${score ? `${qp('panel.computed', 'Computed on')} ${date(score.computedAt)} · ${qp('panel.version', 'Calculation version')} ${esc(score.calculationVersion || '—')}` : ''}</span></div>
          ${score ? `
          <p class="meta" style="margin:0 0 12px">${qp('panel.hint', '')}</p>
          <div class="pil-summary-grid">
            ${QUALITY_COMPONENTS.map((comp) => `<div class="pil-summary-cell" role="button" tabindex="0" style="cursor:pointer;${activeComponent === comp ? 'outline:2px solid var(--green);' : ''}" data-action="quality-component" data-quality-component="${comp}">
              <div class="pil-summary-num">${moneyless(qualityCompValue(score, comp))}%</div>
              <span class="pil-summary-label">${esc(qp('comp.' + comp, comp))}</span>
              <div class="progress" style="margin-top:8px"><span style="width:${pct(qualityCompValue(score, comp))}%"></span></div>
            </div>`).join('')}
            <div class="pil-summary-cell">
              <div class="pil-summary-num">${moneyless(overall)}%</div>
              <span class="pil-summary-label">${qp('panel.overall', 'Overall (derived average)')}</span>
              ${score.blockingIssues?.length ? `<div class="meta" style="color:#b91c1c">${score.blockingIssues.length} blocking</div>` : ''}
            </div>
          </div>` : `<div class="empty"><p>${qp('panel.empty', 'No quality score computed for this product yet.')}</p><button class="btn btn-primary btn-small" data-action="compute-quality">${qp('panel.emptyCta', 'Compute the score')}</button></div>`}
        </div>
        ${drillPanel}

        <div class="card panel" style="margin-top:18px">
          <div class="panel-head">
            <h2>${qp('issues.title', 'Active issues')} (${filteredIssues.length})</h2>
            <div class="actions">
              ${['all', 'blocking', 'warning', 'info'].map((sev) => `<button class="btn ${severityFilter === sev ? 'btn-primary' : 'btn-secondary'} btn-small" data-action="quality-severity" data-quality-severity="${sev}">${esc(qp('issues.' + sev, sev))} (${sevCounts[sev] ?? 0})</button>`).join('')}
            </div>
          </div>
          ${filteredIssues.length ? `<div class="issue-list">${filteredIssues.map(issueCard).join('')}</div>` : `<div class="empty"><p>${qp('issues.empty', 'No active issue for this product.')}</p></div>`}
        </div>
        ${trendPanel}`;
      }

      function scoreCard(label, value) { return `<div class="card score"><div class="score-name">${label}</div><div class="score-value">${moneyless(value)}%</div><div class="progress"><span style="width:${pct(value)}%"></span></div></div>`; }
      function issueCard(issue) {

      function demoCatalogPreview(content) {
        const lines = String(content || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter((line) => line.trim());
        const delimiter = (lines[0] || '').includes(';') ? ';' : ',';
        const headers = (lines[0] || '').split(delimiter).map((value) => value.trim().toLowerCase());
        const referenceIndex = headers.indexOf('reference');
        const nameIndex = headers.indexOf('name');
        const errors = [];
        const rows = [];
        if (referenceIndex < 0 || nameIndex < 0) errors.push({ line: 1, code: 'required_column_missing', message: bt('mdColsRefNameRequired') });
        for (let index = 1; index < lines.length && errors.length < 100; index += 1) {
          const cells = lines[index].split(delimiter).map((value) => value.trim().replace(/^"|"$/g, ''));
          if (!cells[referenceIndex] || !cells[nameIndex]) errors.push({ line: index + 1, code: 'required_value_missing', message: bt('mdValRefNameRequired') });
          else rows.push({ reference: cells[referenceIndex], name: cells[nameIndex], category: cells[headers.indexOf('category')] || null, sku: cells[headers.indexOf('sku')] || null });
        }
        return { valid: errors.length === 0 && rows.length > 0, totalRows: Math.max(0, lines.length - 1), acceptedRows: rows.length, rejectedRows: Math.max(0, lines.length - 1 - rows.length), errors, warnings: [], rows };
      }

      function demoSupplierPreview(content) {
        const lines = String(content || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter((line) => line.trim());
        const delimiter = (lines[0] || '').includes(';') ? ';' : ',';
        const headers = (lines[0] || '').split(delimiter).map((value) => value.trim().toLowerCase());
        const emailIndex = headers.indexOf('email'); const legalNameIndex = headers.indexOf('legalname'); const errors = []; const rows = [];
        if (emailIndex < 0 || legalNameIndex < 0) errors.push({ line: 1, code: 'required_column_missing', message: bt('mdColsEmailLegalRequired') });
        for (let index = 1; index < lines.length; index += 1) {
          const cells = lines[index].split(delimiter).map((value) => value.trim().replace(/^"|"$/g, ''));
          const email = cells[emailIndex]?.toLowerCase(); const legalName = cells[legalNameIndex];
          if (!email || !legalName) errors.push({ line: index + 1, code: 'required_value_missing', message: bt('mdValEmailLegalRequired') });
          else rows.push({ email, legalName });
        }
        return { valid: errors.length === 0 && rows.length > 0, totalRows: Math.max(0, lines.length - 1), acceptedRows: rows.length, rejectedRows: Math.max(0, lines.length - 1 - rows.length), errors, rows };
      }

      async function previewSupplierImport() {
        const content = state.supplierImport.content || document.getElementById('supplier-import-content')?.value || '';
        if (!content.trim()) { notify(bt('mdSelectSupplierCsv'), true); return; }
        state.supplierImport.content = content; state.supplierImport.loading = true; render();
        try {
          state.supplierImport.preview = state.demo
            ? demoSupplierPreview(content)
            : await api('/api/catalog/suppliers/import', { method: 'POST', body: JSON.stringify({ brandOrganizationId: state.activeOrganizationId, csvContent: content, filename: state.supplierImport.filename || 'suppliers.csv', dryRun: true }) });
        } finally { state.supplierImport.loading = false; render(); }
      }

      async function commitSupplierImport() {
        const content = state.supplierImport.content || document.getElementById('supplier-import-content')?.value || '';
        if (!(state.supplierImport.preview?.acceptedRows > 0) || !content.trim()) { notify(bt('cnNPreviewSupplierRow'), true); return; }
        state.supplierImport.loading = true; render();
        try {
          if (state.demo) {
            const preview = demoSupplierPreview(content);
            preview.rows.forEach((row, index) => state.suppliers.push({ id: `demo-supplier-import-${Date.now()}-${index}`, organization_id: `demo-supplier-import-${Date.now()}-${index}`, relationship_id: null, organizations: { display_name: row.legalName, legal_name: row.legalName, type: 'supplier', country_code: null, status: 'invited' } }));
            state.supplierImport.delivery = { total: preview.acceptedRows, pending: preview.acceptedRows, sent: 0, failed: 0 };
            state.supplierImport.job = { status: 'completed', acceptedRows: preview.acceptedRows, rejectedRows: preview.rejectedRows };
          } else {
            const result = await api('/api/catalog/suppliers/import', { method: 'POST', body: JSON.stringify({ brandOrganizationId: state.activeOrganizationId, csvContent: content, filename: state.supplierImport.filename || 'suppliers.csv', idempotencyKey: `brand-suppliers-${Date.now()}-${content.length}` }) });
            state.supplierImport.job = result.job; state.supplierImport.delivery = result.delivery; await sync();
          }
          state.modal = null; const delivery = state.supplierImport.delivery; notify(`Import fournisseurs terminé : ${state.supplierImport.job?.acceptedRows || 0} ${esc(bt('cnInvitesCreated'))}${delivery ? ` ${delivery.sent || 0} ${esc(bt('cnSentPlural'))} ${delivery.pending || 0} en attente manuelle, ${delivery.failed || 0} en échec.` : ''}`);
        } finally { state.supplierImport.loading = false; render(); }
      }
