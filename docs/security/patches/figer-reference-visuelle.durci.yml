# Figer la reference de regression visuelle — acte volontaire.
#
# POURQUOI CE WORKFLOW EXISTE
#
# La comparaison de pixels n'a de sens qu'entre deux rendus produits par la
# MEME pile graphique. Le binaire de navigateur est epingle, les fontes sont
# statiques — mais freetype/fontconfig dependent de l'OS : la meme page rend
# differemment sur un poste Debian et sur le runner ubuntu de la CI, de
# quelques pourcents de pixels sur les pages denses en texte. Une reference
# generee sur un poste ferait donc rougir la CI sans la moindre cause au code.
#
# La reference se genere donc ICI, dans l'environnement ou elle est comparee
# (job identique a celui de la boucle de verification) : c'est la seule facon
# de figer l'empreinte de rendu sans mentir. Les images atterrissent sur la
# branche sous forme de diff — la revue reste humaine.
#
# Declenchement : acte volontaire, comme --maj.
#   - sur main : gh workflow run figer-reference-visuelle.yml
#   - sur une branche : ajouter une ligne a tests/regression/reference/.figer
#     et pousser (workflow_dispatch n'existe que sur la branche par defaut).
#
# Limite connue : la poussee d'images faite par GITHUB_TOKEN ne relance pas
# librement la CI — le run cree reste en attente d'approbation humaine. Un
# commit ulterieur pousse depuis un compte authentifie relance la boucle
# normale sur les memes references.
#
# A REJOUER quand l'environnement de rendu bouge : migration de l'image
# ubuntu-latest, mise a jour de playwright, changement de fontes.
#
# ---------------------------------------------------------------------------
# SEPARATION DES POUVOIRS — 2026-10-12
# ---------------------------------------------------------------------------
# Ce workflow demandait `permissions: contents: write` AU NIVEAU DU WORKFLOW.
# Tous ses jobs heritaient donc du droit d'ecriture, y compris celui qui
# installe les dependances, telecharge un navigateur et execute le code du
# depot. Un declencheur qui execute du code avec un droit d'ecriture dans le
# depot transforme ce droit en capacite de commit : c'est la classe de defaut
# qui a produit l'incident 2C, ou une etape de CI lisait le secret de
# production.
#
# Le droit n'est pas supprime : il est DEPLACE la ou il sert.
#
#   job `generer` — `contents: read`. Il installe, execute, mesure, et depose
#   les images en artefact. Il ne peut rien ecrire dans le depot.
#
#   job `pousser` — `contents: write`, mais AUCUNE execution de code du depot.
#   Il telecharge l'artefact, commit, pousse. Rien d'autre.
#
# Ce qui rend la separation utile : un jeton capable d'ecrire n'est jamais
# detenu par un processus qui execute du code dont il ne maitrise pas le
# contenu. `npm run test:workflow-policy` verifie cet invariant, et refuse
# aussi bien le retour du droit au niveau du workflow qu'un job ecrivain qui
# executerait npm, npx ou node.
#
# Validation par le proprietaire : le job `pousser` porte un environnement
# GitHub. `figer-reference-visuelle` peut y etre associe a des relecteurs
# obligatoires ; l'acte devient alors explicitement approuve. Le reglage est
# cote interface, il ne demande aucune modification de ce fichier.

name: Figer la reference visuelle

on:
  workflow_dispatch:
  push:
    paths:
      # Marqueur de figage : toucher ce fichier (y ajouter une ligne de date)
      # et pousser declenche la regeneration. Le workflow ne le modifie pas :
      # sa propre poussee d'images ne boucle pas.
      - 'tests/regression/reference/.figer'

# Lecture seule par defaut. Le seul job qui ecrit redemande le droit.
permissions:
  contents: read

env:
  NODE_VERSION: '20'
  TF_BASE_URL: http://127.0.0.1:3000

jobs:
  generer:
    name: Regenerer les references dans l'environnement de comparaison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run db:generate

      - name: Installer Chromium pour Playwright (repli du navigateur epingle)
        run: npx playwright install --with-deps chromium

      - name: Demarrer le serveur de previsualisation
        run: |
          nohup npm run serve > /tmp/serve.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf "$TF_BASE_URL/" >/dev/null && echo "serveur pret" && exit 0
            sleep 0.5
          done
          echo "::error::le serveur n'a pas repondu sur $TF_BASE_URL"
          cat /tmp/serve.log || true
          exit 1

      - name: Regenerer les references (--maj)
        run: npm run test:regression -- --maj

      - name: Deposer les references en artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: references-regression-visuelle
          path: tests/regression/reference
          retention-days: 30

  pousser:
    name: Pousser les references sur la branche
    needs: generer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Le seul job qui detient le droit d'ecriture. Il n'execute aucun code du
    # depot : ni npm, ni npx, ni node. C'est verifie par la politique des
    # workflows, pas laisse a la vigilance.
    permissions:
      contents: write
    # Associer cet environnement a des relecteurs obligatoires transforme la
    # poussee automatique en acte approuve, sans modifier ce fichier.
    environment: figer-reference-visuelle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Recuperer les references produites
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: references-regression-visuelle
          path: tests/regression/reference

      - name: Commit et poussee si les references ont change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/regression/reference
          if git diff --cached --quiet; then
            echo "Aucune reference modifiee : rien a pousser."
          else
            git commit -m "reference visuelle : regeneree dans l'environnement CI"
            git push
          fi
