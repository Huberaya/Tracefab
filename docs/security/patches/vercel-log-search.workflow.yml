# PREPARE — NON INSTALLE. Aucun fichier de .github/workflows n'a ete cree.
#
# Destination si vous l'autorisez : .github/workflows/vercel-log-search.yml
#
# POURQUOI CETTE VOIE EXISTE : l'environnement d'analyse n'a pas d'acces reseau
# a api.vercel.com (HTTP 000 mesure). Les runners GitHub, eux, ont un acces
# Internet complet. Ce workflow fait donc la requete a votre place, et n'affiche
# que les lignes portant l'identifiant de correlation.
#
# NATURE DE L'ACTION : niveau C — ecriture GitHub (fichier de workflow, donc une
# execution d'Actions), et lecture d'un secret que VOUS creez. Le jeton n'a pas
# a etre transmis ici : il reste dans le magasin de secrets GitHub.
#
# TROIS CONSEQUENCES A VALIDER AVANT INSTALLATION
#   1. vous devez creer le secret `VERCEL_READONLY_TOKEN` (Settings > Secrets and
#      variables > Actions). Un secret au niveau du depot est lisible par tout
#      workflow declenche sur un push de n'importe quelle branche : tout
#      collaborateur ayant le droit d'ecriture peut donc, s'il le veut, pousser
#      un workflow qui le lit. C'est le mecanisme de l'incident 2C, et c'est
#      pourquoi la variante recommandee place le secret dans un ENVIRONNEMENT
#      `vercel-log-search` avec relecteurs obligatoires (voir la ligne
#      `environment:` ci-dessous, volontairement activee).
#   2. l'environnement `vercel-log-search` doit exister avant la premiere
#      execution, sinon le job echoue sur « environment not found ». Creation :
#      Settings > Environments > New environment, puis Required reviewers.
#   3. le declencheur `push` est volontairement limite a la branche de travail
#      `arena/879cd8db-tracefab`. `workflow_dispatch` n'apparait dans l'interface
#      que si le fichier est aussi sur la branche par defaut : ce n'est PAS le
#      cas ici, et `main` reste intacte.
#
# Si vous preferez le chemin le plus court sans rien creer cote GitHub :
# `sh scripts/diagnose_production_incident.sh` depuis un poste qui joint Vercel,
# et seule la valeur de `error.message` remonte ici.

name: Recherche dans les journaux Vercel (lecture seule)

on:
  push:
    branches:
      - arena/879cd8db-tracefab
  workflow_dispatch:

permissions: {}

concurrency:
  group: vercel-log-search-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recherche:
    name: Lire les journaux et filtrer sur l identifiant de correlation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Le secret vit dans cet environnement, avec relecteurs obligatoires : un
    # workflow pousse par un collaborateur ne peut pas le lire sans approbation.
    environment: vercel-log-search
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Refuser d'avance un secret absent
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_READONLY_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Le secret VERCEL_READONLY_TOKEN est absent ou vide : le controle n'a pas pu tourner, il ne passe pas."
            exit 2
          fi

      - name: Interroger l API Vercel en lecture seule
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_READONLY_TOKEN }}
          TF_DEPLOYMENT_ID: '6968252029'
          TF_CORRELATION_ID: 'fd30b689-f50f-44f0-a0dd-43e5e1e51f0e'
        run: node scripts/diagnose_production_incident.mjs

      - name: Rappeler ce que la sortie signifie
        if: always()
        run: |
          echo "Sortie 0 : la ligne a ete trouvee et affichee ci-dessus."
          echo "Sortie 1 : rien dans les journaux de BUILD — attendu pour un internal_error, qui est un evenement d'execution."
          echo "Sortie 2 : le controle n'a pas pu tourner (jeton, refus, reseau)."

