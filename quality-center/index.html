<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracefab — Quality Center</title>
  <meta name="description" content="Tracefab Quality Center — scores, issues et actions de qualité des données.">
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #17231f; background: #f7f8f4; --green:#0b7656; --dark:#07523e; --muted:#71807a; --line:#e2e8df; --panel:#fff; --yellow:#d79621; --red:#b42318; }
    * { box-sizing: border-box; } body { margin:0; min-height:100vh; background:linear-gradient(135deg,#f7f8f4 0%,#edf6ef 100%); } button,select { font:inherit; }
    .shell { max-width:1280px; margin:0 auto; padding:28px 22px 56px; } .topbar { display:flex; justify-content:space-between; gap:20px; align-items:center; margin-bottom:30px; }
    .brand { display:flex; gap:12px; align-items:center; font-weight:800; } .mark { width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--green);color:#fff;font-weight:900; }
    .brand small { display:block; color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; } .actions { display:flex; gap:10px; align-items:center; }
    a,.btn { border:1px solid var(--line); border-radius:10px; padding:10px 14px; color:var(--dark); background:#fff; text-decoration:none; cursor:pointer; font-weight:700; } .btn-primary { background:var(--green); border-color:var(--green); color:#fff; }
    .hero { display:flex; justify-content:space-between; gap:24px; align-items:end; margin-bottom:28px; } .eyebrow { color:var(--green); text-transform:uppercase; letter-spacing:.14em; font-size:12px; font-weight:800; } h1 { margin:8px 0; font-size:clamp(2rem,5vw,4rem); letter-spacing:-.055em; line-height:1; } .lede { color:var(--muted); max-width:620px; line-height:1.6; }
    .metrics { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:26px; } .metric,.card { background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 30px rgba(23,35,31,.06); } .metric { padding:18px; } .metric label { color:var(--muted); font-size:12px; } .metric strong { display:block; margin-top:6px; font-size:2rem; } .metric.danger strong { color:var(--red); } .metric.warn strong { color:var(--yellow); }
    .layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr); gap:18px; } .card { padding:20px; } .card h2 { margin:0 0 16px; font-size:1.1rem; } .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; } select { border:1px solid var(--line); border-radius:9px; padding:9px 12px; background:#fff; color:var(--dark); }
    .table-wrap { overflow:auto; } table { width:100%; border-collapse:collapse; min-width:680px; } th,td { padding:12px 10px; text-align:left; vertical-align:top; border-top:1px solid var(--line); font-size:13px; } th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; } td small { color:var(--muted); display:block; margin-top:4px; }
    .pill { display:inline-flex; border-radius:999px; padding:4px 8px; font-size:11px; font-weight:800; text-transform:capitalize; } .pill-blocking { background:#fde8e7;color:var(--red); } .pill-warning { background:#fff3d6;color:#8f6417; } .pill-info { background:#e5f1ff;color:#18558e; } .pill-acknowledged { background:#edf0ef;color:#53625d; } .pill-open { background:#e6f5ee;color:var(--dark); }
    .issue-actions { display:flex; gap:6px; flex-wrap:wrap; } .issue-actions button { padding:6px 8px; font-size:11px; } .empty { padding:24px; color:var(--muted); text-align:center; border:1px dashed var(--line); border-radius:12px; } .error { padding:14px; background:#fff0ef; color:var(--red); border-radius:10px; margin-bottom:16px; } .demo { background:#fff3d6; color:#8f6417; padding:8px 12px; border-radius:999px; font-size:12px; font-weight:700; }
    .score-list { display:grid; gap:10px; } .score { border:1px solid var(--line); border-radius:12px; padding:12px; } .score-head { display:flex; justify-content:space-between; gap:10px; } .score-name { font-weight:800; } .score-type { color:var(--muted); font-size:11px; } .bars { display:grid; gap:7px; margin-top:12px; } .bar-line { display:grid; grid-template-columns:112px 1fr 38px; gap:8px; align-items:center; color:var(--muted); font-size:11px; } .bar { height:7px; background:#edf0ed; border-radius:99px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--green); border-radius:99px; }
    .auth { min-height:70vh; display:grid; place-items:center; } .auth-card { max-width:720px; width:100%; padding:36px; background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 20px 48px rgba(23,35,31,.1); } #clerk-sign-in { min-height:180px; } .muted { color:var(--muted); } @media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}} @media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr)}.hero{display:block}.actions{margin-top:18px}.shell{padding:18px 14px 40px}}@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.layout>*{min-width:0}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}}@media(max-width:560px){.actions{flex-wrap:wrap;gap:8px}.actions>*{flex:0 1 auto}}
    .auth-lang { display:flex; justify-content:flex-end; margin-bottom:14px; }
  </style>
  <!-- The legacy auto-translate.js DOM rewriter was removed here, as it already
       was in brand-console and supplier-portal: it walks text nodes against a
       FRENCH-source glossary, caches its language from the legacy "tracefab_lang"
       key at load time and never refreshes it, then re-applies itself on every
       DOM mutation. It therefore overwrote this page's tf-i18n output whenever a
       rendered French string matched a glossary entry. This page now owns its
       complete catalogue (quality.* + shared.*) in /assets/i18n. -->
    <!-- i18n : catalogue unique /assets/i18n. Cette page n'avait aucun
         mecanisme de traduction alors qu'elle est atteignable depuis trois
         pages ; elle suit desormais la langue choisie ailleurs. -->
    <script>window.TF_I18N_SKIP_META = true;</script>
    <script src="/assets/i18n/en.js"></script>
    <script src="/assets/js/tf-i18n.js"></script>
    <link rel="stylesheet" href="/assets/design-system/tracefab-touch.css">
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const state = { demo:new URLSearchParams(location.search).has('demo'), clerk:null, user:null, data:null, loading:true, error:null, severity:'', status:'', notice:null };
      const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
      const num = (value) => Number(value || 0).toLocaleString((window.TF_I18N && window.TF_I18N.lang) || 'en');
      const pct = (value) => Math.max(0, Math.min(100, Number(value || 0))).toFixed(0);
      const app = document.getElementById('app');
      function demoData(){ state.data={metrics:{totalIssues:7,openIssues:4,blockingIssues:1,warningIssues:3,acknowledgedIssues:2,waivedIssues:1},issues:[{id:'demo-quality-1',ownerOrganizationName:'Atelier Demo',subjectType:'product',subjectId:'demo-product-1',subjectName:'Essentiel coton',ruleKey:'product_missing_evidence',severity:'blocking',status:'open',fieldKey:'main_material_percentage',message:'La donnée principale n’a pas encore de preuve disponible.',details:{requiredEvidence:true},detectedAt:new Date().toISOString()},{id:'demo-quality-2',ownerOrganizationName:'Nhãn Textile',subjectType:'supplier',subjectId:'demo-supplier',subjectName:'Nhãn Textile',ruleKey:'supplier_profile_stale',severity:'warning',status:'acknowledged',fieldKey:null,message:'Le profil fournisseur doit être renouvelé.',details:{ageDays:410},detectedAt:new Date(Date.now()-86400000).toISOString()}],scores:[{id:'demo-score-1',subjectType:'product',subjectId:'demo-product-1',subjectName:'Essentiel coton',completeness:'82',freshness:'76',documentationCoverage:'61',consistency:'90',computedAt:new Date().toISOString()}]}; }
      async function token(){ return state.clerk?.session ? state.clerk.session.getToken() : null; }
      async function api(path, options={}){ const headers={'Content-Type':'application/json',...(options.headers||{})}; const t=await token(); if(t) headers.Authorization=`Bearer ${t}`; const r=await fetch(path,{...options,headers}); const body=await r.json().catch(()=>({})); if(!r.ok) throw new Error(body.error || `HTTP ${r.status}`); return body; }
      function pill(value){ return `<span class="pill pill-${esc(value)}">${esc(String(value).replaceAll('_',' '))}</span>`; }
      // q() lit la portee propre a cette page, s() le fonds commun deja
      // partage avec la console et le portail (statuts).
      const LANG_NAMES = {en:'🇬🇧 English',fr:'🇫🇷 Français',de:'🇩🇪 Deutsch',it:'🇮🇹 Italiano',es:'🇪🇸 Español',nl:'🇳🇱 Nederlands',pt:'🇵🇹 Português'};
      const langSelect = () => {
        const api = window.TF_I18N;
        if (!api) return '';
        const opts = api.supported
          .map((l) => `<option value="${l}"${l === api.lang ? ' selected' : ''}>${LANG_NAMES[l] || l}</option>`)
          .join('');
        return `<select id="qc-lang-select" aria-label="Language" style="padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--dark);font-weight:700">${opts}</select>`;
      };
      const q = (k) => (window.TF_I18N ? window.TF_I18N.t('quality.' + k, k) : k);
      const s = (k) => (window.TF_I18N ? window.TF_I18N.t('shared.' + k, k) : k);

      // L'ecran d'erreur affichait state.error tel quel : le responsable
      // conformite lisait « clerk_not_configured » ou « HTTP 503 ». On rend une
      // phrase traduite et on garde le code en console pour le support.
      function errLabel(code){ const c=String(code||'');
        if(/unauthor|clerk|session|sign/i.test(c)) return q('errSignIn');
        if(c) console.error('[tracefab] quality-center:', c);
        return q('errBackend'); }
      function render(){ if(state.loading){app.innerHTML=`<div class="auth"><div class="muted">${q('loading')}</div></div>`;return;} if(state.error&&!state.demo){app.innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-lang">${langSelect()}</div><div class="eyebrow">${q('eyebrowBrand')}</div><h1>${q('unavailable')}</h1><p class="muted">${errLabel(state.error)}</p><button class="btn btn-primary" data-action="retry">${q('retry')}</button></div></div>`;bind();return;} if(!state.user&&!state.demo){app.innerHTML=`<div class="auth"><div class="auth-card"><div class="eyebrow">${q('eyebrowBrand')}</div><h1>${q('signInTitle')}</h1><p class="muted">${q('signInLede')}</p><div id="clerk-sign-in"></div></div></div>`; if(state.clerk) state.clerk.mountSignIn(document.getElementById('clerk-sign-in')); return;} const d=state.data||{metrics:{},issues:[],scores:[]}; const m=d.metrics||{}; const filtered=(d.issues||[]).filter(i=>(!state.severity||i.severity===state.severity)&&(!state.status||i.status===state.status)); app.innerHTML=`<main class="shell"><header class="topbar"><div class="brand"><div class="mark">tf</div><div>tracefab<small>quality center</small></div></div><div class="actions">${langSelect()}<span class="${state.demo?'demo':''}">${state.demo?q('demoMode'):'Quality Center'}</span><a href="/">${q('navHome')}</a><a href="/brand-console/">${q('navConsole')}</a></div></header><section class="hero"><div><div class="eyebrow">${q('eyebrow')}</div><h1>${q('heroTitle')}</h1><p class="lede">${q('heroLede')}</p></div><button class="btn btn-primary" data-action="refresh">${q('refresh')}</button></section>${state.notice?`<div class="error" style="background:#e6f5ee;color:#07523e">${esc(state.notice)}</div>`:''}<section class="metrics"><div class="metric"><label>${q('metricTotal')}</label><strong>${num(m.totalIssues)}</strong></div><div class="metric danger"><label>${q('metricBlocking')}</label><strong>${num(m.blockingIssues)}</strong></div><div class="metric warn"><label>${q('metricWarning')}</label><strong>${num(m.warningIssues)}</strong></div><div class="metric"><label>${q('metricOpen')}</label><strong>${num(m.openIssues)}</strong></div><div class="metric"><label>${q('metricAcknowledged')}</label><strong>${num(m.acknowledgedIssues)}</strong></div></section><section class="layout"><article class="card"><h2>${q('issuesTitle')}</h2><div class="filters"><select data-filter="severity"><option value="">${q('allSeverities')}</option><option value="blocking">${q('sevBlocking')}</option><option value="warning">${q('metricWarning')}</option><option value="info">${q('sevInfo')}</option></select><select data-filter="status"><option value="">${q('allStatuses')}</option><option value="open">${s('stOpen')}</option><option value="acknowledged">${s('stAcknowledged')}</option><option value="waived">${s('stWaived')}</option></select></div>${filtered.length?`<div class="table-wrap"><table><thead><tr><th>${q('colSubject')}</th><th>${q('colIssue')}</th><th>${q('colSeverity')}</th><th>${q('colStatus')}</th><th>${q('colAction')}</th></tr></thead><tbody>${filtered.map(i=>`<tr><td><strong>${esc(i.subjectName)}</strong><small>${esc(i.subjectType)} · ${esc(i.ownerOrganizationName||'')}</small></td><td>${esc(i.message)}<small>${esc(i.ruleKey)}${i.fieldKey?' · '+esc(i.fieldKey):''}</small></td><td>${pill(i.severity)}</td><td>${pill(i.status)}</td><td><div class="issue-actions">${i.status==='open'?`<button class="btn" data-issue-action="ack" data-id="${esc(i.id)}">${q('actionAck')}</button>`:''}${i.status!=='waived'&&i.status!=='resolved'?`<button class="btn" data-issue-action="waive" data-id="${esc(i.id)}">${q('actionWaive')}</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${q('emptyIssues')}</div>`}</article><aside class="card"><h2>${q('scoresTitle')}</h2>${(d.scores||[]).length?`<div class="score-list">${d.scores.slice(0,8).map(s=>`<div class="score"><div class="score-head"><div><div class="score-name">${esc(s.subjectName)}</div><div class="score-type">${esc(s.subjectType)} · ${q('computedOn')} ${new Date(s.computedAt).toLocaleDateString((window.TF_I18N && window.TF_I18N.lang) || 'en')}</div></div><strong>${pct((Number(s.completeness)+Number(s.freshness)+Number(s.documentationCoverage)+Number(s.consistency))/4)}%</strong></div><div class="bars">${[[q('barCompleteness'),s.completeness],[q('barFreshness'),s.freshness],[q('barEvidence'),s.documentationCoverage],[q('barConsistency'),s.consistency]].map(([label,value])=>`<div class="bar-line"><span>${label}</span><div class="bar"><i style="width:${pct(value)}%"></i></div><b>${pct(value)}%</b></div>`).join('')}</div></div>`).join('')}</div>`:`<div class="empty">${q('emptyScores')}</div>`}</aside></section></main>`; bind(); }
      // La langue peut changer depuis la console ou un autre onglet.
      document.addEventListener('tf:languagechange', () => { if (state.i18nReady) render(); });

      function bind(){ const ls=document.getElementById('qc-lang-select'); if(ls) ls.onchange=()=>{ if(window.TF_I18N) window.TF_I18N.setLanguage(ls.value); }; document.querySelectorAll('[data-filter]').forEach(e=>{e.value=state[e.dataset.filter]||'';e.onchange=()=>{state[e.dataset.filter]=e.value;render();};}); document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>{if(e.dataset.action==='retry'||e.dataset.action==='refresh') load();}); document.querySelectorAll('[data-issue-action]').forEach(e=>e.onclick=()=>issueAction(e.dataset.issueAction,e.dataset.id)); }
      async function issueAction(action,id){ try { if(state.demo){state.notice=action==='ack'?q('noticeAck'):q('noticeWaive'); const issue=state.data.issues.find(i=>i.id===id);if(issue)issue.status=action==='ack'?'acknowledged':'waived';render();return;} const path=action==='ack'?`/api/quality-issues/${id}/acknowledge`:`/api/quality-issues/${id}/waive`; const body=action==='ack'?undefined:JSON.stringify({reason:window.prompt(q('promptWaive'))||''}); if(action==='waive'&&!body) return; await api(path,{method:'POST',...(body?{body}:{})}); state.notice=q('noticeSaved'); await load(false); } catch(e){state.error=e.message;render();} }
      async function load(showLoading=true){ if(showLoading)state.loading=true;state.error=null;render(); if(state.demo){demoData();state.loading=false;render();return;} try{state.data=await api(`/api/quality/overview?limit=80${state.severity?'&severity='+encodeURIComponent(state.severity):''}${state.status?'&status='+encodeURIComponent(state.status):''}`);state.loading=false;render();}catch(e){state.loading=false;state.error=e.message;render();} }
      async function boot(){ if(state.demo){await load();return;} try{const config=await fetch('/api/config').then(r=>r.json());if(!config.publishableKey)throw new Error(config.error||'clerk_not_configured');const clerkDomain=atob(config.publishableKey.split('_')[2]).slice(0,-1);await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=`https://${clerkDomain}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;s.async=true;s.crossOrigin='anonymous';s.setAttribute('data-clerk-publishable-key',config.publishableKey);s.onload=resolve;s.onerror=()=>reject(new Error('clerk_sdk_unavailable'));document.head.appendChild(s);});state.clerk=window.Clerk;if(!state.clerk)throw new Error('clerk_sdk_unavailable');await state.clerk.load();state.clerk.addListener(()=>{if(state.clerk.user&&!state.user){state.user=state.clerk.user;load();}});state.user=state.clerk.user||null;state.loading=false;render();if(state.user)load(false);}catch(e){state.loading=false;state.error=e.message;render();} }
      window.tracefabQualityCenter = { state };
      // Charger la locale avant le premier rendu, sinon la page s'affiche en
      // anglais puis bascule.
      (window.TF_I18N ? window.TF_I18N.setLanguage(window.TF_I18N.lang) : Promise.resolve())
        .then(() => { state.i18nReady = true; }, () => { state.i18nReady = true; })
        .then(boot, boot);
    })();
  </script>
</body>
</html>
