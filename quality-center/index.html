<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracefab — Quality Center</title>
  <meta name="description" content="Tracefab Quality Center — scores, issues et actions de qualité des données.">
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #17231f; background: #f7f8f4; --green:#0b7656; --dark:#07523e; --muted:#71807a; --line:#e2e8df; --panel:#fff; --yellow:#d79621; --red:#b42318; }
    * { box-sizing: border-box; } body { margin:0; min-height:100vh; background:linear-gradient(135deg,#f7f8f4 0%,#edf6ef 100%); } button,select { font:inherit; }
    .shell { max-width:1280px; margin:0 auto; padding:28px 22px 56px; } .topbar { display:flex; justify-content:space-between; gap:20px; align-items:center; margin-bottom:30px; }
    .brand { display:flex; gap:12px; align-items:center; font-weight:800; } .mark { width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--green);color:#fff;font-weight:900; }
    .brand small { display:block; color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; } .actions { display:flex; gap:10px; align-items:center; }
    a,.btn { border:1px solid var(--line); border-radius:10px; padding:10px 14px; color:var(--dark); background:#fff; text-decoration:none; cursor:pointer; font-weight:700; } .btn-primary { background:var(--green); border-color:var(--green); color:#fff; }
    .hero { display:flex; justify-content:space-between; gap:24px; align-items:end; margin-bottom:28px; } .eyebrow { color:var(--green); text-transform:uppercase; letter-spacing:.14em; font-size:12px; font-weight:800; } h1 { margin:8px 0; font-size:clamp(2rem,5vw,4rem); letter-spacing:-.055em; line-height:1; } .lede { color:var(--muted); max-width:620px; line-height:1.6; }
    .metrics { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:26px; } .metric,.card { background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 30px rgba(23,35,31,.06); } .metric { padding:18px; } .metric label { color:var(--muted); font-size:12px; } .metric strong { display:block; margin-top:6px; font-size:2rem; } .metric.danger strong { color:var(--red); } .metric.warn strong { color:var(--yellow); }
    .layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr); gap:18px; } .card { padding:20px; } .card h2 { margin:0 0 16px; font-size:1.1rem; } .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; } select { border:1px solid var(--line); border-radius:9px; padding:9px 12px; background:#fff; color:var(--dark); }
    .table-wrap { overflow:auto; } table { width:100%; border-collapse:collapse; min-width:680px; } th,td { padding:12px 10px; text-align:left; vertical-align:top; border-top:1px solid var(--line); font-size:13px; } th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; } td small { color:var(--muted); display:block; margin-top:4px; }
    .pill { display:inline-flex; border-radius:999px; padding:4px 8px; font-size:11px; font-weight:800; text-transform:capitalize; } .pill-blocking { background:#fde8e7;color:var(--red); } .pill-warning { background:#fff3d6;color:#8f6417; } .pill-info { background:#e5f1ff;color:#18558e; } .pill-acknowledged { background:#edf0ef;color:#53625d; } .pill-open { background:#e6f5ee;color:var(--dark); }
    .issue-actions { display:flex; gap:6px; flex-wrap:wrap; } .issue-actions button { padding:6px 8px; font-size:11px; } .empty { padding:24px; color:var(--muted); text-align:center; border:1px dashed var(--line); border-radius:12px; } .error { padding:14px; background:#fff0ef; color:var(--red); border-radius:10px; margin-bottom:16px; } .demo { background:#fff3d6; color:#8f6417; padding:8px 12px; border-radius:999px; font-size:12px; font-weight:700; }
    .score-list { display:grid; gap:10px; } .score { border:1px solid var(--line); border-radius:12px; padding:12px; } .score-head { display:flex; justify-content:space-between; gap:10px; } .score-name { font-weight:800; } .score-type { color:var(--muted); font-size:11px; } .bars { display:grid; gap:7px; margin-top:12px; } .bar-line { display:grid; grid-template-columns:112px 1fr 38px; gap:8px; align-items:center; color:var(--muted); font-size:11px; } .bar { height:7px; background:#edf0ed; border-radius:99px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--green); border-radius:99px; }
    .auth { min-height:70vh; display:grid; place-items:center; } .auth-card { max-width:720px; width:100%; padding:36px; background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 20px 48px rgba(23,35,31,.1); } #clerk-sign-in { min-height:180px; } .muted { color:var(--muted); } @media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}} @media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr)}.hero{display:block}.actions{margin-top:18px}.shell{padding:18px 14px 40px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const state = { demo:new URLSearchParams(location.search).has('demo'), clerk:null, user:null, data:null, loading:true, error:null, severity:'', status:'', notice:null };
      const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
      const num = (value) => Number(value || 0).toLocaleString('fr-FR');
      const pct = (value) => Math.max(0, Math.min(100, Number(value || 0))).toFixed(0);
      const app = document.getElementById('app');
      function demoData(){ state.data={metrics:{totalIssues:7,openIssues:4,blockingIssues:1,warningIssues:3,acknowledgedIssues:2,waivedIssues:1},issues:[{id:'demo-quality-1',ownerOrganizationName:'Atelier Demo',subjectType:'product',subjectId:'demo-product-1',subjectName:'Essentiel coton',ruleKey:'product_missing_evidence',severity:'blocking',status:'open',fieldKey:'main_material_percentage',message:'La donnée principale n’a pas encore de preuve disponible.',details:{requiredEvidence:true},detectedAt:new Date().toISOString()},{id:'demo-quality-2',ownerOrganizationName:'Nhãn Textile',subjectType:'supplier',subjectId:'demo-supplier',subjectName:'Nhãn Textile',ruleKey:'supplier_profile_stale',severity:'warning',status:'acknowledged',fieldKey:null,message:'Le profil fournisseur doit être renouvelé.',details:{ageDays:410},detectedAt:new Date(Date.now()-86400000).toISOString()}],scores:[{id:'demo-score-1',subjectType:'product',subjectId:'demo-product-1',subjectName:'Essentiel coton',completeness:'82',freshness:'76',documentationCoverage:'61',consistency:'90',computedAt:new Date().toISOString()}]}; }
      async function token(){ return state.clerk?.session ? state.clerk.session.getToken() : null; }
      async function api(path, options={}){ const headers={'Content-Type':'application/json',...(options.headers||{})}; const t=await token(); if(t) headers.Authorization=`Bearer ${t}`; const r=await fetch(path,{...options,headers}); const body=await r.json().catch(()=>({})); if(!r.ok) throw new Error(body.error || `HTTP ${r.status}`); return body; }
      function pill(value){ return `<span class="pill pill-${esc(value)}">${esc(String(value).replaceAll('_',' '))}</span>`; }
      function render(){ if(state.loading){app.innerHTML='<div class="auth"><div class="muted">Chargement du Quality Center…</div></div>';return;} if(state.error&&!state.demo){app.innerHTML=`<div class="auth"><div class="auth-card"><div class="eyebrow">Tracefab Quality Center</div><h1>Qualité indisponible</h1><p class="muted">${esc(state.error)}</p><button class="btn btn-primary" data-action="retry">Réessayer</button></div></div>`;bind();return;} if(!state.user&&!state.demo){app.innerHTML='<div class="auth"><div class="auth-card"><div class="eyebrow">Tracefab Quality Center</div><h1>Contrôler la qualité de la donnée.</h1><p class="muted">Scores explicables, issues actionnables et historique des décisions de revue.</p><div id="clerk-sign-in"></div></div></div>'; if(state.clerk) state.clerk.mountSignIn(document.getElementById('clerk-sign-in')); return;} const d=state.data||{metrics:{},issues:[],scores:[]}; const m=d.metrics||{}; const filtered=(d.issues||[]).filter(i=>(!state.severity||i.severity===state.severity)&&(!state.status||i.status===state.status)); app.innerHTML=`<main class="shell"><header class="topbar"><div class="brand"><div class="mark">tf</div><div>tracefab<small>quality center</small></div></div><div class="actions"><span class="${state.demo?'demo':''}">${state.demo?'Mode démo':'Quality Center'}</span><a href="/">Accueil</a><a href="/brand-console/">Brand Console</a></div></header><section class="hero"><div><div class="eyebrow">P1 · qualité des données</div><h1>Décider avec des signaux explicables.</h1><p class="lede">Un espace de revue transversal pour les produits et fournisseurs accessibles à votre organisation. Les statuts déclaratifs ne sont jamais transformés en certification.</p></div><button class="btn btn-primary" data-action="refresh">Rafraîchir</button></section>${state.notice?`<div class="error" style="background:#e6f5ee;color:#07523e">${esc(state.notice)}</div>`:''}<section class="metrics"><div class="metric"><label>Issues visibles</label><strong>${num(m.totalIssues)}</strong></div><div class="metric danger"><label>Bloquantes ouvertes</label><strong>${num(m.blockingIssues)}</strong></div><div class="metric warn"><label>Avertissements</label><strong>${num(m.warningIssues)}</strong></div><div class="metric"><label>À traiter</label><strong>${num(m.openIssues)}</strong></div><div class="metric"><label>Acquittées</label><strong>${num(m.acknowledgedIssues)}</strong></div></section><section class="layout"><article class="card"><h2>Issues prioritaires</h2><div class="filters"><select data-filter="severity"><option value="">Toutes les sévérités</option><option value="blocking">Bloquantes</option><option value="warning">Avertissements</option><option value="info">Information</option></select><select data-filter="status"><option value="">Tous les statuts</option><option value="open">Ouvertes</option><option value="acknowledged">Acquittées</option><option value="waived">Waivées</option></select></div>${filtered.length?`<div class="table-wrap"><table><thead><tr><th>Sujet</th><th>Issue</th><th>Gravité</th><th>Statut</th><th>Action</th></tr></thead><tbody>${filtered.map(i=>`<tr><td><strong>${esc(i.subjectName)}</strong><small>${esc(i.subjectType)} · ${esc(i.ownerOrganizationName||'')}</small></td><td>${esc(i.message)}<small>${esc(i.ruleKey)}${i.fieldKey?' · '+esc(i.fieldKey):''}</small></td><td>${pill(i.severity)}</td><td>${pill(i.status)}</td><td><div class="issue-actions">${i.status==='open'?`<button class="btn" data-issue-action="ack" data-id="${esc(i.id)}">Acquitter</button>`:''}${i.status!=='waived'&&i.status!=='resolved'?`<button class="btn" data-issue-action="waive" data-id="${esc(i.id)}">Waiver</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucune issue pour ces filtres.</div>'}</article><aside class="card"><h2>Derniers scores</h2>${(d.scores||[]).length?`<div class="score-list">${d.scores.slice(0,8).map(s=>`<div class="score"><div class="score-head"><div><div class="score-name">${esc(s.subjectName)}</div><div class="score-type">${esc(s.subjectType)} · calculé ${new Date(s.computedAt).toLocaleDateString('fr-FR')}</div></div><strong>${pct((Number(s.completeness)+Number(s.freshness)+Number(s.documentationCoverage)+Number(s.consistency))/4)}%</strong></div><div class="bars">${[['Complétude',s.completeness],['Fraîcheur',s.freshness],['Preuves',s.documentationCoverage],['Cohérence',s.consistency]].map(([label,value])=>`<div class="bar-line"><span>${label}</span><div class="bar"><i style="width:${pct(value)}%"></i></div><b>${pct(value)}%</b></div>`).join('')}</div></div>`).join('')}</div>`:'<div class="empty">Aucun score calculé.</div>'}</aside></section></main>`; bind(); }
      function bind(){ document.querySelectorAll('[data-filter]').forEach(e=>{e.value=state[e.dataset.filter]||'';e.onchange=()=>{state[e.dataset.filter]=e.value;render();};}); document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>{if(e.dataset.action==='retry'||e.dataset.action==='refresh') load();}); document.querySelectorAll('[data-issue-action]').forEach(e=>e.onclick=()=>issueAction(e.dataset.issueAction,e.dataset.id)); }
      async function issueAction(action,id){ try { if(state.demo){state.notice=action==='ack'?'Issue acquittée en mode démo.':'Waiver enregistré en mode démo.'; const issue=state.data.issues.find(i=>i.id===id);if(issue)issue.status=action==='ack'?'acknowledged':'waived';render();return;} const path=action==='ack'?`/api/quality-issues/${id}/acknowledge`:`/api/quality-issues/${id}/waive`; const body=action==='ack'?undefined:JSON.stringify({reason:window.prompt('Motif du waiver')||''}); if(action==='waive'&&!body) return; await api(path,{method:'POST',...(body?{body}:{})}); state.notice='Action enregistrée.'; await load(false); } catch(e){state.error=e.message;render();} }
      async function load(showLoading=true){ if(showLoading)state.loading=true;state.error=null;render(); if(state.demo){demoData();state.loading=false;render();return;} try{state.data=await api(`/api/quality/overview?limit=80${state.severity?'&severity='+encodeURIComponent(state.severity):''}${state.status?'&status='+encodeURIComponent(state.status):''}`);state.loading=false;render();}catch(e){state.loading=false;state.error=e.message;render();} }
      async function boot(){ if(state.demo){await load();return;} try{const config=await fetch('/api/config').then(r=>r.json());if(!config.publishableKey)throw new Error(config.error||'clerk_not_configured');const clerkDomain=atob(config.publishableKey.split('_')[2]).slice(0,-1);await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=`https://${clerkDomain}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;s.async=true;s.crossOrigin='anonymous';s.setAttribute('data-clerk-publishable-key',config.publishableKey);s.onload=resolve;s.onerror=()=>reject(new Error('clerk_sdk_unavailable'));document.head.appendChild(s);});state.clerk=window.Clerk;if(!state.clerk)throw new Error('clerk_sdk_unavailable');await state.clerk.load();state.clerk.addListener(()=>{if(state.clerk.user&&!state.user){state.user=state.clerk.user;load();}});state.user=state.clerk.user||null;state.loading=false;render();if(state.user)load(false);}catch(e){state.loading=false;state.error=e.message;render();} }
      boot();
    })();
  </script>
</body>
</html>
