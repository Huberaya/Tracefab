<!doctype html>
<html lang="fr">
<head>

  <title>Tracefab — Supplier Portal</title>

  <style>

    * { box-sizing:border-box; } body { margin:0; background:var(--paper); } button,input,select,textarea { font:inherit; } button { cursor:pointer; }
    .app { display:grid; grid-template-columns:256px minmax(0,1fr); min-height:100vh; } .sidebar { background:#112b23; color:#eff8f2; padding:25px 16px; display:flex; flex-direction:column; }
    .brand { display:flex; align-items:center; gap:11px; padding:0 11px 31px; } .brand-mark { width:36px; height:36px; border-radius:12px; background:#d7f3e4; color:var(--green-dark); display:grid; place-items:center; font-weight:900; letter-spacing:-.08em; } .brand-name { font-weight:780; letter-spacing:-.03em; font-size:18px; } .brand-name small { display:block; color:#a9c4b6; font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin-top:2px; }
    .nav { display:grid; gap:6px; } .nav button { appearance:none; border:0; color:#b8cec2; background:transparent; border-radius:12px; display:flex; align-items:center; gap:12px; padding:12px 13px; text-align:left; font-size:13px; font-weight:650; } .nav button:hover,.nav button.active { background:rgba(255,255,255,.1); color:white; } .nav-icon { width:19px; text-align:center; opacity:.9; }
    .sidebar-bottom { margin-top:auto; border-top:1px solid rgba(255,255,255,.12); padding:18px 10px 2px; } .user-mini { display:flex; gap:10px; align-items:center; color:#c5d8cd; font-size:12px; min-width:0; } .avatar { flex:0 0 auto; width:32px; height:32px; border-radius:50%; background:#9edec0; color:#124936; display:grid; place-items:center; font-weight:800; font-size:12px; } .user-mini strong,.user-mini span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .user-mini strong { color:white; } .user-mini span { max-width:160px; }
    .link-button { border:0; background:transparent; color:inherit; padding:0; font-size:12px; text-decoration:underline; opacity:.85; } .main { min-width:0; } .topbar { min-height:76px; padding:0 40px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.7); display:flex; align-items:center; justify-content:space-between; gap:20px; } .crumb { color:var(--muted); font-size:13px; font-weight:650; } .crumb strong { color:var(--ink); } .top-actions { display:flex; align-items:center; gap:12px; }
    .content { max-width:1420px; margin:0 auto; padding:42px 40px 70px; } .eyebrow { font-size:11px; text-transform:uppercase; letter-spacing:.13em; color:var(--green); font-weight:800; margin-bottom:11px; } h1 { margin:0; font-size:clamp(27px,3vw,42px); line-height:1.06; letter-spacing:-.055em; } h2 { margin:0; font-size:22px; letter-spacing:-.035em; } h3 { margin:0; font-size:16px; letter-spacing:-.02em; } p { color:var(--muted); line-height:1.6; }
    .page-head,.detail-hero { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:31px; } .page-head p { margin:10px 0 0; max-width:680px; font-size:14px; } .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; } .btn { border:1px solid transparent; border-radius:11px; padding:10px 15px; font-weight:750; font-size:13px; transition:transform .15s,box-shadow .15s,background .15s; } .btn:hover { transform:translateY(-1px); } .btn-primary { color:white; background:var(--green); box-shadow:0 7px 16px rgba(11,118,86,.18); } .btn-primary:hover { background:var(--green-dark); } .btn-secondary { background:white; color:var(--ink); border-color:var(--line); } .btn-danger { background:var(--red-soft); color:var(--red); border-color:#f7cbc8; } .btn-small { padding:7px 10px; font-size:12px; }
    .grid { display:grid; gap:17px; } .kpis { grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:22px; } .split { grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr); align-items:start; } .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); } .kpi { padding:20px; position:relative; overflow:hidden; } .kpi::after { content:""; width:90px; height:90px; border-radius:50%; position:absolute; right:-30px; bottom:-44px; background:var(--green-soft); } .kpi-label { color:var(--muted); font-size:12px; font-weight:700; } .kpi-value { font-size:30px; font-weight:800; letter-spacing:-.06em; margin:13px 0 3px; } .kpi-note { font-size:11px; color:var(--muted); }
    .panel { padding:23px; } .panel-head { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:18px; } .table-wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; min-width:650px; } th { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.1em; text-align:left; padding:0 12px 12px; font-weight:800; } td { border-top:1px solid #edf0eb; padding:14px 12px; font-size:13px; vertical-align:middle; } td:first-child,th:first-child { padding-left:0; } td:last-child,th:last-child { padding-right:0; text-align:right; } .clickable { cursor:pointer; } .clickable:hover td { background:#fbfcfa; }
    .status { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 9px; font-size:11px; font-weight:800; background:#edf1ed; color:#5b6962; } .status::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; } .status-sent,.status-in_progress { background:#e8f1ff; color:#3970b3; } .status-submitted { background:var(--yellow-soft); color:#9a680e; } .status-approved,.status-verified_by_reviewer { background:var(--green-soft); color:var(--green); } .status-changes_requested,.status-needs_review { background:var(--red-soft); color:var(--red); } .status-draft { background:#f0f1f0; color:#69766e; }
    .progress { height:7px; background:#e9eee9; border-radius:99px; overflow:hidden; min-width:82px; } .progress>span { display:block; height:100%; background:var(--green); border-radius:inherit; } .progress-line { display:flex; align-items:center; gap:9px; } .progress-line small { color:var(--muted); font-weight:700; min-width:32px; }
    .empty { padding:44px 20px; text-align:center; color:var(--muted); } .empty-icon { width:44px; height:44px; display:grid; place-items:center; margin:0 auto 13px; border-radius:14px; background:var(--green-soft); color:var(--green); font-size:20px; } .meta { color:var(--muted); font-size:12px; } .notice { padding:13px 15px; border-radius:12px; background:var(--yellow-soft); color:#795719; font-size:12px; line-height:1.5; } .success-note { padding:13px 15px; border-radius:12px; background:var(--green-soft); color:var(--green-dark); font-size:12px; line-height:1.5; }
    .input,.select,.textarea { width:100%; border:1px solid #d8e1d8; border-radius:10px; padding:11px 12px; background:white; color:var(--ink); outline:none; } .input:focus,.select:focus,.textarea:focus { border-color:#58a887; box-shadow:0 0 0 3px rgba(88,168,135,.13); } label { display:grid; gap:7px; color:#53625a; font-size:12px; font-weight:750; } .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; } .field-full { grid-column:1/-1; } .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:21px; }
    .request-card { padding:18px; border:1px solid var(--line); border-radius:14px; display:grid; gap:13px; } .request-card+.request-card { margin-top:11px; } .request-card-head { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; } .request-card h3 { font-size:15px; } .request-card p { margin:5px 0 0; font-size:12px; } .detail-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
    .item-list { display:grid; gap:13px; } .invitation-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid rgba(121,87,25,.18); font-size:12px; } .invitation-row:first-child { border-top:0; } .item { padding:17px; border:1px solid var(--line); border-radius:14px; } .item-head { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; } .item h3 { font-size:14px; } .item p { margin:5px 0 0; font-size:12px; } .response-box { margin-top:14px; padding:13px; background:#f8faf7; border-radius:12px; } .response-box .form-actions { margin-top:13px; } .response-state { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:7px; }
    .toast { position:fixed; right:25px; bottom:25px; z-index:50; color:white; background:#19372d; border-radius:12px; padding:13px 16px; box-shadow:0 12px 35px rgba(0,0,0,.2); font-size:13px; max-width:360px; } .toast.error { background:#8e3d3b; } .auth-screen { min-height:100vh; display:grid; place-items:center; padding:25px; background:radial-gradient(circle at 10% 0%,#d9f1e4,transparent 32%),var(--paper); } .auth-card { width:min(950px,100%); display:grid; grid-template-columns:1fr 1fr; overflow:hidden; border-radius:24px; background:white; box-shadow:var(--shadow); border:1px solid var(--line); } .auth-copy { padding:52px; background:#112b23; color:white; } .auth-copy h1 { font-size:38px; margin-top:75px; } .auth-copy p { color:#bdd2c7; max-width:370px; } .auth-copy ul { color:#d7e9df; padding-left:19px; line-height:2; font-size:13px; } .auth-box { padding:38px; min-height:480px; } .config-error { max-width:600px; background:white; padding:35px; border-radius:20px; box-shadow:var(--shadow); } .demo-banner { background:var(--yellow-soft); border-bottom:1px solid #f2ddb0; padding:8px 15px; text-align:center; font-size:11px; color:#8f6417; font-weight:750; }
    @media (max-width:1050px) { .kpis{grid-template-columns:repeat(2,1fr)} .split{grid-template-columns:1fr} } @media (max-width:760px) { .app{display:block} .sidebar{min-height:auto;padding:15px} .brand{padding-bottom:16px} .nav{display:flex;overflow-x:auto} .nav button{white-space:nowrap} .sidebar-bottom{display:none} .topbar{padding:0 18px;min-height:64px} .content{padding:28px 18px 50px} .page-head,.detail-hero{display:block} .actions{justify-content:flex-start;margin-top:17px} .auth-card{grid-template-columns:1fr} .auth-copy{display:none} .auth-box{min-height:500px} .form-grid{grid-template-columns:1fr} .field-full{grid-column:auto} }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      'use strict';
      const app = document.getElementById('app');
      const state = { clerk:null, loading:true, configError:null, user:null, memberships:[], organizations:[], selectedOrganizationId:null, supplier:null, profile:null, requests:[], sites:[], certifications:[], materials:[], documents:[], dataPoints:[], members:[], memberInvitations:[], canManageMembers:false, dataPointDefinitions:{}, quality:null, optionalErrors:[], selectedRequest:null, view:'overview', toast:null, demo:new URLSearchParams(location.search).has('demo') };
      const labels = { draft:'Brouillon', sent:'Envoyée', in_progress:'En cours', submitted:'Soumise', changes_requested:'À corriger', approved:'Approuvée', cancelled:'Annulée', needs_review:'À revoir', verified_by_reviewer:'Vérifiée', not_started:'À commencer', uploaded:'Enregistré', scanning:'Contrôle en cours', available:'Disponible', rejected:'Rejeté', deleted:'Supprimé', declared:'Déclarée', documented:'Documentée', suspended:'Suspendu', revoked:'Révoqué' };
      const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
      const first = (value) => String(value || '').trim().split(/\s+/).map((part) => part[0]).join('').slice(0,2).toUpperCase() || 'TF';
      const status = (value) => `<span class="status status-${esc(value)}">${esc(labels[value] || value || '—')}</span>`;
      const pct = (value) => Math.max(0, Math.min(100, Number(value || 0)));
      const date = (value) => value ? new Intl.DateTimeFormat('fr-FR', { dateStyle:'medium' }).format(new Date(value)) : '—';
      const moneyless = (value) => Number(value || 0).toLocaleString('fr-FR', { maximumFractionDigits:0 });
      function notify(message, isError = false) { state.toast = { message, isError }; render(); setTimeout(() => { state.toast = null; render(); }, 3500); }
      async function api(path, options = {}) { const headers = { 'Content-Type':'application/json', ...(options.headers || {}) }; if (!state.demo && state.selectedOrganizationId) headers['X-Tracefab-Organization-Id'] = state.selectedOrganizationId; if (!state.demo && state.clerk?.session) { const token = await state.clerk.session.getToken(); if (token) headers.Authorization = `Bearer ${token}`; } const response = await fetch(path, { ...options, headers }); const payload = await response.json().catch(() => ({})); if (!response.ok) throw new Error(payload.error || `request_failed_${response.status}`); return payload; }

      function demoData() {
        state.user = { id:'demo-user-1', fullName:'Rui Costa', email:'rui@nhan-textile.example' };
        state.memberships = [{ organization_id:'demo-supplier-org', role:'owner', organizations:{ id:'demo-supplier-org', type:'supplier', display_name:'Nhãn Textile', legal_name:'Nhãn Textile', country_code:'PT', status:'active' } }, { organization_id:'demo-supplier-org-2', role:'manager', organizations:{ id:'demo-supplier-org-2', type:'supplier', display_name:'Nhãn Atelier', legal_name:'Nhãn Atelier', country_code:'PT', status:'active' } }];
        state.organizations = state.memberships.map((membership) => ({ organizationId:membership.organization_id, role:membership.role, organization:membership.organizations, supplier:{ id:membership.organization_id === 'demo-supplier-org' ? 'demo-supplier-profile' : 'demo-supplier-profile-2', onboarding_status:'in_progress', profileCompletion:membership.organization_id === 'demo-supplier-org' ? '72' : '48' } }));
        state.selectedOrganizationId = state.selectedOrganizationId || 'demo-supplier-org';
        state.supplier = { id:state.selectedOrganizationId === 'demo-supplier-org' ? 'demo-supplier-profile' : 'demo-supplier-profile-2', organizationId:state.selectedOrganizationId };
        state.profile = { id:'demo-supplier-profile', organizationId:'demo-supplier-org', onboardingStatus:'in_progress', activityTypes:['spinning','cutting','sewing'], profileVersion:2, profileCompletion:'72', profileSummary:'Manufacture de vêtements en coton et lin pour marques européennes.', contactName:'Rui Costa', contactEmail:'rui@nhan-textile.example', contactPhone:'+351 210 000 000', employeeCountRange:'51-250', yearEstablished:2008, lastSubmittedAt:null };
        state.sites = [{ id:'demo-site-1', supplierId:'demo-supplier-profile', name:'Nhãn Porto', countryCode:'PT', address:'Rua da Indústria 10', city:'Porto', postalCode:'4000-000', activityTypes:['cutting','sewing'], isActive:true }];
        state.certifications = [{ id:'demo-certification-1', supplierId:'demo-supplier-profile', supplierSiteId:'demo-site-1', standardName:'GOTS', standardCode:'CU-12345', issuerName:'Control Union', certificateNumber:'CU-12345', issuedAt:'2025-01-15', expiresAt:'2027-01-14', status:'declared', documentId:null }];
        state.materials = [{ id:'demo-material-1', ownerOrganizationId:'demo-supplier-org', materialType:'fiber', name:'Coton biologique', composition:{}, originCountryCode:'PT' }];
        state.documents = [{ id:'demo-document-1', ownerOrganizationId:'demo-supplier-org', originalFilename:'gots-2025.pdf', contentType:'application/pdf', byteSize:24576, kind:'certificate', status:'available', visibility:'private', documentId:'demo-document-1', createdAt:new Date().toISOString(), availableAt:new Date().toISOString() }];
        state.dataPointDefinitions = { country_of_manufacture:{ dataType:'country', description:'Code pays ISO alpha-2.' }, annual_production_capacity:{ dataType:'number', description:'Capacité annuelle déclarée.' }, material_composition:{ dataType:'json', description:'Liste de matières et pourcentages.' } };
        state.dataPoints = [{ id:'demo-point-1', ownerOrganizationId:'demo-supplier-org', supplierId:'demo-supplier-profile', dataKey:'annual_production_capacity', value:125000, dataType:'number', status:'documented', sourceDocumentId:'demo-document-1', version:2, validFrom:'2026-01-01', validUntil:null }, { id:'demo-point-2', ownerOrganizationId:'demo-supplier-org', supplierSiteId:'demo-site-1', dataKey:'country_of_manufacture', value:'PT', dataType:'country', status:'declared', sourceDocumentId:null, version:1, validFrom:null, validUntil:null }];
        state.members = [{ id:'demo-member-1', organizationId:'demo-supplier-org', userId:'demo-user-1', role:'owner', status:'active', user:{ fullName:'Rui Costa', email:'rui@nhan-textile.example' } }, { id:'demo-member-2', organizationId:'demo-supplier-org', userId:'demo-user-2', role:'manager', status:'active', user:{ fullName:'Ana Silva', email:'ana@nhan-textile.example' } }];
        state.memberInvitations = [{ id:'demo-invitation-1', email:'production@nhan-textile.example', targetRole:'contributor', expiresAt:new Date(Date.now()+5*86400000).toISOString(), createdAt:new Date().toISOString() }];
        state.canManageMembers = true;
        state.quality = { score:{ completeness:'72', freshness:'80', documentationCoverage:'25', consistency:'90', missingFields:['active_site'], blockingIssues:[] }, issues:[{ id:'demo-quality-issue-1', severity:'warning', status:'open', ruleKey:'supplier_missing_evidence', message:'La couverture documentaire mérite encore une revue par l’équipe qualité.', detectedAt:new Date().toISOString() }] };
        state.requests = [
          { id:'demo-supplier-request-1', brandOrganizationId:'demo-brand-org', supplierOrganizationId:'demo-supplier-org', title:'Données produit — collection automne', questionnaireKey:'product-data-core', questionnaireVersion:'1.0', status:'in_progress', dueAt:new Date(Date.now()+5*86400000).toISOString(), completionPercentage:'40', lastActivityAt:new Date().toISOString(), items:[
            { id:'demo-item-1', label:'Product description', fieldKey:'product_description', dataType:'text', required:true, evidenceRequired:false, helpText:'Describe the product and its intended use.', validationRules:{ minLength:10, maxLength:2000 }, responses:[] },
            { id:'demo-item-2', label:'Country of manufacture', fieldKey:'country_of_manufacture', dataType:'country', required:true, evidenceRequired:false, helpText:'Use the ISO 3166-1 alpha-2 country code.', validationRules:{}, responses:[{ id:'demo-response-2', value:'PT', status:'declared', isCurrent:true, responseVersion:1 }] },
            { id:'demo-item-3', label:'Main material percentage', fieldKey:'main_material_percentage', dataType:'percentage', required:true, evidenceRequired:true, helpText:'Percentage by mass of the main material.', validationRules:{ min:0, max:100 }, responses:[] },
            { id:'demo-item-4', label:'Material composition', fieldKey:'material_composition', dataType:'json', required:true, evidenceRequired:true, helpText:'Provide an array of materials and their percentages.', validationRules:{ jsonShape:'material_composition' }, responses:[] },
          ] },
          { id:'demo-supplier-request-2', brandOrganizationId:'demo-brand-org-2', supplierOrganizationId:'demo-supplier-org', title:'Origine et composition — Ligne lin naturel', questionnaireKey:'product-data-core', questionnaireVersion:'1.0', status:'submitted', dueAt:new Date(Date.now()+2*86400000).toISOString(), completionPercentage:'100', lastActivityAt:new Date(Date.now()-86400000).toISOString(), items:[] },
        ];
      }
      async function sync() {
        state.loading = true; render();
        try {
          if (state.demo) { demoData(); state.loading = false; render(); return; }
          const me = await api('/api/me');
          state.user = me.user; state.memberships = me.memberships || [];
          const supplierMemberships = state.memberships.filter((membership) => membership.organizations?.type === 'supplier');
          const storedOrganizationId = localStorage.getItem('tracefab_supplier_organization_id');
          state.selectedOrganizationId = supplierMemberships.some((membership) => membership.organization_id === storedOrganizationId) ? storedOrganizationId : supplierMemberships[0]?.organization_id || null;
          if (!state.selectedOrganizationId) {
            state.view = 'selfOnboarding';
            state.loading = false;
            render();
            return;
          }
          const organizationPayload = await api(`/api/supplier/organizations?organizationId=${encodeURIComponent(state.selectedOrganizationId)}`);
          state.organizations = organizationPayload.organizations || [];
          const [profilePayload, requests] = await Promise.all([api('/api/supplier/profile'), api(`/api/data-requests?scope=supplier&organizationId=${encodeURIComponent(state.selectedOrganizationId)}`)]);
          state.supplier = profilePayload.supplier; state.profile = profilePayload.profile; state.requests = requests.requests || [];
          const optional = await Promise.allSettled([api('/api/supplier/sites'), api('/api/supplier/certifications'), api(`/api/materials?organizationId=${encodeURIComponent(state.selectedOrganizationId)}`), api('/api/supplier/documents'), api('/api/supplier/data-points'), api('/api/supplier/members'), api('/api/supplier/quality')]);
          state.sites = optional[0].status === 'fulfilled' ? optional[0].value.sites || [] : state.sites;
          state.certifications = optional[1].status === 'fulfilled' ? optional[1].value.certifications || [] : state.certifications;
          state.materials = optional[2].status === 'fulfilled' ? optional[2].value.materials || [] : state.materials;
          state.documents = optional[3].status === 'fulfilled' ? optional[3].value.documents || [] : state.documents;
          state.dataPoints = optional[4].status === 'fulfilled' ? optional[4].value.dataPoints || [] : state.dataPoints;
          state.dataPointDefinitions = optional[4].status === 'fulfilled' ? optional[4].value.definitions || state.dataPointDefinitions : state.dataPointDefinitions;
          state.members = optional[5].status === 'fulfilled' ? optional[5].value.members || [] : state.members;
          state.memberInvitations = optional[5].status === 'fulfilled' ? optional[5].value.invitations || [] : state.memberInvitations;
          state.canManageMembers = optional[5].status === 'fulfilled' ? Boolean(optional[5].value.canManage) : false;
          state.quality = optional[6].status === 'fulfilled' ? optional[6].value : state.quality;
          state.optionalErrors = optional.filter((result) => result.status === 'rejected').map((result) => result.reason?.message || 'optional_data_unavailable');
          state.loading = false; render();
        } catch (error) { state.loading = false; state.configError = error.message; render(); }
      }
      function viewLabel() { return ({ overview:'Vue d’ensemble', requests:'Demandes de données', profile:'Mon profil', sites:'Sites de production', certifications:'Certificats', materials:'Matériaux', documents:'Preuves', dataPoints:'Données structurées', members:'Équipe', quality:'Qualité', requestDetail:'Répondre à une demande', selfOnboarding:'Création d’entreprise fournisseur' })[state.view] || 'Vue d’ensemble'; }
      function currentOrg() { return state.organizations.find((entry) => entry.organizationId === state.selectedOrganizationId)?.organization || state.memberships.find((membership) => membership.organization_id === state.selectedOrganizationId)?.organizations; }
      function organizationSwitcher() { if (state.organizations.length < 2) return currentOrg() ? `<span class="meta">${esc(currentOrg().display_name || currentOrg().legal_name)}</span>` : ''; return `<label style="min-width:220px"><span class="meta">Organisation active</span><select class="select" id="organization-switcher">${state.organizations.map((entry) => `<option value="${esc(entry.organizationId)}" ${entry.organizationId === state.selectedOrganizationId ? 'selected' : ''}>${esc(entry.organization.display_name || entry.organization.legal_name)}</option>`).join('')}</select></label>`; }
      function openRequests() { return state.requests.filter((request) => !['approved','cancelled'].includes(request.status)); }
      function shell(content) {
        const userName = state.user?.fullName || state.user?.email || 'Utilisateur';

      }
      function navButton(view, icon, label) { return `<button class="${state.view === view ? 'active' : ''}" data-view="${view}"><span class="nav-icon">${icon}</span>${label}</button>`; }
      function render() {
        if (state.configError && !state.demo && !state.user) { app.innerHTML = `<div class="auth-screen"><div class="config-error"><div class="eyebrow">Tracefab Supplier Portal</div><h1>Connexion indisponible</h1><p>${esc(state.configError)}. Vérifiez Clerk et la configuration de l’API, ou ouvrez <code>?demo=1</code> pour parcourir l’interface.</p><button class="btn btn-secondary" data-action="retry">Réessayer</button></div></div>`; bind(); return; }
        if (state.loading) { app.innerHTML = `<div class="auth-screen"><div class="config-error"><div class="eyebrow">Tracefab</div><h1>Préparation de votre espace…</h1><p>Chargement du profil fournisseur et des demandes de données.</p></div></div>`; return; }
        if (!state.user && !state.demo) { renderAuth(); return; }
        if (state.view === 'selfOnboarding') { app.innerHTML = selfOnboardingView(); bind(); return; }
        const content = state.view === 'overview' ? overview() : state.view === 'requests' ? requestsView() : state.view === 'profile' ? profileView() : state.view === 'sites' ? sitesView() : state.view === 'certifications' ? certificationsView() : state.view === 'materials' ? materialsView() : state.view === 'documents' ? documentsView() : state.view === 'dataPoints' ? dataPointsView() : state.view === 'members' ? membersView() : state.view === 'quality' ? qualityView() : requestDetailView();
        app.innerHTML = shell(content); bind();
      }
      function renderAuth() { app.innerHTML = `<div class="auth-screen"><div class="auth-card"><div class="auth-copy"><div class="brand"><div class="brand-mark">tf</div><div class="brand-name">tracefab<small>supplier portal</small></div></div><h1>Vos données, votre rythme.</h1><p>Complétez votre profil, répondez aux demandes de vos marques clientes et gardez l’historique de vos réponses.</p><ul><li>Profil fournisseur maîtrisé</li><li>Demandes versionnées</li><li>Réponses déclarées et traçables</li></ul></div><div class="auth-box"><div class="eyebrow">Espace fournisseur</div><h2>Se connecter</h2><p>Accédez à votre espace Tracefab sécurisé.</p><div id="clerk-sign-in"></div></div></div></div>`; if (state.clerk) state.clerk.mountSignIn(document.getElementById('clerk-sign-in'), { appearance:{ elements:{ card:'shadow-none', rootBox:'w-full' } } }); }

      function selfOnboardingView() {
        const userName = state.user?.fullName || state.user?.email || '';
        return `<div class="auth-screen"><div class="config-error" style="max-width:680px;text-align:left"><div class="brand" style="margin-bottom:20px"><div class="brand-mark">tf</div><div class="brand-name">tracefab<small>supplier portal</small></div></div><div class="eyebrow">Bienvenue sur Tracefab</div><h1 style="font-size:26px;margin:8px 0 12px">Création de votre espace fournisseur</h1><p style="color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:22px">Aucune organisation fournisseur n’est encore associée à votre compte. Configurez votre entreprise pour commencer à déclarer vos capacités, vos sites et répondre aux demandes de vos marques partenaires.</p><form id="self-onboarding-form"><div class="form-grid"><label class="field-full">Raison sociale / Nom légal *<input class="input" name="legalName" required placeholder="ex. Nhãn Textile Lda ou Tissages du Nord SAS"></label><label>Nom commercial usuel (facultatif)<input class="input" name="displayName" placeholder="ex. Nhãn Textile"></label><label>Pays du siège social (code ISO-2) *<input class="input" name="countryCode" required maxlength="2" placeholder="PT" style="text-transform:uppercase"></label><label>Nom du contact principal<input class="input" name="contactName" value="${esc(userName)}" placeholder="Nom et prénom"></label><label>Téléphone professionnel<input class="input" name="contactPhone" placeholder="+351 253 000 000"></label><label class="field-full">Activités textiles principales (séparées par une virgule)<input class="input" name="activityTypes" placeholder="spinning, weaving, dyeing, confection, packaging"></label><label class="field-full">Présentation de l’entreprise<textarea class="textarea" name="profileSummary" rows="3" placeholder="Présentez vos capacités industrielles, certifications et spécialités textiles…"></textarea></label></div><div class="form-actions" style="margin-top:20px"><button type="button" class="btn btn-secondary" data-action="signout">Se déconnecter</button><button class="btn btn-primary" type="submit">Créer mon espace fournisseur</button></div></form></div></div>`;
      }

      function overview() {
        const dueSoon = openRequests().filter((request) => request.dueAt && new Date(request.dueAt).getTime() - Date.now() < 7*86400000);
        return `<div class="page-head"><div><div class="eyebrow">Espace fournisseur</div><h1>Bonjour ${esc((state.user?.fullName || 'équipe').split(' ')[0])}.</h1><p>Retrouvez vos demandes actives et maintenez les informations partagées avec vos marques clientes.</p></div><div class="actions"><button class="btn btn-secondary" data-view="profile">Mettre à jour le profil</button><button class="btn btn-primary" data-view="requests">Voir les demandes</button></div></div><div class="grid kpis"><div class="card kpi"><div class="kpi-label">Profil fournisseur</div><div class="kpi-value">${moneyless(state.profile?.profileCompletion)}%</div><div class="kpi-note">${esc(labels[state.profile?.onboardingStatus] || state.profile?.onboardingStatus || '—')}</div></div><div class="card kpi"><div class="kpi-label">Demandes ouvertes</div><div class="kpi-value">${moneyless(openRequests().length)}</div><div class="kpi-note">hors demandes clôturées</div></div><div class="card kpi"><div class="kpi-label">Échéances proches</div><div class="kpi-value">${moneyless(dueSoon.length)}</div><div class="kpi-note">dans les 7 prochains jours</div></div><div class="card kpi"><div class="kpi-label">Réponses soumises</div><div class="kpi-value">${moneyless(state.requests.filter((request) => request.status === 'submitted').length)}</div><div class="kpi-note">en attente de revue marque</div></div></div><div class="grid split"><div class="card panel"><div class="panel-head"><h2>Demandes à traiter</h2><button class="btn btn-secondary btn-small" data-view="requests">Tout voir</button></div>${requestList(openRequests().slice(0,4))}</div><div class="card panel"><div class="panel-head"><h2>Profil</h2>${status(state.profile?.onboardingStatus)}</div><div class="progress-line" style="margin:18px 0 12px"><div class="progress" style="flex:1"><span style="width:${pct(state.profile?.profileCompletion)}%"></span></div><small>${moneyless(state.profile?.profileCompletion)}%</small></div><p style="font-size:13px">Un profil complet aide vos marques clientes à comprendre votre activité et vos capacités.</p><button class="btn btn-primary btn-small" data-view="profile">Ouvrir mon profil</button></div></div>`;
      }
      function requestList(items) {
        if (!items.length) return `<div class="empty"><div class="empty-icon">↗</div><strong>Aucune demande à traiter</strong><p>Les demandes envoyées par vos marques apparaîtront ici.</p></div>`;
        return `<div class="grid">${items.map((request) => `<div class="request-card clickable" data-request-id="${esc(request.id)}"><div class="request-card-head"><div><h3>${esc(request.title)}</h3><p>Questionnaire ${esc(request.questionnaireKey || '—')} · v${esc(request.questionnaireVersion || '—')}</p></div>${status(request.status)}</div><div class="progress-line"><div class="progress" style="flex:1"><span style="width:${pct(request.completionPercentage)}%"></span></div><small>${moneyless(request.completionPercentage)}%</small></div><div class="meta">Échéance : ${date(request.dueAt)}</div></div>`).join('')}</div>`;
      }
      function requestsView() { return `<div class="page-head"><div><div class="eyebrow">Collecte de données</div><h1>Demandes de données</h1><p>Répondez item par item, sauvegardez vos réponses versionnées puis soumettez la demande à la marque.</p></div></div><div class="card panel">${requestList(state.requests)}</div>`; }
      function profileView() {
        const p = state.profile || {};
        return `<div class="page-head"><div><button class="link-button" data-view="overview">← Retour à l’accueil</button><div class="eyebrow" style="margin-top:20px">Votre organisation</div><h1>Mon profil fournisseur</h1><p>Ces informations sont modifiables par votre organisation. Une modification après soumission peut remettre le profil en cours de complétion.</p></div><div class="actions"><button class="btn btn-secondary" data-action="submit-profile">Soumettre le profil</button></div></div><div class="grid split"><div class="card panel"><div class="panel-head"><h2>Informations principales</h2>${status(p.onboardingStatus)}</div><form id="profile-form"><div class="form-grid"><label class="field-full">Résumé de l’activité<textarea class="textarea" name="profileSummary" rows="5" maxlength="10000">${esc(p.profileSummary || '')}</textarea></label><label>Nom du contact<input class="input" name="contactName" value="${esc(p.contactName || '')}" maxlength="180"></label><label>Email du contact<input class="input" name="contactEmail" type="email" value="${esc(p.contactEmail || '')}" maxlength="320"></label><label>Téléphone<input class="input" name="contactPhone" value="${esc(p.contactPhone || '')}" maxlength="80"></label><label>Effectif<select class="select" name="employeeCountRange"><option value="">Non renseigné</option>${['1-10','11-50','51-250','251-1000','1000+'].map((value) => `<option value="${value}" ${p.employeeCountRange === value ? 'selected' : ''}>${value}</option>`).join('')}</select></label><label>Année de création<input class="input" name="yearEstablished" type="number" min="1800" max="${new Date().getFullYear()}" value="${esc(p.yearEstablished || '')}"></label><label class="field-full">Activités <span class="meta">séparées par des virgules</span><input class="input" name="activityTypes" value="${esc((p.activityTypes || []).join(', '))}" placeholder="spinning, cutting, sewing"></label></div><div class="form-actions"><button class="btn btn-primary" type="submit">Enregistrer les modifications</button></div></form></div><div class="card panel"><div class="panel-head"><h2>État du profil</h2><strong>${moneyless(p.profileCompletion)}%</strong></div><div class="progress" style="margin:12px 0 20px"><span style="width:${pct(p.profileCompletion)}%"></span></div><dl style="display:grid;gap:14px;margin:0"><div><dt class="meta">Version</dt><dd style="margin:4px 0;font-weight:750">${esc(p.profileVersion || '—')}</dd></div><div><dt class="meta">Dernière soumission</dt><dd style="margin:4px 0;font-weight:750">${date(p.lastSubmittedAt)}</dd></div><div><dt class="meta">Identifiant fournisseur</dt><dd style="margin:4px 0;font-weight:750;word-break:break-all">${esc(p.id || '—')}</dd></div></dl><div class="notice" style="margin-top:20px">Les preuves documentaires disposent d’un espace privé dédié. Ne joignez pas de secret ou de document sensible dans un champ texte ; utilisez l’onglet Preuves.</div></div></div>`;
      }
      function optionalDataNotice() { return state.optionalErrors.length ? `<div class="notice" style="margin-bottom:18px">Certaines données secondaires n’ont pas pu être chargées. Vous pouvez actualiser la page sans perdre les informations déjà enregistrées.</div>` : ''; }
      function sitesView() {
        return `<div class="page-head"><div><div class="eyebrow">Organisation fournisseur</div><h1>Sites de production</h1><p>Déclarez les sites actifs et leurs activités. Ces informations alimentent la complétude du profil, sans constituer une vérification.</p></div></div>${optionalDataNotice()}<div class="grid split"><div class="card panel"><div class="panel-head"><h2>${state.sites.length} site(s)</h2><span class="meta">Actifs et historiques</span></div>${state.sites.length ? `<div class="item-list">${state.sites.map((site) => `<form class="item site-edit-form" data-site-id="${esc(site.id)}"><div class="item-head"><div><h3>${esc(site.name)}</h3><p>${esc(site.city || 'Ville non renseignée')} · ${esc(site.countryCode)} · ${(site.activityTypes || []).map(esc).join(', ') || 'Activités non renseignées'}</p></div>${site.isActive ? '<span class="status status-approved">Actif</span>' : '<span class="status status-draft">Inactif</span>'}</div><div class="form-grid" style="margin-top:14px"><label>Nom<input class="input" name="name" value="${esc(site.name)}" required></label><label>Pays<input class="input" name="countryCode" maxlength="2" value="${esc(site.countryCode)}" required></label><label>Ville<input class="input" name="city" value="${esc(site.city || '')}"></label><label>Code postal<input class="input" name="postalCode" value="${esc(site.postalCode || '')}"></label><label class="field-full">Adresse<input class="input" name="address" value="${esc(site.address || '')}"></label><label class="field-full">Activités <span class="meta">séparées par des virgules</span><input class="input" name="activityTypes" value="${esc((site.activityTypes || []).join(', '))}"></label><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="isActive" ${site.isActive ? 'checked' : ''}> Site actif</label></div><div class="form-actions"><button class="btn btn-secondary btn-small" type="submit">Enregistrer le site</button></div></form>`).join('')}</div>` : '<div class="empty"><div class="empty-icon">▦</div><strong>Aucun site enregistré</strong><p>Ajoutez le premier site de production de votre organisation.</p></div>'}</div><div class="card panel"><div class="panel-head"><h2>Ajouter un site</h2></div><form id="site-form"><div class="form-grid"><label>Nom<input class="input" name="name" required placeholder="Nhãn Porto"></label><label>Pays<input class="input" name="countryCode" maxlength="2" required placeholder="PT"></label><label>Ville<input class="input" name="city" placeholder="Porto"></label><label>Code postal<input class="input" name="postalCode" placeholder="4000-000"></label><label class="field-full">Adresse<input class="input" name="address" placeholder="Rua da Indústria 10"></label><label class="field-full">Activités <span class="meta">séparées par des virgules</span><input class="input" name="activityTypes" placeholder="cutting, sewing"></label></div><div class="form-actions"><button class="btn btn-primary" type="submit">Ajouter le site</button></div></form><div class="notice" style="margin-top:20px">Les coordonnées GPS sont disponibles via l’API, mais l’interface minimaliste ne les exige pas.</div></div></div>`;
      }
      function certificationsView() {
        return `<div class="page-head"><div><div class="eyebrow">Déclarations fournisseur</div><h1>Certificats</h1><p>Déclarez vos standards et dates de validité. La présence d’un certificat ne signifie pas qu’il est vérifié.</p></div></div>${optionalDataNotice()}<div class="grid split"><div class="card panel"><div class="panel-head"><h2>${state.certifications.length} certificat(s)</h2><span class="meta">Statut de déclaration</span></div>${state.certifications.length ? `<div class="item-list">${state.certifications.map((certification) => `<form class="item certification-edit-form" data-certification-id="${esc(certification.id)}"><div class="item-head"><div><h3>${esc(certification.standardName)}</h3><p>${esc(certification.standardCode || 'Code non renseigné')} · ${esc(certification.issuerName || 'Émetteur non renseigné')}</p></div>${status(certification.status)}</div><div class="form-grid" style="margin-top:14px"><label>Standard<input class="input" name="standardName" value="${esc(certification.standardName)}" required></label><label>Code<input class="input" name="standardCode" value="${esc(certification.standardCode || '')}"></label><label>Émetteur<input class="input" name="issuerName" value="${esc(certification.issuerName || '')}"></label><label>Numéro<input class="input" name="certificateNumber" value="${esc(certification.certificateNumber || '')}"></label><label>Date d’émission<input class="input" name="issuedAt" type="date" value="${esc(String(certification.issuedAt || '').slice(0,10))}"></label><label>Date d’expiration<input class="input" name="expiresAt" type="date" value="${esc(String(certification.expiresAt || '').slice(0,10))}"></label><label class="field-full">Preuve privée<select class="select" name="documentId"><option value="">Aucune preuve</option>${state.documents.filter((document) => document.status === 'available').map((document) => `<option value="${esc(document.id)}" ${certification.documentId === document.id ? 'selected' : ''}>${esc(document.originalFilename)}</option>`).join('')}</select></label></div><div class="form-actions"><button class="btn btn-secondary btn-small" type="submit">Enregistrer le certificat</button></div></form>`).join('')}</div>` : '<div class="empty"><div class="empty-icon">✓</div><strong>Aucun certificat déclaré</strong><p>Déclarez vos standards et associez une preuve disponible lorsque cela est nécessaire.</p></div>'}</div><div class="card panel"><div class="panel-head"><h2>Déclarer un certificat</h2></div><form id="certification-form"><div class="form-grid"><label>Standard<input class="input" name="standardName" required placeholder="GOTS"></label><label>Site<select class="select" name="supplierSiteId"><option value="">Organisation entière</option>${state.sites.filter((site) => site.isActive).map((site) => `<option value="${esc(site.id)}">${esc(site.name)}</option>`).join('')}</select></label><label>Code<input class="input" name="standardCode" placeholder="CU-12345"></label><label>Émetteur<input class="input" name="issuerName" placeholder="Control Union"></label><label>Numéro<input class="input" name="certificateNumber"></label><label>Date d’émission<input class="input" name="issuedAt" type="date"></label><label>Date d’expiration<input class="input" name="expiresAt" type="date"></label><label class="field-full">Preuve privée<select class="select" name="documentId"><option value="">Aucune preuve</option>${state.documents.filter((document) => document.status === 'available').map((document) => `<option value="${esc(document.id)}">${esc(document.originalFilename)}</option>`).join('')}</select></label></div><div class="form-actions"><button class="btn btn-primary" type="submit">Déclarer le certificat</button></div></form><div class="notice" style="margin-top:20px">Les preuves disponibles sont contrôlées côté serveur avant association au certificat. Une déclaration reste distincte d’une vérification.</div></div></div>`;
      }
      function materialsView() {
        return `<div class="page-head"><div><div class="eyebrow">Catalogue fournisseur</div><h1>Matériaux</h1><p>Maintenez les matériaux dont votre organisation est propriétaire. Les matériaux partagés par une marque restent consultables selon les autorisations.</p></div></div>${optionalDataNotice()}<div class="grid split"><div class="card panel"><div class="panel-head"><h2>${state.materials.length} matériau(x)</h2></div>${state.materials.length ? `<div class="item-list">${state.materials.map((material) => `<form class="item material-edit-form" data-material-id="${esc(material.id)}"><div class="item-head"><div><h3>${esc(material.name)}</h3><p>${esc(material.materialType)} · ${esc(material.originCountryCode || 'Origine non renseignée')}</p></div><span class="meta">${esc(material.normalizedName || '')}</span></div><div class="form-grid" style="margin-top:14px"><label>Nom<input class="input" name="name" value="${esc(material.name)}" required></label><label>Type<input class="input" name="materialType" value="${esc(material.materialType)}" required></label><label>Origine<input class="input" name="originCountryCode" maxlength="2" value="${esc(material.originCountryCode || '')}"></label><label class="field-full">Composition JSON<textarea class="textarea" name="composition" rows="3">${esc(JSON.stringify(material.composition || {}, null, 2))}</textarea></label></div><div class="form-actions"><button class="btn btn-secondary btn-small" type="submit">Enregistrer le matériau</button></div></form>`).join('')}</div>` : '<div class="empty"><div class="empty-icon">◇</div><strong>Aucun matériau</strong><p>Ajoutez vos premiers matériaux déclarés.</p></div>'}</div><div class="card panel"><div class="panel-head"><h2>Ajouter un matériau</h2></div><form id="material-form"><div class="form-grid"><label>Nom<input class="input" name="name" required placeholder="Coton biologique"></label><label>Type<input class="input" name="materialType" required placeholder="fiber"></label><label>Origine<input class="input" name="originCountryCode" maxlength="2" placeholder="PT"></label><label class="field-full">Composition JSON<textarea class="textarea" name="composition" rows="4" placeholder="{}">{}</textarea></label></div><div class="form-actions"><button class="btn btn-primary" type="submit">Ajouter le matériau</button></div></form><div class="notice" style="margin-top:20px">Une déclaration de matériau est une donnée fournisseur. Elle n’est pas automatiquement vérifiée.</div></div></div>`;
      }
      function latestDataPoints() {
        const latest = new Map();
        state.dataPoints.forEach((point) => {
          const subject = point.supplierSiteId || point.supplierId || '';
          const key = `${subject}:${point.dataKey}`;
          if (!latest.has(key) || Number(point.version || 0) > Number(latest.get(key).version || 0)) latest.set(key, point);
        });
        return [...latest.values()];
      }
      function dataPointValue(point) { return point?.dataType === 'json' ? JSON.stringify(point.value ?? {}, null, 2) : String(point?.value ?? ''); }
      function dataPointSubjectOptions(selectedType = 'supplier', selectedId = '') { return `<option value="supplier" ${selectedType === 'supplier' ? 'selected' : ''}>Organisation fournisseur</option>${state.sites.filter((site) => site.isActive).map((site) => `<option value="site:${esc(site.id)}" ${selectedType === 'site' && selectedId === site.id ? 'selected' : ''}>Site · ${esc(site.name)}</option>`).join('')}`; }
      function documentOptions(selected = '') { return `<option value="">Aucune preuve</option>${state.documents.filter((document) => document.status === 'available').map((document) => `<option value="${esc(document.id)}" ${selected === document.id ? 'selected' : ''}>${esc(document.originalFilename)}</option>`).join('')}`; }
      function dataPointsView() {

 => document.status === 'available').map((document) => `<option value="${esc(document.id)}" ${current?.sourceDocumentId === document.id ? 'selected' : ''}>${esc(document.originalFilename)}</option>`).join('')}</select>` : ''}</label><div class="form-actions"><button class="btn btn-primary btn-small" type="submit" ${item.dataType === 'document' ? 'disabled' : ''}>Enregistrer la réponse</button></div></form></div>`; }).join('')}</div>` : '<div class="empty"><div class="empty-icon">↗</div><strong>Aucun item à afficher</strong><p>La demande n’est peut-être pas encore préparée par la marque.</p></div>'}</div><div class="card panel"><div class="panel-head"><h2>À propos de cette demande</h2></div><dl style="display:grid;gap:14px;margin:0"><div><dt class="meta">Questionnaire</dt><dd style="margin:4px 0;font-weight:750">${esc(request.questionnaireKey)} · v${esc(request.questionnaireVersion)}</dd></div><div><dt class="meta">Créée le</dt><dd style="margin:4px 0;font-weight:750">${date(request.createdAt)}</dd></div><div><dt class="meta">Dernière activité</dt><dd style="margin:4px 0;font-weight:750">${date(request.lastActivityAt)}</dd></div></dl><div class="notice" style="margin-top:20px">Une réponse déclarée n’est pas automatiquement vérifiée. La marque pourra la revoir et demander une correction.</div></div></div>`;

      function responseValue(form, dataType) {

        if (dataType === 'number' || dataType === 'percentage') { const value = Number(raw); if (!Number.isFinite(value)) throw new Error('response_value_type_invalid'); return value; }

        const data = Object.fromEntries(new FormData(form));
        const body = { supplierSiteId:data.supplierSiteId || null, documentId:data.documentId || null, standardName:data.standardName, standardCode:data.standardCode || null, issuerName:data.issuerName || null, certificateNumber:data.certificateNumber || null, issuedAt:data.issuedAt || null, expiresAt:data.expiresAt || null };
        const certificationId = form.dataset.certificationId;
        if (state.demo) {
          if (certificationId) { const certification = state.certifications.find((entry) => entry.id === certificationId); if (certification) Object.assign(certification, body); }
          else state.certifications.unshift({ id:`demo-certification-${Date.now()}`, supplierId:state.supplier?.id, status:'declared', documentId:null, ...body });
          notify(certificationId ? 'Certificat mis à jour en mode démonstration.' : 'Certificat déclaré en mode démonstration.'); render(); return;
        }
        await api(certificationId ? `/api/supplier/certifications/${encodeURIComponent(certificationId)}` : '/api/supplier/certifications', { method:certificationId ? 'PATCH' : 'POST', body:JSON.stringify(body) });
        await refreshOptionalData(); notify(certificationId ? 'Certificat mis à jour.' : 'Certificat déclaré.');
      }
      async function saveMaterial(form) {
        const data = Object.fromEntries(new FormData(form));
        const body = { ownerOrganizationId:state.profile.organizationId, materialType:data.materialType, name:data.name, originCountryCode:data.originCountryCode || null, composition:parseJsonField(data.composition) };
        const materialId = form.dataset.materialId;
        if (state.demo) {
          if (materialId) { const material = state.materials.find((entry) => entry.id === materialId); if (material) Object.assign(material, body); }
          else state.materials.unshift({ id:`demo-material-${Date.now()}`, ...body });
          notify(materialId ? 'Matériau mis à jour en mode démonstration.' : 'Matériau ajouté en mode démonstration.'); render(); return;
        }
        await api(materialId ? `/api/materials/${encodeURIComponent(materialId)}` : '/api/materials', { method:materialId ? 'PATCH' : 'POST', body:JSON.stringify(body) });
        await refreshOptionalData(); notify(materialId ? 'Matériau mis à jour.' : 'Matériau ajouté.');
      }
      async function refreshDocuments() {
        if (state.demo) return;
        const result = await api('/api/supplier/documents');
        state.documents = result.documents || [];
        render();
      }
      async function uploadDocument(form) {
        const data = Object.fromEntries(new FormData(form));
        const file = data.file;
        if (!(file instanceof File) || !file.size) throw new Error('document_file_required');
        if (file.size > 50 * 1024 * 1024) throw new Error('document_size_limit_exceeded');
        const body = { originalFilename:file.name, contentType:file.type, byteSize:file.size, kind:data.kind, expiresAt:data.expiresAt || null, metadata:{ source:'supplier-portal' } };
        if (state.demo) {
          state.documents.unshift({ id:`demo-document-${Date.now()}`, ownerOrganizationId:state.profile.organizationId, originalFilename:file.name, contentType:file.type, byteSize:file.size, kind:data.kind, status:'available', visibility:'private', createdAt:new Date().toISOString(), availableAt:new Date().toISOString() });
          notify('Preuve ajoutée en mode démonstration.'); render(); return;
        }
        const intent = await api('/api/supplier/documents/upload-intent', { method:'POST', body:JSON.stringify(body) });
        const upload = await fetch(intent.upload.url, { method:'PUT', headers:intent.upload.headers || {}, body:file });
        if (!upload.ok) throw new Error('private_storage_upload_failed');
        await api(intent.next.scan, { method:'POST', body:'{}' });
        await refreshDocuments();
        notify('Preuve téléversée, contrôlée et disponible.');
      }
      async function downloadDocument(id) {
        if (state.demo) { notify('Téléchargement temporaire simulé en mode démonstration.'); return; }
        const result = await api(`/api/supplier/documents/${encodeURIComponent(id)}/download`);
        window.open(result.download.url, '_blank', 'noopener,noreferrer');
      }

      function parseDataPointValue(raw, dataType) {
        if (raw === '') throw new Error('data_point_value_required');
        if (dataType === 'number' || dataType === 'percentage') { const value = Number(raw); if (!Number.isFinite(value)) throw new Error('invalid_data_point_value'); return value; }
        if (dataType === 'boolean') return raw === 'true';
        if (dataType === 'json') { try { return JSON.parse(raw); } catch { throw new Error('invalid_data_point_value'); } }
        return dataType === 'country' ? raw.toUpperCase() : raw;
      }
      async function saveDataPoint(form) {
        const data = Object.fromEntries(new FormData(form));
        const subject = data.subject ? String(data.subject).split(':') : [data.subjectType || 'supplier', data.subjectId || ''];
        const body = { dataKey:data.dataKey, dataType:data.dataType, value:parseDataPointValue(String(data.value || ''), data.dataType), subjectType:subject[0], subjectId:subject[1] || null, sourceDocumentId:data.sourceDocumentId || null, validFrom:data.validFrom || null, validUntil:data.validUntil || null };
        const id = form.dataset.dataPointId;
        if (state.demo) {
          const point = { id:`demo-point-${Date.now()}`, ownerOrganizationId:state.selectedOrganizationId, supplierId:body.subjectType === 'supplier' ? state.supplier?.id : null, supplierSiteId:body.subjectType === 'site' ? body.subjectId : null, dataKey:body.dataKey, value:body.value, dataType:body.dataType, status:body.sourceDocumentId ? 'documented' : 'declared', sourceDocumentId:body.sourceDocumentId, version:id ? Number(state.dataPoints.find((entry) => entry.id === id)?.version || 1) + 1 : 1, validFrom:body.validFrom, validUntil:body.validUntil }; if (id) point.supersedesId = id; state.dataPoints.unshift(point); notify(id ? 'Nouvelle version créée en mode démonstration.' : 'Donnée enregistrée en mode démonstration.'); render(); return;
        }
        await api(id ? `/api/supplier/data-points/${encodeURIComponent(id)}` : '/api/supplier/data-points', { method:id ? 'PATCH' : 'POST', body:JSON.stringify(body) });
        await refreshOptionalData(); notify(id ? 'Nouvelle version créée.' : 'Donnée enregistrée.');
      }
      async function refreshTeam() {
        if (state.demo) return;
        const result = await api('/api/supplier/members'); state.members = result.members || []; state.memberInvitations = result.invitations || []; state.canManageMembers = Boolean(result.canManage); render();
      }
      async function saveMemberInvite(form) {
        const data = Object.fromEntries(new FormData(form));
        if (state.demo) { state.memberInvitations.unshift({ id:`demo-invitation-${Date.now()}`, email:data.email, targetRole:data.targetRole, expiresAt:new Date(Date.now()+7*86400000).toISOString(), createdAt:new Date().toISOString() }); notify('Invitation créée en mode démonstration.'); render(); return; }
        const result = await api('/api/supplier/members', { method:'POST', body:JSON.stringify({ email:data.email, targetRole:data.targetRole }) });
        await refreshTeam(); notify(result.invitationToken ? `Invitation créée. Token à transmettre une seule fois : ${result.invitationToken}` : 'Invitation envoyée.');
      }
      async function saveMember(form) {
        const data = Object.fromEntries(new FormData(form));
        if (state.demo) { const member = state.members.find((entry) => entry.id === form.dataset.membershipId); if (member) Object.assign(member, { role:data.role, status:data.status }); notify('Accès membre mis à jour en mode démonstration.'); render(); return; }
        await api('/api/supplier/members', { method:'PATCH', body:JSON.stringify({ membershipId:form.dataset.membershipId, role:data.role, status:data.status }) }); await refreshTeam(); notify('Accès membre mis à jour.');
      }
      async function manageInvitation(invitationId, action) {
        if (state.demo) {
          if (action === 'revoke') state.memberInvitations = state.memberInvitations.filter((invitation) => invitation.id !== invitationId);
          else { const invitation = state.memberInvitations.find((entry) => entry.id === invitationId); if (invitation) invitation.expiresAt = new Date(Date.now() + 7 * 86400000).toISOString(); }
          notify(action === 'revoke' ? 'Invitation révoquée en mode démonstration.' : 'Invitation renvoyée en mode démonstration.'); render(); return;
        }
        const result = await api(`/api/supplier/member-invitations/${encodeURIComponent(invitationId)}`, { method: action === 'revoke' ? 'DELETE' : 'POST' });
        await refreshTeam();
        notify(action === 'revoke' ? 'Invitation révoquée.' : result.invitationToken ? `Invitation renvoyée. Token à transmettre une seule fois : ${result.invitationToken}` : 'Invitation renvoyée.');
      }
      async function switchOrganization(organizationId) {
        if (!organizationId || organizationId === state.selectedOrganizationId) return;
        state.selectedOrganizationId = organizationId;
        if (!state.demo) localStorage.setItem('tracefab_supplier_organization_id', organizationId);
        if (state.demo) { demoData(); render(); return; }
        await sync();
      }

      async function computeQuality() {
        if (state.demo) { state.quality.score.computedAt = new Date().toISOString(); notify('Score qualité recalculé en mode démonstration.'); render(); return; }
        state.quality = await api('/api/supplier/quality', { method:'POST', body:JSON.stringify({ calculationVersion:'supplier_quality_v1' }) }); notify('Score qualité recalculé.'); render();
      }

      function bind() {
        document.querySelectorAll('[data-view]').forEach((element) => element.addEventListener('click', () => { state.view = element.dataset.view; if (state.view !== 'requestDetail') state.selectedRequest = null; render(); }));
        document.getElementById('organization-switcher')?.addEventListener('change', (event) => switchOrganization(event.currentTarget.value).catch((error) => notify(error.message, true)));
        document.querySelectorAll('[data-action]').forEach((element) => element.addEventListener('click', async () => { try { const action = element.dataset.action; if (action === 'retry') { state.configError = null; boot(); } if (action === 'signout' && state.clerk) await state.clerk.signOut(); if (action === 'refresh-request') await refreshRequest(); if (action === 'submit-request') await submitRequest(); if (action === 'submit-profile') await submitProfile(); if (action === 'compute-quality') await computeQuality(); } catch (error) { notify(error.message, true); } }));
        document.querySelectorAll('[data-request-id]').forEach((element) => element.addEventListener('click', () => openRequest(element.dataset.requestId).catch((error) => notify(error.message, true))));
        document.querySelectorAll('.response-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveResponse(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('profile-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveProfile(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.getElementById('site-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveSite(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('.site-edit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveSite(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('certification-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveCertification(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('.certification-edit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveCertification(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('material-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveMaterial(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('.material-edit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveMaterial(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('data-point-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveDataPoint(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('.data-point-edit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveDataPoint(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('member-invite-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveMemberInvite(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('.member-edit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveMember(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.querySelectorAll('[data-invitation-action]').forEach((element) => element.addEventListener('click', () => manageInvitation(element.dataset.invitationId, element.dataset.invitationAction).catch((error) => notify(error.message, true))));
        document.getElementById('self-onboarding-form')?.addEventListener('submit', (event) => { event.preventDefault(); submitSelfOnboarding(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.getElementById('document-form')?.addEventListener('submit', (event) => { event.preventDefault(); uploadDocument(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('[data-document-id]').forEach((element) => element.addEventListener('click', () => downloadDocument(element.dataset.documentId).catch((error) => notify(error.message, true))));
      }
      async function boot() {
        if (state.demo) { await sync(); return; }
        try { const config = await fetch('/api/config').then((response) => response.json()); if (!config.publishableKey) throw new Error(config.error || 'clerk_not_configured'); const clerkDomain = atob(config.publishableKey.split('_')[2]).slice(0, -1); await new Promise((resolve, reject) => { const script = document.createElement('script'); script.src = `https://${clerkDomain}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`; script.async = true; script.crossOrigin = 'anonymous'; script.setAttribute('data-clerk-publishable-key', config.publishableKey); script.onload = resolve; script.onerror = () => reject(new Error('clerk_sdk_unavailable')); document.head.appendChild(script); }); state.clerk = window.Clerk; if (!state.clerk) throw new Error('clerk_sdk_unavailable'); await state.clerk.load(); state.clerk.addListener(() => { if (state.clerk.user && !state.user) sync(); }); if (state.clerk.user) await sync(); else { state.loading = false; render(); } } catch (error) { state.loading = false; state.configError = error.message; render(); }
      }
      window.tracefabSupplierPortal = { state, sync };
      boot();
    })();
  </script>
</body>
</html>
