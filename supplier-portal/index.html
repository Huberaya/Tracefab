  <style>
    :root {

      --ink: var(--tf-charcoal-800); --muted: var(--tf-trust-declared-ink);
      --paper: var(--tf-surface-light); --panel: var(--tf-surface-light-raised);
      --green: var(--tf-trust-verified-ink); --green-dark: var(--tf-emerald-ink);

      --line:#e2e8df; --green-soft:#e4f3ec; --yellow:#d79621; --yellow-soft:#fff3d8;
      --red:#b04b49; --red-soft:#ffebea;
      --shadow:0 16px 45px rgba(20,42,34,.08); --radius:18px;
    }

      font-family: var(--tf-font-text); color: var(--ink); }
    p { margin: 1em 0; } button,input,select,textarea { font:inherit; } button { cursor:pointer; }
    .app { display:grid; grid-template-columns:256px minmax(0,1fr); min-height:100vh; } .sidebar { background:#112b23; color:#eff8f2; padding:25px 16px; display:flex; flex-direction:column; }
    .brand { display:flex; align-items:center; gap:11px; padding:0 11px 31px; } .brand-mark { width:36px; height:36px; border-radius:12px; background:#d7f3e4; color:var(--green-dark); display:grid; place-items:center; font-weight:900; letter-spacing:-.08em; } .brand-name { font-weight:780; letter-spacing:-.03em; font-size:18px; } .brand-name small { display:block; color:#a9c4b6; font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin-top:2px; }
    .nav { display:grid; gap:6px; } .nav button { appearance:none; border:0; color:#b8cec2; background:transparent; border-radius:12px; display:flex; align-items:center; gap:12px; padding:12px 13px; text-align:left; font-size:13px; font-weight:650; } .nav button:hover,.nav button.active { background:rgba(255,255,255,.1); color:white; } .nav-icon { width:19px; text-align:center; opacity:.9; }
    .sidebar-bottom { margin-top:auto; border-top:1px solid rgba(255,255,255,.12); padding:18px 10px 2px; } .user-mini { display:flex; gap:10px; align-items:center; color:#c5d8cd; font-size:12px; min-width:0; } .avatar { flex:0 0 auto; width:32px; height:32px; border-radius:50%; background:#9edec0; color:#124936; display:grid; place-items:center; font-weight:800; font-size:12px; } .user-mini strong,.user-mini span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .user-mini strong { color:white; } .user-mini span { max-width:160px; }
    .link-button { border:0; background:transparent; color:inherit; padding:0; font-size:12px; text-decoration:underline; opacity:.85; } .main { min-width:0; } .topbar { min-height:76px; padding:0 40px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.7); display:flex; align-items:center; justify-content:space-between; gap:20px; } .crumb { color:var(--muted); font-size:13px; font-weight:650; } .crumb strong { color:var(--ink); } .top-actions { display:flex; align-items:center; gap:12px; }

    .panel { padding:23px; } .panel-head { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:18px; } .table-wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; min-width:650px; } th { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.1em; text-align:left; padding:0 12px 12px; font-weight:800; } td { border-top:1px solid #edf0eb; padding:14px 12px; font-size:13px; vertical-align:middle; } td:first-child,th:first-child { padding-left:0; } td:last-child,th:last-child { padding-right:0; text-align:right; } .clickable { cursor:pointer; } .clickable:hover td { background:#fbfcfa; }

    .progress { height:7px; background:#e9eee9; border-radius:99px; overflow:hidden; min-width:82px; } .progress>span { display:block; height:100%; background:var(--green); border-radius:inherit; } .progress-line { display:flex; align-items:center; gap:9px; } .progress-line small { color:var(--muted); font-weight:700; min-width:32px; }
    .empty { padding:44px 20px; text-align:center; color:var(--muted); } .empty-icon { width:44px; height:44px; display:grid; place-items:center; margin:0 auto 13px; border-radius:14px; background:var(--green-soft); color:var(--green); font-size:20px; } .meta { color:var(--muted); font-size:12px; } .notice { padding:13px 15px; border-radius:12px; background:var(--yellow-soft); color:#795719; font-size:12px; line-height:1.5; } .success-note { padding:13px 15px; border-radius:12px; background:var(--green-soft); color:var(--green-dark); font-size:12px; line-height:1.5; }
    .input,.select,.textarea { width:100%; border:1px solid #d8e1d8; border-radius:10px; padding:11px 12px; background:white; color:var(--ink); outline:none; } .input:focus,.select:focus,.textarea:focus { border-color:#58a887; box-shadow:0 0 0 3px rgba(88,168,135,.13); } label { display:grid; gap:7px; color:#53625a; font-size:12px; font-weight:750; } .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; } .field-full { grid-column:1/-1; } .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:21px; }
    .request-card { padding:18px; border:1px solid var(--line); border-radius:14px; display:grid; gap:13px; } .request-card+.request-card { margin-top:11px; } .request-card-head { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; } .request-card h3 { font-size:15px; } .request-card p { margin:5px 0 0; font-size:12px; } .detail-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
    .item-list { display:grid; gap:13px; } .invitation-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid rgba(121,87,25,.18); font-size:12px; } .invitation-row:first-child { border-top:0; } .item { padding:17px; border:1px solid var(--line); border-radius:14px; } .item-head { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; } .item h3 { font-size:14px; } .item p { margin:5px 0 0; font-size:12px; } .response-box { margin-top:14px; padding:13px; background:#f8faf7; border-radius:12px; } .response-box .form-actions { margin-top:13px; } .response-state { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:7px; }
    .toast { position:fixed; right:25px; bottom:25px; z-index:50; color:white; background:#19372d; border-radius:12px; padding:13px 16px; box-shadow:0 12px 35px rgba(0,0,0,.2); font-size:13px; max-width:360px; } .toast.error { background:#8e3d3b; } .auth-screen { min-height:100vh; display:grid; place-items:center; padding:25px; background:radial-gradient(circle at 10% 0%,#d9f1e4,transparent 32%),var(--paper); } .auth-card { width:min(950px,100%); display:grid; grid-template-columns:1fr 1fr; overflow:hidden; border-radius:24px; background:white; box-shadow:var(--shadow); border:1px solid var(--line); } .auth-copy { padding:52px; background:#112b23; color:white; } .auth-copy h1 { font-size:38px; margin-top:75px; } .auth-copy p { color:#bdd2c7; max-width:370px; } .auth-copy ul { color:#d7e9df; padding-left:19px; line-height:2; font-size:13px; } .auth-box { padding:38px; min-height:480px; } .config-error { max-width:600px; background:white; padding:35px; border-radius:20px; box-shadow:var(--shadow); } .demo-banner { background:var(--yellow-soft); border-bottom:1px solid #f2ddb0; padding:8px 15px; text-align:center; font-size:11px; color:#8f6417; font-weight:750; }

    /* Evidence Vault, Reusability & NDA Enhancements (Chantier 3) */
    .vault-hero {
      background: linear-gradient(135deg, #0d251d 0%, #163e31 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 25px rgba(11,118,86,0.15);
    }
    .vault-stats {
      display: flex;
      gap: 24px;
    }
    .vault-stat-item strong {
      display: block;
      font-size: 22px;
      font-weight: 800;
      color: #34d399;
    }
    .vault-stat-item span {
      font-size: 11px;
      color: #a3bfb2;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .nda-shield-box {
      background: #ffffff;
      border: 1px solid #d0ded4;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(13,37,29,0.04);
    }
    .nda-shield-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #e4f3ec;
      color: #0b7656;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .client-coverage-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 700;
      margin-top: 4px;
    }
    .lang-switcher-select {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
    }

  
    /* ==========================================================================
       SUPPLIER PORTAL — REUSABLE DATA VAULT & ONE-TO-MANY SHIELD (Phase 6)
       "Your data. Your profile. Reusable across your customers."
       ========================================================================== */
    .sp-hero-card {
      background: linear-gradient(135deg, #102a20 0%, #163a2d 60%, #1d4d3c 100%);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      padding: 30px 34px;
      color: #ffffff;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }

    .sp-hero-card::after {
      content: "";
      position: absolute;
      top: -40%;
      right: -10%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(37, 211, 146, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .sp-hero-tag {
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      color: #34d399;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sp-hero-h1 {
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      line-height: 1.15;
    }

    .sp-hero-sub {
      font-size: 14px;
      color: #b5d5c5;
      max-width: 640px;
      line-height: 1.55;
    }

    /* Supplier Profile 82% Completion Bar */
    .sp-progress-panel {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 22px 26px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .sp-progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .sp-progress-title {
      font-size: 15px;
      font-weight: 800;
      color: #17231f;
    }

    .sp-progress-pct {
      font-family: var(--font-mono, monospace);
      font-size: 20px;
      font-weight: 850;
      color: #0b7656;
    }

    .sp-bar-outer {
      height: 10px;
      background: #edf2ee;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .sp-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #0b7656, #10b981);
      border-radius: 9999px;
      transition: width 0.4s ease;
    }

    .sp-checklist-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .sp-check-pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sp-pill-done { background: #eaf5ef; color: #0b7656; }
    .sp-pill-pending { background: #fef3c7; color: #b45309; }

    /* Reusable Vault & Actions Grid */
    .sp-progress-lead {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.45;
    }
    .sp-progress-missing {
      font-size: 11.5px;
      color: #b45309;
      margin-top: 4px;
    }
    /* La pastille est un bouton : elle mene a la vue qui corrige la
       dimension. Reset de l'apparence native, le visuel reste celui des
       anciennes pastilles. */
    .sp-check-pill {
      border: 0;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
    }
    .sp-check-pill:hover { filter: brightness(0.96); }
    .sp-check-pill:focus-visible { outline: 2px solid #0b7656; outline-offset: 2px; }
    .sp-focus-btn {
      margin-top: 14px;
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 13px 18px;
      background: #0b7656;
      color: #fff;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 750;
      cursor: pointer;
    }
    .sp-focus-btn:hover { background: #0a6349; }
    .sp-focus-btn:focus-visible { outline: 2px solid #17231f; outline-offset: 2px; }
    .sp-progress-pct span {
      display: block;
      font-size: 10.5px;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: right;
    }
    .sp-actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .sp-action-card {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .sp-action-card:hover {
      border-color: #0b7656;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(11, 118, 86, 0.08);
    }

    .sp-card-icon {
      font-size: 20px;
      margin-bottom: 10px;
      color: #0b7656;
    }

    .sp-card-title {
      font-size: 14px;
      font-weight: 800;
      color: #17231f;
      margin-bottom: 4px;
    }

    .sp-card-desc {
      font-size: 12px;
      color: #66736a;
      line-height: 1.4;
    }

    /* Chantier 5 — en 390x844, les 14 elements cliquables au-dessus de la
       ligne de flottaison etaient tous de la navigation. Le fournisseur doit
       savoir immediatement quoi faire ; il ne voyait que des onglets, deux
       listes deroulantes de reglage et une accroche. On degraisse le chrome
       et on comprime l'accroche pour faire remonter le panneau d'action. */
    @media (max-width: 760px) {
      /* le fil d'ariane repete l'onglet actif, deja visible dans la nav */
      .topbar .crumb, .topbar .breadcrumb { display: none; }
      .topbar { min-height: 0; padding: 10px 18px; gap: 10px; flex-wrap: wrap; }
      .topbar select { font-size: 12px; padding: 6px 8px; }
      .topbar label, .topbar .field-label { font-size: 10px; }
      .content { padding: 16px 18px 50px; }

      .sp-hero-card { padding: 18px 20px; border-radius: 16px; margin-bottom: 16px; }
      .sp-hero-tag { font-size: 9.5px; letter-spacing: .08em; margin-bottom: 8px; }
      .sp-hero-h1 { font-size: 20px; line-height: 1.2; }
      /* La promesse tient dans le titre. Le paragraphe l'explicite : utile
         sur grand ecran, il coute 150px au-dessus de la ligne sur mobile et
         repousse la seule chose actionnable hors de l'ecran. */
      .sp-hero-sub { display: none; }

      .sp-progress-panel { padding: 16px 18px; border-radius: 15px; }
      .sp-progress-head { gap: 12px; align-items: flex-start; }
      .sp-progress-pct { font-size: 17px; white-space: nowrap; }
      .sp-checklist-row { gap: 8px; }
      .sp-check-pill { font-size: 11px; padding: 5px 10px; }

      /* langue et organisation tiennent sur une seule ligne : ce sont deux
         reglages poses une fois, ils n'ont pas a couter deux lignes au-dessus
         de la ligne de flottaison. */
      .top-actions { width: 100%; gap: 8px; }
      .top-actions > * { flex: 1 1 0; min-width: 0; }
      .top-actions label { min-width: 0 !important; }
      .top-actions select { width: 100%; }
      .top-actions label .meta { display: none; }
    }

  </style>
