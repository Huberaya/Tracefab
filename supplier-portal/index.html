    /* Evidence Vault, Reusability & NDA Enhancements (Chantier 3) */
    .vault-hero {
      background: linear-gradient(135deg, #0d251d 0%, #163e31 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 25px rgba(11,118,86,0.15);
    }
    .vault-stats {
      display: flex;
      gap: 24px;
    }
    .vault-stat-item strong {
      display: block;
      font-size: 22px;
      font-weight: 800;
      color: #34d399;
    }
    .vault-stat-item span {
      font-size: 11px;
      color: #a3bfb2;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .nda-shield-box {
      background: #ffffff;
      border: 1px solid #d0ded4;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(13,37,29,0.04);
    }
    .nda-shield-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #e4f3ec;
      color: #0b7656;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .client-coverage-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 700;
      margin-top: 4px;
    }
    .lang-switcher-select {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
    }

  
    /* ==========================================================================
       SUPPLIER PORTAL — REUSABLE DATA VAULT & ONE-TO-MANY SHIELD (Phase 6)
       "Your data. Your profile. Reusable across your customers."
       ========================================================================== */
    .sp-hero-card {
      background: linear-gradient(135deg, #102a20 0%, #163a2d 60%, #1d4d3c 100%);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      padding: 30px 34px;
      color: #ffffff;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }

    .sp-hero-card::after {
      content: "";
      position: absolute;
      top: -40%;
      right: -10%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(37, 211, 146, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .sp-hero-tag {
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      color: #34d399;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sp-hero-h1 {
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      line-height: 1.15;
    }

    .sp-hero-sub {
      font-size: 14px;
      color: #b5d5c5;
      max-width: 640px;
      line-height: 1.55;
    }

    /* Supplier Profile 82% Completion Bar */
    .sp-progress-panel {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 22px 26px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .sp-progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .sp-progress-title {
      font-size: 15px;
      font-weight: 800;
      color: #17231f;
    }

    .sp-progress-pct {
      font-family: var(--font-mono, monospace);
      font-size: 20px;
      font-weight: 850;
      color: #0b7656;
    }

    .sp-bar-outer {
      height: 10px;
      background: #edf2ee;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .sp-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #0b7656, #10b981);
      border-radius: 9999px;
      transition: width 0.4s ease;
    }

    .sp-checklist-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .sp-check-pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sp-pill-done { background: #eaf5ef; color: #0b7656; }
    .sp-pill-pending { background: #fef3c7; color: #b45309; }

    /* Reusable Vault & Actions Grid */
    .sp-actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .sp-action-card {
      background: #ffffff;
      border: 1px solid #e1e8e2;
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .sp-action-card:hover {
      border-color: #0b7656;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(11, 118, 86, 0.08);
    }

    .sp-card-icon {
      font-size: 20px;
      margin-bottom: 10px;
      color: #0b7656;
    }

    .sp-card-title {
      font-size: 14px;
      font-weight: 800;
      color: #17231f;
      margin-bottom: 4px;
    }

    .sp-card-desc {
      font-size: 12px;
      color: #66736a;
      line-height: 1.4;
    }

  </style>

></div><form id="document-form"><div class="form-grid"><label class="field-full">Fichier<input class="input" name="file" type="file" accept="application/pdf,image/png,image/jpeg,text/plain" required></label><label>Type de preuve<select class="select" name="kind"><option value="certificate">Certificat</option><option value="technical_spec">Spécification technique</option><option value="origin_proof">Preuve d’origine</option><option value="audit_report">Rapport d’audit</option><option value="invoice">Facture</option><option value="other">Autre</option></select></label><label>Expiration<input class="input" name="expiresAt" type="date"></label></div><div class="form-actions"><button class="btn btn-primary" type="submit">Téléverser et contrôler</button></div></form><div class="notice" style="margin-top:20px">Le navigateur ne marque jamais un fichier comme sûr. Le serveur vérifie l’objet privé et le scanner antivirus avant de le rendre disponible.</div></div></div>`;

      function previewBomCsv() {
        const csv = document.getElementById('bom-csv-input')?.value || '';
        const preview = document.getElementById('bom-preview-area');
        if (!preview) return;

        const lines = csv.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length < 2) {
          preview.style.display = 'block';
          preview.innerHTML = '<div style="color:var(--red);font-size:12px;">Erreur : Le tableau doit contenir au moins une ligne d’en-tête et une matière.</div>';
          return;
        }

        const delimiter = lines[0].includes(';') ? ';' : lines[0].includes('\t') ? '\t' : ',';
        let totalPct = 0;
        let count = 0;

        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(delimiter);
          if (cols.length > 1) {
            const raw = (cols[1] || '').replace(/%/g, '').replace(/,/g, '.').trim();
            const val = parseFloat(raw);
            if (!isNaN(val)) totalPct += val;
            count++;
          }
        }

        totalPct = Number(totalPct.toFixed(2));
        const isExact = Math.abs(totalPct - 100) <= 0.5;

        preview.style.display = 'block';
        preview.innerHTML = `
          <div style="background:#f8faf8;border:1px solid ${isExact ? 'var(--green)' : 'var(--red)'};border-radius:10px;padding:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <strong>Somme de composition calculée : ${totalPct}%</strong>
              <span class="status status-${isExact ? 'approved' : 'rejected'}">${isExact ? '✓ Conforme ESPR (100%)' : '⚠ Non conforme (doit sommer à 100%)'}</span>
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px;">${count} ligne(s) détectée(s) avec séparateur [${delimiter}].</div>
          </div>
        `;
      }

      window.handleBomImportSubmit = handleBomImportSubmit;
      window.previewBomCsv = previewBomCsv;

        document.querySelectorAll('[data-action]').forEach((element) => element.addEventListener('click', async () => { try { const action = element.dataset.action; if (action === 'retry') { state.configError = null; boot(); } if (action === 'open-bom-import') { state.modal = 'import-bom'; render(); return; } if (action === 'close-modal') { state.modal = null; render(); return; } if (action === 'signout' && state.clerk) await state.clerk.signOut(); if (action === 'refresh-request') await refreshRequest(); if (action === 'submit-request') await submitRequest(); if (action === 'submit-profile') await submitProfile(); if (action === 'compute-quality') await computeQuality(); if (action === 'review-passport-request') { notify('Demande de passeport revue en mode démonstration.'); } } catch (error) { notify(error.message, true); } }));
        document.querySelectorAll('[data-request-id]').forEach((element) => element.addEventListener('click', () => openRequest(element.dataset.requestId).catch((error) => notify(error.message, true))));
        document.querySelectorAll('.response-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveResponse(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('profile-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveProfile(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.getElementById('site-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveSite(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('.site-edit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveSite(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('certification-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveCertification(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.getElementById('certification-standard-catalog')?.addEventListener('change', (event) => { const option = event.currentTarget.selectedOptions[0]; const name = document.getElementById('certification-standard-name'); const issuer = document.getElementById('certification-standard-issuer'); if (option?.dataset.standardName && name) name.value = option.dataset.standardName; if (option?.dataset.standardIssuer && issuer && !issuer.value) issuer.value = option.dataset.standardIssuer; });
        document.querySelectorAll('.certification-edit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveCertification(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('material-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveMaterial(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('.material-edit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveMaterial(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.querySelectorAll('.schema-material-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); attachMaterialSchema(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('data-point-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveDataPoint(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('.data-point-edit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveDataPoint(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('member-invite-form')?.addEventListener('submit', (event) => { event.preventDefault(); saveMemberInvite(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('.member-edit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); saveMember(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.querySelectorAll('[data-invitation-action]').forEach((element) => element.addEventListener('click', () => manageInvitation(element.dataset.invitationId, element.dataset.invitationAction).catch((error) => notify(error.message, true))));
        document.getElementById('self-onboarding-form')?.addEventListener('submit', (event) => { event.preventDefault(); submitSelfOnboarding(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.getElementById('document-form')?.addEventListener('submit', (event) => { event.preventDefault(); uploadDocument(event.currentTarget).catch((error) => notify(error.message, true)); });
        document.querySelectorAll('.cap-submit-form').forEach((form) => form.addEventListener('submit', (event) => { event.preventDefault(); submitCapRemediation(event.currentTarget).catch((error) => notify(error.message, true)); }));
        document.getElementById('passport-settings-form')?.addEventListener('submit', (event) => { event.preventDefault(); notify('Réglages du passeport enregistrés en mode démonstration.'); });
        document.getElementById('supplier-tc-form')?.addEventListener('submit', (event) => { event.preventDefault(); notify('Certificat de transaction déclaré en mode démonstration.'); });
        document.querySelectorAll('[data-document-id]').forEach((element) => element.addEventListener('click', () => downloadDocument(element.dataset.documentId).catch((error) => notify(error.message, true))));
      }
      async function boot() {
        if (state.demo) { await sync(); return; }
        try {
          const res = await fetch('/api/config');
          if (!res.ok) throw new Error('config_fetch_failed');
          const config = await res.json();
          if (!config.publishableKey) throw new Error(config.error || 'clerk_not_configured');
          const clerkDomain = atob(config.publishableKey.split('_')[2]).slice(0, -1);
          await new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = `https://${clerkDomain}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
            script.async = true;
            script.crossOrigin = 'anonymous';
            script.setAttribute('data-clerk-publishable-key', config.publishableKey);
            script.onload = resolve;
            script.onerror = () => reject(new Error('clerk_sdk_unavailable'));
            document.head.appendChild(script);
          });
          state.clerk = window.Clerk;
          if (!state.clerk) throw new Error('clerk_sdk_unavailable');
          await state.clerk.load();
          state.clerk.addListener(() => { if (state.clerk.user && !state.user) sync(); });
          if (state.clerk.user) await sync(); else { state.loading = false; render(); }
        } catch (error) {
          console.warn('Backend Clerk unavailable, launching interactive demo workspace:', error.message);
          state.demo = true;
          state.configError = null;
          await sync();
        }
      }
      window.tracefabSupplierPortal = { state, sync };
      boot();
    })();
  </script>
