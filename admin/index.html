<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRACEFAB — Command Center</title>
<meta name="description" content="TRACEFAB Command Center — operate the platform and grow it: prospects, companies, contacts and commercial pipeline.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://rsms.me/" crossorigin>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script src="/i18n-core.js"></script>
<style>
:root{
  --paper:#f7f8f5; --panel:#ffffff; --ink:#141d19; --muted:#6d7b74;
  --line:#e3e8e0; --green:#0b7656; --green-dark:#07523e; --green-soft:#e7f2ec;
  --red:#b42318; --red-soft:#fdeceb; --yellow:#8f6417; --yellow-soft:#fbf2df;
  --blue:#1f4f8f; --blue-soft:#e9f0fa;
  --radius:14px; --shadow:0 12px 30px rgba(20,29,25,.07);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* --- accès refusé / chargement ------------------------------------------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gatebox{max-width:560px;width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:34px;box-shadow:var(--shadow)}
.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.gatebox h1{font-size:clamp(1.6rem,3.4vw,2.3rem);letter-spacing:-.04em;line-height:1.08;margin:10px 0 12px}
.gatebox p{color:var(--muted);margin:0 0 20px;line-height:1.6}
#clerk-sign-in{min-height:190px}

/* --- squelette ----------------------------------------------------------- */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--panel);padding:18px 12px;
  display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--green-dark);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.02em;flex:none}
.brand b{display:block;font-size:13px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.navlabel{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;
  background:none;border-radius:9px;cursor:pointer;text-align:left;font-weight:600;color:#3c4a44}
.nav:hover{background:#f1f4ef}
.nav[aria-current="page"]{background:var(--green-soft);color:var(--green-dark)}
.nav .k{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.nav[aria-current="page"] .k{color:var(--green)}
.nav.soon{opacity:.5;cursor:not-allowed}
.sidefoot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);
  color:var(--muted);font-size:11px;line-height:1.5}
.rolechip{display:inline-block;background:var(--green-soft);color:var(--green-dark);
  font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;margin-bottom:6px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:5}
.top h1{font-size:15px;margin:0;letter-spacing:-.01em;font-weight:700}
.top .sub{color:var(--muted);font-size:12px}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
select,input[type=text],input[type=search],textarea{
  border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;font-size:13px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--green-soft);border-color:var(--green)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;
  font-weight:700;cursor:pointer}
.btn:hover{border-color:#c9d2c6}
.btn.primary{background:var(--green-dark);border-color:var(--green-dark);color:#fff}
.btn.primary:hover{background:#0a6449}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.view{padding:22px 26px 60px;min-width:0}

.demo{display:flex;gap:10px;align-items:center;background:var(--yellow-soft);
  border:1px solid #ecd9ab;color:#6d4d10;border-radius:10px;padding:9px 13px;
  font-size:12.5px;font-weight:600;margin-bottom:18px}

/* --- KPI ----------------------------------------------------------------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;text-align:left;cursor:pointer;transition:border-color .12s,transform .12s}
.kpi:hover{border-color:var(--green);transform:translateY(-1px)}
.kpi[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.kpi .lbl{display:block;color:var(--muted);font-size:10px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase}
.kpi .val{display:block;font-size:2rem;font-weight:800;letter-spacing:-.045em;
  line-height:1.12;margin-top:6px}
.kpi .val.small{font-size:1.5rem}
/* .kl/.kv : même contrat visuel que .lbl/.val, pour les cartes qui utilisent ces
   noms (import, TODAY). Sans ces règles, .kv n'avait aucun style et .kl n'était
   définie que sous .pilotnums — les nombres s'affichaient en texte ordinaire. */
.kpi .kl{display:block;color:var(--muted);font-size:10px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase}
.kpi .kv{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.045em;margin-top:5px}
.kpi.warn .val{color:var(--yellow)} .kpi.bad .val{color:var(--red)} .kpi.good .val{color:var(--green-dark)}

.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px}
.card h2{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 12px}
.bar{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.bar .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:5px;background:#eef1ec;border-radius:3px;overflow:hidden;width:96px;flex:none}
.bar .fill{height:100%;background:var(--green);border-radius:3px}
.bar b{font-variant-numeric:tabular-nums;min-width:26px;text-align:right}

/* --- table --------------------------------------------------------------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .sp{margin-left:auto}
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:840px}
th{text-align:left;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid #f0f3ee;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fafcf9}
.co{font-weight:700;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
.tag.s-new{background:#eef1ec;color:#4a5750}
.tag.s-qualified{background:var(--blue-soft);color:var(--blue)}
.tag.s-to_contact{background:var(--yellow-soft);color:var(--yellow)}
.tag.s-contacted{background:#e9f0fa;color:#1f4f8f}
.tag.s-replied{background:var(--green-soft);color:var(--green-dark)}
.tag.s-meeting{background:#e6eefb;color:#1f4f8f}
.tag.s-demo{background:#dfeee7;color:#0a6449}
.tag.s-pilot{background:#d8ebe2;color:#07523e}
.tag.s-customer{background:var(--green-dark);color:#fff}
.tag.s-lost{background:var(--red-soft);color:var(--red)}
.tag.p-critical{background:var(--red-soft);color:var(--red)}
.tag.p-high{background:var(--yellow-soft);color:var(--yellow)}
.tag.p-medium{background:#eef1ec;color:#4a5750}
.tag.p-low{background:#f2f4f0;color:#8b968f}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 2px;color:var(--muted);font-size:12px}

/* --- pipeline ------------------------------------------------------------ */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{flex:0 0 208px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.colhead{padding:11px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
.colhead b{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:800}
.colhead .c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.colbody{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto}
.pcard{border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:#fff}
.pcard:hover{border-color:var(--green)}
.pcard b{display:block;font-size:12.5px;letter-spacing:-.01em;line-height:1.3}
.pcard .m{color:var(--muted);font-size:11px;margin-top:3px}
.pcard .row{display:flex;gap:5px;align-items:center;margin-top:6px;flex-wrap:wrap}

/* --- détail -------------------------------------------------------------- */
.head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.04em;line-height:1.1;margin:0}
.head .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 13px;font-weight:700;font-size:13px;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;padding:9px 0;border-bottom:1px solid #f0f3ee}
.field label{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.field .v{font-size:13.5px}
.field .v.none{color:#a4ada6}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.form .full{grid-column:1/-1}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #f0f3ee}
.timeline li:last-child{border-bottom:0}
/* Bornée aux items de liste : sans ce scope, la règle écrasait aussi le
   conteneur de ligne de la vue activités, qui réutilise le nom .tl-d. */
.timeline li .tl-d{flex:none;width:74px;color:var(--muted);font-size:11.5px;font-family:var(--mono);padding-top:1px}
.tl-d .tl-when{color:var(--muted);font-size:11.5px;margin-bottom:5px}
.tl-d .tl-body{padding:11px 0;border-bottom:1px solid #f0f3ee}
.tl-d .tl-body b{display:block;font-size:13px;margin-top:3px}
.tl-b b{display:block;font-size:13px}
.tl-b span{color:var(--muted);font-size:12px}
.nextaction{background:var(--green-soft);border:1px solid #cfe3d8;border-radius:var(--radius);padding:14px 16px}
.nextaction .lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-dark)}
.nextaction .v{font-size:15px;font-weight:700;margin-top:5px;letter-spacing:-.01em}
.modal{position:fixed;inset:0;background:rgba(20,29,25,.42);display:grid;place-items:center;
  padding:20px;z-index:20}
.modalbox{background:var(--panel);border-radius:18px;max-width:620px;width:100%;
  max-height:88vh;overflow-y:auto;padding:22px 24px;box-shadow:0 30px 70px rgba(20,29,25,.24)}
.modalbox h2{margin:0 0 16px;font-size:17px;letter-spacing:-.02em}
.modalfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.err{background:var(--red-soft);color:var(--red);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.hint{color:var(--muted);font-size:12px;line-height:1.6;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
    border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:4px 8px} .navlabel{display:none}
  .nav{width:auto;padding:7px 10px} .nav .k{display:none}
  .sidefoot{display:none}
  .view{padding:18px 16px 50px} .top{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;transform:none!important}}

/* ---- Chantier Admin 02 ---- */
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.kpis.three,.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn.on{border-color:var(--ink);color:var(--ink);background:var(--green-soft)}
.btn.link{border:0;background:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
.viewhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:14px 0}
.card.note{border-left:2px solid var(--ink);padding:14px 16px}
h2.sub{font-size:15px;font-weight:600;margin:22px 0 10px;letter-spacing:.01em}
.mono.late{color:var(--red);font-weight:600}
.cardhead{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
.meter{margin:10px 0}
.meterhead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.meterbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.meterbar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.meterbar.ok i{background:var(--green)}
.pilot .pilothead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.pilotnums{display:flex;gap:22px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px}
.pilotnums>div{display:flex;flex-direction:column;gap:2px}
.pilotnums .kl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.arow{display:grid;grid-template-columns:110px 1fr 48px 76px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.alabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.abar i{display:block;height:100%;background:var(--ink)}
.anum{text-align:right}
.arate{text-align:right;font-size:12px}
.tl-d{display:grid;grid-template-columns:132px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.tl-d:last-child{border-bottom:0}
@media(max-width:640px){.tl-d{grid-template-columns:1fr;gap:4px}.arow{grid-template-columns:84px 1fr 40px 64px}}
.tag.a-conversion{background:var(--green);color:#fff}

/* ---- Chantier Admin 03 ---- */
.listbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.advanced{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:12px 0 4px}
.mini{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mini select,.mini input{font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.warn{background:var(--yellow-soft);color:var(--yellow);padding:9px 12px;border-radius:8px;font-size:13px;margin:10px 0}
.modalbox.wide{max-width:860px}
tr.r-invalid{background:var(--red-soft)}
tr.r-duplicate{background:var(--yellow-soft)}
.tag.st-new{background:var(--green-soft);color:var(--green-dark)}
.tag.st-duplicate{background:var(--yellow-soft);color:var(--yellow)}
.tag.st-invalid{background:var(--red-soft);color:var(--red)}

/* ---- Chantier Admin 04 ---- */
ul.findings{margin:0;padding-left:18px;line-height:1.7}
ul.findings li{margin-bottom:8px}
ul.findings .meta{font-size:11px;margin-top:2px}
.tag.layer{font-family:var(--mono);letter-spacing:.04em}
.tag.a-converted,.tag.a-imported{background:var(--green);color:#fff}
.tag.a-deleted,.tag.a-lost,.tag.a-list_deleted{background:var(--red-soft);color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/*
 * TRACEFAB COMMAND CENTER — Chantier Admin 01.
 *
 * Même architecture que les autres surfaces : un IIFE, un état unique, un rendu
 * par réécriture de #app, Clerk chargé depuis /api/config, et un mode `?demo`.
 *
 * Deux règles non négociables :
 *   - aucun chiffre inventé. Chaque KPI vient de /api/admin/dashboard, qui
 *     compte des lignes réelles. Quand rien n'est mesurable, on affiche
 *     « non mesuré », pas 0.
 *   - en mode démonstration, un bandeau le dit en permanence.
 */
(() => {
'use strict';

const STAGES = ['new','qualified','to_contact','contacted','replied','meeting','demo','pilot','customer'];
const STAGE_LOST = 'lost';
const PRIORITIES = ['critical','high','medium','low'];
const COMPANY_TYPES = ['fashion_brand','textile_brand','manufacturer','textile_supplier','mill','dye_house','garment_factory','luxury_brand','sportswear','outdoor','retailer','marketplace','other'];
const MATURITIES = ['unknown','low','medium','high'];
const CONTACT_STATUSES = ['to_contact','contacted','replied','meeting','unresponsive','declined'];
const INTEREST_LEVELS = ['unknown','low','medium','high'];
const AUDIT_ENTITIES = ['crm_company','crm_contact','crm_task','crm_meeting','crm_pilot','crm_saved_view','crm_import'];
const LANGUAGES = ['en','fr','de','it','es','nl','pt'];

const app = document.getElementById('app');

const state = {
  clerk: null, user: null, access: null,
  loading: true, error: null,
  demo: new URLSearchParams(location.search).has('demo'),
  lang: localStorage.getItem('tracefab.lang') || 'en',
  view: 'dashboard',
  dashboard: null,
  companies: { items: [], total: 0, limit: 50, offset: 0 },
  contacts: { items: [] },
  tasks: { items: [] }, meetings: { items: [] }, pilots: { items: [] },
  activities: { items: [] }, analytics: null,
  taskScope: 'today', meetScope: 'upcoming', activityType: '', pilotStatus: '',
  filters: { stage: '', priority: '', country: '', company_type: '', q: '', due: '',
    maturity: '', employee_band: '', dpp_interest: '', traceability_interest: '',
    product_count_min: '', product_count_max: '', supplier_count_min: '', supplier_count_max: '' },
  advancedOpen: false,
  settings: null, audit: null, auditFilter: '',
  notes: null, emails: null, opportunities: null, noteCompany: '', emailCompany: '',
  connected: null, usage: null, linkableOrgs: [],
  campaigns: null, leads: null, campaign: null, lead: null, leadCampaign: '', leadStatus: '',
  lists: { items: [] }, activeList: null,
  importStep: null, importCsv: '', importMapping: {}, importPreview: null,
  importSource: '', importDetail: '', importSkip: true, importResult: null,
  selected: null,          // id de l'entreprise ouverte
  detail: null,            // { company, contacts, activities }
  tab: 'overview',
  modal: null,             // 'company' | 'contact' | 'move' | null
  formError: null,
  saving: false,
};

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;',
}[c]));

/* Traduction : une clé absente renvoie la clé, jamais un blanc. */
const t = (key) => {
  const v = window.TracefabI18n ? window.TracefabI18n.t(key) : null;
  return v == null ? key : v;
};

/* ---------------------------------------------------------------- données */

function demoDashboard() {
  return {

/* ------------------------------------------------------------------ API */

async function api(path, options = {}) {
  const token = state.clerk?.session ? await state.clerk.session.getToken() : null;
  const res = await fetch(path, {
    ...options,
    headers: {
      ...(options.body ? { 'Content-Type': 'application/json' } : {}),
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(body.error || `HTTP ${res.status}`);
    err.status = res.status;
    err.details = body.details;
    throw err;
  }
  return body;
}

/* ---------------------------------------------------------------- helpers */

const fmtInt = (n) => (typeof n === 'number' && Number.isFinite(n)
  ? n.toLocaleString(state.lang === 'fr' ? 'fr-FR' : 'en-US') : '—');

const fmtMoney = (n) => (typeof n === 'number' && Number.isFinite(n)
  ? `€${n.toLocaleString(state.lang === 'fr' ? 'fr-FR' : 'en-US')}` : '—');

/*
 * Un pourcentage à une décimale. `fmtInt` arrondirait 68.4 en 68 et ferait
 * perdre la précision que le serveur a volontairement conservée.
 */
const fmtPct = (n) => (typeof n === 'number' && Number.isFinite(n)
  ? `${n.toLocaleString(state.lang || 'fr', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} %`
  : '—');
const fmtDate = (v) => {
  if (!v) return null;
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return null;
  return d.toLocaleDateString(state.lang === 'fr' ? 'fr-FR' : 'en-US', { day:'2-digit', month:'short' });
};

const fmtDateTime = (v) => {
  if (!v) return null;
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return null;
  return d.toLocaleString(state.lang === 'fr' ? 'fr-FR' : 'en-US', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
};

/** Une absence de mesure n'est pas un zéro. */
const measured = (v) => (v === null || v === undefined ? t('common.notMeasured') : v);

const stageTag = (s) => `<span class="tag s-${esc(s)}">${esc(t('stage.' + s))}</span>`;
const priorityTag = (p) => `<span class="tag p-${esc(p)}">${esc(t('priority.' + p))}</span>`;

function field(label, value, cls) {
  const shown = value === null || value === undefined || value === ''
    ? `<span class="v none">${esc(t('common.notProvided'))}</span>`
    : `<span class="v ${cls || ''}">${esc(value)}</span>`;
  return `<div class="field"><label>${esc(label)}</label>${shown}</div>`;
}

function viewDashboard() {
  const d = state.dashboard;
  if (!d) return `<div class="empty">${esc(t('common.loading'))}</div>`;

  const kpi = (key, value, filter, tone) => `
    <button class="kpi ${tone || ''}" data-kpi="${esc(filter || '')}" aria-pressed="${state.filters.stage === filter ? 'true' : 'false'}">
      <span class="lbl">${esc(t('dashboard.' + key))}</span>
      <span class="val ${String(value).length > 6 ? 'small' : ''} num">${esc(value)}</span>
    </button>`;

  const bars = (title, obj, labelFn) => {
    const entries = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
    if (!entries.length) {
      return `<div class="card"><h2>${esc(t(title))}</h2><p class="hint">${esc(t('common.noData'))}</p></div>`;
    }
    const max = Math.max(...entries.map((e) => e[1]), 1);
    return `<div class="card"><h2>${esc(t(title))}</h2>${entries.map(([k, v]) => `
      <div class="bar">
        <span class="n">${esc(labelFn ? labelFn(k) : k)}</span>
        <span class="track"><span class="fill" style="width:${Math.round((v / max) * 100)}%"></span></span>
        <b class="num">${fmtInt(v)}</b>
      </div>`).join('')}</div>`;
  };

  return `
    <section class="kpis">
      ${kpi('prospects', fmtInt(d.totalProspects), '')}
      ${kpi('new', fmtInt(d.newProspects), 'new')}
      ${kpi('toContact', fmtInt(d.toContact), 'to_contact', 'warn')}
      ${kpi('contacted', fmtInt(d.contacted), 'contacted')}
      ${kpi('replies', fmtInt(d.replies), 'replied')}
      ${kpi('meetings', fmtInt(d.meetings), 'meeting')}
      ${kpi('demos', fmtInt(d.demos), 'demo')}
      ${kpi('pilots', fmtInt(d.pilots), 'pilot')}
      ${kpi('customers', fmtInt(d.customers), 'customer', 'good')}
      ${kpi('lost', fmtInt(d.lost), 'lost', 'bad')}
      <div class="kpi" data-kpi="" style="cursor:default">
        <span class="lbl">${esc(t('dashboard.value'))}</span>
        <span class="val small num">${esc(fmtMoney(d.estimatedValueEur))}</span>
      </div>
      <div class="kpi" data-kpi="" style="cursor:default">
        <span class="lbl">${esc(t('dashboard.conversion'))}</span>
        <span class="val small num">${esc(d.conversionRate === null ? t('common.notMeasured') : d.conversionRate + '%')}</span>
      </div>
      ${kpi('dueToday', fmtInt(d.dueToday), '', 'warn')}
    </section>

    <div class="panels">
      ${bars('dashboard.byStage', d.byStage, (k) => t('stage.' + k))}
      ${bars('dashboard.byCountry', d.byCountry)}
      ${bars('dashboard.byType', d.byCompanyType, (k) => t('type.' + k))}
      ${bars('dashboard.byPriority', d.byPriority, (k) => t('priority.' + k))}
      <div class="card">
        <h2>${esc(t('dashboard.measured'))}</h2>
        <p class="hint">${esc(t('dashboard.measuredBody'))}</p>
        <div class="field"><label>${esc(t('dashboard.sampleSize'))}</label><span class="v num">${fmtInt(d.sampleSize)}</span></div>
        <div class="field"><label>${esc(t('dashboard.measuredAt'))}</label><span class="v mono">${esc(fmtDateTime(d.measuredAt) || '—')}</span></div>
      </div>
    </div>`;
}

function opportunityPanel(c) {
  /*
   * §4 — opportunité TRACEFAB.
   *
   * Tout vient de `state.detail.opportunity`, calculé CÔTÉ SERVEUR par
   * assessOpportunity(). Chaque conclusion arrive avec le champ qui l'a produite
   * (`evidence`) : affiché tel quel, il est vérifiable. Sans signal, l'écran dit
   * « données insuffisantes » au lieu de broder.
   */
  const o = state.detail?.opportunity;
  const facts = [
    c.product_count ? `${fmtInt(c.product_count)} ${t('common.products')}` : null,
    c.supplier_count ? `${fmtInt(c.supplier_count)} ${t('common.suppliers')}` : null,
    c.country_code ? `${t('common.country')} ${c.country_code}` : null,
    t('type.' + c.company_type),
  ].filter(Boolean);

  const list = (items, prefix) => (items || []).map((f) => `
    <li><b>${esc(t(prefix + f.code))}</b>
      <div class="meta mono">${esc(f.evidence)}</div></li>`).join('');

  const body = (!o || o.insufficient)
    ? `<div class="empty"><b>${esc(t('opportunity.insufficient'))}</b>${esc(t('opportunity.insufficientBody'))}</div>`
    : `<div class="panels">
        <div class="card">
          <div class="cardhead">${esc(t('opportunity.problems'))}</div>
          ${o.problems.length ? `<ul class="findings">${list(o.problems, 'opportunityProblem.')}</ul>`
            : `<div class="hint">${esc(t('opportunity.noProblem'))}</div>`}
        </div>
        <div class="card">
          <div class="cardhead">${esc(t('opportunity.features'))}</div>
          ${o.features.length ? `<ul class="findings">${list(o.features, 'opportunityFeature.')}</ul>`
            : `<div class="hint">${esc(t('opportunity.noFeature'))}</div>`}
        </div>
      </div>
      <div class="card">
        <div class="cardhead">${esc(t('opportunity.layers'))}</div>
        <div class="filters">${(o.layers || []).map((l) => `<span class="tag layer">${esc(l)} ${esc(t('layers.' + l))}</span>`).join('')}</div>
        <div class="hint">${esc(t('opportunity.signals')).replace('%n', String(o.signals))}</div>
      </div>`;

  return `<div class="grid2">
    <div class="card">
      <h2>${esc(t('company.opportunity'))}</h2>
      <div class="field"><label>${esc(t('company.potential'))}</label>
        <span class="v">${priorityTag(c.priority)}</span></div>
      <div class="field"><label>${esc(t('company.maturity'))}</label>
        <span class="v">${esc(t('maturity.' + c.maturity))}</span></div>
      <div class="field"><label>${esc(t('company.estimatedValue'))}</label>
        <span class="v num">${esc(fmtMoney(c.estimated_value_eur))}</span></div>
      <div class="field"><label>${esc(t('company.source'))}</label>
        <span class="v">${esc(c.source || '')}${c.source_detail ? ' · ' + esc(c.source_detail) : ''}</span></div>
      <div class="hint">${esc(t('opportunity.declaredNote'))}</div>
    </div>
    <div class="card">
      <h2>${esc(t('company.whyTarget'))}</h2>
      <ul class="findings">${facts.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>
      <p class="hint" style="margin-top:12px">${esc(t('company.whyTargetNote'))}</p>
    </div>
  </div>
  ${body}`;
}

      </div>

    body = (d.contacts || []).length ? `<div class="tblwrap"><table>
        <thead><tr><th>${esc(t('common.contact'))}</th><th>${esc(t('contacts.jobTitle'))}</th>
          <th>${esc(t('contacts.email'))}</th><th>${esc(t('contacts.phone'))}</th>
          <th>${esc(t('contacts.decisionMaker'))}</th><th>${esc(t('common.status'))}</th>
          <th>${esc(t('contacts.nextAction'))}</th></tr></thead>
        <tbody>${d.contacts.map((k) => `
          <tr>
            <td class="co">${esc([k.first_name, k.last_name].filter(Boolean).join(' ') || '—')}</td>
            <td>${esc(k.job_title || '—')}</td>
            <td class="mono">${esc(k.email || '—')}</td>
            <td class="mono">${esc(k.phone || '—')}</td>
            <td>${k.is_decision_maker ? esc(t('common.yes')) : esc(t('common.no'))}</td>
            <td>${esc(t('contactStatus.' + k.status))}</td>
            <td class="meta">${esc(k.next_action || '—')}</td>
          </tr>`).join('')}</tbody></table></div>`
      : `<div class="empty"><b>${esc(t('contacts.empty'))}</b>${esc(t('company.noContactBody'))}
           <div style="margin-top:14px"><button class="btn primary" id="new-contact">${esc(t('contacts.add'))}</button></div></div>`;

    body = opportunityPanel(c);

        <ul class="timeline">${acts.map((a) => `
          <li><span class="tl-d">${esc(fmtDate(a.occurred_at) || '')}</span>

            </span></li>`).join('')}</ul></div>`
      : `<div class="empty"><b>${esc(t('company.noActivity'))}</b>${esc(t('company.noActivityBody'))}</div>`;

     * Les notes de la timeline sont des `crm_activities` en REVOKE UPDATE, DELETE :
     * elles ne peuvent être ni retouchées ni effacées. Afficher l'une sans l'autre
     * donnait un historique incomplet — et l'unique colonne écrasée à chaque fois.
     */
    const logged = (d.activities || []).filter((a) => a.type === 'note');

      <div class="card"><h2>${esc(t('notes.summary'))}</h2>

          <label class="full">${esc(t('common.detail'))}
            <textarea id="note-detail" rows="3" maxlength="4000" placeholder="${esc(t('notes.detailPlaceholder'))}"></textarea></label>
        </div>
        <button class="btn" id="save-note">${esc(t('notes.save'))}</button>
        <p class="hint" style="margin-top:10px">${esc(t('notes.appendOnly'))}</p>
      </div>
    </div>
    ${logged.length ? `<div class="card"><h2>${esc(t('notes.logged'))}</h2>
      <ul class="timeline">${logged.map((a) => `
        <li><span class="tl-d">${esc(fmtDate(a.occurred_at) || '')}</span>
          <span class="tl-b"><b>${esc(a.summary)}</b>
            ${a.detail ? `<span style="white-space:pre-wrap">${esc(a.detail)}</span>` : ''}
            <span>${esc(a.actor_name || '—')}</span></span></li>`).join('')}</ul></div>`
      : `<div class="empty"><b>${esc(t('notes.empty'))}</b>${esc(t('notes.emptyBody'))}</div>`}`;
  } else if (state.tab === 'emails') {
    /*
     * TRACEFAB journalise, il n'envoie pas. Le refus est affiché avec sa raison :
     * un bouton absent sans explication ressemble à un oubli, et un oubli finit
     * par être « corrigé » sans que la décision ait été prise.
     */
    const logged = (d.activities || []).filter((a) => a.type === 'email');
    body = `<div class="warn">${esc(t('emails.refused'))}
        <div class="meta" style="margin-top:6px">${esc(t('emails.refusedWhy'))}</div></div>
    <div class="card" style="margin-top:14px"><h2>${esc(t('emails.add'))}</h2>

        <label>${esc(t('emails.to'))}
          <input type="email" id="email-to" placeholder="${esc(t('emails.toPlaceholder'))}"></label>
        <label class="full">${esc(t('emails.subject'))}

        <label class="full">${esc(t('emails.outcome'))}
          <textarea id="email-detail" rows="3" maxlength="4000" placeholder="${esc(t('emails.outcomePlaceholder'))}"></textarea></label>
      </div>
      <button class="btn" id="save-email">${esc(t('emails.save'))}</button>
    </div>
    ${logged.length ? `<div class="card"><h2>${esc(t('emails.logged'))}</h2>
      <ul class="timeline">${logged.map((a) => `
        <li><span class="tl-d">${esc(fmtDate(a.occurred_at) || '')}</span>
          <span class="tl-b"><b>${esc(a.summary)}</b>
            ${a.detail ? `<span style="white-space:pre-wrap">${esc(a.detail)}</span>` : ''}
            <span>${esc(a.actor_name || '—')}</span></span></li>`).join('')}</ul></div>`
      : `<div class="empty"><b>${esc(t('emails.empty'))}</b>${esc(t('emails.emptyBody'))}</div>`}`;
  }

  return `
    <div class="head">
      <div style="min-width:0">
        <button class="btn sm" id="back">${esc(t('common.back'))}</button>
        <h1>${esc(c.name)}</h1>
        <div class="tags">${stageTag(c.stage)}${priorityTag(c.priority)}
          ${c.country_code ? `<span class="tag p-medium mono">${esc(c.country_code)}</span>` : ''}
        </div>
      </div>
      <span class="sp" style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
        <select id="move-stage" aria-label="${esc(t('pipeline.move'))}">
          ${[...STAGES, STAGE_LOST].map((s) => `<option value="${s}"${c.stage === s ? ' selected' : ''}>${esc(t('stage.' + s))}</option>`).join('')}

        aria-selected="${state.tab === id ? 'true' : 'false'}">${esc(label)}</button>`).join('')}
    </div>
    ${body}`;
}

  if (step === 'file') {
    return `<div class="modal"><div class="modalbox" role="dialog" aria-modal="true">

      </div>
    </div></div>`;
  }

  /* Étape 2 — mapping des colonnes. */
  if (step === 'mapping' && prev) {
    const headers = prev.headers || [];
    return `<div class="modal"><div class="modalbox" role="dialog" aria-modal="true">
      <h2>${esc(t('import.mapping'))}</h2>
      <div class="hint">${esc(t('import.mappingHint'))}</div>

        ${headers.map((h) => `<label class="mini">${esc(h)}
          <select id="map-${esc(h)}">

    const c = prev.counts || {};
    const rows = (prev.rows || []).slice(0, 200).map((r) => `<tr class="r-${esc(r.status)}">

    return `<div class="modal"><div class="modalbox wide" role="dialog" aria-modal="true">
      <h2>${esc(t('import.review'))}</h2>
      <div class="kpis four">
        <div class="kpi"><div class="kl">${esc(t('import.total'))}</div><div class="kv num">${esc(c.total || 0)}</div></div>

/*
 * `rate` existe déjà et rend un taux null par « Non mesuré » — c'est exactement
 * le comportement voulu, et le réutiliser évite deux lectures du même concept.
 *
 * Mais `rate` arrondit via `fmtInt`. Les pourcentages de pilote sont des entiers,
 * les taux de campagne ne le sont pas (2 promotions sur 3 = 66,7 %). Arrondir
 * ferait perdre la précision sur de petits échantillons, exactement ceux où elle
 * compte. D'où cette variante, sans toucher à `rate` dont la vue Pilotes est
 * déjà validée.
 */
const ratePct = (v) => (v === null || v === undefined
  ? `<span class="hint">${esc(t('common.notMeasured'))}</span>`
  : `<b class="num">${fmtPct(v)}</b>`);

function channelTag(ch) { return `<span class="tag">${esc(t('campaigns.channel.' + ch))}</span>`; }

}

/** Une tâche en retard reste en retard même si son échéance tombe aujourd'hui. */
function taskBucket(task) {
  if (task.status !== 'open') return 'closed';
  if (!task.due_at) return 'undated';
  const d = new Date(task.due_at);
  if (Number.isNaN(d.getTime())) return 'undated';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dueDay = new Date(d); dueDay.setHours(0, 0, 0, 0);
  if (dueDay < today) return 'overdue';
  if (dueDay.getTime() === today.getTime()) return 'today';
  return 'upcoming';
}

</div>`;

  <div class="meterbar ${tone || ''}"><i style="width:${typeof pct === 'number' ? Math.min(100, Math.max(0, pct)) : 0}%"></i></div>

  const open = (counts.overdue || 0) + (counts.today || 0) + (counts.upcoming || 0) + (counts.undated || 0);

  const filtered = state.taskScope === 'all' ? items : items.filter((x) => taskBucket(x) === state.taskScope);
  /* TODAY = ce qui est à faire aujourd'hui ET le retard. Séparer les deux
     laisserait croire qu'un commercial en retard est à l'heure. */
  const scoped = state.taskScope === 'today'
    ? items.filter((x) => taskBucket(x) === 'today' || taskBucket(x) === 'overdue')
    : filtered;

  const rows = scoped.map((k) => `
    <tr>
      <td>${taskTypeTag(k.type)}</td>
      <td><div class="co">${esc(k.title)}</div>
        ${k.detail ? `<div class="meta">${esc(k.detail)}</div>` : ''}</td>
      <td>${k.crm_companies ? `<button class="btn sm link" data-open="${esc(k.crm_companies.id)}">${esc(k.crm_companies.name)}</button>` : '<span class="hint">—</span>'}</td>
      <td class="mono ${taskBucket(k) === 'overdue' ? 'late' : ''}">${esc(fmtDateTime(k.due_at) || t('tasks.noDate'))}</td>
      <td>${priorityTag(k.priority)}</td>
      <td class="meta">${esc(k.assignee_name || '—')}</td>
      <td><button class="btn sm" data-task="${esc(k.id)}" data-to="${k.status === 'done' ? 'open' : 'done'}">
        ${esc(k.status === 'done' ? t('tasks.reopen') : t('tasks.markDone'))}</button></td>
    </tr>`).join('');

  const table = scoped.length ? `<div class="tblwrap"><table>
    <thead><tr>
      <th>${esc(t('common.type'))}</th><th>${esc(t('tasks.task'))}</th>
      <th>${esc(t('common.company'))}</th><th>${esc(t('tasks.due'))}</th>
      <th>${esc(t('common.priority'))}</th><th>${esc(t('tasks.owner'))}</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table></div>`
    : `<div class="empty"><b>${esc(t('tasks.empty'))}</b>${esc(t('tasks.emptyBody'))}</div>`;

  return `
  <div class="kpis four">
    <button class="kpi" data-tscope="today"><div class="kl">${esc(t('tasks.actionable'))}</div>
      <div class="kv num">${fmtInt((counts.overdue || 0) + (counts.today || 0))}</div></button>
    <button class="kpi" data-tscope="overdue"><div class="kl">${esc(t('tasks.overdue'))}</div>
      <div class="kv num">${fmtInt(counts.overdue || 0)}</div></button>
    <button class="kpi" data-tscope="open"><div class="kl">${esc(t('tasks.open'))}</div>
      <div class="kv num">${fmtInt(open)}</div></button>
    <button class="kpi" data-tscope="all"><div class="kl">${esc(t('tasks.all'))}</div>
      <div class="kv num">${fmtInt(items.length)}</div></button>
  </div>
  ${scopeBar('tscope', state.taskScope, [
    ['today', t('tasks.actionable')], ['overdue', t('tasks.overdue')],
    ['upcoming', t('tasks.upcoming')], ['undated', t('tasks.undated')],
    ['closed', t('tasks.closed')], ['all', t('tasks.all')],
  ])}
  <div class="viewhead">
    <div class="hint">${esc(t('tasks.hint'))}</div>
    <button class="btn primary" id="new-task">${esc(t('tasks.new'))}</button>
  </div>
  ${table}`;
}

function render() {
  if (state.loading) {
    app.innerHTML = `<div class="gate"><div class="gatebox">
      <div class="eyebrow">TRACEFAB</div><h1>${esc(t('gate.loading'))}</h1></div></div>`;
    return;
  }
  if (state.error && !state.demo && !state.access) {
    app.innerHTML = `<div class="gate"><div class="gatebox">
      <div class="eyebrow">TRACEFAB Command Center</div>
      <h1>${esc(t('gate.error'))}</h1>
      <p class="err">${esc(state.error)}</p>
      <button class="btn" id="reload">${esc(t('common.retry'))}</button></div></div>`;
    const b = document.getElementById('reload');
    if (b) b.onclick = () => location.reload();
    return;
  }
  if (!state.access && !state.demo) {
    app.innerHTML = `<div class="gate"><div class="gatebox">
      <div class="eyebrow">TRACEFAB Command Center</div>
      <h1>${esc(t('gate.signin'))}</h1>
      <p>${esc(t('gate.signinBody'))}</p>
      <div id="clerk-sign-in"></div></div></div>`;
    if (state.clerk) state.clerk.mountSignIn(document.getElementById('clerk-sign-in'));
    return;
  }
  if (!state.access && state.demo && state.accessChecked) {
    app.innerHTML = `<div class="gate"><div class="gatebox">
      <div class="eyebrow">TRACEFAB Command Center</div>
      <h1>${esc(t('gate.denied'))}</h1>
      <p>${esc(t('gate.deniedBody'))}</p></div></div>`;
    return;
  }
  app.innerHTML = shell();
  bind();
}

/* ---------------------------------------------------------------- binding */

function bind() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  const all = (sel) => Array.from(document.querySelectorAll(sel));

  all('[data-view]').forEach((b) => b.addEventListener('click', () => go(b.dataset.view)));
  all('[data-kpi]').forEach((b) => b.addEventListener('click', () => {
    state.filters.stage = b.dataset.kpi;
    state.filters.offset = 0;
    go('prospects');
  }));
  all('[data-open]').forEach((el) => el.addEventListener('click', () => openCompany(el.dataset.open)));
  all('[data-campaign]').forEach((el) => el.addEventListener('click', () => openCampaign(el.dataset.campaign)));
  all('[data-lead]').forEach((el) => el.addEventListener('click', () => openLead(el.dataset.lead)));
  all('[data-promote]').forEach((el) => el.addEventListener('click', () => promoteLead(el.dataset.promote)));
  all('[data-tab]').forEach((b) => b.addEventListener('click', () => { state.tab = b.dataset.tab; render(); }));
  const sn = document.getElementById('save-note');
  if (sn) sn.addEventListener('click', () => saveNote());
  const se = document.getElementById('save-email');
  if (se) se.addEventListener('click', () => saveEmailLog());

  on('lang', 'change', (e) => setLang(e.target.value));
  on('refresh', 'click', () => loadView());
  on('back', 'click', () => go(state.view === 'campaign' ? 'campaigns'
    : (state.view === 'lead' ? 'leads' : 'prospects')));
  on('new-company', 'click', () => { state.formError = null; state.modal = 'company'; render(); });
  on('new-contact', 'click', () => { state.formError = null; state.modal = 'contact'; render(); });
  on('new-campaign', 'click', () => { state.formError = null; state.modal = 'campaign'; render(); });
  on('edit-campaign', 'click', () => { state.formError = null; state.modal = 'campaign'; render(); });
  /* Le sélecteur de campagne du formulaire de lead a besoin de la liste :
     elle est chargée avant l'ouverture, sinon le choix serait vide. */
  on('new-lead', 'click', async () => {
    state.formError = null;
    if (!state.campaigns) { try { await loadCampaigns(); } catch (e) { /* liste absente : le lead reste créable sans campagne */ } }
    state.modal = 'lead';
    render();
  });
  on('edit-company', 'click', () => { state.formError = null; state.modal = 'company'; render(); });
  on('m-cancel', 'click', () => { state.modal = null; state.formError = null; render(); });
  on('m-save', 'click', saveModal);
  on('prev', 'click', () => { state.companies.offset = Math.max(0, state.companies.offset - state.companies.limit); loadView(); });
  on('next', 'click', () => { state.companies.offset += state.companies.limit; loadView(); });

  const fDue = document.getElementById('f-due');
  if (fDue) fDue.addEventListener('click', () => {
    state.filters.due = state.filters.due === 'today' ? '' : 'today';
    loadView();
  });

  const FILTER_IDS = ['f-stage', 'f-priority', 'f-type', 'f-maturity', 'f-dpp_interest',
    'f-traceability_interest', 'f-employee_band', 'f-product_count_min', 'f-product_count_max',
    'f-supplier_count_min', 'f-supplier_count_max'];
  FILTER_IDS.forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    const ev = el.tagName === 'SELECT' ? 'change' : 'input';
    let timer;
    el.addEventListener(ev, () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        state.filters.stage = document.getElementById('f-stage')?.value || '';
        state.filters.priority = document.getElementById('f-priority')?.value || '';
        state.filters.company_type = document.getElementById('f-type')?.value || '';
        readAdvancedFilters();
        state.activeList = null;
        state.companies.offset = 0;
        loadView();
      }, id === 'f-employee_band' || /_count_/.test(id) ? 260 : 0);
    });
  });

  on('f-advanced', 'click', () => { state.advancedOpen = !state.advancedOpen; render(); });
  on('f-reset', 'click', () => {
    FILTER_KEYS.forEach((k) => { state.filters[k] = ''; });
    state.activeList = null;
    state.companies.offset = 0;
    loadView();
  });
  on('f-list', 'change', (e) => applyList(e.target.value));
  on('list-save', 'click', saveCurrentList);
  on('list-delete', 'click', deleteList);
  on('export-csv', 'click', exportCsv);
  on('import-open', 'click', openImport);
  on('im-preview', 'click', () => runImportPreview());
  on('im-repreview', 'click', () => { state.importMapping = readImportMapping(); runImportPreview(state.importMapping); });
  on('im-commit', 'click', commitImport);
  on('im-back', 'click', () => {
    state.importStep = state.importStep === 'review' ? 'mapping' : 'file';
    render();
  });

  const q = document.getElementById('f-q');
  if (q) {
    let timer;
    q.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        state.filters.q = q.value;
        state.companies.offset = 0;
        loadView();
      }, 260);
    });
  }

  const move = document.getElementById('move-stage');
  if (move) move.addEventListener('change', () => moveStage(move.value));

  /* Admin 02 : bascules de portée, actions de tâche, création. */
  all('[data-tscope]').forEach((b) => b.addEventListener('click', () => {
    state.taskScope = b.dataset.tscope; render();
  }));
  all('[data-mscope]').forEach((b) => b.addEventListener('click', () => {
    state.meetScope = b.dataset.mscope; loadView();
  }));
  all('[data-pstatus]').forEach((b) => b.addEventListener('click', () => {
    state.pilotStatus = b.dataset.pstatus; render();
  }));
  all('[data-task]').forEach((b) => b.addEventListener('click', () => setTaskStatus(b.dataset.task, b.dataset.to)));
  on('new-task', 'click', () => { state.formError = null; state.modal = 'task'; render(); });
  on('new-meeting', 'click', () => { state.formError = null; state.modal = 'meeting'; render(); });

  const fa = document.getElementById('f-activity');
  if (fa) fa.addEventListener('change', () => { state.activityType = fa.value; loadView(); });

  const fg = document.getElementById('f-audit');
  if (fg) fg.addEventListener('change', () => { state.auditFilter = fg.value; loadView(); });
}

  FILTER_KEYS.forEach((k) => { state.filters[k] = ''; });

async function exportCsv() {
  if (state.demo) {
    const rows = state.companies.items || [];
    const head = ['name', 'country_code', 'company_type', 'stage', 'priority', 'source'];
    const csv = [head.join(',')].concat(rows.map((r) => head.map((k) => {
      const v = String(r[k] ?? '');
      return /[",;\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
    }).join(','))).join('\n');
    downloadCsv(`\uFEFF${csv}`, 'tracefab-prospects-demo.csv');
    return;
  }
  try {
    const token = state.clerk?.session ? await state.clerk.session.getToken() : null;
    const res = await fetch(`/api/admin/companies/export?${queryString(true)}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'export_failed');
    }
    downloadCsv(await res.text(), `tracefab-prospects-${new Date().toISOString().slice(0, 10)}.csv`);
    state.error = null;
  } catch (e) { state.error = e.message; }
  render();
}

function downloadCsv(text, filename) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function readImportMapping() {

  const mapping = {};

async function runImportPreview(mapping) {
  const csv = (document.getElementById('im-csv') || {}).value;
  if (csv === undefined) { /* étape mapping : le textarea n'est plus dans le DOM */ }
  else state.importCsv = csv;
  const src = (document.getElementById('im-source') || {}).value;
  if (src !== undefined) state.importSource = src;
  const det = (document.getElementById('im-detail') || {}).value;
  if (det !== undefined) state.importDetail = det;

  if (!state.importSource.trim()) { state.formError = t('import.sourceRequired'); render(); return; }
  if (!state.importCsv.trim()) { state.formError = t('import.csvRequired'); render(); return; }

  state.saving = true;
  render();
  try {
    if (state.demo) {
      state.importPreview = demoImportPreview();
      state.importStep = 'review';
    } else {
      const res = await api('/api/admin/import/preview', {
        method: 'POST',
        body: JSON.stringify({
          csv: state.importCsv,
          source: state.importSource,
          source_detail: state.importDetail || null,
          mapping: mapping || {},
        }),
      });
      state.importPreview = res.preview;
      /* Le serveur a peut-être complété le mapping : on passe à l'étape mapping
         seulement s'il reste des colonnes non reconnues. */
      state.importStep = (res.preview.unmapped || []).length ? 'mapping' : 'review';
    }
    state.formError = null;
  } catch (e) {
    state.formError = e.details ? `${e.message} — ${e.details.join(', ')}` : e.message;
    state.importStep = 'file';
  }
  state.saving = false;
  render();
}

function demoImportPreview() {
  const lines = state.importCsv.split(/\r?\n/).filter((l) => l.trim());
  const headers = (lines[0] || '').split(/[;,]/).map((h) => h.trim());
  const mapping = {};
  headers.forEach((h, i) => { mapping[h] = ['name', 'country_code', 'product_count'][i] || null; });
  const rows = lines.slice(1).map((line, i) => {
    const cells = line.split(/[;,]/).map((c) => c.trim());
    const name = cells[0] || '';
    /* Normalisation avant comparaison : « Maison Lumière » avec son accent ne
       matche pas /lumiere/ — le doublon de démonstration passait en « nouveau ». */
    const flat = (v) => String(v).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const dupe = /maison lumiere/.test(flat(name));
    return {
      index: i, name,
      status: !name ? 'invalid' : dupe ? 'duplicate' : 'new',
      errors: name ? undefined : ['name_required'],
      duplicate: dupe ? { reason: 'same_name_and_country', existingName: 'Maison Lumière', existingId: 'd3' } : undefined,
      data: name ? { name, country_code: cells[1] || null, product_count: Number(cells[2]) || null } : undefined,
    };
  });
  const counts = rows.reduce((a, r) => { a[r.status] = (a[r.status] || 0) + 1; a.total += 1; return a; }, { total: 0 });
  return {
    headers, mapping, rows, counts,
    unmapped: headers.filter((h) => !mapping[h]),
  };
}

async function commitImport() {
  if (state.demo) { state.formError = t('common.demoReadOnly'); render(); return; }
  state.saving = true;

  try {

    state.importResult = res;
    state.modal = null;
    state.importStep = null;
    state.importCsv = '';
    state.importPreview = null;
    state.error = null;
    await loadView();
  } catch (e) {
    state.formError = e.details ? `${e.message} — ${e.details.join(', ')}` : e.message;
    state.importStep = 'review';
    render();
  }
  state.saving = false;
}

async function loadAudit() {
  if (state.demo) {
    state.audit = { items: [
      { id: 'g1', action: 'converted', entity_type: 'crm_company', entity_id: 'd7',
        actor_user_id: 'u1', created_at: inDays(-9),
        metadata: { actorName: 'Founder', changedFields: ['stage', 'converted_at'], changeCount: 2 } },
      { id: 'g2', action: 'imported', entity_type: 'crm_import', entity_id: null,
        actor_user_id: 'u1', created_at: inDays(-6),
        metadata: { actorName: 'Founder', source: 'Salon PV 2026', total: 12, created: 9, duplicate: 2, invalid: 1 } },
      { id: 'g3', action: 'stage_changed', entity_type: 'crm_company', entity_id: 'd1',
        actor_user_id: 'u1', created_at: inDays(-3),
        metadata: { actorName: 'Founder', from: 'demo', to: 'pilot', changeCount: 1 } },
      { id: 'g4', action: 'list_saved', entity_type: 'crm_saved_view', entity_id: 'l1',
        actor_user_id: 'u1', created_at: inDays(-1),
        metadata: { actorName: 'Founder', changeCount: 0 } },
    ], total: 4, chain: { isValid: true, totalEntries: 4 } };
    return;
  }
  const q = state.auditFilter ? `?entity_type=${encodeURIComponent(state.auditFilter)}` : '';
  state.audit = await api(`/api/admin/audit${q}&verify=1`.replace('?&', '?'));
}

async function loadView() {
  state.error = null;
  try {
    if (state.view === 'dashboard') await loadDashboard();
    else if (state.view === 'contacts') { await loadCompanies(); await loadContacts(); }
    else if (state.view === 'company' && state.selected) { await openCompany(state.selected); return; }
    else if (state.view === 'tasks') await loadTasks();
    else if (state.view === 'meetings') await loadMeetings();
    else if (state.view === 'pilots') await loadPilots();
    else if (state.view === 'activities') await loadActivities();
    else if (state.view === 'analytics') await loadAnalytics();
    else if (state.view === 'customers') await loadCustomers();
    else if (state.view === 'settings') { await loadSettings(); await loadAudit(); }
    else if (state.view === 'opportunities') await loadOpportunities();
    else if (state.view === 'emails') await loadEmails();
    else if (state.view === 'notes') await loadNotes();
    else if (state.view === 'suppliers') await loadConnected();
    else if (state.view === 'usage') await loadUsage();
    else if (state.view === 'campaigns') await loadCampaigns();
    else if (state.view === 'leads') { await loadLeads(); if (!state.campaigns) await loadCampaigns(); }
    else if (state.view === 'prospects') { await loadCompanies(); await loadLists(); }
    else await loadCompanies();
  } catch (e) {
    state.error = e.message;
  }
  render();
}

function go(view) {
  state.view = view;
  if (view !== 'company') state.selected = null;
  loadView();
}

/* --------------------------------------------------------------- mutations */

function readForm(prefix, ids) {
  const out = {};
  ids.forEach((id) => {
    const el = document.getElementById(`${prefix}${id}`);
    if (el) out[id] = el.value;
  });
  return out;
}

const COMPANY_IDS = ['name','website','country_code','city','industry','company_type','employee_band',
  'revenue_band','product_count','supplier_count','maturity','priority','estimated_value_eur',
  'source','owner_name','next_contact_at','notes','organization_id'];
const CONTACT_IDS = ['first_name','last_name','job_title','email','phone','linkedin_url','country_code',
  'language','is_decision_maker','influence_level','status','next_action','company_id'];
const TASK_IDS = ['title','type','priority','due_at','assignee_name','company_id','detail'];
const MEETING_IDS = ['subject','starts_at','ends_at','mode','company_id','location','attendees'];

const CAMPAIGN_IDS = ['name', 'channel', 'status', 'objective', 'target_audience',
  'starts_at', 'ends_at', 'budget_eur', 'owner_name', 'notes'];
const LEAD_IDS = ['company_name', 'campaign_id', 'contact_name', 'contact_job_title',
  'email', 'phone', 'linkedin_url', 'website', 'country_code', 'city', 'sector',
  'source', 'source_detail', 'collected_at', 'notes'];

function modalCampaign() {
  const c = state.view === 'campaign' && state.campaign ? state.campaign : {};
  const inp = (id, label, value, attrs) =>
    `<label>${esc(label)}<input type="text" id="cp-${id}" value="${esc(value ?? '')}" ${attrs || ''}></label>`;
  const sel = (id, label, value, list) =>
    `<label>${esc(label)}<select id="cp-${id}">
      ${list.map(([v, l]) => `<option value="${v}"${value === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}
    </select></label>`;
  const CHANNELS = ['email', 'linkedin', 'phone', 'event', 'webinar', 'referral', 'partner', 'content', 'other'];
  const STATUSES = ['draft', 'planned', 'running', 'paused', 'completed', 'cancelled'];
  return `
  <div class="modal"><div class="modalbox" role="dialog" aria-modal="true">
    <h2>${esc(c.id ? t('campaigns.editTitle') : t('campaigns.new'))}</h2>
    ${state.formError ? `<div class="err">${esc(state.formError)}</div>` : ''}
    <div class="form">
      <label class="full">${esc(t('common.name'))}<input type="text" id="cp-name" value="${esc(c.name || '')}" required></label>
      ${sel('channel', t('campaigns.channelLabel'), c.channel || 'email', CHANNELS.map((v) => [v, t('campaigns.channel.' + v)]))}
      ${sel('status', t('common.status'), c.status || 'draft', STATUSES.map((v) => [v, t('campaigns.status.' + v)]))}
      ${inp('starts_at', t('campaigns.starts'), (c.starts_at || '').slice(0, 10), 'placeholder="AAAA-MM-JJ"')}
      ${inp('ends_at', t('campaigns.ends'), (c.ends_at || '').slice(0, 10), 'placeholder="AAAA-MM-JJ"')}
      ${inp('budget_eur', t('campaigns.budget'), c.budget_eur ?? '')}
      ${inp('owner_name', t('common.owner'), c.owner_name)}
      <label class="full">${esc(t('campaigns.objective'))}<input type="text" id="cp-objective" value="${esc(c.objective || '')}"></label>
      <label class="full">${esc(t('campaigns.targetAudience'))}<input type="text" id="cp-target_audience" value="${esc(c.target_audience || '')}"></label>
      <label class="full">${esc(t('common.notes'))}<textarea id="cp-notes">${esc(c.notes || '')}</textarea></label>
      <div class="hint full">${esc(t('campaigns.budgetHint'))}</div>
    </div>
    <div class="modalfoot"><button class="btn" id="m-cancel">${esc(t('common.cancel'))}</button>
      <button class="btn primary" id="m-save">${esc(t('common.save'))}</button></div>
  </div></div>`;
}

function modalLead() {
  const l = state.view === 'lead' && state.lead ? state.lead : {};
  const inp = (id, label, value, attrs) =>
    `<label>${esc(label)}<input type="text" id="ld-${id}" value="${esc(value ?? '')}" ${attrs || ''}></label>`;
  const camps = (state.campaigns?.campaigns || []);
  return `
  <div class="modal"><div class="modalbox" role="dialog" aria-modal="true">
    <h2>${esc(t('leads.new'))}</h2>
    ${state.formError ? `<div class="err">${esc(state.formError)}</div>` : ''}
    <div class="form">
      <label class="full">${esc(t('leads.company'))}<input type="text" id="ld-company_name" value="${esc(l.company_name || '')}" required></label>
      <label class="full">${esc(t('leads.campaign'))}
        <select id="ld-campaign_id">
          <option value="">${esc(t('leads.noCampaign'))}</option>
          ${camps.map((c) => `<option value="${esc(c.id)}"${l.campaign_id === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select>
      </label>
      ${inp('contact_name', t('leads.contactLabel'), l.contact_name)}
      ${inp('contact_job_title', t('leads.jobTitle'), l.contact_job_title)}
      ${inp('email', t('leads.emailLabel'), l.email)}
      ${inp('phone', t('leads.phone'), l.phone)}
      ${inp('linkedin_url', 'LinkedIn', l.linkedin_url)}
      ${inp('website', t('leads.websiteLabel'), l.website)}
      ${inp('country_code', t('common.country'), l.country_code, 'maxlength="2"')}
      ${inp('city', t('leads.city'), l.city)}
      ${inp('sector', t('leads.sector'), l.sector)}
      ${inp('source', t('leads.source'), l.source)}
      ${inp('source_detail', t('leads.sourceDetail'), l.source_detail)}
      ${inp('collected_at', t('leads.collected'), (l.collected_at || '').slice(0, 10), 'placeholder="AAAA-MM-JJ"')}
      <div class="hint full">${esc(t('leads.identityHint'))}</div>
      <div class="hint full">${esc(t('leads.collectedHint'))}</div>
    </div>
    <div class="modalfoot"><button class="btn" id="m-cancel">${esc(t('common.cancel'))}</button>
      <button class="btn primary" id="m-save">${esc(t('common.save'))}</button></div>
  </div></div>`;
}

async function openCampaign(id) {
  state.campaign = null;
  state.view = 'campaign';
  render();
  try {
    if (state.demo) {
      const c = demoCampaigns().find((x) => x.id === id) || null;
      const leads = demoLeads().filter((l) => l.campaign_id === id);
      /* La démo recompose le détail à partir des mêmes fixtures que la liste :
         deux sources différentes finiraient par afficher des chiffres distincts. */
      state.campaign = c ? { ...c, leads, companies: [] } : null;
    } else {
      state.campaign = await api(`/api/admin/campaigns/${encodeURIComponent(id)}`)
        .then((r) => ({ ...(r.campaign || {}), metrics: r.metrics, leads: r.leads, companies: r.companies }));
    }
  } catch (e) {
    state.error = e.message;
  }
  render();
}

function openLead(id) {
  const l = (state.leads?.leads || demoLeads()).find((x) => x.id === id)
    || (state.campaign?.leads || []).find((x) => x.id === id) || null;
  state.lead = l;
  state.view = 'lead';
  render();
}

/*
 * Promouvoir un lead : une entreprise est créée et le lead reste, marqué
 * `converted`, avec sa provenance. Le supprimer ferait perdre l'origine du
 * client — c'est la seule trace qu'il en reste (§14).
 */
async function promoteLead(id) {
  try {
    if (state.demo) {
      const l = demoLeads().find((x) => x.id === id);
      if (!l) return;
      state.lead = { ...l, status: 'converted', converted_company_id: 'demo-' + id, converted_at: new Date().toISOString() };
      state.formError = null;
      render();
      return;
    }
    const r = await api(`/api/admin/leads/${encodeURIComponent(id)}/promote`, { method: 'POST' });
    state.lead = r.lead;
    await loadLeads();
    render();
  } catch (e) {
    state.error = e.message;
    render();
  }
}

async function saveModal() {
  state.saving = true;
  state.formError = null;
  render();
  try {
    if (state.modal === 'company') {
      const body = readForm('fc-', COMPANY_IDS);
      if (body.estimated_value_eur) body.estimated_value_eur = Number(body.estimated_value_eur);
      if (body.product_count) body.product_count = Number(body.product_count);
      if (body.supplier_count) body.supplier_count = Number(body.supplier_count);
      /* Une sélection vide DÉLIE : sans cela un lien erroné serait irréversible. */
      if (body.organization_id === '') body.organization_id = null;
      if (state.detail?.company?.id) {
        const { company } = await api(`/api/admin/companies/${encodeURIComponent(state.detail.company.id)}`,
          { method: 'PATCH', body: JSON.stringify(body) });
        state.detail.company = company;
      } else if (state.demo) {
        state.formError = t('common.demoReadOnly');
        state.saving = false; render(); return;
      } else {
        await api('/api/admin/companies', { method: 'POST', body: JSON.stringify(body) });
      }
    } else if (state.modal === 'campaign') {
      const body = readForm('cp-', CAMPAIGN_IDS);
      if (body.budget_eur !== '') body.budget_eur = Number(body.budget_eur);
      for (const k of ['starts_at', 'ends_at']) { if (body[k] === '') body[k] = null; }
      if (state.demo) { state.formError = t('common.demoReadOnly'); state.saving = false; render(); return; }
      if (state.campaign?.id) {
        await api(`/api/admin/campaigns/${encodeURIComponent(state.campaign.id)}`,
          { method: 'PATCH', body: JSON.stringify(body) });
      } else {
        await api('/api/admin/campaigns', { method: 'POST', body: JSON.stringify(body) });
      }
    } else if (state.modal === 'lead') {
      const body = readForm('ld-', LEAD_IDS);
      /* Un champ vide délie / vide : sans cela une saisie erronée serait
         définitive. L'empreinte de doublon, elle, reste figée côté serveur. */
      for (const k of LEAD_IDS) { if (body[k] === '') body[k] = null; }
      if (state.demo) { state.formError = t('common.demoReadOnly'); state.saving = false; render(); return; }
      const r = await api('/api/admin/leads', { method: 'POST', body: JSON.stringify(body) })
        .catch((e) => {
          /* Un doublon n'est pas une panne : l'API renvoie la ligne existante
             pour que l'opérateur puisse juger s'il s'agit du même prospect. */
          if (e && e.status === 409) { state.formError = t('leads.duplicateFound'); throw e; }
          throw e;
        });
      if (r && r.lead) { state.lead = r.lead; }
    } else if (state.modal === 'task') {
      const body = readForm('tk-', TASK_IDS);
      if (state.demo) { state.formError = t('common.demoReadOnly'); state.saving = false; render(); return; }
      await api('/api/admin/tasks', { method: 'POST', body: JSON.stringify(body) });
    } else if (state.modal === 'meeting') {
      const body = readForm('mt-', MEETING_IDS);
      if (state.demo) { state.formError = t('common.demoReadOnly'); state.saving = false; render(); return; }
      await api('/api/admin/meetings', { method: 'POST', body: JSON.stringify(body) });
    } else {
      const body = readForm('kc-', CONTACT_IDS);
      body.is_decision_maker = body.is_decision_maker === 'true';
      body.influence_level = Number(body.influence_level || 0);
      if (state.demo) {
        state.formError = t('common.demoReadOnly');
        state.saving = false; render(); return;
      }
      await api('/api/admin/contacts', { method: 'POST', body: JSON.stringify(body) });
    }
    state.modal = null;
    state.saving = false;
    await loadView();
  } catch (e) {
    state.saving = false;
    state.formError = e.details ? `${e.message} — ${e.details.join(', ')}` : e.message;
    render();
  }
}

async function moveStage(stage) {
  const company = state.detail?.company;
  if (!company || company.stage === stage) return;
  if (state.demo) { state.error = t('common.demoReadOnly'); render(); return; }

  let lostReason = null;
  if (stage === 'lost') {
    lostReason = window.prompt(t('pipeline.lostReasonPrompt'));
    if (!lostReason) { render(); return; }
  }
  try {
    const res = await api(`/api/admin/companies/${encodeURIComponent(company.id)}/stage`, {
      method: 'PATCH',
      body: JSON.stringify({ stage, lost_reason: lostReason }),
    });
    state.detail.company = res.company;
    state.detail.activities = (await api(
      `/api/admin/companies/${encodeURIComponent(company.id)}/activities`,
    )).items;
    state.error = null;
  } catch (e) {
    state.error = e.message;
  }
  render();
}

/* ---------------------------------------------------------------- langue */

async function setLang(lang) {
  state.lang = lang;
  localStorage.setItem('tracefab.lang', lang);
  document.documentElement.lang = lang;
  if (window.TracefabI18n) {
    await window.TracefabI18n.setLanguage(lang);
  }
  render();
}

/* ------------------------------------------------------------------ boot */

async function boot() {
  try {
    await window.TracefabI18n.init({ scope: 'admin', fallback: 'en', language: state.lang });
  } catch (e) {
    /* Le dictionnaire peut manquer : on continue avec les clés brutes plutôt que
       de bloquer la console. L'erreur est visible en console. */
    console.error('TRACEFAB admin : dictionnaire i18n indisponible', e);
  }

  if (state.demo) {
    state.access = { role: 'owner', organizationName: 'TRACEFAB (demo)', email: 'demo@tracefab.example' };
    await loadLinkableOrgs();
    state.loading = false;
    await loadView();
    return;
  }

  try {
    const config = await fetch('/api/config').then((r) => r.json());
    if (!config.publishableKey) throw new Error(config.error || 'clerk_not_configured');
    const domain = atob(config.publishableKey.split('_')[2]).slice(0, -1);
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = `https://${domain}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
      s.async = true;
      s.crossOrigin = 'anonymous';
      s.setAttribute('data-clerk-publishable-key', config.publishableKey);
      s.onload = resolve;
      s.onerror = () => reject(new Error('clerk_sdk_unavailable'));
      document.head.appendChild(s);
    });
    state.clerk = window.Clerk;
    if (!state.clerk) throw new Error('clerk_sdk_unavailable');
    await state.clerk.load();
    state.user = state.clerk.user;
    state.loading = false;

    if (!state.user) { render(); return; }

    try {
      state.access = await api('/api/admin/access');
      await loadLinkableOrgs();
    } catch (e) {
      state.access = null;
      state.accessChecked = true;
      if (e.status !== 403) state.error = e.message;
    }
    render();
    if (state.access) await loadView();
  } catch (e) {
    state.loading = false;
    state.error = e.message;
    render();
  }
}

boot();
})();
</script>
