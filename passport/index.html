<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="passport.meta.title">Passeport Fournisseur Universel | TRACEFAB Verified</title>
  <meta name="description" data-i18n-attr="content:passport.meta.description" content="Passeport Fournisseur Universel vérifié sur Tracefab. Identité industrielle, certifications actives et conformité RSE.">

  <!-- Open Graph -->
  <meta property="og:title" content="Passeport Fournisseur Universel — TRACEFAB">
  <meta property="og:description" content="Identité industrielle, sites certifiés et conformité RSE vérifiée.">
  <meta property="og:type" content="profile">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --ink: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.25);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.2);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.2);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      min-height: 100vh;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 100px;
    }

    header.top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.5px;
    }
    .brand-name {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.3px;
    }
    .brand-name small {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .verified-seal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 36px;
      margin-bottom: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #2563eb, #10b981, #f59e0b);
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }
    .supplier-title h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
    }
    .supplier-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13.5px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .badge-country {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
    }
    .headline-text {
      font-size: 16px;
      color: #cbd5e1;
      margin: 20px 0 24px;
      line-height: 1.6;
      max-width: 780px;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }
    .kpi-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 14px 18px;
    }
    .kpi-label {
      font-size: 11.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .kpi-val {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      font-family: var(--mono);
    }

    /* État d'erreur : remplace le repli silencieux qui présentait un
       fournisseur inventé comme vérifié. */
    .error-card {
      background: var(--card-bg);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 18px;
      padding: 36px;
      margin-bottom: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .error-card h1 { margin: 0 0 10px; font-size: 1.35rem; }

    .error-card .error-reason {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--card-border);
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted);
      word-break: break-word;
    }

    /* Démonstration explicite : les valeurs de démo doivent être identifiables. */
    .demo-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(37, 99, 235, 0.35);
      border-radius: 12px;
      margin-bottom: 24px;
      color: var(--ink);
    }

    .nda-banner {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      margin-bottom: 30px;
    }
    .nda-icon {
      font-size: 24px;
      color: #f59e0b;
      flex-shrink: 0;
    }
    .nda-content {
      font-size: 12.5px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .nda-content strong {
      color: #f59e0b;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    @media (max-width: 820px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .card-head h2 {
      font-size: 17px;
      font-weight: 750;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-badge {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .item-list {
      display: grid;
      gap: 12px;
    }
    .item-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 14px 16px;
      transition: all 0.2s ease;
    }
    .item-box:hover {
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }
    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .item-top strong {
      font-size: 14px;
      font-weight: 700;
    }
    .cert-verified {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #10b981;
      font-size: 11.5px;
      font-weight: 700;
    }
    .item-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }
    .btn-emerald {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 14px var(--green-glow);
    }
    .btn-emerald:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }

    .sticky-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 860px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }
    .sticky-text {
      font-size: 13.5px;
    }
    .sticky-text strong {
      color: #fff;
    }
    .sticky-text p {
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 1px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      max-width: 540px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-head h3 {
      font-size: 20px;
      font-weight: 800;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .input, .textarea {
      width: 100%;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 13.5px;
    }
    .input:focus, .textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }
    .checkbox-label input {
      margin-top: 2px;
    }
  </style>
  <script src="/i18n-core.js"></script>
</head>
<body>
  <div class="container">
    <header class="top-nav">
      <a href="/" class="brand-logo">
        <div class="brand-mark">tf</div>
        <div class="brand-name">
          tracefab
          <small data-i18n="passport.nav.passport">Universal Supplier Passport</small>
        </div>
      </a>
      <div style="display:flex;align-items:center;gap:10px">
        <select class="verified-seal" id="lang-select" aria-label="Language" style="cursor:pointer;background:transparent;font-family:inherit"></select>
        <div class="verified-seal" id="verified-seal">
          <span>✓</span> <span data-i18n="passport.nav.verified">Profil Industriel Vérifié</span>
        </div>
      </div>
    </header>

    <div id="app">
      <div style="text-align:center;padding:80px 20px;color:var(--muted)">
        <span data-i18n="passport.loading">Chargement du passeport fournisseur…</span>
      </div>
    </div>
  </div>

  <div id="modal-container"></div>

  <script>
    (async function() {
      /*
       * Tout le texte vient de locales/{lang}/passport.json.
       *
       * Les 56 chaînes vivaient en dur ici, en français, dans le HTML et dans
       * les gabarits. Un passeport fournisseur est lu par des donneurs d'ordre
       * étrangers : c'est précisément son objet.
       *
       * `t()` renvoie la clé quand le dictionnaire ne l'a pas — la convention de
       * brand-console. Une clé manquante doit rester visible pour être comblée,
       * jamais se déguiser en texte plausible.
       */
      const t = (key, values) => {
        const value = window.TracefabI18n ? window.TracefabI18n.t(key, values) : null;
        return value === null || value === undefined ? key : value;
      };

      const LANG_NAMES = { en: 'English', fr: 'Français', de: 'Deutsch', it: 'Italiano', es: 'Español', nl: 'Nederlands', pt: 'Português' };
      const langSelect = document.getElementById('lang-select');
      function renderLangSelect() {
        const langs = window.TracefabI18n ? window.TracefabI18n.LANGS : Object.keys(LANG_NAMES);
        const active = window.TracefabI18n ? window.TracefabI18n.language : null;
        langSelect.innerHTML = langs
          .map((code) => `<option value="${code}"${code === active ? ' selected' : ''}>${LANG_NAMES[code] || code}</option>`)
          .join('');
      }
      langSelect.addEventListener('change', () => {
        if (window.TracefabI18n) window.TracefabI18n.setLanguage(langSelect.value);
      });
      /* Changer de langue doit retraduire ce qui est DÉJÀ affiché, pas seulement
         le prochain rendu : le gabarit est réinjecté, et un modal ouvert aussi. */
      document.addEventListener('tracefab:lang', () => {
        renderLangSelect();
        render();
        if (document.getElementById('modal-container').innerHTML.trim()) window.openRequestModal();
      });

      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get('ref') || urlParams.get('token') || 'nhan-textile-pt';
      /**
       * La démonstration n'est servie que sur demande explicite (?demo=1).
       *
       * Avant, tout échec d'API — référence inconnue, réseau coupé, serveur en
       * panne — basculait silencieusement sur un fournisseur inventé dont les
       * trois certificats portaient isVerified: true. Un visiteur lisait donc un
       * profil « vérifié » qui ne correspondait à aucune entreprise, et un
       * incident de production ressemblait à un passeport valide.
       */
      const demoRequested = (() => {
        const flag = urlParams.get('demo');
        return flag === null ? false : !['0', 'false', 'off'].includes(String(flag).toLowerCase());
      })();

      let state = {
        data: null,
        loading: true,
        error: null,
        demo: false,
        modalOpen: false
      };

      async function fetchPassport() {
        try {
          const res = await fetch(`/api/passport/${encodeURIComponent(ref)}`);
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || 'Passeport introuvable.');
          }
          state.data = await res.json();
          state.loading = false;
        } catch (e) {
          if (demoRequested) {
            console.warn('API indisponible — passeport de démonstration affiché (?demo=1) :', e.message);
            state.data = demoPassport();
            state.demo = true;
          } else {
            state.data = null;
            state.error = e && e.message ? e.message : String(e);
          }
          state.loading = false;
          render();
          return;
        }
        state.loading = false;
        render();
      }

      /**
       * Passeport de démonstration. Servi uniquement derrière ?demo=1 et
       * étiqueté comme tel à l'écran : ces valeurs ne décrivent aucune
       * entreprise réelle et ne doivent jamais passer pour des données vérifiées.
       */
      function demoPassport() {
        return {
            passport: {
              id: 'demo-passport-1',
              slug: 'nhan-textile-pt',
              shareToken: 'pass_demo_pt_123',
              headline: 'Manufacture textile intégrée certifiée GOTS & OEKO-TEX. Filature, tricotage et confection éco-responsable.',
              tradeSecretMode: 'redacted',
              viewsCount: 28,
              lastViewedAt: new Date().toISOString()
            },
            supplier: {
              legalName: 'Nhãn Textile Lda',
              displayName: 'Nhãn Textile Portugal',
              countryCode: 'PT',
              website: 'https://nhantextile.example.pt',
              activityTypes: ['ginning', 'spinning', 'knitting', 'sewing', 'packaging'],
              profileSummary: 'Nhãn Textile opère depuis 1998 à Porto un parc industriel de 14 000 m² dédié au jersey circulaire haut de gamme, molleton peigné et confection éthique certifiée.',
              employeeCountRange: '251-1000',
              yearEstablished: 1998,
              profileCompletion: 92,
              contactName: 'Directrice RSE & Qualité'
            },
            sites: [
              { id: 's1', name: 'Atelier de Tricotage & Coupe (Porto)', countryCode: 'PT', city: 'Porto', address: '[Secret d’affaires masqué — Accord NDA requis]', activityTypes: ['knitting', 'cutting'], isActive: true },
              { id: 's2', name: 'Unité de Confection & Finitions (Braga)', countryCode: 'PT', city: 'Braga', address: '[Secret d’affaires masqué — Accord NDA requis]', activityTypes: ['sewing', 'packaging'], isActive: true }
            ],
            certifications: [
              { id: 'c1', standardName: 'Global Organic Textile Standard (GOTS)', standardCode: 'GOTS 7.0', issuerName: 'Control Union Certifications B.V.', certificateNumber: 'CU812345GOTS-2025-01', issuedAt: '2025-01-15', expiresAt: '2027-01-14', isVerified: true },
              { id: 'c2', standardName: 'STANDARD 100 by OEKO-TEX', standardCode: 'OEKO-TEX 100', issuerName: 'CITEVE', certificateNumber: '12345-OEKO-2025', issuedAt: '2025-03-01', expiresAt: '2026-02-28', isVerified: true },
              { id: 'c3', standardName: 'SMETA 4-Pillars Ethical Audit', standardCode: 'SMETA 4P', issuerName: 'Intertek', certificateNumber: 'SMETA-2025-PT', issuedAt: '2025-02-10', expiresAt: '2027-02-09', isVerified: true }
            ],
            materials: [
              { id: 'm1', name: 'Jersey de Coton Biologique 185g', materialType: 'yarn', originCountryCode: 'PT', composition: { cotton_organic: 95, elastane: 5 } },
              { id: 'm2', name: 'Molleton Coton Recyclé Pré-conso 320g', materialType: 'fabric', originCountryCode: 'PT', composition: { cotton_recycled: 60, cotton_organic: 40 } }
            ],
            qualityScore: {
              completeness: 92,
              freshness: 95,
              documentationCoverage: 100,
              consistency: 90
            },
            tradeSecretProtection: {
              exactAddressesMasked: true,
              mode: 'redacted',
              legalBasis: 'Directive (UE) 2016/943 sur la protection des secrets d\'affaires'
            }
        };
      }

      function render() {
        const app = document.getElementById('app');
        if (state.loading) return;

        /* Sans donnée, on affiche l'échec — jamais un profil inventé. Le sceau
           « Profil Industriel Vérifié » est masqué : il affirmerait le contraire
           de ce que l'écran montre. */
        const seal = document.getElementById('verified-seal');
        if (state.error || !state.data) {
          if (seal) seal.style.display = 'none';
          app.innerHTML = `
            <div class="error-card" role="alert">
              <h1>${esc(t('passport.error.title'))}</h1>
              <p style="color:var(--muted);margin:0">${esc(t('passport.error.body'))}</p>
              ${state.error ? `<div class="error-reason">${esc(t('passport.error.reason'))} : ${esc(state.error)}</div>` : ''}
              <p style="margin:20px 0 0">
                <a class="badge badge-country" href="${esc(window.location.pathname + window.location.search)}">${esc(t('passport.error.retry'))}</a>
              </p>
            </div>`;
          return;
        }
        if (seal && !state.demo) seal.style.display = '';
        else if (seal && state.demo) seal.style.display = 'none';

        const d = state.data;
        const sup = d.supplier;
        const pass = d.passport;
        const score = d.qualityScore;

        app.innerHTML = `
          ${state.demo ? `<div class="demo-banner" role="status"><span>◆</span><span>${esc(t('passport.demo.banner'))}</span></div>` : ''}
          <div class="hero-card">
            <div class="hero-top">
              <div class="supplier-title">
                <h1>${esc(sup.displayName || sup.legalName)}</h1>
                <div class="supplier-meta">
                  <span class="badge badge-country">🇵🇹 ${esc(sup.countryCode || 'PT')}</span>
                  <span>${esc(t('passport.hero.foundedIn', { year: sup.yearEstablished || '1998' }))}</span>
                  <span>·</span>
                  <span>${esc(t('passport.hero.headcount', { range: sup.employeeCountRange || '251-1000' }))}</span>
                  <span>·</span>
                  <span style="color:#10b981">${esc(t('passport.hero.audited'))}</span>
                </div>
              </div>
              <button class="btn btn-emerald" onclick="openRequestModal()">
                ${esc(t('passport.hero.requestFull'))}
              </button>
            </div>

            <div class="headline-text">
              "${esc(pass.headline || sup.profileSummary || 'Fournisseur textile engagé certifié Tracefab.')}"
            </div>

            <div class="kpi-row">
              <div class="kpi-box">
                <div class="kpi-label">${esc(t('passport.kpi.profile'))}</div>
                <div class="kpi-val" style="color:#10b981">${moneyless(sup.profileCompletion)}%</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">${esc(t('passport.kpi.evidence'))}</div>
                <div class="kpi-val" style="color:#38bdf8">${score ? moneyless(score.documentationCoverage) : '100'}%</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">${esc(t('passport.kpi.certifications'))}</div>
                <div class="kpi-val" style="color:#f59e0b">${d.certifications.length}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">${esc(t('passport.kpi.sites'))}</div>
                <div class="kpi-val" style="color:#a855f7">${d.sites.length}</div>
              </div>
            </div>
          </div>

          <div class="nda-banner">
            <div class="nda-icon">🛡️</div>
            <div class="nda-content">
              <strong>${esc(t('passport.nda.title'))}</strong><br>
              ${esc(t('passport.nda.body'))}
            </div>
          </div>

          <div class="grid-2">
            <!-- Certifications -->
            <div class="card">
              <div class="card-head">
                <h2>${esc(t('passport.certs.title'))}</h2>
                <span class="card-badge">${esc(t('passport.certs.count', { count: d.certifications.length }))}</span>
              </div>
              <div class="item-list">
                ${d.certifications.map((c) => `
                  <div class="item-box">
                    <div class="item-top">
                      <strong>${esc(c.standardName)}</strong>
                      <span class="cert-verified">${esc(t('passport.certs.verified'))}</span>
                    </div>
                    <div class="item-desc">
                      ${esc(t('passport.certs.issuer'))} <strong>${esc(c.issuerName || t('passport.certs.issuerFallback'))}</strong><br>
                      ${esc(t('passport.certs.number'))} <code>${esc(c.certificateNumber || 'CU812345')}</code><br>
                      ${esc(t('passport.certs.validUntil'))} <strong>${date(c.expiresAt)}</strong>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Sites Industriels -->
            <div class="card">
              <div class="card-head">
                <h2>${esc(t('passport.sites.title'))}</h2>
                <span class="card-badge">${esc(t('passport.sites.count', { count: d.sites.length }))}</span>
              </div>
              <div class="item-list">
                ${d.sites.map((s) => `
                  <div class="item-box">
                    <div class="item-top">
                      <strong>${esc(s.name)}</strong>
                      <span class="badge" style="background:rgba(16,185,129,0.15);color:#34d399">${esc(t('passport.sites.active'))}</span>
                    </div>
                    <div class="item-desc">
                      ${esc(t('passport.sites.location'))} <strong>${esc(s.city || 'Portugal')}, ${esc(s.countryCode)}</strong><br>
                      ${esc(t('passport.sites.address'))} <em style="color:#94a3b8">${esc(s.address)}</em><br>
                      ${esc(t('passport.sites.activities'))} ${(s.activityTypes || []).map((a) => `<span class="badge" style="background:rgba(255,255,255,0.06);margin-right:4px">${esc(a)}</span>`).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Matériaux & Savoir-faire -->
          <div class="card" style="margin-bottom:24px">
            <div class="card-head">
              <h2>${esc(t('passport.materials.title'))}</h2>
              <span class="card-badge">${esc(t('passport.materials.count', { count: d.materials.length }))}</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:14px">
              ${d.materials.map((m) => `
                <div class="item-box">
                  <div class="item-top">
                    <strong>${esc(m.name)}</strong>
                    <span class="badge badge-country">${esc(m.materialType || t('passport.materials.typeFallback'))}</span>
                  </div>
                  <div class="item-desc" style="margin-top:6px">
                    ${esc(t('passport.materials.origin'))} <strong>${esc(m.originCountryCode || 'Portugal')}</strong><br>
                    ${m.composition ? `${esc(t('passport.materials.composition'))} <code>${typeof m.composition === 'string' ? esc(m.composition) : esc(JSON.stringify(m.composition))}</code>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Sticky Bar for Inbound Conversion -->
          <div class="sticky-bar">
            <div class="sticky-text">
              <strong>${esc(t('passport.sticky.title'))}</strong>
              <p>${esc(t('passport.sticky.body'))}</p>
            </div>
            <button class="btn btn-primary" onclick="openRequestModal()">
              ${esc(t('passport.sticky.cta'))}
            </button>
          </div>
        `;
      }

      function esc(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
      }
      function date(d) {
        if (!d) return '—';
        /* La locale suit la langue active : afficher « 12 mars 2026 » à un
           lecteur allemand pendant que tout le reste est en allemand serait une
           demi-traduction. */
        const locale = { fr: 'fr-FR', en: 'en-GB', de: 'de-DE', it: 'it-IT', es: 'es-ES', nl: 'nl-NL', pt: 'pt-PT' }[window.TracefabI18n?.language || 'fr'] || 'fr-FR';
        return new Date(d).toLocaleDateString(locale, { day: '2-digit', month: 'short', year: 'numeric' });
      }
      function moneyless(n) { return Math.round(Number(n) || 0); }

      window.openRequestModal = function() {
        const mc = document.getElementById('modal-container');
        mc.innerHTML = `
          <div class="modal-backdrop" onclick="if(event.target === this) closeRequestModal()">
            <div class="modal-box">
              <div class="modal-head">
                <div>
                  <div style="font-size:11px;font-weight:700;color:#38bdf8;text-transform:uppercase;letter-spacing:0.5px">${esc(t('passport.modal.eyebrow'))}</div>
                  <h3>${esc(t('passport.modal.title'))}</h3>
                </div>
                <button class="close-btn" onclick="closeRequestModal()">×</button>
              </div>
              <p style="font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.5">
                ${esc(t('passport.modal.intro', { supplier: esc(state.data?.supplier?.displayName || t('passport.modal.supplierFallback')) }))}
              </p>
              <form id="access-form" onsubmit="submitAccessRequest(event)">
                <div class="form-group">
                  <label>${esc(t('passport.modal.nameLabel'))}</label>
                  <input class="input" name="requesterName" required placeholder="${esc(t('passport.modal.namePlaceholder'))}">
                </div>
                <div class="form-group">
                  <label>${esc(t('passport.modal.emailLabel'))}</label>
                  <input class="input" name="requesterEmail" type="email" required placeholder="${esc(t('passport.modal.emailPlaceholder'))}">
                </div>
                <div class="form-group">
                  <label>${esc(t('passport.modal.companyLabel'))}</label>
                  <input class="input" name="requesterCompany" required placeholder="${esc(t('passport.modal.companyPlaceholder'))}">
                </div>
                <div class="form-group">
                  <label>${esc(t('passport.modal.messageLabel'))}</label>
                  <textarea class="textarea" name="message" rows="3" placeholder="${esc(t('passport.modal.messagePlaceholder'))}"></textarea>
                </div>
                <div class="form-group" style="margin-top:14px">
                  <label class="checkbox-label">
                    <input type="checkbox" name="ndaAccepted" required checked>
                    <span>${esc(t('passport.modal.ndaLabel'))}</span>
                  </label>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px">
                  <button type="button" class="btn" style="background:rgba(255,255,255,0.08);color:#fff" onclick="closeRequestModal()">${esc(t('passport.modal.cancel'))}</button>
                  <button type="submit" class="btn btn-emerald">${esc(t('passport.modal.submit'))}</button>
                </div>
              </form>
            </div>
          </div>
        `;
      };

      window.closeRequestModal = function() {
        document.getElementById('modal-container').innerHTML = '';
      };

      window.submitAccessRequest = async function(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const body = {
          requesterName: formData.get('requesterName'),
          requesterEmail: formData.get('requesterEmail'),
          requesterCompany: formData.get('requesterCompany'),
          message: formData.get('message'),
          ndaAccepted: true
        };

        try {
          const res = await fetch(`/api/passport/${encodeURIComponent(ref)}/request-access`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const result = await res.json();
          if (!res.ok) throw new Error(result.error || t('passport.modal.sendError'));

          document.getElementById('modal-container').innerHTML = `
            <div class="modal-backdrop" onclick="closeRequestModal()">
              <div class="modal-box" style="text-align:center">
                <div style="font-size:42px;margin-bottom:12px">🎉</div>
                <h3 style="font-size:20px;margin-bottom:8px">${esc(t('passport.modal.success'))}</h3>
                <p style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:24px">
                  ${esc(result.message || t('passport.modal.notified'))}
                </p>
                <button class="btn btn-primary" onclick="closeRequestModal()">${esc(t('passport.modal.understood'))}</button>
              </div>
            </div>
          `;
        } catch (err) {
          alert(t('passport.modal.alertPrefix') + ' ' + err.message);
        }
      };

      /* Le contenu s'affiche d'abord en français, puis est traduit dès que le
         dictionnaire arrive : aucun fetch ne bloque le premier rendu. */
      renderLangSelect();
      const start = () => { renderLangSelect(); fetchPassport(); };
      if (window.TracefabI18n) window.TracefabI18n.init({ scope: 'passport', fallback: 'fr' }).then(start, start);
      else start();
    })();
  </script>
</body>
</html>
