<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="passport.metaTitle">Universal Supplier Passport | TRACEFAB Verified</title>
  <meta name="description" data-i18n-attr="content:passport.metaDesc" content="Universal Supplier Passport verified on Tracefab. Industrial identity, active certifications and traceability compliance under trade secret protection.">

  <!-- Open Graph -->
  <meta property="og:title" data-i18n-attr="content:passport.ogTitle" content="Universal Supplier Passport — TRACEFAB">
  <meta property="og:description" data-i18n-attr="content:passport.ogDesc" content="Industrial identity, certified sites and verified CSR compliance.">
  <meta property="og:type" content="profile">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --ink: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.25);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.2);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.2);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      min-height: 100vh;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 100px;
    }

    header.top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.5px;
    }
    .brand-name {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.3px;
    }
    .brand-name small {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .verified-seal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 36px;
      margin-bottom: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #2563eb, #10b981, #f59e0b);
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }
    .supplier-title h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
    }
    .supplier-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13.5px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .badge-country {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
    }
    .headline-text {
      font-size: 16px;
      color: #cbd5e1;
      margin: 20px 0 24px;
      line-height: 1.6;
      max-width: 780px;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }
    .kpi-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 14px 18px;
    }
    .kpi-label {
      font-size: 11.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .kpi-val {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      font-family: var(--mono);
    }

    .nda-banner {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      margin-bottom: 30px;
    }
    .nda-icon {
      font-size: 24px;
      color: #f59e0b;
      flex-shrink: 0;
    }
    .nda-content {
      font-size: 12.5px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .nda-content strong {
      color: #f59e0b;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    @media (max-width: 820px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .card-head h2 {
      font-size: 17px;
      font-weight: 750;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-badge {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .item-list {
      display: grid;
      gap: 12px;
    }
    .item-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 14px 16px;
      transition: all 0.2s ease;
    }
    .item-box:hover {
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }
    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .item-top strong {
      font-size: 14px;
      font-weight: 700;
    }
    .cert-verified {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #10b981;
      font-size: 11.5px;
      font-weight: 700;
    }
    .item-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }
    .btn-emerald {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 14px var(--green-glow);
    }
    .btn-emerald:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }

    .sticky-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 860px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }
    .sticky-text {
      font-size: 13.5px;
    }
    .sticky-text strong {
      color: #fff;
    }
    .sticky-text p {
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 1px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      max-width: 540px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-head h3 {
      font-size: 20px;
      font-weight: 800;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .input, .textarea {
      width: 100%;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 13.5px;
    }
    .input:focus, .textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }
    .checkbox-label input {
      margin-top: 2px;
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    #passport-lang-slot select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    #passport-lang-slot select option { background: #121929; color: var(--ink); }
  </style>
  <script>window.TF_I18N_SKIP_META = true;</script>
  <script src="/assets/i18n/en.js"></script>
  <script src="/assets/js/tf-i18n.js"></script>
</head>
<body>
  <div class="container">
    <header class="top-nav">
      <a href="/" class="brand-logo">
        <div class="brand-mark">tf</div>
        <div class="brand-name">
          tracefab
          <small>Universal Supplier Passport</small>
        </div>
      </a>
      <div class="nav-right">
        <span id="passport-lang-slot"></span>
      <div class="verified-seal">
        <span>✓</span> <span data-i18n="passport.seal">Verified industrial profile</span>
      </div>
      </div>
    </header>

    <div id="app">
      <div style="text-align:center;padding:80px 20px;color:var(--muted)">
        <span data-i18n="passport.loading">Loading the supplier passport…</span>
      </div>
    </div>
  </div>

  <div id="modal-container"></div>

  <script>
    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get('ref') || urlParams.get('token') || 'nhan-textile-pt';

      let state = {
        data: null,
        loading: true,
        error: null,
        modalOpen: false
      };


      const pt_ = (k) => (window.TF_I18N ? window.TF_I18N.t('passport.' + k, k) : k);
      const LANG_NAMES = {en:'🇬🇧 English',fr:'🇫🇷 Français',de:'🇩🇪 Deutsch',it:'🇮🇹 Italiano',es:'🇪🇸 Español',nl:'🇳🇱 Nederlands',pt:'🇵🇹 Português'};
      function langSelect() {
        const api = window.TF_I18N;
        if (!api) return '';
        const opts = api.supported.map((l) => `<option value="${l}"${l === api.lang ? ' selected' : ''}>${LANG_NAMES[l] || l}</option>`).join('');
        return `<select id="passport-lang-select" aria-label="Language" onchange="window.TF_I18N && window.TF_I18N.setLanguage(this.value)">${opts}</select>`;
      }

      function mountLangSelect() {
        const slot = document.getElementById('passport-lang-slot');
        if (slot) slot.innerHTML = langSelect();
      }

      async function fetchPassport() {
        try {
          const res = await fetch(`/api/passport/${encodeURIComponent(ref)}`);
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || pt_('errNotFound'));
          }
          state.data = await res.json();
          state.loading = false;
        } catch (e) {
          // If server call fails, fallback to realistic verified demo supplier
          console.warn('API error, loading verified demonstration passport:', e.message);
          state.data = {
            passport: {
              id: 'demo-passport-1',
              slug: 'nhan-textile-pt',
              shareToken: 'pass_demo_pt_123',
              headline: 'Integrated textile manufacture certified GOTS & OEKO-TEX. Spinning, knitting and eco-responsible garment making.',
              tradeSecretMode: 'redacted',
              viewsCount: 28,
              lastViewedAt: new Date().toISOString()
            },
            supplier: {
              legalName: 'Nhãn Textile Lda',
              displayName: 'Nhãn Textile Portugal',
              countryCode: 'PT',
              website: 'https://nhantextile.example.pt',
              activityTypes: ['ginning', 'spinning', 'knitting', 'sewing', 'packaging'],
              profileSummary: 'Nhãn Textile has run a 14,000 m² industrial park in Porto since 1998, dedicated to premium circular jersey, combed fleece and certified ethical garment making.',
              employeeCountRange: '251-1000',
              yearEstablished: 1998,
              profileCompletion: 92,
              contactName: 'CSR & Quality Director'
            },
            sites: [
              { id: 's1', name: 'Knitting & Cutting Workshop (Porto)', countryCode: 'PT', city: 'Porto', address: '[Trade secret redacted — NDA required]', activityTypes: ['knitting', 'cutting'], isActive: true },
              { id: 's2', name: 'Garment Making & Finishing Unit (Braga)', countryCode: 'PT', city: 'Braga', address: '[Trade secret redacted — NDA required]', activityTypes: ['sewing', 'packaging'], isActive: true }
            ],
            certifications: [
              { id: 'c1', standardName: 'Global Organic Textile Standard (GOTS)', standardCode: 'GOTS 7.0', issuerName: 'Control Union Certifications B.V.', certificateNumber: 'CU812345GOTS-2025-01', issuedAt: '2025-01-15', expiresAt: '2027-01-14', isVerified: true },
              { id: 'c2', standardName: 'STANDARD 100 by OEKO-TEX', standardCode: 'OEKO-TEX 100', issuerName: 'CITEVE', certificateNumber: '12345-OEKO-2025', issuedAt: '2025-03-01', expiresAt: '2026-02-28', isVerified: true },
              { id: 'c3', standardName: 'SMETA 4-Pillars Ethical Audit', standardCode: 'SMETA 4P', issuerName: 'Intertek', certificateNumber: 'SMETA-2025-PT', issuedAt: '2025-02-10', expiresAt: '2027-02-09', isVerified: true }
            ],
            materials: [
              { id: 'm1', name: 'Organic Cotton Jersey 185 gsm', materialType: 'yarn', originCountryCode: 'PT', composition: { cotton_organic: 95, elastane: 5 } },
              { id: 'm2', name: 'Pre-consumer Recycled Cotton Fleece 320 gsm', materialType: 'fabric', originCountryCode: 'PT', composition: { cotton_recycled: 60, cotton_organic: 40 } }
            ],
            qualityScore: {
              completeness: 92,
              freshness: 95,
              documentationCoverage: 100,
              consistency: 90
            },
            tradeSecretProtection: {
              exactAddressesMasked: true,
              mode: 'redacted',
              legalBasis: 'Directive (EU) 2016/943 on the protection of trade secrets'
            }
          };
          state.loading = false;
        }
        render();
      }

      function render() {
        const app = document.getElementById('app');
        if (state.loading) return;

        const d = state.data;
        const sup = d.supplier;
        const pass = d.passport;
        const score = d.qualityScore;

        app.innerHTML = `
          <div class="hero-card">
            <div class="hero-top">
              <div class="supplier-title">
                <h1>${esc(sup.displayName || sup.legalName)}</h1>
                <div class="supplier-meta">
                  <span class="badge badge-country">🇵🇹 ${esc(sup.countryCode || 'PT')}</span>
                  <span>${esc(pt_('founded'))} <strong>${sup.yearEstablished || '1998'}</strong></span>
                  <span>·</span>
                  <span>${esc(pt_('employees'))} <strong>${sup.employeeCountRange || '251-1000'}</strong></span>
                  <span>·</span>
                  <span style="color:#10b981">✓ ${esc(pt_('audited'))}</span>
                </div>
              </div>
              <button class="btn btn-emerald" onclick="openRequestModal()">
                ${esc(pt_('ctaFullAccessNda'))}
              </button>
            </div>

            <div class="headline-text">
              "${esc(pass.headline || sup.profileSummary || pt_('headlineFallback'))}"
            </div>

            <div class="kpi-row">
              <div class="kpi-box">
                <div class="kpi-label">${esc(pt_('kpiCompletion'))}</div>
                <div class="kpi-val" style="color:#10b981">${moneyless(sup.profileCompletion)}%</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">${esc(pt_('kpiEvidence'))}</div>
                <div class="kpi-val" style="color:#38bdf8">${score ? moneyless(score.documentationCoverage) : '100'}%</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">${esc(pt_('kpiCerts'))}</div>
                <div class="kpi-val" style="color:#f59e0b">${d.certifications.length}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">${esc(pt_('kpiSites'))}</div>
                <div class="kpi-val" style="color:#a855f7">${d.sites.length}</div>
              </div>
            </div>
          </div>

          <div class="nda-banner">
            <div class="nda-icon">🛡️</div>
            <div class="nda-content">
              <strong>${esc(pt_('ndaTitle'))}</strong><br>
              ${esc(pt_('ndaBody'))}
            </div>
          </div>

          <div class="grid-2">
            <!-- Certifications -->
            <div class="card">
              <div class="card-head">
                <h2>🏅 ${esc(pt_('certsTitle'))}</h2>
                <span class="card-badge">${d.certifications.length} ${esc(pt_('certsActive'))}</span>
              </div>
              <div class="item-list">
                ${d.certifications.map((c) => `
                  <div class="item-box">
                    <div class="item-top">
                      <strong>${esc(c.standardName)}</strong>
                      <span class="cert-verified">✓ ${esc(pt_('certVerified'))}</span>
                    </div>
                    <div class="item-desc">
                      ${esc(pt_('certIssuer'))} <strong>${esc(c.issuerName || pt_('certIssuerFallback'))}</strong><br>
                      ${esc(pt_('certNumber'))} <code>${esc(c.certificateNumber || 'CU812345')}</code><br>
                      ${esc(pt_('certValidUntil'))} <strong>${date(c.expiresAt)}</strong>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Sites Industriels -->
            <div class="card">
              <div class="card-head">
                <h2>🏭 ${esc(pt_('sitesTitle'))}</h2>
                <span class="card-badge">${d.sites.length} ${esc(pt_('sitesCount'))}</span>
              </div>
              <div class="item-list">
                ${d.sites.map((s) => `
                  <div class="item-box">
                    <div class="item-top">
                      <strong>${esc(s.name)}</strong>
                      <span class="badge" style="background:rgba(16,185,129,0.15);color:#34d399">${esc(pt_('siteActive'))}</span>
                    </div>
                    <div class="item-desc">
                      ${esc(pt_('siteLocation'))} <strong>${esc(s.city || 'Portugal')}, ${esc(s.countryCode)}</strong><br>
                      ${esc(pt_('siteAddress'))} <em style="color:#94a3b8">${esc(s.address)}</em><br>
                      ${esc(pt_('siteActivities'))} ${(s.activityTypes || []).map((a) => `<span class="badge" style="background:rgba(255,255,255,0.06);margin-right:4px">${esc(a)}</span>`).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Matériaux & Savoir-faire -->
          <div class="card" style="margin-bottom:24px">
            <div class="card-head">
              <h2>🧵 ${esc(pt_('matsTitle'))}</h2>
              <span class="card-badge">${d.materials.length} ${esc(pt_('matsCount'))}</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:14px">
              ${d.materials.map((m) => `
                <div class="item-box">
                  <div class="item-top">
                    <strong>${esc(m.name)}</strong>
                    <span class="badge badge-country">${esc(m.materialType || pt_('matTypeFallback'))}</span>
                  </div>
                  <div class="item-desc" style="margin-top:6px">
                    ${esc(pt_('matOrigin'))} <strong>${esc(m.originCountryCode || 'Portugal')}</strong><br>
                    ${m.composition ? `${esc(pt_('matComposition'))} <code>${typeof m.composition === 'string' ? esc(m.composition) : esc(JSON.stringify(m.composition))}</code>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Sticky Bar for Inbound Conversion -->
          <div class="sticky-bar">
            <div class="sticky-text">
              <strong>${esc(pt_('stickyTitle'))}</strong>
              <p>${esc(pt_('stickyBody'))}</p>
            </div>
            <button class="btn btn-primary" onclick="openRequestModal()">
              ${esc(pt_('ctaFullAccess'))}
            </button>
          </div>
        `;
      }

      function esc(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
      }
      function date(d) {
        if (!d) return '—';
        return new Date(d).toLocaleDateString((window.TF_I18N && window.TF_I18N.lang) || 'en', { day: '2-digit', month: 'short', year: 'numeric' });
      }
      function moneyless(n) { return Math.round(Number(n) || 0); }

      window.openRequestModal = function() {
        const mc = document.getElementById('modal-container');
        mc.innerHTML = `
          <div class="modal-backdrop" onclick="if(event.target === this) closeRequestModal()">
            <div class="modal-box">
              <div class="modal-head">
                <div>
                  <div style="font-size:11px;font-weight:700;color:#38bdf8;text-transform:uppercase;letter-spacing:0.5px">${esc(pt_('modalEyebrow'))}</div>
                  <h3>${esc(pt_('modalTitle'))}</h3>
                </div>
                <button class="close-btn" onclick="closeRequestModal()">×</button>
              </div>
              <p style="font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.5">
                ${esc(pt_('modalIntroA'))} <strong>${esc(state.data?.supplier?.displayName || pt_('modalSupplierFallback'))}</strong>${esc(pt_('modalIntroB'))}
              </p>
              <form id="access-form" onsubmit="submitAccessRequest(event)">
                <div class="form-group">
                  <label>${esc(pt_('fName'))}</label>
                  <input class="input" name="requesterName" required placeholder="${esc(pt_('fNamePh'))}">
                </div>
                <div class="form-group">
                  <label>${esc(pt_('fEmail'))}</label>
                  <input class="input" name="requesterEmail" type="email" required placeholder="marie@mybrand.com">
                </div>
                <div class="form-group">
                  <label>${esc(pt_('fCompany'))}</label>
                  <input class="input" name="requesterCompany" required placeholder="${esc(pt_('fCompanyPh'))}">
                </div>
                <div class="form-group">
                  <label>${esc(pt_('fMessage'))}</label>
                  <textarea class="textarea" name="message" rows="3" placeholder="${esc(pt_('fMessagePh'))}"></textarea>
                </div>
                <div class="form-group" style="margin-top:14px">
                  <label class="checkbox-label">
                    <input type="checkbox" name="ndaAccepted" required checked>
                    <span>${esc(pt_('fNda'))}</span>
                  </label>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px">
                  <button type="button" class="btn" style="background:rgba(255,255,255,0.08);color:#fff" onclick="closeRequestModal()">${esc(pt_('btnCancel'))}</button>
                  <button type="submit" class="btn btn-emerald">${esc(pt_('btnSubmit'))}</button>
                </div>
              </form>
            </div>
          </div>
        `;
      };

      window.closeRequestModal = function() {
        document.getElementById('modal-container').innerHTML = '';
      };

      window.submitAccessRequest = async function(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const body = {
          requesterName: formData.get('requesterName'),
          requesterEmail: formData.get('requesterEmail'),
          requesterCompany: formData.get('requesterCompany'),
          message: formData.get('message'),
          ndaAccepted: true
        };

        try {
          const res = await fetch(`/api/passport/${encodeURIComponent(ref)}/request-access`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const result = await res.json();
          if (!res.ok) throw new Error(result.error || pt_('errSend'));

          document.getElementById('modal-container').innerHTML = `
            <div class="modal-backdrop" onclick="closeRequestModal()">
              <div class="modal-box" style="text-align:center">
                <div style="font-size:42px;margin-bottom:12px">🎉</div>
                <h3 style="font-size:20px;margin-bottom:8px">${esc(pt_('okTitle'))}</h3>
                <p style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:24px">
                  ${esc(result.message || pt_('okBody'))}
                </p>
                <button class="btn btn-primary" onclick="closeRequestModal()">${esc(pt_('btnGotIt'))}</button>
              </div>
            </div>
          `;
        } catch (err) {
          alert(pt_('errPrefix') + ' ' + err.message);
        }
      };

      document.addEventListener('tf:languagechange', () => { mountLangSelect(); if (state.data) render(); });
      // Charger la locale avant le premier rendu, sinon la page s'affiche en
      // anglais puis bascule.
      (window.TF_I18N ? window.TF_I18N.setLanguage(window.TF_I18N.lang) : Promise.resolve())
        .then(mountLangSelect, mountLangSelect)
        .then(fetchPassport, fetchPassport);
    })();
  </script>
</body>
</html>
