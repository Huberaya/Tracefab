<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="passport.metaTitle">Universal Supplier Passport | TRACEFAB Verified</title>
  <meta name="description" data-i18n-attr="content:passport.metaDesc" content="Universal Supplier Passport verified on Tracefab. Industrial identity, active certifications and traceability compliance under trade secret protection.">

  <!-- Open Graph -->
  <meta property="og:title" data-i18n-attr="content:passport.ogTitle" content="Universal Supplier Passport — TRACEFAB">
  <meta property="og:description" data-i18n-attr="content:passport.ogDesc" content="Industrial identity, certified sites and verified CSR compliance.">
  <meta property="og:type" content="profile">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="/assets/design-system/tracefab-core.css">
  <style>
    /* Passeport Fournisseur Universel — aligné sur le design system TRACEFAB.
       Surface sombre Deep Forest, accent émeraude parcimonieux, Inter Tight +
       JetBrains Mono. Les couleurs de statut viennent de l'échelle de confiance
       (--tf-trust-*), pas d'une palette décorative. */

    body {
      background: var(--tf-surface-dark);
      color: var(--tf-ink-inv);
      font-family: var(--tf-font-text);
      min-height: 100vh;
      /* Une seule lueur émeraude, très basse en opacité : la page doit rester
         lisible en monochrome. */
      background-image:
        radial-gradient(ellipse 70% 50% at 50% -10%, rgba(15, 185, 124, 0.10) 0%, transparent 70%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      /* La barre collante mesure ~84 px : la réserve en bas évite qu'elle
         recouvre la dernière carte. */
      padding: var(--tf-s7) var(--tf-gutter) 150px;
    }

    /* ---------- barre supérieure ---------- */
    header.top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--tf-s4);
      flex-wrap: wrap;
      margin-bottom: var(--tf-s7);
      padding-bottom: var(--tf-s4);
      border-bottom: 1px solid var(--tf-line-dark-soft);
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: var(--tf-s3);
      text-decoration: none;
      color: var(--tf-ink-inv);
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: var(--tf-r-sm);
      background: var(--tf-emerald);
      color: #04130d;
      display: grid;
      place-items: center;
      font-family: var(--tf-font-mono);
      font-weight: 500;
      font-size: var(--tf-size-xs);
      letter-spacing: var(--tf-track-tight);
    }
    .brand-name {
      font-weight: 600;
      font-size: var(--tf-size-md);
      letter-spacing: var(--tf-track-tight);
      line-height: 1.15;
    }
    .brand-name small {
      display: block;
      margin-top: 3px;
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-3xs);
      font-weight: 400;
      color: var(--tf-ink-inv-muted);
      letter-spacing: var(--tf-track-wider);
      text-transform: uppercase;
    }
    .nav-right { display: flex; align-items: center; gap: var(--tf-s3); flex-wrap: wrap; }
    .verified-seal {
      display: inline-flex;
      align-items: center;
      gap: var(--tf-s2);
      padding: 8px 14px;
      border-radius: var(--tf-r-sm);
      background: var(--tf-trust-verified-bg);
      border: 1px solid rgba(15, 185, 124, 0.32);
      color: var(--tf-emerald-bri);
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-2xs);
      font-weight: 500;
      letter-spacing: var(--tf-track-wide);
      text-transform: uppercase;
      min-height: 40px;
    }
    #passport-lang-slot select {
      background: var(--tf-forest-850);
      border: 1px solid var(--tf-line-dark);
      color: var(--tf-ink-inv);
      border-radius: var(--tf-r-sm);
      padding: 9px 12px;
      min-height: 40px;
      font-family: var(--tf-font-text);
      font-size: var(--tf-size-2xs);
      font-weight: 500;
      cursor: pointer;
    }
    #passport-lang-slot select option { background: var(--tf-forest-900); color: var(--tf-ink-inv); }

    /* ---------- carte d'en-tête ---------- */
    .hero-card {
      position: relative;
      overflow: hidden;
      background: var(--tf-forest-900);
      border: 1px solid var(--tf-line-dark-soft);
      border-radius: var(--tf-r-lg);
      padding: var(--tf-s8) var(--tf-layer-pad, var(--tf-s7));
      margin-bottom: var(--tf-s5);
    }
    /* Un seul filet émeraude, à la place du dégradé tricolore. */
    .hero-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, var(--tf-emerald) 0%, rgba(15, 185, 124, 0.12) 60%, transparent 100%);
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--tf-s5);
      flex-wrap: wrap;
    }
    .supplier-title h1 {
      font-family: var(--tf-font-display);
      font-size: var(--tf-size-d3);
      font-weight: 540;
      letter-spacing: var(--tf-track-tighter);
      line-height: 1.04;
      margin-bottom: var(--tf-s3);
      text-wrap: balance;
    }
    .supplier-meta {
      display: flex;
      align-items: center;
      gap: var(--tf-s3);
      color: var(--tf-ink-inv-muted);
      font-size: var(--tf-size-xs);
      flex-wrap: wrap;
    }
    .supplier-meta strong { color: var(--tf-ink-inv-soft); font-weight: 600; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: var(--tf-r-xs);
      background: rgba(242, 245, 243, 0.06);
      border: 1px solid var(--tf-line-dark-soft);
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-3xs);
      font-weight: 500;
      letter-spacing: var(--tf-track-wide);
      text-transform: uppercase;
      color: var(--tf-ink-inv-soft);
    }
    .badge-country { color: var(--tf-ink-inv); }
    .headline-text {
      margin-top: var(--tf-s5);
      max-width: var(--tf-max-text);
      font-size: var(--tf-size-lg);
      line-height: 1.5;
      color: var(--tf-ink-inv-soft);
      letter-spacing: var(--tf-track-tight);
    }

    /* ---------- bandeau d'indicateurs ---------- */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      margin-top: var(--tf-s7);
      padding-top: var(--tf-s6);
      border-top: 1px solid var(--tf-line-dark-soft);
    }
    .kpi-box { padding: 0 var(--tf-s5); border-left: 1px solid var(--tf-line-dark-faint); }
    .kpi-box:first-child { padding-left: 0; border-left: 0; }
    .kpi-label {
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-3xs);
      font-weight: 500;
      letter-spacing: var(--tf-track-wider);
      text-transform: uppercase;
      color: var(--tf-ink-inv-muted);
      margin-bottom: var(--tf-s3);
    }
    /* Chiffres en blanc cassé : l'émeraude est réservée aux signaux de
       confiance, pas à la décoration. */
    .kpi-val {
      font-family: var(--tf-font-display);
      font-size: var(--tf-size-n2);
      font-weight: 500;
      letter-spacing: var(--tf-track-tighter);
      line-height: 1;
      color: var(--tf-ink-inv);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- bandeau secret d'affaires ---------- */
    .nda-banner {
      display: flex;
      gap: var(--tf-s4);
      align-items: flex-start;
      padding: var(--tf-s5);
      margin-bottom: var(--tf-s5);
      border: 1px solid var(--tf-line-dark-soft);
      border-left: 2px solid var(--tf-trust-review);
      border-radius: var(--tf-r-md);
      background: var(--tf-trust-review-bg);
    }
    .nda-icon { font-size: var(--tf-size-lg); line-height: 1.2; opacity: .85; }
    .nda-content { font-size: var(--tf-size-xs); line-height: 1.6; color: var(--tf-ink-inv-soft); }
    .nda-content strong {
      display: block;
      margin-bottom: 5px;
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-2xs);
      font-weight: 500;
      letter-spacing: var(--tf-track-wide);
      text-transform: uppercase;
      color: #e3b85c;
    }

    /* ---------- cartes ---------- */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: var(--tf-s5);
      margin-bottom: var(--tf-s5);
    }
    .card {
      background: var(--tf-forest-900);
      border: 1px solid var(--tf-line-dark-soft);
      border-radius: var(--tf-r-lg);
      padding: var(--tf-s6);
    }
    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--tf-s3);
      padding-bottom: var(--tf-s4);
      margin-bottom: var(--tf-s5);
      border-bottom: 1px solid var(--tf-line-dark-soft);
    }
    .card-head h2 {
      font-family: var(--tf-font-display);
      font-size: var(--tf-size-xl);
      font-weight: 560;
      letter-spacing: var(--tf-track-tight);
      line-height: 1.2;
    }
    .card-badge {
      flex: none;
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-3xs);
      font-weight: 500;
      letter-spacing: var(--tf-track-wider);
      text-transform: uppercase;
      color: var(--tf-ink-inv-muted);
    }
    .item-list { display: flex; flex-direction: column; gap: var(--tf-s3); }
    .item-box {
      padding: var(--tf-s4);
      border: 1px solid var(--tf-line-dark-faint);
      border-radius: var(--tf-r-md);
      background: var(--tf-forest-850);
      transition: border-color .18s ease, background .18s ease;
    }
    .item-box:hover { border-color: var(--tf-line-dark); background: var(--tf-forest-800); }
    .item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--tf-s3);
      margin-bottom: var(--tf-s2);
    }
    .item-top strong {
      font-size: var(--tf-size-sm);
      font-weight: 600;
      letter-spacing: var(--tf-track-tight);
      color: var(--tf-ink-inv);
    }
    .cert-verified {
      flex: none;
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-3xs);
      font-weight: 500;
      letter-spacing: var(--tf-track-wide);
      text-transform: uppercase;
      color: var(--tf-emerald-bri);
    }
    .item-desc {
      font-size: var(--tf-size-xs);
      line-height: 1.75;
      color: var(--tf-ink-inv-muted);
    }
    .item-desc strong { color: var(--tf-ink-inv-soft); font-weight: 600; }
    .item-desc code {
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-2xs);
      color: var(--tf-ink-inv-soft);
      background: rgba(242, 245, 243, 0.05);
      padding: 1px 5px;
      border-radius: var(--tf-r-xs);
    }
    .item-desc em { font-style: normal; color: var(--tf-ink-inv-faint); }

    /* ---------- boutons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--tf-s2);
      min-height: 44px;
      padding: 12px 20px;
      border: 1px solid transparent;
      border-radius: var(--tf-r-sm);
      font-family: var(--tf-font-text);
      font-size: var(--tf-size-xs);
      font-weight: 600;
      letter-spacing: var(--tf-track-tight);
      cursor: pointer;
      text-decoration: none;
      transition: background .18s ease, border-color .18s ease, color .18s ease;
    }
    .btn-primary, .btn-emerald {
      background: var(--tf-emerald);
      border-color: var(--tf-emerald);
      color: #04130d;
    }
    .btn-primary:hover, .btn-emerald:hover {
      background: var(--tf-emerald-bri);
      border-color: var(--tf-emerald-bri);
    }
    .btn:focus-visible { outline: 2px solid var(--tf-emerald-bri); outline-offset: 2px; }

    /* ---------- barre collante ---------- */
    .sticky-bar {
      position: fixed;
      left: 50%;
      bottom: var(--tf-s5);
      transform: translateX(-50%);
      z-index: var(--tf-z-sticky);
      width: min(calc(100% - 2 * var(--tf-gutter)), 900px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--tf-s5);
      padding: var(--tf-s4) var(--tf-s5);
      border: 1px solid var(--tf-line-dark);
      border-radius: var(--tf-r-lg);
      background: rgba(9, 27, 21, 0.92);
      backdrop-filter: blur(14px);
      box-shadow: var(--tf-shadow-lg);
    }
    .sticky-text strong {
      display: block;
      font-size: var(--tf-size-sm);
      font-weight: 600;
      letter-spacing: var(--tf-track-tight);
      color: var(--tf-ink-inv);
    }
    .sticky-text p {
      margin-top: 3px;
      font-size: var(--tf-size-2xs);
      color: var(--tf-ink-inv-muted);
      line-height: 1.5;
    }
    .sticky-bar .btn { flex: none; }

    /* ---------- modale ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: var(--tf-z-modal);
      display: grid;
      place-items: center;
      padding: var(--tf-s5);
      background: rgba(2, 6, 5, 0.78);
      backdrop-filter: blur(6px);
    }
    .modal-box {
      width: min(100%, 540px);
      max-height: 88vh;
      overflow-y: auto;
      padding: var(--tf-s6);
      border: 1px solid var(--tf-line-dark);
      border-radius: var(--tf-r-lg);
      background: var(--tf-forest-900);
      box-shadow: var(--tf-shadow-lg);
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--tf-s4);
      margin-bottom: var(--tf-s5);
    }
    .modal-head h3 {
      font-family: var(--tf-font-display);
      font-size: var(--tf-size-2xl);
      font-weight: 560;
      letter-spacing: var(--tf-track-tighter);
      line-height: 1.1;
      margin-top: 4px;
    }
    .close-btn {
      flex: none;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--tf-line-dark-soft);
      border-radius: var(--tf-r-sm);
      background: transparent;
      color: var(--tf-ink-inv-muted);
      font-size: var(--tf-size-lg);
      line-height: 1;
      cursor: pointer;
      transition: color .18s ease, border-color .18s ease;
    }
    .close-btn:hover { color: var(--tf-ink-inv); border-color: var(--tf-line-dark); }
    .form-group { margin-bottom: var(--tf-s4); }
    .form-group label {
      display: block;
      margin-bottom: var(--tf-s2);
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-3xs);
      font-weight: 500;
      letter-spacing: var(--tf-track-wider);
      text-transform: uppercase;
      color: var(--tf-ink-inv-muted);
    }
    .input, .textarea {
      width: 100%;
      min-height: 44px;
      padding: 11px 13px;
      border: 1px solid var(--tf-line-dark);
      border-radius: var(--tf-r-sm);
      background: var(--tf-forest-950);
      color: var(--tf-ink-inv);
      font-family: var(--tf-font-text);
      font-size: var(--tf-size-sm);
      transition: border-color .18s ease;
    }
    .textarea { resize: vertical; line-height: 1.55; }
    .input::placeholder, .textarea::placeholder { color: var(--tf-ink-inv-faint); }
    .input:focus, .textarea:focus {
      outline: none;
      border-color: var(--tf-emerald);
      box-shadow: 0 0 0 3px rgba(15, 185, 124, 0.16);
    }
    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: var(--tf-s3);
      font-size: var(--tf-size-2xs);
      line-height: 1.6;
      color: var(--tf-ink-inv-muted);
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
      font-family: var(--tf-font-text);
    }
    .checkbox-label input {
      flex: none;
      width: 17px;
      height: 17px;
      margin-top: 1px;
      accent-color: var(--tf-emerald);
      cursor: pointer;
    }

    .badge-active {
      background: var(--tf-trust-verified-bg);
      border-color: rgba(15, 185, 124, 0.30);
      color: var(--tf-emerald-bri);
    }
    .item-top .badge { margin-right: 0; }
    .item-desc .badge { margin-right: 4px; }
    .modal-ok-mark {
      width: 52px;
      height: 52px;
      margin: 0 auto var(--tf-s4);
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--tf-trust-verified-bg);
      border: 1px solid rgba(15, 185, 124, 0.32);
      color: var(--tf-emerald-bri);
      font-size: var(--tf-size-xl);
    }

    .modal-eyebrow {
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-3xs);
      font-weight: 500;
      letter-spacing: var(--tf-track-wider);
      text-transform: uppercase;
      color: var(--tf-emerald-bri);
    }
    .modal-intro {
      margin-bottom: var(--tf-s5);
      font-size: var(--tf-size-xs);
      line-height: 1.65;
      color: var(--tf-ink-inv-muted);
    }
    .modal-intro strong { color: var(--tf-ink-inv-soft); font-weight: 600; }
    .modal-box--ok { text-align: center; }
    .modal-box--ok h3 { margin-top: 0; font-size: var(--tf-size-xl); }
    .btn-ghost {
      background: transparent;
      border-color: var(--tf-line-dark);
      color: var(--tf-ink-inv-soft);
    }
    .btn-ghost:hover { border-color: var(--tf-ink-inv-muted); color: var(--tf-ink-inv); }
    /* La mention NDA est une phrase juridique : elle doit echapper au
       traitement mono majuscule des libelles de formulaire. */
    .form-group .checkbox-label {
      font-family: var(--tf-font-text);
      font-size: var(--tf-size-2xs);
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      color: var(--tf-ink-inv-muted);
      line-height: 1.6;
      margin-bottom: 0;
    }

    .app-loading {
      text-align: center;
      padding: var(--tf-s10) var(--tf-s5);
      color: var(--tf-ink-inv-muted);
      font-family: var(--tf-font-mono);
      font-size: var(--tf-size-2xs);
      letter-spacing: var(--tf-track-wide);
      text-transform: uppercase;
    }

    /* ---------- responsive (doit rester en dernier) ---------- */
    @media (max-width: 760px) {
      .container { padding: var(--tf-s5) var(--tf-gutter) 170px; }
      .hero-card { padding: var(--tf-s6) var(--tf-s5); }
      .card { padding: var(--tf-s5); }
      .hero-top { flex-direction: column; align-items: stretch; }
      .hero-top .btn { width: 100%; }
      .kpi-row { grid-template-columns: repeat(2, 1fr); row-gap: var(--tf-s5); }
      .kpi-box:nth-child(odd) { padding-left: 0; border-left: 0; }
      .sticky-bar { flex-direction: column; align-items: stretch; gap: var(--tf-s3); text-align: left; }
      .sticky-bar .btn { width: 100%; }
      .modal-box { padding: var(--tf-s5); }
    }
    @media (max-width: 520px) {
      header.top-nav { align-items: flex-start; }
      .nav-right { width: 100%; justify-content: space-between; }
    }
  </style>
  <script>window.TF_I18N_SKIP_META = true;</script>
  <script src="/assets/i18n/en.js"></script>
  <script src="/assets/js/tf-i18n.js"></script>
</head>
<body>
  <div class="container">
    <header class="top-nav">
      <a href="/" class="brand-logo">
        <div class="brand-mark">tf</div>
        <div class="brand-name">
          tracefab
          <small>Universal Supplier Passport</small>
        </div>
      </a>
      <div class="nav-right">
        <span id="passport-lang-slot"></span>
      <div class="verified-seal">
        <span>✓</span> <span data-i18n="passport.seal">Verified industrial profile</span>
      </div>
      </div>
    </header>

    <div id="app">
      <div class="app-loading">
        <span data-i18n="passport.loading">Loading the supplier passport…</span>
      </div>
    </div>
  </div>

  <div id="modal-container"></div>

  <script>
    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get('ref') || urlParams.get('token') || 'nhan-textile-pt';

      let state = {
        data: null,
        loading: true,
        error: null,
        modalOpen: false
      };


      const pt_ = (k) => (window.TF_I18N ? window.TF_I18N.t('passport.' + k, k) : k);
      const LANG_NAMES = {en:'🇬🇧 English',fr:'🇫🇷 Français',de:'🇩🇪 Deutsch',it:'🇮🇹 Italiano',es:'🇪🇸 Español',nl:'🇳🇱 Nederlands',pt:'🇵🇹 Português'};
      function langSelect() {
        const api = window.TF_I18N;
        if (!api) return '';
        const opts = api.supported.map((l) => `<option value="${l}"${l === api.lang ? ' selected' : ''}>${LANG_NAMES[l] || l}</option>`).join('');
        return `<select id="passport-lang-select" aria-label="Language" onchange="window.TF_I18N && window.TF_I18N.setLanguage(this.value)">${opts}</select>`;
      }

      function mountLangSelect() {
        const slot = document.getElementById('passport-lang-slot');
        if (slot) slot.innerHTML = langSelect();
      }

      async function fetchPassport() {
        try {
          const res = await fetch(`/api/passport/${encodeURIComponent(ref)}`);
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || pt_('errNotFound'));
          }
          state.data = await res.json();
          state.loading = false;
        } catch (e) {
          // If server call fails, fallback to realistic verified demo supplier
          console.warn('API error, loading verified demonstration passport:', e.message);
          state.data = {
            passport: {
              id: 'demo-passport-1',
              slug: 'nhan-textile-pt',
              shareToken: 'pass_demo_pt_123',
              headline: 'Integrated textile manufacture certified GOTS & OEKO-TEX. Spinning, knitting and eco-responsible garment making.',
              tradeSecretMode: 'redacted',
              viewsCount: 28,
              lastViewedAt: new Date().toISOString()
            },
            supplier: {
              legalName: 'Nhãn Textile Lda',
              displayName: 'Nhãn Textile Portugal',
              countryCode: 'PT',
              website: 'https://nhantextile.example.pt',
              activityTypes: ['ginning', 'spinning', 'knitting', 'sewing', 'packaging'],
              profileSummary: 'Nhãn Textile has run a 14,000 m² industrial park in Porto since 1998, dedicated to premium circular jersey, combed fleece and certified ethical garment making.',
              employeeCountRange: '251-1000',
              yearEstablished: 1998,
              profileCompletion: 92,
              contactName: 'CSR & Quality Director'
            },
            sites: [
              { id: 's1', name: 'Knitting & Cutting Workshop (Porto)', countryCode: 'PT', city: 'Porto', address: '[Trade secret redacted — NDA required]', activityTypes: ['knitting', 'cutting'], isActive: true },
              { id: 's2', name: 'Garment Making & Finishing Unit (Braga)', countryCode: 'PT', city: 'Braga', address: '[Trade secret redacted — NDA required]', activityTypes: ['sewing', 'packaging'], isActive: true }
            ],
            certifications: [
              { id: 'c1', standardName: 'Global Organic Textile Standard (GOTS)', standardCode: 'GOTS 7.0', issuerName: 'Control Union Certifications B.V.', certificateNumber: 'CU812345GOTS-2025-01', issuedAt: '2025-01-15', expiresAt: '2027-01-14', isVerified: true },
              { id: 'c2', standardName: 'STANDARD 100 by OEKO-TEX', standardCode: 'OEKO-TEX 100', issuerName: 'CITEVE', certificateNumber: '12345-OEKO-2025', issuedAt: '2025-03-01', expiresAt: '2026-02-28', isVerified: true },
              { id: 'c3', standardName: 'SMETA 4-Pillars Ethical Audit', standardCode: 'SMETA 4P', issuerName: 'Intertek', certificateNumber: 'SMETA-2025-PT', issuedAt: '2025-02-10', expiresAt: '2027-02-09', isVerified: true }
            ],
            materials: [
              { id: 'm1', name: 'Organic Cotton Jersey 185 gsm', materialType: 'yarn', originCountryCode: 'PT', composition: { cotton_organic: 95, elastane: 5 } },
              { id: 'm2', name: 'Pre-consumer Recycled Cotton Fleece 320 gsm', materialType: 'fabric', originCountryCode: 'PT', composition: { cotton_recycled: 60, cotton_organic: 40 } }
            ],
            qualityScore: {
              completeness: 92,
              freshness: 95,
              documentationCoverage: 100,
              consistency: 90
            },
            tradeSecretProtection: {
              exactAddressesMasked: true,
              mode: 'redacted',
              legalBasis: 'Directive (EU) 2016/943 on the protection of trade secrets'
            }
          };
          state.loading = false;
        }
        render();
      }

      function render() {
        const app = document.getElementById('app');
        if (state.loading) return;

        const d = state.data;
        const sup = d.supplier;
        const pass = d.passport;
        const score = d.qualityScore;

        app.innerHTML = `
          <div class="hero-card">
            <div class="hero-top">
              <div class="supplier-title">
                <h1>${esc(sup.displayName || sup.legalName)}</h1>
                <div class="supplier-meta">
                  <span class="badge badge-country">${esc(sup.countryCode || 'PT')}</span>
                  <span>${esc(pt_('founded'))} <strong>${sup.yearEstablished || '1998'}</strong></span>
                  <span>·</span>
                  <span>${esc(pt_('employees'))} <strong>${sup.employeeCountRange || '251-1000'}</strong></span>
                  <span>·</span>
                  <span class="cert-verified">✓ ${esc(pt_('audited'))}</span>
                </div>
              </div>
              <button class="btn btn-emerald" onclick="openRequestModal()">
                ${esc(pt_('ctaFullAccessNda'))}
              </button>
            </div>

            <div class="headline-text">
              "${esc(pass.headline || sup.profileSummary || pt_('headlineFallback'))}"
            </div>

            <div class="kpi-row">
              <div class="kpi-box">
                <div class="kpi-label">${esc(pt_('kpiCompletion'))}</div>
                <div class="kpi-val">${moneyless(sup.profileCompletion)}%</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">${esc(pt_('kpiEvidence'))}</div>
                <div class="kpi-val">${score ? moneyless(score.documentationCoverage) : '100'}%</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">${esc(pt_('kpiCerts'))}</div>
                <div class="kpi-val">${d.certifications.length}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">${esc(pt_('kpiSites'))}</div>
                <div class="kpi-val">${d.sites.length}</div>
              </div>
            </div>
          </div>

          <div class="nda-banner">
                        <div class="nda-content">
              <strong>${esc(pt_('ndaTitle'))}</strong><br>
              ${esc(pt_('ndaBody'))}
            </div>
          </div>

          <div class="grid-2">
            <!-- Certifications -->
            <div class="card">
              <div class="card-head">
                <h2>${esc(pt_('certsTitle'))}</h2>
                <span class="card-badge">${d.certifications.length} ${esc(pt_('certsActive'))}</span>
              </div>
              <div class="item-list">
                ${d.certifications.map((c) => `
                  <div class="item-box">
                    <div class="item-top">
                      <strong>${esc(c.standardName)}</strong>
                      <span class="cert-verified">✓ ${esc(pt_('certVerified'))}</span>
                    </div>
                    <div class="item-desc">
                      ${esc(pt_('certIssuer'))} <strong>${esc(c.issuerName || pt_('certIssuerFallback'))}</strong><br>
                      ${esc(pt_('certNumber'))} <code>${esc(c.certificateNumber || 'CU812345')}</code><br>
                      ${esc(pt_('certValidUntil'))} <strong>${date(c.expiresAt)}</strong>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Sites Industriels -->
            <div class="card">
              <div class="card-head">
                <h2>${esc(pt_('sitesTitle'))}</h2>
                <span class="card-badge">${d.sites.length} ${esc(pt_('sitesCount'))}</span>
              </div>
              <div class="item-list">
                ${d.sites.map((s) => `
                  <div class="item-box">
                    <div class="item-top">
                      <strong>${esc(s.name)}</strong>
                      <span class="badge badge-active">${esc(pt_('siteActive'))}</span>
                    </div>
                    <div class="item-desc">
                      ${esc(pt_('siteLocation'))} <strong>${esc(s.city || 'Portugal')}, ${esc(s.countryCode)}</strong><br>
                      ${esc(pt_('siteAddress'))} <em>${esc(s.address)}</em><br>
                      ${esc(pt_('siteActivities'))} ${(s.activityTypes || []).map((a) => `<span class="badge">${esc(a)}</span>`).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Matériaux & Savoir-faire -->
          <div class="card" style="margin-bottom:24px">
            <div class="card-head">
              <h2>${esc(pt_('matsTitle'))}</h2>
              <span class="card-badge">${d.materials.length} ${esc(pt_('matsCount'))}</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:14px">
              ${d.materials.map((m) => `
                <div class="item-box">
                  <div class="item-top">
                    <strong>${esc(m.name)}</strong>
                    <span class="badge badge-country">${esc(m.materialType || pt_('matTypeFallback'))}</span>
                  </div>
                  <div class="item-desc" style="margin-top:6px">
                    ${esc(pt_('matOrigin'))} <strong>${esc(m.originCountryCode || 'Portugal')}</strong><br>
                    ${m.composition ? `${esc(pt_('matComposition'))} <code>${typeof m.composition === 'string' ? esc(m.composition) : esc(JSON.stringify(m.composition))}</code>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Sticky Bar for Inbound Conversion -->
          <div class="sticky-bar">
            <div class="sticky-text">
              <strong>${esc(pt_('stickyTitle'))}</strong>
              <p>${esc(pt_('stickyBody'))}</p>
            </div>
            <button class="btn btn-primary" onclick="openRequestModal()">
              ${esc(pt_('ctaFullAccess'))}
            </button>
          </div>
        `;
      }

      function esc(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
      }
      function date(d) {
        if (!d) return '—';
        return new Date(d).toLocaleDateString((window.TF_I18N && window.TF_I18N.lang) || 'en', { day: '2-digit', month: 'short', year: 'numeric' });
      }
      function moneyless(n) { return Math.round(Number(n) || 0); }

      window.openRequestModal = function() {
        const mc = document.getElementById('modal-container');
        mc.innerHTML = `
          <div class="modal-backdrop" onclick="if(event.target === this) closeRequestModal()">
            <div class="modal-box">
              <div class="modal-head">
                <div>
                  <div class="modal-eyebrow">${esc(pt_('modalEyebrow'))}</div>
                  <h3>${esc(pt_('modalTitle'))}</h3>
                </div>
                <button class="close-btn" onclick="closeRequestModal()">×</button>
              </div>
              <p class="modal-intro">
                ${esc(pt_('modalIntroA'))} <strong>${esc(state.data?.supplier?.displayName || pt_('modalSupplierFallback'))}</strong>${esc(pt_('modalIntroB'))}
              </p>
              <form id="access-form" onsubmit="submitAccessRequest(event)">
                <div class="form-group">
                  <label>${esc(pt_('fName'))}</label>
                  <input class="input" name="requesterName" required placeholder="${esc(pt_('fNamePh'))}">
                </div>
                <div class="form-group">
                  <label>${esc(pt_('fEmail'))}</label>
                  <input class="input" name="requesterEmail" type="email" required placeholder="marie@mybrand.com">
                </div>
                <div class="form-group">
                  <label>${esc(pt_('fCompany'))}</label>
                  <input class="input" name="requesterCompany" required placeholder="${esc(pt_('fCompanyPh'))}">
                </div>
                <div class="form-group">
                  <label>${esc(pt_('fMessage'))}</label>
                  <textarea class="textarea" name="message" rows="3" placeholder="${esc(pt_('fMessagePh'))}"></textarea>
                </div>
                <div class="form-group" style="margin-top:14px">
                  <label class="checkbox-label">
                    <input type="checkbox" name="ndaAccepted" required checked>
                    <span>${esc(pt_('fNda'))}</span>
                  </label>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px">
                  <button type="button" class="btn btn-ghost" onclick="closeRequestModal()">${esc(pt_('btnCancel'))}</button>
                  <button type="submit" class="btn btn-emerald">${esc(pt_('btnSubmit'))}</button>
                </div>
              </form>
            </div>
          </div>
        `;
      };

      window.closeRequestModal = function() {
        document.getElementById('modal-container').innerHTML = '';
      };

      window.submitAccessRequest = async function(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const body = {
          requesterName: formData.get('requesterName'),
          requesterEmail: formData.get('requesterEmail'),
          requesterCompany: formData.get('requesterCompany'),
          message: formData.get('message'),
          ndaAccepted: true
        };

        try {
          const res = await fetch(`/api/passport/${encodeURIComponent(ref)}/request-access`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const result = await res.json();
          if (!res.ok) throw new Error(result.error || pt_('errSend'));

          document.getElementById('modal-container').innerHTML = `
            <div class="modal-backdrop" onclick="closeRequestModal()">
              <div class="modal-box modal-box--ok">
                <div class="modal-ok-mark">✓</div>
                <h3 >${esc(pt_('okTitle'))}</h3>
                <p class="modal-intro">
                  ${esc(result.message || pt_('okBody'))}
                </p>
                <button class="btn btn-primary" onclick="closeRequestModal()">${esc(pt_('btnGotIt'))}</button>
              </div>
            </div>
          `;
        } catch (err) {
          alert(pt_('errPrefix') + ' ' + err.message);
        }
      };

      document.addEventListener('tf:languagechange', () => { mountLangSelect(); if (state.data) render(); });
      // Charger la locale avant le premier rendu, sinon la page s'affiche en
      // anglais puis bascule.
      (window.TF_I18N ? window.TF_I18N.setLanguage(window.TF_I18N.lang) : Promise.resolve())
        .then(mountLangSelect, mountLangSelect)
        .then(fetchPassport, fetchPassport);
    })();
  </script>
</body>
</html>
