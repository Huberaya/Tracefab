# Déclenchement manuel de la validation Preview
# Parcours HTTP sur la Preview de la PR #101. Aucun service local ni mock.
#
# workflow_dispatch exige que le fichier existe sur la branche par defaut.
# Comme cette PR ne doit pas etre fusionnee, le push est une voie alternative
# strictement limitee a la branche de la mission et DESACTIVEE par defaut.
# Un administrateur doit d'abord definir la variable de depot
# TF_PREVIEW_PUSH_ENABLED=1. Les relecteurs obligatoires et la politique de
# branche de l'environnement restent applicables dans les DEUX cas.
#
# Les ecritures exigent en plus une attestation explicite de l'administrateur
# sur la nature TEST du deploiement, de la base, de Clerk, du bucket et de
# l'antivirus. Une origine et un SHA autorises doivent correspondre exactement.
# Cette attestation ne remplace pas la verification reelle de ces services.

name: Preview HTTP — parcours authentifies reels

on:
  push:
    branches:
      - 'arena/647ac97c-tracefab'
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Origine HTTPS de la Preview verifiee (doit correspondre a la variable protegee)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-http-journeys-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parcours:
    # Le push ne lance jamais de job privilegié sans opt-in ADMIN explicite.
    # Un job saute est NOT RUN, jamais une preuve de test reussi.
    if: ${{ github.ref == 'refs/heads/arena/647ac97c-tracefab' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.TF_PREVIEW_PUSH_ENABLED == '1')) }}
    name: Preview — parcours HTTP authentifies
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: tracefab-clerk-test
    env:
      NODE_VERSION: '20'
      TF_PREVIEW_HARNESS: '1'
      TRACEFAB_STAGING_URL: ${{ inputs.preview_url || vars.TF_PREVIEW_EXPECTED_ORIGIN }}
      TF_PREVIEW_EXPECTED_ORIGIN: ${{ vars.TF_PREVIEW_EXPECTED_ORIGIN }}
      TF_PREVIEW_STORAGE_HOST: ${{ vars.TF_PREVIEW_STORAGE_HOST }}
      TF_PREVIEW_DEPLOYED_SHA: ${{ vars.TF_PREVIEW_DEPLOYED_SHA }}
      TF_PREVIEW_TEST_ENV_CONFIRMED: ${{ vars.TF_PREVIEW_TEST_ENV_CONFIRMED }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      TF_PREVIEW_USER_ALPHA: ${{ secrets.TF_PREVIEW_USER_ALPHA }}
      TF_PREVIEW_USER_BETA: ${{ secrets.TF_PREVIEW_USER_BETA }}
      TF_PREVIEW_ORG_ALPHA: ${{ secrets.TF_PREVIEW_ORG_ALPHA }}
      TF_PREVIEW_ORG_BETA: ${{ secrets.TF_PREVIEW_ORG_BETA }}
      TF_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TF_PREVIEW_EVIDENCE: /tmp/tf-preview-evidence.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Presence des prerequis — sans afficher leurs valeurs
        run: |
          for name in CLERK_SECRET_KEY TF_PREVIEW_USER_ALPHA TF_PREVIEW_USER_BETA TF_PREVIEW_ORG_ALPHA TF_PREVIEW_ORG_BETA TF_VERCEL_BYPASS TF_PREVIEW_EXPECTED_ORIGIN TF_PREVIEW_STORAGE_HOST TF_PREVIEW_DEPLOYED_SHA TF_PREVIEW_TEST_ENV_CONFIRMED; do
            if [ -n "${!name:-}" ]; then echo "$name=present"; else echo "$name=absent"; fi
          done

      - name: Gardes du harnais — aucune connexion requise
        run: node scripts/test_preview_journeys_guards.mjs

      - name: Parcours HTTP authentifies sur la Preview
        # Le harnais refuse toute ecriture sans attestation, SHA/origine
        # approuves et organisations de test verifiees. Il garde la preuve en
        # JSON expurge meme si le pre-vol echoue ou qu'un parcours est bloque.
        run: node scripts/test_preview_http_journeys.mjs

      - name: Conserver uniquement la preuve JSON expurgee
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-http-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/tf-preview-evidence.json
          if-no-files-found: warn
          retention-days: 7
