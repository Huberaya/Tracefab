# P1 staging — execution reelle authentifiee sur une Preview Vercel.
#
# POURQUOI CE WORKFLOW EST SEPARE DU DIAGNOSTIC
#   Ce workflow est rattache a l'environnement GitHub `tracefab-clerk-test`,
#   qui porte les secrets de l'instance Clerk de TEST et le secret de la sonde
#   interne. Un environnement protege par des relecteurs et par une politique
#   de branche retient TOUT le run tant que la politique n'est pas levee : un
#   job de diagnostic partage avec lui ne tournerait donc jamais. D'ou la
#   separation : `p1-staging-surface.yml` mesure, ce workflow execute.
#
# CE QUE CE WORKFLOW FAIT, DANS L'ORDRE
#   0. pre-vol : verifie que la Preview repond comme l'application, et non
#      comme la protection de deploiement Vercel ;
#   1. fabrique trois sessions Clerk de test dans l'instance Clerk DE TEST
#      (aucune donnee de production), une par persona : marque A, fournisseur,
#      marque B dans une organisation distincte ;
#   2. ecrit trois etats de session Playwright dans l'espace de travail du
#      runner — jamais dans le depot, jamais en artefact, jamais dans un
#      journal ;
#   3. execute `npm run test:p1:staging` contre la Preview (URL fournie par
#      l'entree du job, pas une valeur codee en dur) ;
#   4. interroge la sonde d'identite DB runtime
#      `/api/internal/p2/readiness?identity=1` avec le secret UNIQUEMENT dans
#      l'en-tete HTTP, et n'affiche que des booleens et un nom de role.
#
# CE QUE CE WORKFLOW NE FAIT PAS
#   - il ne lit aucun secret de Production : la cle Clerk est une cle
#     `sk_test_` d'instance de test, refusee si elle commence par `sk_live_` ;
#   - il ne contacte aucune base Neon : le test P1 cible une Preview dont la
#     base est elle-meme un environnement de test ;
#   - il n'ecrit aucun fichier de suivi du depot (les etats de session restent
#     dans /tmp du runner) ;
#   - il n'imprime aucune valeur de secret, aucun cookie, aucun jeton.
#
# VARIABLES D'ENVIRONNEMENT ATTENDUES (et ou les trouver)
#   TRACEFAB_STAGING_URL                        — URL de la Preview (entree du job)
#   CLERK_SECRET_KEY                            — secret d'environnement, cle `sk_test_`
#   TRACEFAB_NOTIFICATION_WORKER_SECRET         — secret d'exploitation de la Preview
#   VERCEL_AUTOMATION_BYPASS_SECRET (optionnel) — contournement de la protection
#                                                 de deploiement Vercel

name: P1 staging — execution authentifiee (environnement protege)

on:
  push:
    branches:
      - 'arena/88857a44-tracefab'
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'URL de base de la Preview Vercel a tester (https://...vercel.app)'
        required: false
        default: 'https://tracefab-ccbx6uau5-baya-ibraimmayoanouedu-8164s-projects.vercel.app'

permissions:
  contents: read

concurrency:
  group: p1-staging-authenticated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p1-staging:
    name: P1 — staging authentifie sur Preview
    environment: tracefab-clerk-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_VERSION: '20'
      TRACEFAB_STAGING_URL: ${{ github.event.inputs.preview_url || 'https://tracefab-ccbx6uau5-baya-ibraimmayoanouedu-8164s-projects.vercel.app' }}
      TRACEFAB_PREVIEW_URLS: ${{ github.event.inputs.preview_url || 'https://tracefab-ccbx6uau5-baya-ibraimmayoanouedu-8164s-projects.vercel.app' }}
      TF_P1_STATE_DIR: /tmp/p1-storage-states
      # Le nom du secret n'est pas impose : plusieurs noms usuels sont
      # acceptes, le premier non vide gagne. Un secret absent donne une
      # chaine vide, jamais une erreur.
      TRACEFAB_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || secrets.VERCEL_PROTECTION_BYPASS_SECRET || secrets.VERCEL_BYPASS_SECRET }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || secrets.CLERK_TEST_SECRET_KEY || secrets.CLERK_INSTANCE_SECRET_KEY }}
      TF_WORKER_SECRET: ${{ secrets.TRACEFAB_NOTIFICATION_WORKER_SECRET || secrets.TRACEFAB_STAGING_WORKER_SECRET || secrets.TRACEFAB_WORKER_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Presence des secrets necessaires aux etapes suivantes — sans afficher leur valeur
        # Distingue deux echecs qu'il faut distinguer : un secret ABSENT de
        # l'environnement, et un secret PRESENT mais faux (la Preview reste
        # alors protegee et le pre-vol le dit). La valeur n'est jamais
        # affichee, ni comparee, ni journalisee.
        #
        # SCOPE : ce garde-fou ne verifie que les secrets dont les etapes
        # SUIVANTES dependent reellement. Le secret de la sonde d'identite
        # (TF_WORKER_SECRET) n'est requis que par la DERNIERE etape (la sonde
        # d'identite DB) : exiger ici son presence interromprait les tests
        # d'isolation, qui n'en dependent pas, et transformerait un manque de
        # secret de sonde en perte totale de preuves. Il est donc verifie a
        # l'endroit ou il sert, et la ou il manque, l'echec est nomme.
        run: |
          if [ -n "${TRACEFAB_VERCEL_BYPASS:-}" ]; then
            echo "::notice title=P1 staging::secret_bypass=present"
          else
            echo "::error title=P1 staging::secret_bypass=absent de l'environnement tracefab-clerk-test"
            exit 1
          fi
          if [ -n "${CLERK_SECRET_KEY:-}" ]; then
            echo "::notice title=P1 staging::secret_clerk=present"
          else
            echo "::error title=P1 staging::secret_clerk=absent de l'environnement tracefab-clerk-test"
            exit 1
          fi

      - name: Pre-vol — la Preview repond-elle comme l application ?
        # Une Preview derriere la protection de deploiement Vercel repond 302
        # vers /sso-api : le runner atteint la protection, pas l'application.
        # Detecter cela ici evite un echec illisible plus loin. En mode
        # strict, l'absence de reponse applicative arrete le job.
        env:
          TF_PROBE_STRICT: '1'
        run: node scripts/probe_preview_surface.mjs

      - name: Inspection — comptes et organisations de test deja presents
        env:
          TF_P1_PHASE: inspect
        run: node scripts/prepare_p1_staging_sessions.mjs

      - name: Preparer les trois sessions Clerk de test
        env:
          TF_P1_PHASE: provision
        run: node scripts/prepare_p1_staging_sessions.mjs

      - name: Executer la suite P1 staging
        env:
          TRACEFAB_P1_BRAND_STORAGE_STATE: /tmp/p1-storage-states/brand.json
          TRACEFAB_P1_SUPPLIER_STORAGE_STATE: /tmp/p1-storage-states/supplier.json
          TRACEFAB_P1_SECOND_BRAND_STORAGE_STATE: /tmp/p1-storage-states/second-brand.json
        run: npm run test:p1:staging

      - name: Sonde d'identite DB runtime sur la Preview
        # Le secret de la sonde est verifie ICI, et pas plus tot : c'est la
        # seule etape qui en depend. Son absence ne doit donc pas priver le
        # dossier des preuves d'isolation deja mesurees ; elle doit etre
        # nommee, avec l'action exacte pour la lever.
        run: |
          if [ -n "${TF_WORKER_SECRET:-}" ]; then
            echo "::notice title=P1 staging::secret_sonde=present"
          else
            echo "::error title=P1 staging::secret_sonde=absent de l'environnement tracefab-clerk-test — deposer TRACEFAB_NOTIFICATION_WORKER_SECRET (valeur de la Preview) dans l'environnement tracefab-clerk-test ; les tests d'isolation ci-dessus restent valides"
            exit 1
          fi
          node scripts/probe_preview_runtime_identity.mjs
