          const names = ['20261108119900_assert_neon_worker_preflight','20261108120000_ingest_plm_graphe_versionne','20261108120100_worker_fonctions_systeme_completes','20261108120200_corrections_p106_ownership_et_appartenance','20261108120300_acl_colonnes_bornees_au_runtime','20261108120400_lien_graphe_statut_enum_type','20261108120500_lecture_users_requise_par_les_politiques','20261108120600_lecture_orders_requise_par_le_runtime','20261108120700_assert_worker_membership_revoked'];
          for (const key of ['DATABASE_URL','TF_ADMIN_URL']) { if(!process.env[key]) throw new Error(key+' absent'); const u=new URL(process.env[key]); if(u.hostname===productionHost||u.hostname.startsWith('ep-polished-night')||u.hostname.includes('-pooler')||u.pathname!=='/neondb') throw new Error('Cible interdite ou connexion non directe'); }
          const c=new pg.Client({connectionString:process.env.DATABASE_URL}), a=new pg.Client({connectionString:process.env.TF_ADMIN_URL}); await c.connect(); await a.connect();
          try {
            const x=(await c.query("select current_user r,current_database() d,current_setting('neon.branch_id',true) b")).rows[0], y=(await a.query("select current_user r,current_database() d,current_setting('neon.branch_id',true) b")).rows[0];
            if(x.r!=='tracefab_migrator'||y.r!=='neondb_owner'||x.d!=='neondb'||y.d!=='neondb'||x.b!==expectedBranch||y.b!==expectedBranch) throw new Error('Identité de branche/base/rôle incorrecte');
            const rows=(await c.query("select migration_name,finished_at,rolled_back_at from public._prisma_migrations")).rows, pending=names.filter(n=>!rows.some(r=>r.migration_name===n&&r.finished_at&&!r.rolled_back_at)), failed=rows.filter(r=>!r.finished_at&&!r.rolled_back_at), applied=rows.filter(r=>r.finished_at&&!r.rolled_back_at);
            if(applied.length!==86||failed.length!==0||pending.length!==9) throw new Error('État initial inattendu : attendu 86 appliquées, 0 en échec, 9 ciblées en attente');
            const disk=readdirSync('prisma/migrations').filter(n=>/^\d/.test(n)&&statSync(join('prisma/migrations',n)).isDirectory()&&existsSync(join('prisma/migrations',n,'migration.sql'))).sort();
            if(disk.length!==95||disk.filter(n=>!applied.some(r=>r.migration_name===n)).length!==9||names.some(n=>!disk.includes(n))) throw new Error('Le différentiel disque/base ne correspond pas exactement aux neuf migrations ciblées');
            console.log('PASS Repair : branche, rôles, base et différentiel exacts confirmés ; aucune écriture.');
          } finally { await c.end(); await a.end(); }
