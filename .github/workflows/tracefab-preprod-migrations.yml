        run: node scripts/provisionner_worker_neon.mjs --etat
        continue-on-error: true
        id: worker_state
      - name: Provisionner et vérifier le rôle worker (si nécessaire)
        if: steps.worker_state.outcome == 'failure'
        env:
          DATABASE_URL: ${{ secrets.TRACEFAB_REPAIR_DATABASE_URL }}
          TF_ADMIN_URL: ${{ secrets.TRACEFAB_REPAIR_ADMIN_URL }}
          TF_ALLOW_WORKER_ROLE_SWAP: 'oui'
          TF_EXPECTED_DATABASE_HOST: ${{ secrets.TRACEFAB_REPAIR_DATABASE_URL }}
          TF_EXPECTED_DATABASE_NAME: neondb
          TF_PRODUCTION_HOSTS: ep-polished-night-b1jc5941.c-5.eu-central-1.aws.neon.tech
        run: |
          node --input-type=module <<'NODE'
          const u = new URL(process.env.TF_EXPECTED_DATABASE_HOST);
          process.env.TF_EXPECTED_DATABASE_HOST = u.hostname;
