name: P11 Preview — postflight P10.7

on:
  push:
    branches:
      - arena/b8fe1a44-tracefab

permissions:
  contents: read

concurrency:
  group: tracefab-p11-preview-p107-postflight
  cancel-in-progress: false

jobs:
  verify-preview-p11:
    if: ${{ github.event.head_commit.message == 'VERIFY P11 PREVIEW POSTFLIGHT' }}
    runs-on: ubuntu-latest
    environment: tracefab-p11-preview
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Validate postflight script
        run: node --check scripts/verification_p107_preview_migration.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify P10.7 migration, ACLs, 13 guards and HMAC
        env:
          DATABASE_URL: ${{ secrets.TRACEFAB_P11_DATABASE_ADMIN_URL }}
        run: node scripts/verification_p107_preview_migration.mjs postflight
