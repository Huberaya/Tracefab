# TRACEFAB — Diagnostic Vercel/Neon via GitHub Actions
# Ce workflow est TEMPORAIRE. Il doit être supprimé après usage.
name: Diagnostic
on:
  workflow_dispatch:
    inputs:
      vercel_token:
        description: 'Vercel API token'
        required: false
        type: string

jobs:
  diagnostic:
    name: Diagnostic Vercel/Neon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostic Vercel
        if: ${{ inputs.vercel_token != '' }}
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token }}
        run: |
          echo "=== Vercel User ==="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user
          echo ""

          echo "=== Vercel Projects ==="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v9/projects 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              projects = data.get('projects', [])
              for p in projects:
                  print(f\"  Project: {p.get('name')} | ID: {p.get('id')} | Framework: {p.get('framework')}\")
          except Exception as e:
              print(f'  Error parsing: {e}')
          "

          echo ""
          echo "=== Finding tracefab project ID ==="
          PROJECT_ID=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v9/projects 2>/dev/null | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for p in data.get('projects', []):
              if p.get('name') == 'tracefab':
                  print(p['id'])
                  break
          " 2>/dev/null)

          if [ -n "$PROJECT_ID" ]; then
            echo "  tracefab project ID: $PROJECT_ID"

            echo ""
            echo "=== Recent Deployments ==="
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&limit=5" 2>/dev/null | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            for d in data.get('deployments', []):
                print(f\"  {d.get('uid','?')[:10]} | {d.get('environment','?')} | {d.get('state','?')} | {d.get('created','?')}\")
            "

            echo ""
            echo "=== Environment Variables (names only) ==="
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$PROJECT_ID/env" 2>/dev/null | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            for e in data.get('envs', []):
                key = e.get('key', '?')
                target = ', '.join(e.get('target', []))
                print(f'  {key} (target: {target})')
            "

            echo ""
            echo "=== Build Logs (latest production) ==="
            LATEST_DEP=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&limit=1&target=production" 2>/dev/null | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            deps = data.get('deployments', [])
            if deps:
                print(deps[0].get('uid', ''))
            " 2>/dev/null)

            if [ -n "$LATEST_DEP" ]; then
              echo "  Latest production deployment: $LATEST_DEP"
              echo "  Build logs:"
              curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v5/deployments/$LATEST_DEP/events?direction=backward&limit=50" 2>/dev/null | python3 -c "
              import json, sys
              data = json.load(sys.stdin)
              for ev in data if isinstance(data, list) else []:
                  text = ev.get('text', ev.get('message', ''))
                  if text:
                      print(f'    {text[:200]}')
              " 2>/dev/null
            fi
          else
            echo "  tracefab project not found"
          fi

      - name: Diagnostic Production
        run: |
          echo "=== GET /api/health ==="
          curl -sS -i --max-time 15 https://tracefab.vercel.app/api/health || echo "FAILED"
          echo ""
          echo "=== GET /api/catalog/schemas ==="
          curl -sS -i --max-time 15 https://tracefab.vercel.app/api/catalog/schemas || echo "FAILED"
          echo ""
          echo "=== GET /api/config ==="
          curl -sS -i --max-time 15 https://tracefab.vercel.app/api/config || echo "FAILED"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-results
          path: /dev/stdout
          if-no-files-found: ignore