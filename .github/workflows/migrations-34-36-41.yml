# TRACEFAB — intégration migrations #34 / #36 / #41 sur Postgres 17 jetable.
# Aucun secret. Aucune URL distante. Ne fusionne rien.
name: Intégration migrations 34/36/41

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'scripts/test_migration_integration_34_36_41.sh'
      - 'scripts/test_prisma_migrate_deploy_checksum_variance.mjs'
      - 'scripts/test_plm_gs1_catalog_repair_postgres.mjs'
      - '.github/workflows/migrations-34-36-41.yml'
      - 'prisma/migrations/**'
  push:
    paths:
      - 'scripts/test_migration_integration_34_36_41.sh'
      - 'scripts/test_prisma_migrate_deploy_checksum_variance.mjs'
      - '.github/workflows/migrations-34-36-41.yml'
      - 'prisma/migrations/**'
  workflow_dispatch:

concurrency:
  group: migint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-jetable:
    name: Chaîne 34/36/41 sur Postgres 17 jetable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracefab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACEFAB_H1_4_MODE: jetable
      TF_INTEGRATION_THROWAWAY: oui
      TRACEFAB_H1_4_CIBLE: locale
      TRACEFAB_H1_4_CONFIRM_READONLY: oui
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tracefab_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tracefab_test
      TF_APP_PASSWORD: isolation_ci_jetable
      TF_RLS_APP_URL: postgresql://tracefab_app:isolation_ci_jetable@localhost:5432/tracefab_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Récupérer les SHA #34 et #41 sans fusion
        run: |
          git fetch origin pull/34/head:refs/tmp/pr34
          git fetch origin pull/41/head:refs/tmp/pr41
          git rev-parse refs/tmp/pr34
          git rev-parse refs/tmp/pr41

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run db:generate

      - name: Prisma deploy — checksum historique divergent et pending
        # Vérifie le vrai binaire Prisma sur le PostgreSQL 17 jetable :
        # un checksum déjà enregistré ne doit pas être réécrit, et la migration
        # suivante doit réellement s'appliquer. Le test crée son propre schéma
        # isolé et le détruit ensuite. Aucune cible Neon/Vercel n'est utilisée.
        run: npm run test:prisma:checksum-deploy
        env:
          TF_EXIGER_LOCAL: oui

      - name: Réparation PLM/GS1 — PostgreSQL 17 réel jetable
        run: npm run test:plm:gs1-repair-postgres
        env:
          TF_EXIGER_LOCAL: oui

      - name: Installer le client psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Intégration A (neuve) et B (10120000 tardif)
        run: bash scripts/test_migration_integration_34_36_41.sh

      - name: Inventaire RLS après migration #25 — compteurs et zéro non classé
        shell: bash
        run: |
          psql -X --no-password -v ON_ERROR_STOP=1 -At -F '|' <<'SQL'
          WITH policies AS (
            SELECT tablename, policyname,
                   coalesce(qual, '') || ' ' || coalesce(with_check, '') AS expression
              FROM pg_catalog.pg_policies
             WHERE schemaname = 'public'
               AND tablename NOT IN (
                 'organizations', 'organization_memberships',
                 'organization_invitations', 'rate_limit_counters',
                 'tracefab_schema_catalog', 'dpp_requirement_profiles',
                 'green_claims_rules', 'pef_emission_factors'
               )
          )
          SELECT
            count(*) AS policies_total,
            count(*) FILTER (WHERE expression ~* 'tracefab_in_active_tenant\\(') AS active_tenant_policies,
            count(*) FILTER (WHERE expression ~* 'tracefab_(is_org_member|has_org_role|can_access_org)\\(') AS membership_helper_policies,
            count(*) FILTER (WHERE expression ~* 'organization_memberships') AS direct_membership_policies,
            count(*) FILTER (
              WHERE (
                expression ~* 'tracefab_(is_org_member|has_org_role|can_access_org)\\('
                AND expression !~* 'tracefab_in_active_tenant\\('
              ) OR (
                expression ~* 'organization_memberships'
                AND expression !~* 'tracefab_in_active_tenant\\('
              )
            ) AS unresolved_policies
          FROM policies;
          SQL

      # La commande Prisma migrate deploy ci-dessus applique toute la chaîne
      # du checkout, dont 20261105250000_active_tenant_policy_and_worker_closure.
      # Ces suites exécutent ensuite les assertions métier sous tracefab_app
      # sur le même PostgreSQL 17 jetable, après provisionnement du rôle.
      - name: Isolation tenant actif — positifs et refus inter-tenant PostgreSQL 17
        run: npm run test:neon:active-tenant

      - name: Identité worker non falsifiable — PostgreSQL 17
        run: npm run test:neon:worker-non-forgeable

      - name: Isolation RLS inter-tenant — PostgreSQL 17
        run: npm run test:neon:cross-tenant
