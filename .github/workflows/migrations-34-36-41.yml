# TRACEFAB — intégration migrations #34 / #36 / #41 sur Postgres 17 jetable.
# Aucun secret. Aucune URL distante. Ne fusionne rien.
name: Intégration migrations 34/36/41

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'scripts/test_migration_integration_34_36_41.sh'
      - '.github/workflows/migrations-34-36-41.yml'
      - 'prisma/migrations/**'
  push:
    paths:
      - 'scripts/test_migration_integration_34_36_41.sh'
      - '.github/workflows/migrations-34-36-41.yml'
      - 'prisma/migrations/**'
  workflow_dispatch:

concurrency:
  group: migint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-jetable:
    name: Chaîne 34/36/41 sur Postgres 17 jetable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracefab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACEFAB_H1_4_MODE: jetable
      TF_INTEGRATION_THROWAWAY: oui
      TRACEFAB_H1_4_CIBLE: locale
      TRACEFAB_H1_4_CONFIRM_READONLY: oui
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tracefab_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tracefab_test
      TF_APP_PASSWORD: isolation_ci_jetable
      TF_RLS_APP_URL: postgresql://tracefab_app:isolation_ci_jetable@localhost:5432/tracefab_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Récupérer les SHA #34 et #41 sans fusion
        run: |
          git fetch origin pull/34/head:refs/tmp/pr34
          git fetch origin pull/41/head:refs/tmp/pr41
          git rev-parse refs/tmp/pr34
          git rev-parse refs/tmp/pr41

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run db:generate

      - name: Utiliser psql du conteneur PostgreSQL 17
        run: |
          container_id="$(docker ps --filter 'label=com.github.actions.service=postgres' --format '{{.ID}}' | head -n1)"
          if [[ -z "$container_id" ]]; then
            container_id="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n1)"
          fi
          test -n "$container_id"
          export TRACEFAB_PSQL_CONTAINER_ID="$container_id"
          echo "TRACEFAB_PSQL_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/psql-bin"
          cat > "$RUNNER_TEMP/psql-bin/psql" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${TRACEFAB_PSQL_CONTAINER_ID:?conteneur PostgreSQL 17 introuvable}"
          exec docker exec \
            -e PGHOST=127.0.0.1 \
            -e "PGPORT=${PGPORT:-5432}" \
            -e "PGUSER=${PGUSER:-postgres}" \
            -e "PGPASSWORD=${PGPASSWORD:-postgres}" \
            -e "PGDATABASE=${PGDATABASE:-tracefab_test}" \
            "$TRACEFAB_PSQL_CONTAINER_ID" psql "$@"
          EOF
          chmod +x "$RUNNER_TEMP/psql-bin/psql"
          echo "$RUNNER_TEMP/psql-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/psql-bin/psql" -X --no-password -v ON_ERROR_STOP=1 -tAc "SHOW server_version"

      - name: Rejouabilité P10.6 — runner sous admin/migrateur non-superusers
        run: node scripts/test_p106_rejouabilite_chaine.mjs

      - name: Intégration A (neuve) et B (10120000 tardif)
        run: bash scripts/test_migration_integration_34_36_41.sh
