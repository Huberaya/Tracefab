name: TraceFab — vérifier les connexions P11 et Repair

on:
  push:
    branches:
      - ops/p11-repair-neon-credentials-check-20261109
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tracefab-neon-credentials-check
  cancel-in-progress: false

jobs:
  verify-neon-credentials:
    name: Vérification des quatre connexions (lecture seule)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Installer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Vérifier le moteur Prisma en lecture seule sur P11
        env:
          DATABASE_URL: ${{ secrets.TRACEFAB_P11_DATABASE_URL }}
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
        run: npx prisma migrate status --schema prisma/schema.prisma

      - name: Vérifier le moteur Prisma en lecture seule sur Repair
        env:
          DATABASE_URL: ${{ secrets.TRACEFAB_REPAIR_DATABASE_URL }}
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
        run: npx prisma migrate status --schema prisma/schema.prisma

      - name: Vérifier les quatre connexions sans afficher les URI
        env:
          TRACEFAB_P11_DATABASE_URL: ${{ secrets.TRACEFAB_P11_DATABASE_URL }}
          TRACEFAB_P11_ADMIN_URL: ${{ secrets.TRACEFAB_P11_ADMIN_URL }}
          TRACEFAB_REPAIR_DATABASE_URL: ${{ secrets.TRACEFAB_REPAIR_DATABASE_URL }}
          TRACEFAB_REPAIR_ADMIN_URL: ${{ secrets.TRACEFAB_REPAIR_ADMIN_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';

          const targets = [
            ['P11 migrator', process.env.TRACEFAB_P11_DATABASE_URL, 'tracefab_migrator'],
            ['P11 admin', process.env.TRACEFAB_P11_ADMIN_URL, 'neondb_owner'],
            ['Repair migrator', process.env.TRACEFAB_REPAIR_DATABASE_URL, 'tracefab_migrator'],
            ['Repair admin', process.env.TRACEFAB_REPAIR_ADMIN_URL, 'neondb_owner'],
          ];
          const productionHost = 'ep-polished-night-b1jc5941.c-5.eu-central-1.aws.neon.tech';
          let failed = false;

          for (const [label, value, expectedRole] of targets) {
            if (!value) {
              console.error(`FAIL ${label}: secret absent ou indisponible pour ce workflow`);
              failed = true;
              continue;
            }
            let parsed;
            try { parsed = new URL(value); }
            catch {
              console.error(`FAIL ${label}: URI invalide (valeur masquée)`);
              failed = true;
              continue;
            }
            if (parsed.hostname === productionHost || parsed.hostname.startsWith('ep-polished-night')) {
              console.error(`FAIL ${label}: cible Production refusée`);
              failed = true;
              continue;
            }
            if (parsed.hostname.includes('-pooler') || parsed.pathname.replace(/^\//, '') !== 'neondb') {
              console.error(`FAIL ${label}: connexion directe à neondb requise`);
              failed = true;
              continue;
            }
            const client = new pg.Client({ connectionString: value, connectionTimeoutMillis: 10000, application_name: 'tracefab-neon-credentials-check' });
            try {
              await client.connect();
              const { rows } = await client.query('select current_user as role, current_database() as db');
              if (rows[0]?.role !== expectedRole || rows[0]?.db !== 'neondb') {
                console.error(`FAIL ${label}: rôle ou base inattendu`);
                failed = true;
              } else {
                console.log(`PASS ${label}: rôle et base confirmés`);
              }
            } catch {
              console.error(`FAIL ${label}: connexion refusée (détails masqués)`);
              failed = true;
            } finally {
              try { await client.end(); } catch {}
            }
          }

          for (const prefix of ['TRACEFAB_P11', 'TRACEFAB_REPAIR']) {
            const a = process.env[`${prefix}_DATABASE_URL`];
            const b = process.env[`${prefix}_ADMIN_URL`];
            if (!a || !b) continue;
            try {
              const ua = new URL(a), ub = new URL(b);
              if (ua.hostname !== ub.hostname || ua.pathname !== ub.pathname) {
                console.error(`FAIL ${prefix}: migrator et admin ne ciblent pas la même branche/base`);
                failed = true;
              } else {
                console.log(`PASS ${prefix}: migrator et admin ciblent la même branche/base`);
              }
            } catch {
              failed = true;
            }
          }

          if (failed) process.exit(1);
          console.log('VERDICT: quatre connexions vérifiées. Aucune écriture SQL effectuée.');
          NODE
