# P1 staging — diagnostic de surface (aucun secret, aucun environnement).
#
# POURQUOI CE WORKFLOW EXISTE
#   Le bac a sable d'analyse n'a aucun acces reseau a *.vercel.app (HTTP 000
#   mesure) ni a api.clerk.com : un test lance la n'atteindrait jamais
#   l'application, donc ne prouverait rien. Les runners GitHub ont un acces
#   Internet complet. L'execution reelle part donc d'ici.
#
# CE QUE CE WORKFLOW FAIT
#   Il mesure ce qui est mesurable sans privilege : la surface reelle de la
#   Preview — sante, configuration Clerk, presence de la sonde interne protegee.
#   Il ne lit AUCUN secret : une reference au contexte `secrets` ferait retenir
#   le run entier par la politique de protection du depot.
#
# CE QU'IL NE FAIT PAS
#   - il ne lit aucun secret, ni valeur ni nom ;
#   - il n'ecrit rien, ne cree aucun tenant, ne joint aucune base ;
#   - il n'est rattache a aucun environnement et ne lit aucun secret : il n'est
#     donc jamais retenu par une approbation, ce qui le rend toujours jouable.
#
# L'URL de la Preview n'est pas codee en dur : elle vient de l'entree
# `preview_url`, ce qui permet de rejouer le meme test sur un autre
# deploiement sans modifier le code.

name: P1 staging — diagnostic de surface

on:
  push:
    branches:
      - 'arena/88857a44-tracefab'
  pull_request:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'URL de base de la Preview Vercel a tester (https://...vercel.app)'
        required: false
        default: 'https://tracefab-m815yyk4e-baya-ibraimmayoanouedu-8164s-projects.vercel.app'

permissions:
  contents: read
  deployments: read

concurrency:
  group: p1-staging-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnostic — surface Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRACEFAB_PREVIEW_URLS: ${{ github.event.inputs.preview_url || 'https://tracefab-m815yyk4e-baya-ibraimmayoanouedu-8164s-projects.vercel.app,https://tracefab-ek0vg39c3-baya-ibraimmayoanouedu-8164s-projects.vercel.app' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Lister les deploiements Preview du depot
        # La protection de deploiement Vercel peut etre propre au projet ou a
        # un deploiement. Sans cette liste, on ne peut pas distinguer les deux
        # cas, donc on ne peut pas dire au proprietaire quoi changer.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/preview-urls.txt
          gh api "repos/${{ github.repository }}/deployments?per_page=30" \
            --jq '.[] | select(.environment == "Preview") | .id' > /tmp/deployment-ids.txt
          while read -r id; do
            [ -n "$id" ] || continue
            url="$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].environment_url // empty' || true)"
            [ -n "$url" ] && echo "$url" >> /tmp/preview-urls.txt
          done < /tmp/deployment-ids.txt
          sort -u /tmp/preview-urls.txt -o /tmp/preview-urls.txt
          echo "preview_deployements=$(wc -l < /tmp/preview-urls.txt)"

      - name: Preview — sante et configuration Clerk (prefixes seuls)
        env:
          TRACEFAB_PREVIEW_URLS_FILE: /tmp/preview-urls.txt
        run: node scripts/probe_preview_surface.mjs
