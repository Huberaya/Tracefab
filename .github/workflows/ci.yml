#
# TRACEFAB — integration continue
#
# Trois etages, du plus rapide au plus couteux, pour que l'echec le plus
# probable soit aussi le plus vite signale :
#
#   1. socle        types, compilation, isolation multi-locataires  (~1 min)
#   2. verification 63 scripts test:* + audit statique end-to-end
#   3. parcours     navigateur reel : 20 parcours, personas, phases 9-12
#
# L'etage base de donnees ne se declenche que si le secret DATABASE_URL existe,
# pour qu'un fork ou une contribution externe ne voie pas un echec qui ne lui
# appartient pas.
#
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # Une nouvelle poussee annule la precedente sur la meme reference : inutile de
  # payer deux fois pour un etat depasse.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  TF_BASE: http://127.0.0.1:3000

jobs:
  # --------------------------------------------------------------- 1. socle
  socle:
    name: Socle — types, compilation, isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run db:generate

      - name: Verification des types applicatifs
        run: npx tsc --noEmit

      - name: Verification des types de l'API
        run: npm run api:typecheck

      - name: Isolation multi-locataires
        # Toute route nouvelle doit declarer son modele d'acces. Une route non
        # classee et non authentifiee fait echouer cette etape.
        run: npm run test:cross-tenant

      - name: Garde-fous de mise en production
        # Barriere d'erreur centrale, caviardage des secrets reellement
        # execute, et contrat de variables d'environnement a jour.
        run: npm run test:production-readiness

  # -------------------------------------------------- 2. suite de verification
  verification:
    name: Verification — suite de tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: socle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run db:generate

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Compilation complete
        # `build` enchaine deja types, schema, routes, i18n et les tests de
        # chantier : c'est la porte d'entree historique du depot.
        run: npm run build

      - name: Audit statique end-to-end
        run: npm run audit:e2e

      - name: Demarrer le serveur de previsualisation
        # dev_static_server applique les reecritures de vercel.json. Servir
        # autrement reviendrait a tester un routage qui n'existe pas en production.
        run: |
          # nohup + redirection : sans cela le runner peut rester bloque en fin
          # de job sur le descripteur de sortie encore tenu par le serveur.
          nohup npm run serve > /tmp/serve.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf "$TF_BASE/" >/dev/null && echo "serveur pret" && exit 0
            sleep 0.5
          done
          echo "::error::le serveur n'a pas repondu sur $TF_BASE"
          cat /tmp/serve.log || true
          exit 1

      - name: Suite complete des scripts test:*
        # Les suites neon et staging exigent une base ou un environnement
        # deploye : elles ont leur propre etage.
        run: |
          set -u
          scripts=$(node -e "console.log(Object.keys(require('./package.json').scripts).filter(k=>k.startsWith('test:')&&!k.includes('neon')&&!k.includes('staging')&&k!=='test:p2').join(' '))")
          echoues=''
          for s in $scripts; do
            if npm run "$s" --silent >"/tmp/$s.log" 2>&1; then
              echo "OK    $s"
            else
              echo "ECHEC $s"
              echoues="$echoues $s"
            fi
          done
          if [ -n "$echoues" ]; then
            echo "::group::Journaux des suites en echec"
            for s in $echoues; do echo "----- $s -----"; tail -40 "/tmp/$s.log"; done
            echo "::endgroup::"
            echo "::error::suites en echec :$echoues"
            exit 1
          fi

      - name: Journaux en cas d'echec
        if: failure()
        run: tail -n 60 /tmp/*.log || true

  # ------------------------------------------------------------ 3. parcours
  parcours:
    name: Parcours — navigateur reel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: socle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run db:generate

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Demarrer le serveur de previsualisation
        run: |
          # nohup + redirection : sans cela le runner peut rester bloque en fin
          # de job sur le descripteur de sortie encore tenu par le serveur.
          nohup npm run serve > /tmp/serve.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf "$TF_BASE/" >/dev/null && echo "serveur pret" && exit 0
            sleep 0.5
          done
          echo "::error::le serveur n'a pas repondu sur $TF_BASE"
          cat /tmp/serve.log || true
          exit 1

      - name: 20 parcours end-to-end non mockes
        run: npm run test:journeys -- --base "$TF_BASE"

      - name: Trois personas — dirigeant, conformite, fournisseur
        # Critere d'acceptation du cahier des charges : si un persona se perd,
        # la livraison est refusee.
        run: npm run audit:personas

      - name: Phases 9 a 12 — tracabilite, DPP, passeport public, i18n
        run: npm run test:phases

      - name: Captures en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-parcours
          path: |
            .visual/**
            /tmp/*.png
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------- 4. base de donnees reelle
  base-de-donnees:
    name: Base — isolation RLS executee
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: socle
    # Sans secret, l'etage est saute plutot que rouge : un echec doit toujours
    # designer un vrai probleme.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verifier la presence du secret
        id: secret
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL absent : les scenarios croises executes sont sautes."
          fi

      - name: Installer les dependances
        if: steps.secret.outputs.present == 'true'
        run: npm ci

      - name: Generer le client Prisma
        if: steps.secret.outputs.present == 'true'
        run: npm run db:generate

      - name: Scenarios croises executes contre Postgres
        if: steps.secret.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run test:neon:security
          npm run test:neon:supplier
          npm run test:neon:product
          npm run test:neon:quality
          npm run test:neon:collection
