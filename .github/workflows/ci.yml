#
# TRACEFAB — integration continue
#
# Trois etages, du plus rapide au plus couteux, pour que l'echec le plus
# probable soit aussi le plus vite signale :
#
#   1. socle        types, compilation, isolation multi-locataires  (~1 min)
#   2. verification suites test:* sans base + audit statique end-to-end
#   3. parcours     navigateur reel : 20 parcours, personas, phases 9-12
#
# L'etage base de donnees monte un Postgres jetable : il ne lit aucun secret.
# Les suites qui ecrivent passent par scripts/run-db-suite.mjs, donc par la
# garde de cible — une cible non jetable est refusee meme fournie a la main.
#
name: CI

# Permissions minimales : les jobs de test ne publient ni ne modifient le dépôt.
permissions:
  contents: read

on:
  push:
    # Les branches de PR sont déjà couvertes par pull_request ci-dessous.
    # Limiter push à main évite deux runs concurrents sur le même SHA et un
    # required check bloqué par le doublon push alors que la CI PR est verte.
    branches: ['main']
  pull_request:
  workflow_dispatch:

concurrency:
  # Une nouvelle poussee annule la precedente sur la meme reference : inutile de
  # payer deux fois pour un etat depasse.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  TF_BASE: http://127.0.0.1:3000

jobs:
  # --------------------------------------------------------------- 1. socle
  socle:
    name: Socle — types, compilation, isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run db:generate

      - name: Verification des types applicatifs
        run: npx tsc --noEmit

      - name: Verification des types de l'API
        run: npm run api:typecheck

      - name: Isolation multi-locataires
        # Toute route nouvelle doit declarer son modele d'acces. Une route non
        # classee et non authentifiee fait echouer cette etape. Le controle
        # refuse aussi le repli sur toutes les organisations de l'utilisateur :
        # c'est le defaut Production du 2026-10-17 (produit de recette visible
        # depuis un autre tenant du meme compte).
        run: npm run test:cross-tenant

      - name: Contexte de locataire actif
        # Contrat du module api/_lib/tenant.ts : locataire obligatoire, valide,
        # fail-closed. Un locataire absent, mal forme ou non adherent ne doit
        # provoquer aucune requete metier.
        run: npm run test:active-tenant

      - name: Commentaires de fin de ligne dans les routes compactees
        # Un commentaire `//` dans une route ecrite sur une ligne met en
        # commentaire tout le handler, sans erreur de compilation.
        run: npm run test:minified-comments

      - name: Garde-fous de mise en production
        # Barriere d'erreur centrale, caviardage des secrets reellement
        # execute, et contrat de variables d'environnement a jour.
        run: npm run test:production-readiness

      - name: Historique des migrations — fail-closed
        run: npm run test:migration-history

      - name: CI sans acces production
        run: npm run test:ci-no-production-access

      - name: Garde de cible des suites destructives
        # Aucune suite qui ecrit en base ne s'execute sans avoir prouve que sa
        # cible est jetable. La garde est eprouvee dans les deux sens.
        run: npm run test:db-guard

      - name: Garde de prisma migrate deploy (base jetable)
        # db:deploy:throwaway refuse avant le binaire prisma. Aucune connexion.
        run: npm run test:db-throwaway

      - name: Routage des suites destructives
        # Toute suite ecrivant en base doit passer par le lanceur garde. Une
        # suite destructive non declaree fait echouer la CI.
        run: npm run test:db-routing

      - name: Politique des workflows
        # Aucun secret lu, aucune action non epinglee, aucun privilege
        # d'ecriture non declare.
        run: npm run test:workflow-policy

      - name: Controle du client Prisma — eprouve dans les deux sens
        run: npm run test:prisma-client

      - name: Client Prisma du paquet
        # Mode de defaillance exact de l'incident du 2026-10-12 : echoue si le
        # client n'est pas genere ou si le schema a evolue sans regeneration.
        run: npm run verify:prisma-client

      - name: Chargement des modules de route
        # Les 125 routes doivent se charger. Un client Prisma non initialise
        # fait echouer ce chargement, et la production repond alors
        # internal_error avec un identifiant de correlation.
        run: npm run test:router-load

      - name: Couverture HTTP de l'authentification des routes tenant
        # Appelle les gestionnaires réels sans bearer Clerk et sans URL DB.
        # Toute route tenant qui répond 2xx, 5xx ou ne refuse pas explicitement
        # l'accès anonyme fait échouer la CI.
        run: npm run test:route-auth-coverage

      - name: Couverture du contexte RLS des routes
        # Toute route authentifiee doit armer un contexte transactionnel ;
        # les lectures publiques de passeports doivent armer le contexte public.
        run: npm run test:route-context-coverage

      - name: Identité du rôle DB runtime — garde fail-closed
        # Vérifie le choix de TF_RLS_APP_URL et le contrat de la sonde réelle.
        run: npm run test:runtime-db-role-guard

      - name: Limitation de débit — dispense avant vérification du jeton
        run: npm run test:rate-limit

      - name: Garde statique des tables en ecriture directe
        # La liste des tables ou le role applicatif ecrit directement est une
        # decision de securite. Sans cette etape, rien n'empeche une route
        # d'ajouter un INSERT sur une table absente de la liste, ou la liste de
        # diverger du provisioning : les deux passeraient au vert en CI.
        run: npm run test:tables-ecriture-directe

      - name: Rapport d'ecarts de privileges — non-regression
        # Le lecteur en lecture seule compare l'etat mesure a la liste declaree.
        # Sans cette etape, il pourrait revenir a un jeu de tables fige et
        # presenter des tables volontairement en lecture seule comme inexpliquees.
        run: npm run test:disponibilite-role-app

      - name: Comparateur d'objets SQL — non-regression
        # C'est l'outil qui tranche sur les politiques et fonctions divergentes
        # d'une cible reelle. Un faux vert ici rendrait tout audit distant muet.
        run: npm run test:objets-sql:comparaison

      - name: Controle des migrations — coherence et horodatages
        # Deux controles statiques : coherence migrations/schema et unicite des
        # horodatages. Aucun des deux n'a besoin de base ni de client Prisma.
        run: npm run test:migrations:controle && npm run test:migrations:horodatages

      - name: Validation TLS jamais desactivee
        # Verifie qu'aucun chemin de connexion ne pose rejectUnauthorized: false
        # ni NODE_TLS_REJECT_UNAUTHORIZED=0. Une regression ici annulerait
        # tout le chantier C sans qu'aucun autre test ne rougisse.
        run: npm run test:tls:validation

      - name: Registre des chantiers — coherence avec le depot
        # Verifie que le registre ne presente pas un SHA obsolete comme etat
        # courant et que le compte de migrations cite correspond au depot.
        run: npm run test:chantiers

      - name: Reconciliation de l historique de migrations
        # Hors ligne : compare les empreintes SHA-256 recalculees du depot a un
        # export d historique. Aucune connexion, aucun secret. Eprouve dans les
        # deux sens par le test (export conforme, absent, divergent, annule).
        run: npm run test:reconciliation-historique

      - name: Releve M6 executable et inoffensif
        # Le script de diagnostic de production doit s executer sur le schema
        # complet (63 migrations, PGlite) et ne rien modifier. Un releve jamais
        # execute n est pas un diagnostic.
        run: npm run test:diagnostic-m6

      - name: Correctif supplier_portal — defaut reproduit puis corrige
        # La production refuse l invitation d un owner portant un relationship_id.
        # Ce test reproduit le refus sur l etat de production, applique la
        # migration corrective, verifie la non-regression (owner sans relation
        # reste refuse) et l idempotence, et controle qu aucun GRANT n est ajoute.
        run: npm run test:supplier-invitation-corrective

      - name: Divergences d empreinte — effet reel mesure
        # Trois migrations ont une empreinte de production differente du depot.
        # Une empreinte ne dit pas si le schema differe : ce test rejoue les deux
        # versions et compare ce que la base produit reellement (regle d
        # autorisation, GRANT conditionnel, objets RLS de reference).
        run: npm run test:divergences-migrations

      - name: Migrations hors bande — deux chemins, meme schema
        # Cinq migrations de production portent `applied_steps_count = 0` : leur
        # SQL a ete execute par des lanceurs, pas par `migrate deploy`. Ce test
        # rejoue la chaine privee des cinq (elle s arrete — elles sont
        # portantes), puis applique les cinq par les deux chemins sur deux bases
        # jetables et compare les catalogues objet par objet : tables, colonnes,
        # contraintes, index, politiques RLS, declencheurs, fonctions
        # (SECURITY DEFINER, search_path, proprietaire, EXECUTE de
        # tracefab_app et de PUBLIC), RLS forcee. Il mesure aussi la seule
        # difference reelle : l atomicite.
        run: npm run test:migrations:hors-bande

      - name: Reprise des migrations — incidents reproduits puis franchis
        # Sur PostgreSQL 18 (PGlite), meme majeure que Neon : les deux incidents
        # rapportes (refus de privilege sur public, conflit de signature de
        # fonction) sont reproduits avec leur code d erreur, le contenu du depot
        # les franchit, et les rejeux sont idempotents. Conditionne la surete du
        # plan de reprise, qui re-execute ces migrations.
        run: npm run test:reprise-migrations

  # -------------------------------------------------- 2. suite de verification
  verification:
    name: Verification — suite de tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: socle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run db:generate

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Compilation complete
        # `build` enchaine deja types, schema, routes, i18n et les tests de
        # chantier : c'est la porte d'entree historique du depot.
        run: npm run build

      - name: Audit statique end-to-end
        run: npm run audit:e2e

      - name: Demarrer le serveur de previsualisation
        # dev_static_server applique les reecritures de vercel.json. Servir
        # autrement reviendrait a tester un routage qui n'existe pas en production.
        run: |
          # nohup + redirection : sans cela le runner peut rester bloque en fin
          # de job sur le descripteur de sortie encore tenu par le serveur.
          nohup npm run serve > /tmp/serve.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf "$TF_BASE/" >/dev/null && echo "serveur pret" && exit 0
            sleep 0.5
          done
          echo "::error::le serveur n'a pas repondu sur $TF_BASE"
          cat /tmp/serve.log || true
          exit 1

      - name: Suite complete des scripts test:*
        # Les suites neon, staging et test:audit-script exigent une base ou un
        # environnement deploye : elles ont leur propre etage. test:audit-script
        # s'execute dans le job base de donnees contre PostgreSQL jetable.
        #
        # test:regression est exclu pour une raison differente et assumee : sa
        # reference est une image, donc liee a son environnement de rendu. Les
        # fontes distantes sont bloquees, mais le repli depend des polices
        # systeme, qui different entre le poste de developpement et le runner.
        # Le laisser ici le ferait rougir pour une raison etrangere au code ;
        # l'automatiser suppose de figer le rendu dans un conteneur.
        run: |
          set -u
          # Deux exclusions de plus, pour la meme raison que neon/staging : ces
          # suites exigent une base PostgreSQL fournie par l'operateur. Elles
          # s'executent dans le job « Base », sur le Postgres jetable, ou sur
          # une branche nommee. Les laisser ici les rendrait rouges pour une
          # raison d'environnement, jamais de code.
          #   test:dpp:review-publication — ecrit un tenant de test, garde de cible
          #   test:dpp:branche            — harnais d'exploitation, cible nommee
          #   test:dpp:role-applicatif    — exige un dossier reel + trois
          #     identifiants (produit, organisation, acteur) que la RLS empeche
          #     de decouvrir ; cible nommee, hors chaine automatique
          #   test:garde-fous:neon        — eprouve un verrou de commande, il a
          #     donc besoin d'une base ; il tourne dans le job « Base »
          scripts=$(node -e "console.log(Object.keys(require('./package.json').scripts).filter(k=>k.startsWith('test:')&&!k.includes('neon')&&!k.includes('staging')&&k!=='test:p2'&&k!=='test:regression'&&k!=='test:audit-script'&&k!=='test:dpp:review-publication'&&k!=='test:dpp:branche'&&k!=='test:dpp:role-applicatif'&&k!=='test:garde-fous:neon').join(' '))")
          echoues=''
          for s in $scripts; do
            if npm run "$s" --silent >"/tmp/$s.log" 2>&1; then
              echo "OK    $s"
            else
              echo "ECHEC $s"
              echoues="$echoues $s"
            fi
          done
          if [ -n "$echoues" ]; then
            echo "::group::Journaux des suites en echec"
            for s in $echoues; do echo "----- $s -----"; tail -40 "/tmp/$s.log"; done
            echo "::endgroup::"
            # Le journal d'un job est heberge hors de l'API GitHub. Sans
            # annotation, une suite en echec n'est qu'un nom : on sait QUOI,
            # jamais POURQUOI. Chaque suite publie donc la fin de son journal.
            for s in $echoues; do
              detail=$(tail -25 "/tmp/$s.log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | tr '\n' '\036' | sed -e 's/\x1e/%0A/g' -e 's/`//g')
              echo "::error title=$s::$detail"
            done
            echo "::error::suites en echec :$echoues"
            exit 1
          fi

      - name: Journaux en cas d'echec
        if: failure()
        run: tail -n 60 /tmp/*.log || true

  # ------------------------------------------------------------ 3. parcours
  parcours:
    name: Parcours — navigateur reel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: socle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run db:generate

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Demarrer le serveur de previsualisation
        run: |
          # nohup + redirection : sans cela le runner peut rester bloque en fin
          # de job sur le descripteur de sortie encore tenu par le serveur.
          nohup npm run serve > /tmp/serve.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf "$TF_BASE/" >/dev/null && echo "serveur pret" && exit 0
            sleep 0.5
          done
          echo "::error::le serveur n'a pas repondu sur $TF_BASE"
          cat /tmp/serve.log || true
          exit 1

      - name: 20 parcours end-to-end non mockes
        run: npm run test:journeys -- --base "$TF_BASE"

      - name: Un utilisateur, deux organisations — aucune fuite, aucun flash
        # Reproduction navigateur du defaut Production du 2026-10-17 : un
        # administrateur de Ginger et de Tracefab Recette Production voyait
        # depuis Ginger le produit RECETTE-DPP-20261017 du tenant de recette.
        # Verifie l'en-tete de locataire sur chaque appel prive, l'absence de
        # donnee du tenant precedent pendant le basculement (controle a
        # mi-requete), la persistance du locataire et l'absence de debordement
        # a 390 px. Le test monte son propre serveur sur le port 4181.
        run: npm run test:multi-tenant:browser

      - name: Trois personas — dirigeant, conformite, fournisseur
        # Critere d'acceptation du cahier des charges : si un persona se perd,
        # la livraison est refusee.
        run: npm run audit:personas

      - name: Phases 9 a 12 — tracabilite, DPP, passeport public, i18n
        run: npm run test:phases

      - name: Captures en cas d'echec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures-parcours
          path: |
            .visual/**
            /tmp/*.png
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------- 4. base de donnees reelle
  base-de-donnees:
    name: Base — isolation RLS executee
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: socle
    # Ce job ne depend plus d'aucun secret.
    #
    # Avant, il verifiait la presence de secrets.DATABASE_URL et sautait ses
    # etapes quand il etait absent. Le depot n'a jamais eu le moindre secret :
    # le job annoncait donc « isolation RLS executee » sans jamais rien
    # executer, et affichait vert. Un vert obtenu sans travail est pire qu'un
    # rouge : il eteint la vigilance.
    #
    # Brancher la base de production aurait ete le mauvais remede — exposer
    # des identifiants de production a tout workflow, et faire tourner
    # l'epreuve sur des donnees reelles. On monte un Postgres jetable a la
    # place : l'epreuve tourne a chaque poussee, y compris depuis un fork.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracefab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base jetable, detruite avec le runner. Le mot de passe n'ouvre rien.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tracefab_test
      TF_APP_PASSWORD: isolation_ci_jetable
      TF_RLS_APP_URL: postgresql://tracefab_app:isolation_ci_jetable@localhost:5432/tracefab_test
      # Aucun secret n'est injecte dans ce job, et le contexte `secrets` n'y
      # est plus lu du tout : `npm run test:workflow-policy` le verifie a
      # chaque execution.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run db:generate

      - name: Préparer le rôle applicatif avant migrations
        # Via le lanceur garde : refuse toute cible non jetable avant CREATE ROLE.
        run: npm run db:prepare-ci-role

      - name: Appliquer les migrations sur la base jetable
        # db:deploy:throwaway, PAS db:deploy. db:deploy est la commande
        # operationnelle sans garde. Ici : Postgres 17 du service CI,
        # DATABASE_URL = localhost/tracefab_test, aucun secret. La cible
        # est classee avant le binaire prisma local. Jamais npx.
        run: npm run db:deploy:throwaway

      - name: Privilèges et RLS effectifs — mesurés dans le catalogue
        # Une migration qui contient GRANT ne prouve pas ce que la base accorde.
        # Cet audit lit le catalogue : RLS activée ET forcée sur chaque table de
        # données, aucun droit d'écriture hors RLS, fonctions SECURITY DEFINER
        # avec search_path figé, aucune fonction exécutable par PUBLIC. Il sort
        # en 1 si l'une de ces propriétés tombe.
        run: npm run audit:privileges
        env:
          TF_EXIGER_LOCAL: oui

      - name: Privilèges SQL après migrations, avant le seed
        # Vérifie les GRANT conditionnels dans le scénario où tracefab_app
        # existe déjà, comme en production, avant que le seed n'accorde des droits.
        run: npm run test:neon:privileges

      - name: Garde propriétaire SQL — scénario de refus
        # Crée un objet PUBLIC EXECUTE possédé par un autre rôle et prouve que
        # la migration échouerait de façon explicite. Le script refuse tout hôte
        # autre que localhost/tracefab_test.
        run: node scripts/test_migration_owner_guard.mjs

      - name: Creer le role tracefab_app et deux locataires
        # Via npm run db:seed-rls, donc via la garde de cible : ce script cree
        # un role, accorde des privileges et ecrit des lignes. Meme sur la
        # base jetable de ce job, il ne s execute qu apres avoir prouve sa
        # cible — c est la garde, pas la bonne volonte, qui protege.
        run: npm run db:seed-rls

      - name: Isolation RLS prouvee par execution
        # Le role tracefab_app ne porte pas BYPASSRLS : les politiques sont
        # reellement evaluees. Le test echoue s'il ne peut pas s'executer.
        run: npm run test:neon:rls

      - name: Registre des fonctions runtime — perimetre et coherence
        # Bloquant. Echoue si (1) une fonction autorisee n'existe pas, (2) le
        # module TypeScript et la base divergent, (3) une fonction executable
        # existe hors registre, (4) le perimetre herite de 84 noms est perdu,
        # (5) la migration 20261021120000 a change de contenu, (6) une migration
        # posterieure accorde EXECUTE directement sans passer par le registre.
        # Sans ce controle, un elargissement silencieux passerait inapercu.
        run: npm run test:neon:registre-fonctions

      - name: L'identite worker n'est pas falsifiable — bloquant
        # CE TEST ECHOUE SUR LE CODE VULNERABLE, pas seulement il passe sur le
        # correctif : verifie le 28/10/2026 en remettant une politique sur le
        # GUC worker — la propriete 2 tombe immediatement.
        # Il prouve que tracefab_app ne peut plus lire organisations,
        # utilisateurs et adhesions en posant tracefab.worker_context, que les
        # six operations systeme fonctionnent sous identite autorisee, et
        # qu'aucun des deux roles ne peut endosser l'autre.
        run: npm run test:neon:worker-non-forgeable

      - name: Garde-fous de la commande de validation Neon
        # Neuf chemins d'arret eprouves par execution : arbre modifie, revision
        # inattendue, cible de production, cible non nommee, banc applicatif
        # incomplet, `db:deploy` en echec, migration exigee absente. Le banc
        # sort en 1 si un seul de ces cas rend un code nul — un faux succes.
        run: npm run test:garde-fous:neon

      - name: Inventaire des consommateurs de la base — un seul point d'entrée
        # Analyse statique : une seule variable de connexion, un seul client
        # Prisma, aucun secret de base dans les workflows, crons inventories.
        # Le banc a ete ecrit apres que la premiere version a compte deux
        # clients Prisma et un secret qui etaient... des commentaires.
        run: npm run test:inventaire:consommateurs

      - name: Garde-fous du recalcul réel — deux noms pour écrire
        # `--appliquer` ecrit. Ce banc prouve, sans ouvrir de connexion, qu'il
        # ne franchit pas les gardes sans deux noms concordants (cible +
        # confirmation), qu'il refuse la production, et qu'une simple lecture
        # ne demande, elle, qu'un seul nom.
        run: npm run test:garde-fous:recalcul

      - name: Colonnes différées — mesurable, différée, inattendue
        # Le verificateur d identite interroge des colonnes de revue creees par
        # les migrations EN ATTENTE : il echouait donc avant de pouvoir
        # autoriser la migration. Ce banc verrouille la distinction : une
        # colonne absente qu une migration en attente ajoute est DIFFEREE
        # (declaree), une colonne absente que rien n ajoute reste une
        # INCOHERENCE (echec). Une relaxation future qui rendrait le script
        # muet sur une vraie colonne manquante casse ce test.
        run: npm run test:colonnes-differees

      - name: Revue et publication — non-regression sur base migree
        # Neuf cas qui echouent si le recalcul efface une revue sans raison,
        # si un passeport publie devient incoherent, ou si l'idempotence
        # se perd. Tourne sur le Postgres jetable, APRES `prisma migrate
        # deploy` : c'est aussi une execution reelle du registre de
        # migrations, pas une reprise maison.
        run: npm run test:dpp:review-publication

      - name: Politiques d'ecriture — WITH CHECK reel, pas suppose
        # Cinq politiques d'ecriture sont declarees sans WITH CHECK. Ce n'est
        # pas une faille, mais la protection qui empeche un transfert de
        # propriete inter-organisations repose sur la coherence entre politiques
        # de lecture et d'ecriture. Le test le prouve par execution, avec un
        # role de sonde sans BYPASSRLS cree puis detruit, et il passe au rouge
        # si une politique permissive FOR ALL est ajoutee (controle negatif
        # verifie sur PostgreSQL 18.4).
        run: npm run test:neon:write-policies

      - name: Disponibilite a la bascule du runtime vers tracefab_app
        # Le runtime se connecte aujourd'hui avec neondb_owner, qui porte
        # BYPASSRLS : les politiques ne sont jamais evaluees en production.
        # Basculer vers tracefab_app les rend opposables, mais change ce que
        # chaque requete voit. Ce test rejoue sous tracefab_app reel les quatre
        # contextes que le code sait armer — public, authentifie, worker, et
        # l'ecriture anonyme — et exige le resultat attendu dans les deux sens.
        # Controle negatif verifie : une politique permissive ajoutee sur
        # tracefab_products le fait passer au rouge (3 echecs, sortie 1).
        run: npm run test:neon:app-readiness

      - name: Controle negatif — l isolement vient bien de la RLS
        # Une suite qui verifie « A ne voit rien de B » ne prouve rien si la
        # requete renverrait 0 dans tous les cas. Ce controle rejoue le MEME
        # contexte acteur et les MEMES requetes sous un role identique en tout
        # point mais dote de BYPASSRLS, et exige qu'il aboutisse : si le role
        # privilegie reussit la ou le role applicatif echoue, l'echec vient de
        # la RLS et non d'un artefact du test. Le role de sonde est detruit dans
        # un finally, et le script refuse toute URL Neon.
        run: npm run test:neon:bypass-control

      - name: Provenance DPP / Wallet
        run: npm run test:neon:dpp-provenance

      - name: Cycle de vie DPP dynamique — deux tenants
        # Epreuve non mockee : publication, preuve, correction, idempotence,
        # refus cross-tenant, historique, suspension et retrait public.
        run: npm run test:neon:dpp-lifecycle

      - name: Provisionnement auth runtime
        run: npm run test:neon:auth-provisioning

      - name: Deploiement publication explicite (jetable)
        run: npm run test:neon:deploiement-publication

      # Les trois routes POST de la PR sont Clerk-gatees : un POST non
      # authentifie doit rendre 401 sans creer ni modifier aucun document.
      # Aucun parcours de navigateur ne peut les valider, et un POST
      # authentifie sur upload-intent cree un document reel — seul le refus
      # est exercable. L'etape importe le repartiteur reel et lui passe trois
      # requetes depourvues d'en-tete authorization.
      #
      # Le gabarit de CLERK_SECRET_KEY est pose par le script lui-meme :
      # requireClerkUser teste la presence de la cle avant le jeton, donc sans
      # variable les routes repondent 503 clerk_not_configured sans atteindre
      # le controle. Sans en-tete authorization l'execution s'arrete sur
      # UnauthorizedError avant verifyToken et createClerkClient : la valeur
      # n'est jamais utilisee et aucun appel reseau vers Clerk n'est emis.
      #
      # Le script est execute par run-db-suite.mjs, qui lui applique la garde
      # de cible et choisit tsx — node nu ne saurait pas charger api/index.ts.
      - name: Ecriture refusee sans authentification sur les routes POST
        run: npm run test:neon:ecriture-non-authentifiee

      - name: Audit en lecture seule — la session ne peut pas ecrire
        # La lecture seule est appliquee par le serveur, et le test le prouve
        # en TENTANT une ecriture : elle doit etre refusee avec « read-only
        # transaction ». Le rapport est relu avant affichage pour verifier
        # qu il ne divulgue ni chaine de connexion ni identifiant.
        run: npm run test:audit-script

      - name: Privileges d execution des fonctions SECURITY DEFINER
        # Aucune fonction SECURITY DEFINER ne doit etre executable par PUBLIC,
        # et le role applicatif doit pouvoir executer ce dont les politiques
        # ont besoin. C'est la regression constatee : la migration
        # 20261009120000 a rendu tracefab_material_visible_via_product
        # executable par PUBLIC.
        run: npm run test:neon:privileges

      - name: Isolation inter-organisations
        # Prouve que deux organisations distinctes ne peuvent pas accéder aux
        # données de l'autre via INSERT, UPDATE, SELECT, DELETE ni fonctions SD.
        run: npm run test:neon:cross-tenant

      - name: Contexte de locataire actif en base
        # La RLS seule ne suffisait pas : le defaut Production du 2026-10-17
        # venait d'un filtre portant sur l'UNION des organisations d'un compte
        # membre de plusieurs tenants. Ce test se connecte avec UN utilisateur
        # reellement admin de deux organisations, et verifie que
        # `accessibleProduct` rend le produit sous son propre tenant et rien
        # sous l'autre — alors que la RLS seule laisse passer dans les deux cas.
        # Verifie aussi que le GUC ne survit pas a la transaction (pool de
        # connexions) et que les trois fonctions sont fermees a PUBLIC.
        run: npm run test:neon:active-tenant

      - name: Cycle de vie documentaire — visibilite, roles de scan, fail-closed
        # TF-2 : le proprietaire lit ses documents dans tous les etats non
        # supprimes, la finalisation exige un role ecrivain, aucun verdict
        # d'analyse absent ne devient « sain ».
        run: npm run test:neon:document-lifecycle

      - name: Privilèges minimaux du rôle applicatif — provisioning réel
        # Ce contrôle couvre un trou : `bootstrap_app_role.mjs` n'était exécuté
        # par aucune étape, donc les privilèges que reçoit vraiment tracefab_app
        # n'étaient mesurés nulle part. Les étapes précédentes emploient
        # `db:prepare-ci-role`, qui ne fait que CREATE ROLE sans aucun GRANT.
        #
        # Le contrôle crée sa PROPRE base éphémère dans le cluster, y applique
        # les migrations, exécute le provisioning réel, puis se reconnecte en
        # tracefab_app pour mesurer. Il ne touche pas tracefab_test, donc ne
        # modifie aucun privilège vu par les autres suites du même job.
        #
        # Il vérifie aussi le mécanisme de confinement réel : les migrations
        # accordent elles-mêmes DML ... TO PUBLIC, donc ce n'est pas le GRANT
        # qui confine mais la RLS — d'où l'exigence que toute table applicative
        # porte une RLS active et forcée.
        run: npm run test:neon:privileges-role-app

      - name: Ecarts de privileges — les deux sens eprouves sur base reelle
        # Le controle statique dit que le lecteur compare a la liste declaree ;
        # il ne dit pas qu'il detecte quoi que ce soit. Cette etape provoque un
        # sur-privilege puis un sous-privilege sur la base jetable, verifie que
        # chacun est nomme, puis restaure l'etat mesure au depart.
        run: npm run test:neon:ecarts-privileges

      - name: Isolation RLS sur lignes existantes — deux organisations
        # Les contrôles existants s'appuient sur has_table_privilege, sur la
        # présence de FORCE ROW LEVEL SECURITY, ou sur un DELETE ... WHERE false.
        # Aucun des trois ne prouve l'isolation : le premier ne dit que le droit
        # d'essayer, le deuxième ne dit pas qu'une politique filtre, et le
        # troisième n'examine aucune ligne — avec WHERE false la clause USING
        # n'est jamais évaluée.
        #
        # Ce contrôle crée deux organisations réelles, y insère des documents et
        # des produits réels, puis tente depuis l'une de lire, modifier et
        # supprimer les lignes de l'autre. Chaque refus est doublé d'un contrôle
        # positif sur les données propres, pour qu'une base vide ne puisse pas
        # passer pour de l'isolation.
        #
        # Il embarque son propre contrôle négatif : avec
        # ISOLATION_CONTROLE_NEGATIF=desactive_rls_documents, huit assertions
        # passent au rouge. C'est ce qui prouve qu'elles mesurent la RLS.
        run: npm run test:neon:isolation-lignes

      - name: Limitation de débit — opérations légitimes et abus refusés
        # La politique rate_limit_counters_global était FOR ALL USING (true)
        # WITH CHECK (true). Le USING (true) est justifié et conservé pour la
        # lecture, l'insertion et la mise à jour : la table n'a pas de locataire
        # et le limiteur compte des requêtes anonymes. Il ne l'était pas pour la
        # suppression.
        #
        # Risque reproduit sur base jetable sous le rôle applicatif : un DELETE
        # sans filtre supprimait les 3 compteurs d'un jeu de test, dont les 2
        # fenêtres actives. Le besoin légitime, vérifié sur tout le dépôt, se
        # limite à `DELETE ... WHERE expires_at < NOW()`.
        #
        # Ce contrôle vérifie d'abord le chemin réel — insertion, upsert qui
        # incrémente, nettoyage des fenêtres expirées — puis les abus : vidage
        # sans filtre, remise de hits à zéro, déplacement de fenêtre. Sans la
        # migration 20261019140000 il tombe à 8/18. Sans la seule garde sur
        # expires_at il tombe à 27/30 : raccourcir la fenêtre puis supprimer
        # suffit alors à éliminer un compteur actif en deux étapes autorisées.
        run: npm run test:neon:compteurs-debit

      - name: Sonde d'identité du runtime — justesse de l'instrument
        # Toute la sécurité du runtime repose sur la RLS, et la RLS ne
        # s'applique pas à un rôle qui porte BYPASSRLS. L'identité réellement
        # utilisée ne se déduit ni du code ni de la configuration attendue :
        # seul un current_user lu sur la connexion réelle le dit.
        #
        # Ce contrôle ne mesure PAS le runtime — il n'y a pas de runtime en CI.
        # Il vérifie que l'instrument est juste, pour que la mesure prise plus
        # tard sur l'environnement autorisé veuille dire quelque chose. La
        # requête est extraite du fichier source, pas recopiée, et doit
        # discriminer un rôle soumis (bypasses_rls false) du rôle propriétaire
        # (true). Il borne aussi ce que la sonde expose et vérifie que la route
        # interne authentifie avant de l'appeler.
        run: npm run test:neon:sonde-identite

      # ---------------------------------------------------------------------
      # Six suites qui n'etaient cablees dans AUCUN workflow
      # ---------------------------------------------------------------------
      # Elles existaient, portaient des assertions de securite et de parcours,
      # et ne tournaient nulle part : ni en CI, ni sur un poste. Un test qu'on
      # ne lance jamais ne protege rien, et son vert suppose est un mensonge.
      #
      # Elles tournent ici, sur le Postgres 17 jetable, avec DATABASE_URL (le
      # proprietaire) et non TF_RLS_APP_URL : ce sont des parcours qui creent
      # leurs propres organisations et utilisateurs, puis eprouvent la RLS en
      # se plaçant dans un role de test dedie.
      #
      # Deux corrections ont ete necessaires pour qu'elles mesurent vraiment
      # quelque chose, aucune ne les affaiblit :
      #   1. le role de test recoit SELECT sur les tables, comme le runtime
      #      (tracefab_app : SELECT sur les 51). Sans ce GRANT il s'arretait sur
      #      42501 AVANT la RLS : ce n'etait pas la politique qui refusait,
      #      c'etait l'absence de privilege, et le test ne prouvait rien ;
      #   2. l'ecriture directe par un viewer est acceptee comme refusee si elle
      #      l'est par le privilege (42501) OU par la RLS (0 ligne). L'assertion
      #      d'origine n'admettait que 0 ligne, ce qui supposait le DML accorde a
      #      PUBLIC — revoque par 20261014130000 et 20261023120000. Une ecriture
      #      reussie fait toujours echouer les deux formes.
      # ---------------------------------------------------------------------

      - name: Securite multi-tenant — isolation et refus de role
        # Cree un role de test, deux organisations, et verifie que la RLS
        # n'ouvre rien entre locataires : lecture des organisations et des
        # fournisseurs, ecriture directe refusee, et refus explicite de la
        # fonction de mise a jour de profil pour un viewer.
        run: npm run test:neon:security

      - name: Parcours produit — donnees, composition, identifiants
        # Cree deux marques, un produit et sa composition de chaque cote, puis
        # verifie l'isolation de lecture et le refus d'ecriture pour un viewer.
        run: npm run test:neon:product

      - name: Parcours fournisseur — invitation, partage, portee
        run: npm run test:neon:supplier

      - name: Parcours qualite — signalement, actions correctives, roles
        run: npm run test:neon:quality

      - name: Collecte de donnees — demandes, reponses, isolation
        run: npm run test:neon:collection

      # Non-regression 20261028130000 : les champs calcules d'un produit ne
      # dependent plus d'un GUC falsifiable — l'ecriture du role runtime est
      # colonne par colonne et exclut version/data_completion/data_readiness/
      # data_ready_at. Le test echoue sur l'etat vulnerable, pas seulement sur
      # le correctif, et verifie que l'INSERT et la revision fonctionnent encore.
      - name: Champs calcules produit — hors de portee du role runtime
        run: npm run test:neon:produit-champs-calcules

      - name: Quotas de stockage — calcul et refus au-dela du quota
        # Celui-ci passe par TF_RLS_APP_URL quand il est fourni ; il exige le
        # client Prisma, genere plus haut dans ce job.
        run: npm run test:neon:storage:chantier10
