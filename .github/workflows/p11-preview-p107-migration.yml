name: P11 Preview — migration P10.7

on:
  push:
    branches:
      - arena/b8fe1a44-tracefab

permissions:
  contents: read

concurrency:
  group: tracefab-p11-preview-p107-migration
  cancel-in-progress: false

jobs:
  migrate-preview-p11:
    if: ${{ github.event.head_commit.message == 'EXECUTE P11 PREVIEW MIGRATION' }}
    runs-on: ubuntu-latest
    environment: tracefab-p11-preview
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.TRACEFAB_P11_DATABASE_ADMIN_URL }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify target and exact pending migration
        run: node scripts/verification_p107_preview_migration.mjs preflight
      - name: Apply through Prisma only
        run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Verify schema, ACLs, guards and HMAC
        run: node scripts/verification_p107_preview_migration.mjs postflight
