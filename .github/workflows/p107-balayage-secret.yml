# Balayage de diagnostic — LECTURE SEULE, aucune valeur affichee.
# But : determiner dans QUEL environnement GitHub (s'il en existe un) le
# secret de sonde est provisionne. Un secret d'environnement n'est visible que
# par un job qui declare CET environnement : d'ou une matrice, un job par
# environnement.
name: P10.7 — balayage du secret de sonde
on:
  workflow_dispatch:
  push:
    branches:
      - 'release/p107-runtime-production-20261110'
permissions:
  contents: read
jobs:
  balayage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        env: [aucun, Preview, Production, tracefab-cleanroom, tracefab-clerk-test, tracefab-p11-preview, tracefab-preproduction]
    environment: ${{ matrix.env == 'aucun' && '' || matrix.env }}
    steps:
      - name: Presence du secret dans cet environnement
        env:
          JETON: ${{ secrets.TRACEFAB_RUNTIME_PROBE_TOKEN }}
          JETON2: ${{ secrets.RUNTIME_PROBE_TOKEN }}
        run: |
          set -u
          trouve="AUCUN"
          [ -n "${JETON:-}" ] && trouve="TRACEFAB_RUNTIME_PROBE_TOKEN"
          [ -n "${JETON2:-}" ] && trouve="$trouve+RUNTIME_PROBE_TOKEN"
          echo "environnement=${{ matrix.env }} -> $trouve"
          echo "::notice title=balayage ${{ matrix.env }} ::secret: $trouve"
