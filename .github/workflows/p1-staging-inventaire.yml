# P1 staging — inventaire des NOMS de secrets visibles.
#
# POURQUOI CE WORKFLOW EST ISSE
#   Une cle de test peut porter n'importe quel nom. Deviner des noms dans un
#   workflow serait une suite d'essais aveugles ; lister les noms est une
#   mesure. Un NOM n'est pas une valeur : scripts/list_secret_names.mjs
#   n'affiche que des noms, jamais une valeur, jamais un prefixe de valeur.
#
#   Ce workflow est declenche par `pull_request` et non par `push` : une
#   lecture du contexte `secrets` dans un workflow declenche par push est
#   retenue par la politique de protection du depot (run en `action_required`,
#   zero job). La PR vient de la meme branche et de la meme organisation que
#   la branche : le perimetre des secrets n'est pas elargi, seul le
#   declencheur change.
#
# CE QU'IL NE FAIT PAS
#   - il n'affiche aucune valeur ;
#   - il ne joint aucune base, ne deploie rien, ne contacte aucun tenant.

name: P1 staging — inventaire des noms de secrets

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-staging-inventaire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventaire:
    name: Inventaire — noms de secrets, aucune valeur
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Inventaire — noms de secrets visibles, aucune valeur
        env:
          TF_SECRET_NAMES: ${{ toJSON(secrets) }}
        run: node scripts/list_secret_names.mjs
