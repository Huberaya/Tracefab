<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passeport Numérique de Produit | TRACEFAB</title>
  <meta name="description" content="Passeport Numérique de Produit (DPP) : origine, matières, composition, fabrication, circularité et preuves, tels que déclarés dans TRACEFAB.">
  <meta property="og:title" content="Passeport Numérique de Produit | TRACEFAB">
  <meta property="og:description" content="Données produit déclarées, documentées et vérifiées. Les champs non renseignés sont affichés comme absents.">
  <meta property="og:type" content="product">

  <!-- Open Graph / Meta -->
  <meta property="og:description" content="Traçabilité certifiée de la fibre au vêtement fini. Conforme Règlementation Européenne ESPR.">
  <meta property="og:type" content="product">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CIRPASS / ESPR Compliant JSON-LD Digital Product Passport schema -->

  <style>
    :root {
      --primary: #0b7656;
      --primary-hover: #07523e;
      --primary-soft: #e4f3ec;
      --primary-glow: rgba(11, 118, 86, 0.2);

      --forest-900: #081712;
      --forest-800: #0e241c;
      --forest-700: #14352a;

      --bg-page: #f8faf8;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f2;

      --text-main: #13221b;
      --text-muted: #56675e;
      --text-subtle: #88988f;

      --border-light: #e4ede7;
      --border-medium: #cfded4;

      --status-verified: #0b7656;
      --status-verified-bg: #e4f3ec;
      --status-certified: #047857;
      --status-certified-bg: #d1fae5;
      --status-documented: #4f46e5;
      --status-documented-bg: #eef2ff;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 26px;
      --radius-full: 9999px;

      --shadow-sm: 0 2px 6px rgba(11, 27, 20, 0.04);
      --shadow-md: 0 8px 24px rgba(11, 27, 20, 0.07);
      --shadow-lg: 0 16px 40px rgba(11, 27, 20, 0.1);

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-main);
      background-color: var(--bg-page);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 70px;
    }

    /* Container for Mobile First DPP Experience */
    .dpp-container {
      width: min(580px, 100%);
      margin: 0 auto;
      background: var(--bg-surface);
      min-height: 100vh;
      border-left: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
      box-shadow: var(--shadow-md);
      position: relative;
    }

    /* Top Brand & Regulation Header */
    .dpp-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.95);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }
    .brand-id {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--forest-900);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px;
    }
    .brand-text strong {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: block;
      line-height: 1.1;
    }
    .brand-text span {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge-eu {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #3730a3;
      border-radius: var(--radius-full);
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: 0.02em;
    }
    .badge-eu svg {
      width: 14px;
      height: 14px;
      color: #4338ca;
    }

    /* Hero Product Section */
    .product-hero {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border-light);
      background: radial-gradient(circle at top right, #e8f5ed 0%, transparent 65%);
    }
    .product-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 3px 9px;
      border-radius: var(--radius-full);
      margin-bottom: 10px;
    }
    .product-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .product-meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .product-summary {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* Trust Pill Bar */
    .trust-pill-bar {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .trust-badge-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      box-shadow: var(--shadow-sm);
    }
    .trust-badge-item.verified {
      background: var(--status-verified-bg);
      color: var(--status-verified);
      border-color: #bbf7d0;
    }

    /* Tabbed Navigation inside DPP */
    .dpp-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg-surface);
      position: sticky;
      top: 65px;
      z-index: 40;
    }
    .dpp-tab-btn {
      flex: 1;
      padding: 13px 8px;
      text-align: center;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .dpp-tab-btn:hover {
      color: var(--text-main);
    }
    .dpp-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--primary-soft);
    }

    /* Section Wrapper */
    .tab-content-panel {
      padding: 24px 20px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    /* Composition Section */
    .composition-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .comp-bar {
      height: 12px;
      border-radius: var(--radius-full);
      background: #e6ede8;
      display: flex;
      overflow: hidden;
      margin: 12px 0 16px;
    }
    .comp-fill-1 { width: 85%; background: var(--primary); }
    .comp-fill-2 { width: 15%; background: #0284c7; }

    .comp-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }
    .comp-item:last-child {
      border-bottom: none;
    }
    .comp-item-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .comp-bullet {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Supply Chain Flow Timeline (Vertical on Mobile) */
    .trace-timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      margin-top: 14px;
    }
    .trace-timeline::before {
      content: "";
      position: absolute;
      top: 24px;
      bottom: 24px;
      left: 20px;
      width: 2px;
      background: #d4e2d8;
      z-index: 1;
    }
    .timeline-node {
      display: flex;
      gap: 16px;
      position: relative;
      z-index: 2;
    }
    .node-pin {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 2px solid var(--primary);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px var(--primary-glow);
      font-size: 14px;
    }
    .node-body {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      flex: 1;
      box-shadow: var(--shadow-sm);
    }
    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .node-header strong {
      font-size: 13.5px;
      font-weight: 750;
    }
    .node-tier-tag {
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 7px;
      border-radius: var(--radius-full);
    }
    .node-sub {
      font-size: 12px;
      color: var(--text-muted);
    }
    .node-proof {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-light);
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Environmental & Repair Section */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .info-card {
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
      border: 1px solid var(--border-light);
    }
    .info-card span {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .info-card strong {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
    }
    .info-card p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Care & Repair Guide */
    .care-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }
    .care-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg-subtle);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 16px;
    }
    .care-text strong {
      display: block;
      font-size: 13px;
    }
    .care-text span {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* Verification Badge & Proof Signature */
    .signature-card {
      margin: 24px 20px 0;
      background: var(--forest-900);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }
    .signature-card::before {
      content: "";
      position: absolute;
      top: -30px;
      right: -30px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(11, 118, 86, 0.35);
    }
    .sig-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .sig-logo {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: #10b981;
      color: #081712;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 12px;
    }
    .sig-top strong {
      font-size: 13px;
      letter-spacing: -0.02em;
    }
    .sig-hash {
      font-family: var(--font-mono);
      font-size: 10px;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      border-radius: 6px;
      word-break: break-all;
      color: #a3bfb2;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 10px;
    }

    /* JSON-LD Drawer & Modal */
    .jsonld-action-bar {
      margin: 18px 20px 0;
      display: flex;
      gap: 10px;
    }
    .btn-action {
      flex: 1;
      padding: 10px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-medium);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: var(--bg-subtle);
    }
    .btn-action-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-action-primary:hover {
      background: var(--primary-hover);
    }

    /* Raw JSON-LD Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 23, 18, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      place-items: center;
      padding: 20px;
    }
    .modal-overlay.open {
      display: grid;
    }
    .modal-window {
      background: #ffffff;
      border-radius: var(--radius-xl);
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .modal-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }
    .code-box {
      background: var(--forest-900);
      color: #a7f3d0;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      padding: 16px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      white-space: pre;
    }

    /* Footer in DPP */
    .dpp-footer {
      padding: 24px 20px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-subtle);
      border-top: 1px solid var(--border-light);
      margin-top: 30px;
    }
    .dpp-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
  </style>

  <script type="application/ld+json" id="dpp-jsonld">{}</script>
</head>

<body>
  <div class="dpp-container" id="dpp" aria-busy="true">
    <p class="section-desc">Chargement du passeport…</p>
  </div>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(location.search);
      const demo = (() => {
        const flag = params.get('demo');
        return flag === null ? false : !['0', 'false', 'off'].includes(String(flag).toLowerCase());
      })();
      const identifier = params.get('gtin') || params.get('ref') || params.get('id') || '';

      const state = { demo, identifier: identifier || (demo ? 'AT-ESS-001' : ''), dpp: null, links: null, loading: true, error: null, tab: 'produit' };

      /* Les onze rubriques du passeport. Chacune est rendue à partir du contrat
         réel de resolveDppPassData. Celles qui n'ont aucune source de données
         sont affichées comme non publiées, jamais complétées d'office. */
      const SECTIONS = [
        { id: 'produit', label: 'Produit' },
        { id: 'origine', label: 'Origine' },
        { id: 'matieres', label: 'Matières' },
        { id: 'composition', label: 'Composition' },
        { id: 'fabrication', label: 'Fabrication' },
        { id: 'certifications', label: 'Certifications' },
        { id: 'circularite', label: 'Circularité' },
        { id: 'entretien', label: 'Entretien' },
        { id: 'reparation', label: 'Réparation' },
        { id: 'tracabilite', label: 'Traçabilité' },
        { id: 'preuves', label: 'Preuves' },
      ];

      const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const num = (v, d = 2) => (v === null || v === undefined || Number.isNaN(Number(v)) ? '—' : Number(v).toLocaleString('fr-FR', { maximumFractionDigits: d }));

      /** Une valeur issue d'un repli n'est pas une mesure : on le dit. */
      const gap = (key) => (state.dpp?.dataGaps || []).includes(key);
      const gapNote = (label) => `<p class="section-desc" style="margin-top:10px"><strong>Valeur non mesurée.</strong> ${esc(label)}</p>`;

      function absent(title, why) {
        return `<div class="info-card">
          <div class="section-title">${esc(title)}</div>
          <p class="section-desc" style="margin:8px 0 0">${esc(why)}</p>
        </div>`;
      }

      async function load() {
        state.loading = true;
        state.error = null;
        render();
        try {
          if (state.demo) {
            const d = demoData();
            state.dpp = d.dpp;
            state.links = d.links;
          } else {
            if (!state.identifier) throw new Error('missing_identifier');
            const response = await fetch(`/api/dpp/${encodeURIComponent(state.identifier)}`);
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.error || `requete_echouee_${response.status}`);
            state.dpp = payload.dpp;
            state.links = payload.links;
          }
          applyJsonLd();
          document.title = `Passeport Numérique — ${state.dpp.productName} | TRACEFAB`;
        } catch (error) {
          state.error = error.message;
        }
        state.loading = false;
        render();
      }

      /* JSON-LD généré depuis les données réelles. Aucune signature ni empreinte
         n'est produite : TRACEFAB ne scelle pas cryptographiquement ce contenu. */
      function applyJsonLd() {
        const d = state.dpp;
        if (!d) return;
        const graph = {
          '@context': ['https://schema.org'],
          '@type': 'Product',
          name: d.productName,
          sku: d.sku,
          gtin: d.gtin || undefined,
          category: d.category,
          brand: { '@type': 'Brand', name: d.brandName },
        };
        if ((d.materials || []).length) {
          graph.material = d.materials.map((m) => `${num(m.percentage, 0)}% ${m.name}`).join(', ');
        }
        if (d.countryOfManufacture && !gap('countryOfManufacture')) graph.countryOfOrigin = d.countryOfManufacture;
        document.getElementById('dpp-jsonld').textContent = JSON.stringify(graph, null, 2);
      }

      function demoData() {
        return {
          dpp: {
            productId: 'demo-product-1',
            brandName: 'Atelier Tracefab',
            brandLegalName: 'Atelier Tracefab SAS',
            productName: 'Essentiel coton biologique',
            productReference: 'AT-ESS-001',
            sku: 'AT-ESS-001',
            gtin: '3760000000017',
            serialNumber: 'DPP-3760000000017-v2',
            category: 'T-shirt',
            countryOfManufacture: 'PT',
            countryOfDesign: 'FR',
            weightGrams: 165,
            certifiedComposition: '95% Coton biologique, 5% Élasthanne',
            materials: [
              { name: 'Coton biologique', percentage: 95, role: 'shell', originCountry: 'TR' },
              { name: 'Élasthanne', percentage: 5, role: 'trim', originCountry: 'IT' },
            ],
            pefScore: 78,
            pefGrade: 'B',
            carbonFootprintKgCo2e: 3.42,
            waterScarcityM3: 0.85,
            circularityScore: 85,
            dppUrl: 'https://tracefab.com/p/3760000000017',
            digitalLinkUri: 'urn:epc:id:sgtin:3760123.001.2',
            verificationDate: '2026-10-01',
            transactionCertificateNumber: 'TC-2026-00431',
            supplyChainSummary: 'Filature (TR) ➔ Tricotage (PT) ➔ Teinture (PT) ➔ Confection (PT)',
            careInstructions: 'Lavage en machine à 30°C sur envers avec couleurs similaires. Essorage doux (600 tr/min). Ne pas sécher en machine. Repassage à fer doux.',
            recyclingInstructions: 'Produit mono-matière hautement recyclable. En fin d’usage, déposer dans une borne textile Re-fashion ou rapporter en magasin.',
            dataGaps: ['pef', 'carbonFootprint', 'waterScarcity', 'circularity', 'careInstructions', 'recyclingInstructions'],
          },
          links: {
            appleWalletUrl: '/api/dpp/3760000000017/apple-wallet',
            googleWalletUrl: '/api/dpp/3760000000017/google-wallet',
            digitalLinkUri: 'urn:epc:id:sgtin:3760123.001.2',
          },
        };
      }

      /* ---------------------------------------------------------------- vues */

      function header() {
        const d = state.dpp;
        return `<header class="dpp-header">
          <div class="brand-id">
            <div class="brand-mark">tf</div>
            <div class="brand-text">TRACEFAB<small>Passeport Numérique de Produit</small></div>
          </div>
          ${state.demo ? '<span class="product-tag" style="background:#fdf3d7;color:#8f6417">Mode démonstration — données fictives</span>' : ''}
        </header>
        <section class="product-hero">
          <span class="product-tag">${esc(d.category || 'Textile')}</span>
          <h1 class="product-title">${esc(d.productName)}</h1>
          <p class="product-summary">${esc(d.brandName)} · Réf. ${esc(d.productReference)}</p>
          <div class="product-meta-row">
            <span class="badge-eu">Règlement ESPR — données déclaratives</span>
            ${d.gtin ? `<span>GTIN ${esc(d.gtin)}</span>` : ''}
            <span>Mis à jour le ${esc(d.verificationDate || '—')}</span>
          </div>
        </section>`;
      }

      function tabs() {
        return `<nav class="dpp-tabs" role="tablist" aria-label="Rubriques du passeport">
          ${SECTIONS.map((s) => `<button type="button" class="dpp-tab-btn${state.tab === s.id ? ' active' : ''}" data-tab="${s.id}" role="tab" aria-selected="${state.tab === s.id}">${esc(s.label)}</button>`).join('')}
        </nav>`;
      }

      function viewProduit() {
        const d = state.dpp;
        return `<h2 class="section-title">Produit</h2>
          <p class="section-desc">Identité du produit telle qu'enregistrée par la marque.</p>
          <div class="info-grid">
            <div class="info-card"><div class="section-desc">Désignation</div><strong>${esc(d.productName)}</strong></div>
            <div class="info-card"><div class="section-desc">Référence</div><strong>${esc(d.productReference)}</strong></div>
            <div class="info-card"><div class="section-desc">SKU</div><strong>${esc(d.sku || '—')}</strong></div>
            <div class="info-card"><div class="section-desc">GTIN</div><strong>${esc(d.gtin || 'Non attribué')}</strong></div>
            <div class="info-card"><div class="section-desc">Catégorie</div><strong>${esc(d.category || '—')}</strong></div>
            <div class="info-card"><div class="section-desc">Masse</div><strong>${gap('weightGrams') ? 'Non renseignée' : num(d.weightGrams, 0) + ' g'}</strong></div>
            <div class="info-card"><div class="section-desc">Marque</div><strong>${esc(d.brandName)}</strong></div>
            <div class="info-card"><div class="section-desc">Entité légale</div><strong>${esc(d.brandLegalName)}</strong></div>
          </div>
          ${gap('gtin') ? gapNote('Aucun GTIN n’est enregistré pour ce produit ; l’identifiant affiché est le SKU.') : ''}`;
      }

      function viewOrigine() {
        const d = state.dpp;
        return `<h2 class="section-title">Origine</h2>
          <p class="section-desc">Pays déclarés sur la fiche produit.</p>
          <div class="info-grid">
            <div class="info-card"><div class="section-desc">Pays de confection</div><strong>${gap('countryOfManufacture') ? 'Non renseigné' : esc(d.countryOfManufacture)}</strong></div>
            <div class="info-card"><div class="section-desc">Pays de conception</div><strong>${gap('countryOfDesign') ? 'Non renseigné' : esc(d.countryOfDesign)}</strong></div>
          </div>
          ${gap('countryOfManufacture') || gap('countryOfDesign') ? gapNote('Un pays absent de la fiche produit n’est pas déduit.') : ''}`;
      }

      function viewMatieres() {
        const d = state.dpp;
        const mats = d.materials || [];
        if (!mats.length) {
          return `<h2 class="section-title">Matières</h2>` + absent('Aucune matière enregistrée', "La nomenclature de ce produit ne contient aucune matière. Rien n'est affiché à la place.");
        }
        return `<h2 class="section-title">Matières</h2>
          <p class="section-desc">${mats.length} matière(s) issue(s) de la nomenclature produit.</p>
          <div class="info-grid">
            ${mats.map((m) => `<div class="info-card">
              <div class="section-desc">${esc(m.role || 'matière')}</div>
              <strong>${esc(m.name)}</strong>
              <div class="section-desc" style="margin-top:6px">${num(m.percentage, 0)} %${m.originCountry ? ` · origine ${esc(m.originCountry)}` : ' · origine non renseignée'}</div>
            </div>`).join('')}
          </div>`;
      }

      function viewComposition() {
        const d = state.dpp;
        const mats = d.materials || [];
        const total = mats.reduce((s, m) => s + (Number(m.percentage) || 0), 0);
        return `<h2 class="section-title">Composition</h2>
          <p class="section-desc">${esc(d.certifiedComposition)}</p>
          ${mats.length ? `<div class="composition-card">
            <div class="comp-bar">
              ${mats.map((m, i) => `<div class="comp-fill-${(i % 2) + 1}" style="width:${Math.max(0, Math.min(100, Number(m.percentage) || 0))}%" title="${esc(m.name)} — ${num(m.percentage, 0)} %"></div>`).join('')}
            </div>
            ${mats.map((m) => `<div class="comp-item"><span class="comp-bullet"></span><span class="comp-item-title">${esc(m.name)}</span><strong>${num(m.percentage, 0)} %</strong></div>`).join('')}
            <p class="section-desc" style="margin-top:12px">Total déclaré : <strong>${num(total, 0)} %</strong>${Math.abs(total - 100) > 0.5 ? ' — la composition ne totalise pas 100 %.' : ''}</p>
          </div>` : absent('Composition non publiée', 'Aucune matière n’étant enregistrée, aucune composition ne peut être affichée.')}
          ${gap('composition') ? gapNote('La composition affichée est un texte par défaut, et non la nomenclature du produit.') : ''}`;
      }

      function viewFabrication() {
        const d = state.dpp;
        const steps = String(d.supplyChainSummary || '').split('➔').map((s) => s.trim()).filter(Boolean);
        if (!steps.length) {
          return `<h2 class="section-title">Fabrication</h2>` + absent('Chaîne de fabrication non publiée', 'Aucun nœud de chaîne d’approvisionnement n’est rattaché à ce produit.');
        }
        return `<h2 class="section-title">Fabrication</h2>
          <p class="section-desc">${gap('supplyChain') ? 'Aucun nœud réel n’est rattaché : la séquence ci-dessous est un libellé par défaut.' : steps.length + ' étape(s) rattachée(s) au produit.'}</p>
          <div class="trace-timeline">
            ${steps.map((step, i) => {
              const label = step.split('(')[0].trim();
              const country = (step.match(/\(([^)]+)\)/) || [])[1];
              return `<div class="timeline-node">
                <div class="node-pin"></div>
                <div class="node-header"><span class="node-tier-tag">Étape ${i + 1}</span><strong>${esc(label)}</strong></div>
                <div class="node-body"><div class="node-sub">${country ? 'Pays déclaré : ' + esc(country) : 'Pays non renseigné'}</div></div>
              </div>`;
            }).join('')}
          </div>`;
      }

      function viewCertifications() {
        const d = state.dpp;
        if (!d.transactionCertificateNumber) {
          return `<h2 class="section-title">Certifications</h2>` + absent('Aucun certificat rattaché', "Aucun certificat de transaction n'est associé à ce produit. L'absence est affichée telle quelle.");
        }
        return `<h2 class="section-title">Certifications</h2>
          <p class="section-desc">Certificat de transaction rattaché par le bilan de masse.</p>
          <div class="info-card">
            <div class="section-desc">Numéro de certificat</div>
            <strong>${esc(d.transactionCertificateNumber)}</strong>
            <p class="section-desc" style="margin-top:10px">Ce numéro atteste d'une allocation de matière certifiée. Il ne couvre pas les autres référentiels, et TRACEFAB n'expose ici ni l'échéance ni l'organisme émetteur.</p>
          </div>`;
      }

      function viewCircularite() {
        const d = state.dpp;
        return `<h2 class="section-title">Circularité & impact</h2>
          <p class="section-desc">Scores issus de l'évaluation PEF lorsque celle-ci existe.</p>
          <div class="info-grid">
            <div class="info-card"><div class="section-desc">Éco-Score Textile Européen (PEF)</div><strong>${gap('pef') ? 'Non mesuré' : num(d.pefScore, 0) + ' · ' + esc(d.pefGrade)}</strong></div>
            <div class="info-card"><div class="section-desc">Empreinte carbone</div><strong>${gap('carbonFootprint') ? 'Non mesurée' : num(d.carbonFootprintKgCo2e) + ' kg CO₂e'}</strong></div>
            <div class="info-card"><div class="section-desc">Stress hydrique</div><strong>${gap('waterScarcity') ? 'Non mesuré' : num(d.waterScarcityM3) + ' m³'}</strong></div>
            <div class="info-card"><div class="section-desc">Score de circularité</div><strong>${gap('circularity') ? 'Non mesuré' : num(d.circularityScore, 0) + ' / 100'}</strong></div>
          </div>
          ${gap('pef') ? gapNote('Aucune évaluation PEF n’est enregistrée pour ce produit : les indicateurs d’impact sont absents plutôt qu’estimés.') : ''}
          <div class="info-card" style="margin-top:16px">
            <div class="section-desc">Fin de vie</div>
            <p class="section-desc" style="margin:8px 0 0">${esc(d.recyclingInstructions || 'Non publié')}</p>
            ${gap('recyclingInstructions') ? '<p class="section-desc" style="margin-top:10px"><strong>Texte générique.</strong> Cette consigne est identique pour tous les produits et ne provient d’aucune saisie.</p>' : ''}
          </div>`;
      }

      function viewEntretien() {
        const d = state.dpp;
        return `<h2 class="section-title">Entretien</h2>
          ${d.careInstructions ? `<div class="info-card"><p class="section-desc" style="margin:0">${esc(d.careInstructions)}</p></div>` : absent('Entretien non publié', 'Aucune instruction d’entretien n’est enregistrée.')}
          ${gap('careInstructions') ? gapNote('Cette consigne est identique pour tous les produits : TRACEFAB ne stocke pas encore d’instruction d’entretien par produit.') : ''}`;
      }

      function viewReparation() {
        return `<h2 class="section-title">Réparation</h2>` + absent(
          'Réparabilité non publiée',
          "TRACEFAB ne stocke aucun indice de réparabilité ni aucune offre de réparation : le schéma de base ne contient pas ces champs. Rien n'est affiché à la place, et aucun score n'est estimé.",
        );
      }

      function viewTracabilite() {
        const d = state.dpp;
        return `<h2 class="section-title">Traçabilité</h2>
          <p class="section-desc">Identifiants permettant de relier ce passeport à son produit.</p>
          <div class="info-grid">
            <div class="info-card"><div class="section-desc">Identifiant GS1 Digital Link</div><div class="code-box">${esc(d.digitalLinkUri || '—')}</div></div>
            <div class="info-card"><div class="section-desc">Numéro de série du passeport</div><div class="code-box">${esc(d.serialNumber || '—')}</div></div>
            <div class="info-card"><div class="section-desc">Adresse du passeport</div><div class="code-box">${esc(d.dppUrl || '—')}</div></div>
          </div>
          <p class="section-desc" style="margin-top:14px">La chaîne d'étapes figure à la rubrique Fabrication. TRACEFAB ne stocke pas de lot : la traçabilité
          publiée s'arrête aux nœuds réellement rattachés au produit.</p>`;
      }

      function viewPreuves() {
        return `<h2 class="section-title">Preuves</h2>` + absent(
          'Aucune preuve publiée',
          "Le passeport public n'expose aucun document : la route qui le produit ne joint ni certificat, ni rapport d'essai, ni déclaration. Les preuves existent dans TRACEFAB côté marque, mais leur publication consommateur n'est pas encore câblée.",
        );
      }

      function footer() {
        const d = state.dpp;
        const links = state.links || {};
        return `<footer class="dpp-footer">
          <div>
            <div class="section-desc">Cadres applicables : Loi AGEC &amp; ESPR. Ce passeport restitue les données déclarées dans
            TRACEFAB ; il ne constitue ni une certification, ni une attestation de conformité à ces cadres. Les rubriques sans
            donnée sont affichées comme absentes.</div>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
            ${links.appleWalletUrl ? `<a class="btn-action" href="${esc(links.appleWalletUrl)}">Apple Wallet</a>` : ''}
            ${links.googleWalletUrl ? `<a class="btn-action" href="${esc(links.googleWalletUrl)}">Google Wallet</a>` : ''}
            ${state.demo ? '' : `<a class="btn-action btn-action-primary" href="/dpp/?gtin=${encodeURIComponent(state.identifier)}">Lien permanent</a>`}
          </div>
          <div class="section-desc" style="margin-top:14px">TRACEFAB · ${esc(d.brandLegalName)}</div>
        </footer>`;
      }

      const VIEWS = {
        produit: viewProduit, origine: viewOrigine, matieres: viewMatieres, composition: viewComposition,
        fabrication: viewFabrication, certifications: viewCertifications, circularite: viewCircularite,
        entretien: viewEntretien, reparation: viewReparation, tracabilite: viewTracabilite, preuves: viewPreuves,
      };

      /* ---------------------------------------------------------------- rendu */

      function render() {
        const root = document.getElementById('dpp');
        root.setAttribute('aria-busy', state.loading ? 'true' : 'false');

        if (state.loading) {
          root.innerHTML = '<p class="section-desc">Chargement du passeport…</p>';
          return;
        }
        if (state.error === 'missing_identifier') {
          root.innerHTML = `<h1 class="product-title">Passeport introuvable</h1>
            <p class="section-desc">Aucun identifiant n'a été fourni. Ajoutez <code>?gtin=</code>, <code>?ref=</code> ou <code>?id=</code> à l'adresse,
            ou <a href="/dpp/?demo=1">ouvrez le passeport de démonstration</a>.</p>`;
          return;
        }
        if (state.error) {
          root.innerHTML = `<h1 class="product-title">Passeport indisponible</h1>
            <p class="section-desc">Le passeport n'a pas pu être chargé (${esc(state.error)}). Vérifiez l'identifiant du produit.</p>`;
          return;
        }

        const body = (VIEWS[state.tab] || viewProduit)();
        root.innerHTML = `${header()}${tabs()}<main class="tab-content-panel" style="display:block">${body}</main>${footer()}`;
        bind();
      }

      function bind() {
        document.querySelectorAll('.dpp-tab-btn').forEach((btn) => {
          btn.addEventListener('click', () => { state.tab = btn.dataset.tab; render(); });
        });
      }

      window.tracefabPublicDpp = { state, load, SECTIONS };
      load();
    })();
  </script>
</body>
</html>
